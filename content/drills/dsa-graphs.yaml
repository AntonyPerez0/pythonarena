        hidden: true

  - type: predict
    after: dijkstra
    code: |
      import heapq
      graph = [[(1, 5), (2, 1)], [], [(1, 2)]]
      dist, heap = {0: 0}, [(0, 0)]
      while heap:
          d, v = heapq.heappop(heap)
          print(v, d)
          for w, cost in graph[v]:
              if w not in dist or d + cost < dist[w]:
                  dist[w] = d + cost
                  heapq.heappush(heap, (d + cost, w))
    why: "From 0, vertex 1 costs 5 and 2 costs 1, so 2 comes out first and finds 1 for 1 + 2 = 3, cheaper than 5. 1 then comes out at 3. Nothing here skips stale pairs, so the old pair for 1, at 5, comes out too, last. The lesson's `if d > dist[v]: continue` would skip it."

  - type: choice
    after: dijkstra
    prompt: Why does Dijkstra's algorithm need weights that aren't negative?
    choices:
      - "`heapq` can't hold negative numbers"
      - "A vertex's distance is final when it leaves the heap, but a negative edge found later could still lower it"
      - "With negative weights the heap gives the largest pair first"
    answer: 2
    why: "When `(d, v)` is the smallest pair in the heap, any other way to v goes through a vertex that's at least d away, and the edges after it only add. A negative edge breaks the \"only add\", so a later way can be cheaper than the distance already taken as final."

  - type: bug
    after: dijkstra
    code: |
      import heapq

      heap = []
      for town, minutes in [("Zurich", 2), ("Bern", 7), ("Aarau", 5)]:
          heapq.heappush(heap, (town, minutes))  # BUG
      print(heapq.heappop(heap))
    fix: heapq.heappush(heap, (minutes, town))
    why: "Tuples compare by their first item first, so this heap is ordered by the town's name, and Aarau comes out first. With the minutes first, the closest town comes out first, as Dijkstra's algorithm needs."

  - type: predict
    after: union-find
    code: |
      parent = list(range(7))


      def find(x):
          while parent[x] != x:
              x = parent[x]
          return x


      for a, b in [(6, 2), (5, 5), (1, 4), (2, 4), (4, 6)]:
          if find(a) != find(b):
              parent[find(a)] = find(b)
      print(len({find(x) for x in range(7)}))
    why: "Each group has one root, so the number of different roots is the number of groups. 1, 2, 4 and 6 end up in one group. `(5, 5)` changes nothing, and `(4, 6)` finds them already joined. With 0, 3 and 5 alone, that makes 4 groups."

  - type: choice
    after: union-find
    prompt: "Union-find without union by size and without path compression: n people join person 0's group, one `union(0, i)` at a time, and each union hangs 0's root under i. What do the n unions cost?"
    choices:
      - "O(n)"
      - "O(n log n)"
      - "O(n²)"
    answer: 3
    why: "Each union makes the chain under the new root one longer, with 0 at its bottom, and the next `find(0)` walks all of it: 1 + 2 + ... + (n - 1) steps. Either fix alone keeps each find short."
