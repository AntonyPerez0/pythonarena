  - type: choice
    after: adjacency-lists
    prompt: "A graph with E edges is kept as a plain list of pairs, `edges = [(a, b), ...]`. What does `(a, b) in edges` cost, and what does `b in graph[a]` cost when `graph` is a dict of neighbor sets?"
    choices:
      - "O(1) for both"
      - "O(E) for the list, O(1) on average for the set"
      - "O(log E) for the list, O(1) for the set"
    answer: 2
    why: "`in` on a list compares the pairs one by one, O(E). A set finds b by its hash, O(1) on average. Adjacency sets cost O(V + E) memory once, and every edge check after that is fast."

  - type: bug
    after: bfs
    code: |
      from collections import deque
      graph = {0: [1, 2], 1: [3], 2: [4], 3: [], 4: [3]}
      dist, queue = {0: 0}, deque([0])
      while queue:
          v = queue.pop()  # BUG
          for w in graph[v]:
              if w not in dist:
                  dist[w] = dist[v] + 1
                  queue.append(w)
      print(dist[3])
    fix: v = queue.popleft()
    why: "`pop` takes the vertex added last, so the search goes deep first: 0, 2, 4, and 3 gets distance 3 from 4 before 1 is ever taken. BFS takes the oldest vertex with `popleft`, so vertices leave in order of distance, and 3 gets 2, through 1."

  - type: choice
    after: bfs
    prompt: "A BFS on a grid keeps the cells it has found in a list and checks `(nr, nc) not in visited` before adding a cell. What does the search cost on a grid with n open cells?"
    choices:
      - "O(n), like any BFS"
      - "O(n log n)"
      - "O(n²)"
    answer: 3
    why: "Each check scans the list of cells found so far, up to n of them, and there are about 4n checks. A set or a dict makes each check O(1) on average, and the search O(n)."

  - type: boss
    after: bfs
    prompt: |
      Write `knight_moves(n, start, goal)` that returns the fewest moves a chess knight needs from `start` to `goal` on an n by n board, or -1 when it can't get there. Squares are `(row, column)` pairs, from 0 to n - 1. A knight moves two squares one way and one square the other: from `(r, c)` it can go to `(r + 2, c + 1)`, `(r + 1, c + 2)`, `(r - 1, c + 2)` and the five other such squares, as long as they're on the board.

      For example, this call:

      ```python fragment
      print(knight_moves(8, (0, 0), (7, 7)))
      ```

      prints:

      ```
      6
      ```
    seed: |
      from collections import deque


      def knight_moves(n, start, goal):
          pass


      if __name__ == "__main__":
          print(knight_moves(8, (0, 0), (7, 7)))
    solution: |
      from collections import deque


      def knight_moves(n, start, goal):
          dist = {start: 0}
          queue = deque([start])
          while queue:
              r, c = queue.popleft()
              if (r, c) == goal:
                  return dist[(r, c)]
              for dr, dc in [(1, 2), (2, 1), (2, -1), (1, -2), (-1, -2), (-2, -1), (-2, 1), (-1, 2)]:
                  nr, nc = r + dr, c + dc
                  if 0 <= nr < n and 0 <= nc < n and (nr, nc) not in dist:
                      dist[(nr, nc)] = dist[(r, c)] + 1
                      queue.append((nr, nc))
          return -1


      if __name__ == "__main__":
          print(knight_moves(8, (0, 0), (7, 7)))
    hints:
      - "The squares are the vertices, and the knight's moves are the edges. Every move counts as one step, so BFS finds the fewest."
      - "Make a list of the eight moves as `(dr, dc)` pairs: every combination of 1 and 2 with both signs, one of them in the row and the other in the column."
      - "Run BFS from `start` with a dict of distances. A square joins the queue when it's on the board and not in the dict yet. Return the distance when the goal leaves the queue, and -1 if the queue runs empty."
    tests:
      - call: print(knight_moves(8, (0, 0), (7, 7)))
      - call: knight_moves(5, (2, 2), (2, 2))
        hidden: true
      - call: knight_moves(8, (0, 0), (1, 2))
        hidden: true
