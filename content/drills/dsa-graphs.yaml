  - type: runs
    after: dfs
    code: |
      def dfs(graph, v, seen):
          seen.add(v)
          for w in graph[v]:
              if w not in seen:
                  dfs(graph, w, seen)


      line = {v: [v + 1] for v in range(2000)}
      line[2000] = []
      dfs(line, 0, set())
      print("done")
    why: "Each call waits for the call on the next vertex, so the line of 2,001 vertices needs 2,001 nested calls, and Python stops at about 1000 with a `RecursionError`. A stack of your own, a list with `append` and `pop`, has no such limit."

