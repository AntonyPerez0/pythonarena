  - type: choice
    after: topological-sort
    prompt: Kahn's algorithm runs on a directed graph of 10 vertices and ends with only 7 of them in the order. What does that mean?
    choices:
      - "The 3 missing vertices have no edges at all"
      - "The graph has a cycle: the 3 missing vertices are on it, or wait for a vertex on it"
      - "The queue should have been a stack"
    answer: 2
    why: "A vertex without edges has in-degree 0, so it's in the order from the start. Vertices on a cycle each wait for another one on it, so none of them reaches in-degree 0, and neither does anything after them."

  - type: boss
    after: topological-sort
    prompt: |
      Tasks are numbered 0 to n - 1, and `(a, b)` in `deps` means task a must be done before task b. Write `stuck_tasks(n, deps)` that returns a sorted list of the tasks that can never be done: the ones on a cycle, and the ones that wait, directly or not, for a task on a cycle.

      For example, 1 and 2 wait for each other, and 3 waits for 2. So this call:

      ```python fragment
      print(stuck_tasks(6, [(0, 1), (1, 2), (2, 1), (2, 3), (4, 5)]))
      ```

      prints:

      ```
      [1, 2, 3]
      ```
    seed: |
      from collections import deque


      def stuck_tasks(n, deps):
          pass


      if __name__ == "__main__":
          print(stuck_tasks(6, [(0, 1), (1, 2), (2, 1), (2, 3), (4, 5)]))
    solution: |
      from collections import deque


      def stuck_tasks(n, deps):
          needs = [0] * n
          after = [[] for _ in range(n)]
          for a, b in deps:
              after[a].append(b)
              needs[b] += 1
          queue = deque([t for t in range(n) if needs[t] == 0])
          done = [False] * n
          while queue:
              t = queue.popleft()
              done[t] = True
              for u in after[t]:
                  needs[u] -= 1
                  if needs[u] == 0:
                      queue.append(u)
          return [t for t in range(n) if not done[t]]


      if __name__ == "__main__":
          print(stuck_tasks(6, [(0, 1), (1, 2), (2, 1), (2, 3), (4, 5)]))
    hints:
      - "Run Kahn's algorithm: count the in-degrees, start the queue with the tasks of in-degree 0, and mark each task you take from the queue as done."
      - "A task whose in-degree reaches 0 joins the queue. Tasks on a cycle, and tasks behind one, never get there."
      - "When the queue is empty, the tasks that were never marked done are the stuck ones. Going through `range(n)` lists them in order."
    tests:
      - call: print(stuck_tasks(6, [(0, 1), (1, 2), (2, 1), (2, 3), (4, 5)]))
      - call: stuck_tasks(4, [(0, 1), (1, 2), (2, 3)])
