    prompt: A map is a list of strings, one string per row. Which expression is the square in column 4 of row 1?
    choices:
      - "`level[1][4]`"
      - "`level[4][1]`"
      - "`level[1, 4]`"
    answer: 1
    why: "The list holds rows, so the row's index comes first: `level[1]` is the row, and `[4]` picks the square in it. In a pygame position the order is the other way round, x first."

