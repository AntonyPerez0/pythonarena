  - type: boss
    after: robot
    prompt: |
      Write a function `next_square(level, x, y, dx, dy)` for a grid game. `level` is a map as a list of strings, where `#` is a wall. The function returns the square a robot at (x, y) ends up on when it tries to move in the direction (dx, dy), as a tuple `(x, y)`: the next square in that direction, or the same square if the next one is a wall.

      For example, with `level = ["#####", "#...#", "#####"]`, `next_square(level, 1, 1, 1, 0)` returns `(2, 1)`, and `next_square(level, 1, 1, -1, 0)` returns `(1, 1)`.
    seed: |
      def next_square(level, x, y, dx, dy):
          pass
    solution: |
      def next_square(level, x, y, dx, dy):
          new_x = x + dx
          new_y = y + dy
          if level[new_y][new_x] == "#":
              return (x, y)
          return (new_x, new_y)
    hints:
      - "The next square is at `x + dx`, `y + dy`."
      - "Read it from the map row first: `level[new_y][new_x]`. If it's `\"#\"`, return the old place, `(x, y)`."
    tests:
      - call: next_square(["#####", "#...#", "#####"], 1, 1, 1, 0)
      - call: next_square(["#####", "#...#", "#####"], 1, 1, -1, 0)
      - call: next_square(["####", "#..#", "#..#", "####"], 2, 1, 0, 1)
        hidden: true
      - call: next_square(["####", "#..#", "#..#", "####"], 2, 1, 0, -1)
        hidden: true
      - call: next_square(["#####", "#.#.#", "#...#", "#####"], 1, 2, 0, -1)
        hidden: true

  - type: boss
    after: finishing
    prompt: |
      Write a function `boxes_left(level, boxes)`. `level` is a map as a list of strings, where `X` is a target, and `boxes` is a list of the boxes' places as `(x, y)` tuples. The function returns how many boxes are not on a target yet.

      For example, `boxes_left(["#X..X#"], [(1, 0), (2, 0), (3, 0)])` returns `2`.
    seed: |
      def boxes_left(level, boxes):
          pass
    solution: |
      def boxes_left(level, boxes):
          left = 0
          for x, y in boxes:
              if level[y][x] != "X":
                  left += 1
          return left
    hints:
      - "Go through the boxes with `for x, y in boxes:` and count the ones whose square isn't a target."
      - "The square under a box is `level[y][x]`, row first."
    tests:
      - call: boxes_left(["#X..X#"], [(1, 0), (2, 0), (3, 0)])
      - call: boxes_left(["#X..X#"], [(1, 0), (4, 0)])
        hidden: true
      - call: boxes_left(["####", "#X.#", "#.X#", "####"], [(2, 1), (1, 2)])
        hidden: true
      - call: boxes_left(["#..#"], [])
        hidden: true
