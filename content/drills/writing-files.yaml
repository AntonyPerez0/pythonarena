  - type: choice
    after: clear-and-delete
    prompt: How does a program usually change one line in the middle of a file?
    choices:
      - Opens the file with `"a"` and writes the new line
      - Reads all the lines into a list, changes the list, then writes all of it back with `"w"`
      - Opens the file with `"w"` and writes only the changed line
    answer: 2
    why: "`\"a\"` can only add to the end, and `\"w\"` empties the file. So the program keeps all the lines in a list and writes the whole file again."

  - type: boss
    after: clear-and-delete
    prompt: |
      Write a function `number_lines(source, target)` that writes a copy of the file `source` into the file `target`, with each line's number and a colon in front of it.

      If `poem.txt` has

      ```text
      Roses are red
      Code is too
      ```

      then `number_lines("poem.txt", "numbered.txt")` writes this `numbered.txt`:

      ```text
      1: Roses are red
      2: Code is too
      ```
    seed: |
      def number_lines(source, target):
          pass


      if __name__ == "__main__":
          number_lines("poem.txt", "numbered.txt")
    solution: |
      def number_lines(source, target):
          lines = []
          with open(source) as file:
              for line in file:
                  lines.append(line.strip())

          with open(target, "w") as file:
              number = 1
              for line in lines:
                  file.write(f"{number}: {line}\n")
                  number += 1


      if __name__ == "__main__":
          number_lines("poem.txt", "numbered.txt")
    hints:
      - Read the lines of `source` into a list, stripping each one.
      - "Then open `target` with `\"w\"` and write each line with its number: `f\"{number}: {line}\\n\"`."
    tests:
      - call: number_lines("poem.txt", "numbered.txt")
        files:
          poem.txt: |
            Roses are red
            Code is too
        writes: [numbered.txt]
      - call: number_lines("list.txt", "out.txt")
        files:
          list.txt: |
            milk
            bread
            jam
        writes: [out.txt]
        hidden: true
