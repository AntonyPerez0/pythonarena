topic: writing-files
drills:
  - type: predict
    after: create
    code: |
      with open("out.txt", "w") as file:
          file.write("ab")
          file.write("cd\n")

      with open("out.txt") as file:
          print(file.read())
    why: "`write` writes exactly the string it gets. No line break comes between `ab` and `cd`, so they end up on one line."

  - type: fill
    after: create
    code: |
      with open("hello.txt", [["w"‖'w']]) as file:
          file.write("Hello!\n")

      with open("hello.txt") as file:
          print(file.read())
    why: "The mode `\"w\"` opens the file for writing and creates it if it doesn't exist."

  - type: runs
    after: create
    code: |
      total = 15
      with open("total.txt", "w") as file:
          file.write(total)
    why: "`write` only takes a string, so writing the number 15 stops with a `TypeError`. Write `f\"{total}\\n\"` instead."

  - type: predict
    after: create
    code: |
      with open("note.txt", "w") as file:
          file.write("first\n")

      with open("note.txt", "w") as file:
          file.write("second\n")

      with open("note.txt") as file:
          print(file.read())
    why: "Opening a file with `\"w\"` empties it first, so the second `with` wipes out `first` before it writes `second`."

  - type: choice
    after: create
    prompt: "The file `data.txt` has 100 lines. What does `open(\"data.txt\", \"w\")` do to it?"
    choices:
      - Opens it so that new lines go after the old ones
      - Empties it, so the 100 lines are gone
      - Stops with an error because the file already exists
    answer: 2
    why: "The mode `\"w\"` always starts from an empty file. To keep the old lines and add to the end, use `\"a\"`."

  - type: bug
    after: create
    code: |
      with open("lines.txt", "w") as file:
          file.write("first")  # BUG
          file.write("second\n")

      with open("lines.txt") as file:
          print(file.read())
    fix: file.write("first\n")
    why: "`write` doesn't add a line break the way `print` does. Without `\\n`, the two strings end up on the same line."

