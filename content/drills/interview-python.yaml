  - type: predict
    code: |
      from contextlib import contextmanager


      @contextmanager
      def opened(name):
          print("open", name)
          yield
          print("close", name)


      try:
          with opened("log"):
              1 / 0
      except ZeroDivisionError:
          print("error")
    why: "`@contextmanager` turns a generator into a context manager: the code before `yield` runs as the `with` block starts, and the code after it as the block ends. But an error in the block is raised inside the generator, at the `yield`, so the lines after a bare `yield` never run and nothing prints `close`. Put the `yield` in a `try` and the clean-up in its `finally`, and the clean-up runs whether there was an error or not."

  - type: boss
    prompt: |
      Write a decorator `memoize(func)` that remembers results. The first call with some arguments runs `func` and stores what it returns. A later call with the same arguments gives back the stored value without running `func` again. The functions it decorates take only positional arguments, and every argument can be a dictionary key. Use `functools.wraps`, so that the decorated function keeps its name and docstring. Each decorated function has results of its own.

      The check runs:

      ```python fragment
      @memoize
      def square(n):
          print("computing", n)
          return n * n


      print(square(4), square(4), square(5))
      ```

      and expects:

      ```
      computing 4
      computing 5
      16 16 25
      ```
    seed: |
      import functools


      def memoize(func):
          return func
    solution: |
      import functools


      def memoize(func):
          cache = {}

          @functools.wraps(func)
          def wrapper(*args):
              if args not in cache:
                  cache[args] = func(*args)
              return cache[args]

          return wrapper
    hints:
      - "Inside `memoize`, make a dictionary `cache = {}` and define a function `wrapper(*args)` that `memoize` returns. `args` is a tuple, so it can be a dictionary key."
      - "In `wrapper`, call `func(*args)` only when `args not in cache`, and store its result there. Test with `in` rather than `cache.get(args)`, since a stored result can be 0. Put `@functools.wraps(func)` on the line above `def wrapper`."
    tests:
      - call: |
          @memoize
          def square(n):
              print("computing", n)
              return n * n


          print(square(4), square(4), square(5))
      - call: |
          calls = []


          @memoize
          def fib(n):
              calls.append(n)
              if n < 2:
                  return n
              return fib(n - 1) + fib(n - 2)


          print(fib(25), len(calls))
        hidden: true
      - call: |
          @memoize
          def power(base, exp):
              """Base to the power exp."""
              return base ** exp


          print(power(2, 3), power(3, 2), power(2, 5), power.__name__, power.__doc__)
        hidden: true
      - call: |
          @memoize
          def double(n):
              print("doubling", n)
              return n * 2


          @memoize
          def triple(n):
              return n * 3


          print(double(5), triple(5), double(0), double(0))
        hidden: true

  - type: boss
    prompt: |
      Write a class `Countdown`, where `Countdown(3)` counts down 3, 2, 1 and a countdown from 0 has no numbers. Make it an **iterable** that isn't its own iterator: two loops over the same countdown each keep a place of their own, even when they run at the same time (one inside the other, or `zip(launch, launch)`), as two loops over one list do. An `__iter__` that sets a counter back to the start and returns `self`, as in the iterators lesson, restarts a loop that comes after another one, but not a loop that runs at the same time.

      The check runs:

      ```python fragment
      launch = Countdown(3)
      print(list(zip(launch, launch)))
      ```

      and expects:

      ```
      [(3, 3), (2, 2), (1, 1)]
      ```
    seed: |
      class Countdown:
          def __init__(self, start):
              self.start = start
    solution: |
      class Countdown:
          def __init__(self, start):
              self.start = start

          def __iter__(self):
              n = self.start
              while n > 0:
                  yield n
                  n -= 1
    hints:
      - "A loop calls `__iter__` once, at its start, to get an iterator. If `__iter__` returns `self`, every loop shares the object's one place in the countdown. Setting that place back to the start in `__iter__` is enough when the loops come one after another, but a loop inside a loop sets back and uses up the outer loop's place too."
      - "Write `__iter__` as a generator: start a local variable at `self.start`, and while it is above 0, `yield` it and take 1 off. Each call of `__iter__` then makes a new generator with a place of its own."
    tests:
      - call: |
          launch = Countdown(3)
          print(list(zip(launch, launch)))
      - call: |
          launch = Countdown(4)
          print(list(launch), list(launch))
        hidden: true
      - call: |
          launch = Countdown(2)
          for a in launch:
              for b in launch:
                  print(a, b)
        hidden: true
      - call: print(list(Countdown(0)), sum(Countdown(4)))
        hidden: true
