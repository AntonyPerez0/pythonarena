  - type: bug
    after: filter
    code: |
      numbers = [3, 8, 11, 14]
      evens = filter(lambda n: n % 2 == 1, numbers)  # BUG
      print(list(evens))
    fix: "evens = filter(lambda n: n % 2 == 0, numbers)"
    why: "An even number leaves no remainder when divided by 2, so the condition is `n % 2 == 0`."

