  - type: runs
    after: reduce
    code: |
      from functools import reduce

      print(reduce(lambda a, b: a + b, []))
    why: "Without a start value, `reduce` starts from the first item, and an empty list has none, so it stops with a `TypeError`. A start value, such as `0`, fixes it."

  - type: bug
    after: reduce
    code: |
      from functools import reduce


      class Coin:
          def __init__(self, value):
              self.value = value


      coins = [Coin(2), Coin(1), Coin(2)]
      total = reduce(lambda result, coin: result + coin.value, coins)  # BUG
      print(total)
    fix: "total = reduce(lambda result, coin: result + coin.value, coins, 0)"
    why: "Without a start value the first `Coin` object becomes the starting result, and Python can't add a number to it. Start from `0`."

  - type: boss
    after: filter
    prompt: |
      Write a function `loud_short_words(words)` that returns a list of the words that have at most 4 letters, in capital letters. Use `filter` and `map`. For example,

      ```python fragment
      print(loud_short_words(["map", "filter", "zip", "reduce", "list"]))
      ```

      should print:

      ```
      ['MAP', 'ZIP', 'LIST']
      ```
    seed: |
      def loud_short_words(words):
          pass


      if __name__ == "__main__":
          print(loud_short_words(["map", "filter", "zip", "reduce", "list"]))
    solution: |
      def loud_short_words(words):
          short = filter(lambda word: len(word) <= 4, words)
          return list(map(lambda word: word.upper(), short))


      if __name__ == "__main__":
          print(loud_short_words(["map", "filter", "zip", "reduce", "list"]))
    hints:
      - "First `filter` the words with `len(word) <= 4`, then `map` them to `word.upper()`."
      - "The result of `map` is an iterator: return `list(...)` of it."
    require:
      - pattern: \bfilter\s*\(
        message: Pick the short words with `filter`.
      - pattern: \bmap\s*\(
        message: Make them capital letters with `map`.
    tests:
      - call: print(loud_short_words(["map", "filter", "zip", "reduce", "list"]))
      - call: loud_short_words(["functional", "is", "fun", "style"])
        hidden: true

  - type: boss
    after: reduce
    prompt: |
      Write a function `longest_word(words)` that uses `reduce` to return the longest word of the list. When several words are equally long, it returns the first of them, and for an empty list it returns an empty string. For example,

      ```python fragment
      print(longest_word(["sky", "ocean", "river", "sun"]))
      ```

      should print:

      ```
      ocean
      ```
    seed: |
      def longest_word(words):
          pass


      if __name__ == "__main__":
          print(longest_word(["sky", "ocean", "river", "sun"]))
    solution: |
      from functools import reduce


      def longest_word(words):
          return reduce(lambda longest, word: word if len(word) > len(longest) else longest, words, "")


      if __name__ == "__main__":
          print(longest_word(["sky", "ocean", "river", "sun"]))
    hints:
      - "Start from the empty string `\"\"`, and in each round keep the longer of the result so far and the next word."
      - "`word if len(word) > len(longest) else longest` keeps the earlier word when the two are equally long."
    require:
      - pattern: \breduce\s*\(
        message: Find the word with `reduce`.
    tests:
      - call: print(longest_word(["sky", "ocean", "river", "sun"]))
      - call: longest_word(["a", "bb", "cc", "d"])
        hidden: true
      - call: longest_word([])
        hidden: true
