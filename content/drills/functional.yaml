  - type: runs
    after: map
    code: |
      squares = map(lambda n: n * n, [1, 2, 3])
      print(squares[0])
    why: "A `map` object is an iterator, not a list: it has no indexes. `list(map(...))` would have them."

  - type: choice
    after: map
    prompt: "What does `map(function, series)` return?"
    choices:
      - A list with the function's result for every item
      - An iterator that calls the function on each item when the value is asked for
      - The function's result for the first item only
    answer: 2
    why: "`map` is lazy, like a generator. Use `list(map(...))` when you need a list."

