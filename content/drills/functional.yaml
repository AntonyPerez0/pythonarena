drills:
  - type: predict
    after: map
    code: |
      words = ["hi", "hey", "hello"]
      print(list(map(len, words)))
    why: "`map` calls `len` on every word and gives the lengths, which `list` collects."

  - type: predict
    after: map
    code: |
      doubled = map(lambda n: n * 2, [1, 2, 3])
      print(list(doubled))
      print(list(doubled))
    why: "`map` returns an iterator, which is used up after one pass. The second `list` finds nothing left."

  - type: fill
    after: map
    code: |
      texts = ["4", "15", "8"]
      numbers = list(map([[int]], texts))
      print(sum(numbers))
