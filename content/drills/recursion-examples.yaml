  - type: boss
    after: binary-trees
    prompt: |
      Write a recursive function `tree_values(node)` that returns a list of the values of a tree: first the node's own value, then the values of its left subtree, then those of its right subtree. An empty tree, `None`, gives an empty list.

      For example, `tree_values(Node(8, Node(3, Node(1)), Node(10)))` returns:

      ```
      [8, 3, 1, 10]
      ```
    seed: |
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def tree_values(node):
          pass


      if __name__ == "__main__":
          print(tree_values(Node(8, Node(3, Node(1)), Node(10))))
    solution: |
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def tree_values(node):
          if node is None:
              return []
          return [node.value] + tree_values(node.left) + tree_values(node.right)


      if __name__ == "__main__":
          print(tree_values(Node(8, Node(3, Node(1)), Node(10))))
    hints:
      - "The empty tree gives `[]`: that's the base case."
      - "Join three lists with `+`: `[node.value]`, the values of the left subtree and the values of the right subtree."
    require:
      - pattern: def tree_values\b[^\n]*\n(?:[ \t]*\n|[ \t]+[^\n]*\n)*?[ \t]+[^\n]*\btree_values\s*\(
        message: Make `tree_values` call itself inside its own body.
    tests:
      - call: tree_values(Node(8, Node(3, Node(1)), Node(10)))
      - call: tree_values(None)
        hidden: true
      - call: tree_values(Node(1, None, Node(2, Node(3), Node(4))))
        hidden: true

  - type: boss
    after: nested-structures
    prompt: |
      Write a recursive function `deep_count(items, target)` that returns how many times `target` appears in a list whose items can be lists, nested to any depth.

      For example, `deep_count([1, [2, 1], [[1, 3]]], 1)` returns:

      ```
      3
      ```
    seed: |
      def deep_count(items, target):
          pass


      if __name__ == "__main__":
          print(deep_count([1, [2, 1], [[1, 3]]], 1))
    solution: |
      def deep_count(items, target):
          count = 0
          for item in items:
              if type(item) == list:
                  count += deep_count(item, target)
              elif item == target:
                  count += 1
          return count


      if __name__ == "__main__":
          print(deep_count([1, [2, 1], [[1, 3]]], 1))
    hints:
      - "Go through the items with a loop. An item that is a list is counted with a recursive call, `deep_count(item, target)`."
      - "An item that isn't a list adds 1 to the count when it equals the target."
    require:
      - pattern: def deep_count\b[^\n]*\n(?:[ \t]*\n|[ \t]+[^\n]*\n)*?[ \t]+[^\n]*\bdeep_count\s*\(
        message: Make `deep_count` call itself inside its own body.
    tests:
      - call: deep_count([1, [2, 1], [[1, 3]]], 1)
      - call: deep_count(["a", ["b", ["a", ["a"]]]], "a")
        hidden: true
      - call: deep_count([], 5)
        hidden: true
      - call: deep_count([4, [5]], 6)
        hidden: true
