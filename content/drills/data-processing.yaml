  - type: boss
    after: csv-module
    prompt: |
      The file `results.csv` has a player's name and score on each line, separated by a semicolon. Write a function `best_player(filename)` that reads the file with the `csv` module and returns the name of the player with the highest score (the first of them, if several share it).

      For a file with the lines `Ada;12`, `Ben;17` and `Cy;9`, it returns `"Ben"`.
    seed: |
      import csv


      def best_player(filename):
          pass


      if __name__ == "__main__":
          print(best_player("results.csv"))
    solution: |
      import csv


      def best_player(filename):
          best = ""
          best_score = -1
          with open(filename) as file:
              for row in csv.reader(file, delimiter=";"):
                  score = int(row[1])
                  if score > best_score:
                      best = row[0]
                      best_score = score
          return best


      if __name__ == "__main__":
          print(best_player("results.csv"))
    hints:
      - "Read the rows with `csv.reader(file, delimiter=\";\")`, and convert each score with `int`."
      - Keep the best name and score so far in two variables, and replace them only when a score is strictly higher.
    tests:
      - call: best_player("results.csv")
        files:
          results.csv: |
            Ada;12
            Ben;17
            Cy;9
      - call: best_player("final.csv")
        files:
          final.csv: |
            Noor;30
            Otto;41
            Pia;41
            Quinn;8
        hidden: true
