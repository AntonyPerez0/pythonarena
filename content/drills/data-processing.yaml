  - type: choice
    after: json-files
    prompt: Which of these is valid JSON?
    choices:
      - "`{\"name\": \"Ada\", \"admin\": true}`"
      - "`{'name': 'Ada', 'admin': true}`"
      - "`{\"name\": \"Ada\", \"admin\": True}`"
    answer: 1
    why: "JSON needs double quotes around strings and writes true in small letters. Single quotes and Python's `True` aren't JSON."

