    why: "`wheel.radius` is already the number 30, and the parentheses then try to call 30 like a function: `TypeError: 'int' object is not callable`. A property is used without parentheses."

  - type: runs
    after: getters
    code: |
      class Circle:
          def __init__(self, radius):
              self.__radius = radius

          @property
          def radius(self):
