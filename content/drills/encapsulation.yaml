topic: encapsulation
drills:
  - type: runs
    after: private-attributes
    code: |
      class Safe:
          def __init__(self):
              self.__gold = 10


      safe = Safe()
      print(safe.__gold)
    why: "`__gold` is private, so code outside the class can't use it by that name: `AttributeError: 'Safe' object has no attribute '__gold'`."

  - type: predict
    after: private-attributes
    code: |
      class Safe:
          def __init__(self):
              self.__gold = 10

          def gold(self):
              return self.__gold


      safe = Safe()
      print(safe.gold())
    why: "Inside the class, `self.__gold` works as usual. The method `gold` is public, so the client can call it and get the value."

  - type: predict
    after: private-attributes
    code: |
      class Safe:
          def __init__(self):
              self.__gold = 10

          def gold(self):
              return self.__gold


      safe = Safe()
      safe.__gold = 999
      print(safe.gold())
    why: "Outside the class, `safe.__gold = 999` doesn't reach the private attribute. It quietly creates a new, unrelated attribute, so the method still returns 10."

  - type: choice
    after: private-attributes
    prompt: Which attribute is private?
    choices:
      - "`self.balance`"
      - "`self.__balance`"
      - "`self.__balance__`"
      - "`self._balance_`"
    answer: 2
    why: "A private name starts with two underscores. Names with two underscores at both ends, like `__init__`, are Python's special names and aren't private."

  - type: predict
    after: getters
    code: |
      class Circle:
          def __init__(self, radius):
              self.__radius = radius

          @property
          def diameter(self):
              return self.__radius * 2


      wheel = Circle(30)
      print(wheel.diameter)
    why: "`diameter` is a property, so `wheel.diameter` runs the getter without parentheses. It calculates 30 * 2."

  - type: runs
