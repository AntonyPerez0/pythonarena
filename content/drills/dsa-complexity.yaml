topic: dsa-complexity
drills:
  - type: predict
    after: big-o
    code: |
      steps = 0
      for i in range(5):
          for j in range(i, 5):
              steps += 1
      print(steps)
    why: "The inner loop runs 5, 4, 3, 2 and 1 times: 15 in all. For n values that's about n²/2 steps, which is O(n²)."

  - type: choice
    after: big-o
    prompt: "`a` and `b` are lists of n values each. What is the Big-O of `count_common`?"
    code: |
      def count_common(a, b):
          count = 0
          for x in a:
              if x in b:
                  count += 1
          return count


      print(count_common([1, 2, 3], [2, 3, 4]))
    choices:
      - "O(n)"
      - "O(n log n)"
      - "O(n²)"
    answer: 3
    why: "`x in b` looks through the list `b` item by item, O(n), and it runs once for each of the n values of `a`. With `b` turned into a set first, it would be O(n)."

  - type: choice
    after: big-o
    prompt: "What is the Big-O of emptying a list of n items like this?"
    code: |
      queue = list(range(1000))
      while queue:
          item = queue.pop(0)
      print(len(queue))
    choices:
      - "O(n)"
      - "O(n log n)"
      - "O(n²)"
    answer: 3
    why: "`pop(0)` takes the first item, and every item after it moves one place to the left: O(n) for each pop. `queue.pop()` from the end is O(1), and `collections.deque` has `popleft()` in O(1)."

  - type: predict
