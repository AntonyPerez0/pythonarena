  - type: bug
    after: sets-and-dicts
    code: |
      def two_sum(numbers, target):
          positions = {}
          for i, x in enumerate(numbers):
              if target - x in positions:
                  return (positions[target - x], i)
              positions[i] = x  # BUG
          return None


      print(two_sum([3, 8, 5], 13))
    fix: positions[x] = i
    why: "The lookup `target - x in positions` asks about values, so the keys must be the values and the dict's values their indexes."

  - type: predict
    after: binary-search
    code: |
      from bisect import bisect_left, bisect_right

      scores = [10, 20, 20, 20, 30]
      print(bisect_left(scores, 20), bisect_right(scores, 20))
      print(bisect_left(scores, 25))
    why: "`bisect_left` gives the first index whose value is at least 20, and `bisect_right` the first whose value is greater than 20. 25 would go before 30, at index 4."

  - type: runs
    after: binary-search
    code: |
      values = [2, 4, 6]
      lo = 0
      hi = len(values)
      while lo <= hi:
          mid = (lo + hi) // 2
          if values[mid] < 7:
              lo = mid + 1
          else:
              hi = mid - 1
      print(lo)
    why: "`hi` starts one past the end, and `lo <= hi` lets `mid` reach 3. `values[3]` doesn't exist, so it stops with an `IndexError`. With `hi = len(values) - 1` it would print 3."

  - type: fill
    after: binary-search
    code: |
      values = [3, 5, 8, 8, 20]
      lo = 0
      hi = len(values)
      while lo < hi:
          mid = (lo + hi) // 2
          if values[mid] < 8:
              lo = mid + 1
          else:
              hi = [[mid]]
      print(lo)
    why: "This search finds the first index whose value is at least 8. When `values[mid]` is big enough, `mid` may be the answer, so it stays in the range: `hi = mid`, and it prints 2. With `hi = mid - 1`, the first round drops index 2, the answer itself, and it prints 1."

  - type: predict
    after: two-pointers
    code: |
      values = [3, 3, 3, 3]
      for value in values:
          if values.count(value) > 1:
              values.remove(value)
      print(values)
    why: "The loop goes by position. After each `remove`, the items shift left, and the loop's next position skips one of them. It stops after two removals, with two 3s left."

  - type: choice
    after: two-pointers
    prompt: "In a sorted list, `values[left] + values[right]` is smaller than the target. Why is it safe to move `left` on?"
    choices:
      - "`values[left]` is too small even with the largest value still in play, so it can't be in any pair"
      - "`values[right]` is too big to be in any pair"
      - "Moving `left` on makes the sum smaller"
    answer: 1
    why: "Every other partner of `values[left]` is at most `values[right]`, so no pair with it reaches the target. Dropping it loses nothing, and moving `left` on makes the sum bigger, not smaller."

