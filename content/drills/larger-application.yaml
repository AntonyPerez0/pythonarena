  - type: bug
    after: files
    code: |
      data = {"robin": ["park"], "heron": ["lake", "river"]}
      with open("birds.txt", "w") as file:
          for species, places in data.items():
              file.write(";".join([species] + places))  # BUG
      with open("birds.txt") as file:
          print(file.read())
    fix: file.write(";".join([species] + places) + "\n")
    why: "`write` doesn't add a line break by itself. Without `\"\\n\"` at the end, both species end up on the same line, and the file can't be read back correctly."

  - type: choice
    after: files
    prompt: How does the bird log application use its file?
    choices:
      - It reads the whole file when it starts, and writes all the data back when the user quits
      - It opens the file again for every command
      - It changes only the lines that changed, in place
    answer: 1
    why: "Reading once and writing everything back at the end is the simplest way to keep data in a file. While the program runs, the data lives in its objects."

  - type: boss
    after: files
    prompt: |
      Write the logic class `Glossary`, which keeps words and their translations. A word can have several translations. It has these methods:

      - `add(word, translation)` adds a translation for the word. The same translation isn't added twice.
      - `translations(word)` returns the list of the word's translations, in the order they were added, or an empty list for a word the glossary doesn't have.

      For example,

      ```python fragment
      glossary = Glossary()
      glossary.add("cat", "kissa")
      glossary.add("cat", "katti")
      glossary.add("cat", "kissa")
      print(glossary.translations("cat"))
      print(glossary.translations("dog"))
      ```

      should print:

      ```
      ['kissa', 'katti']
      []
      ```
    seed: |
      # Write the class Glossary here.


      if __name__ == "__main__":
          glossary = Glossary()
          glossary.add("cat", "kissa")
          print(glossary.translations("cat"))
    solution: |
      class Glossary:
          def __init__(self):
              self.__words = {}

          def add(self, word, translation):
              if word not in self.__words:
                  self.__words[word] = []
              if translation not in self.__words[word]:
                  self.__words[word].append(translation)

          def translations(self, word):
              if word not in self.__words:
                  return []
              return self.__words[word]


      if __name__ == "__main__":
          glossary = Glossary()
          glossary.add("cat", "kissa")
          print(glossary.translations("cat"))
    hints:
      - "Keep a dictionary in a private attribute: the word is the key, and a list of translations the value."
      - "In `add`, create an empty list for a new word first. Then append the translation only if it's `not in` the list yet."
    tests:
      - call: |
          glossary = Glossary()
          glossary.add("cat", "kissa")
          glossary.add("cat", "katti")
          glossary.add("cat", "kissa")
          print(glossary.translations("cat"))
          print(glossary.translations("dog"))
      - call: |
