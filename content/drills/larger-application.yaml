  - type: choice
    after: user-interface
    prompt: "In a well-organized text user interface, what does the main loop in `execute` do?"
    choices:
      - Reads a command and calls the method that handles it
      - Handles every command itself, all inside the loop
      - Stores the data in a dictionary of its own
    answer: 1
    why: "The loop only delegates. Each command has a method of its own, and the data belongs to the logic class."

  - type: predict
    after: objects-in-dictionary
    code: |
      class Tally:
          def __init__(self):
              self.count = 0


      tallies = {}
      for word in ["yes", "no", "yes"]:
          if word not in tallies:
              tallies[word] = Tally()
          tallies[word].count += 1
      print(tallies["yes"].count)
      print(len(tallies))
    why: "Each word gets one `Tally` object the first time it comes up. `yes` comes twice, so its count is 2, and the dictionary has two keys."

  - type: predict
    after: objects-in-dictionary
    code: |
      class Box:
          def __init__(self):
              self.items = []


      boxes = {"red": Box(), "blue": Box()}
      red = boxes["red"]
      red.items.append("ball")
      print(boxes["red"].items)
      print(boxes["blue"].items)
    why: "`red` refers to the same object that's in the dictionary, not a copy, so the ball goes into the red box in the dictionary. The blue box is another object."

  - type: runs
    after: objects-in-dictionary
    code: |
      class Tally:
          def __init__(self):
              self.count = 0


      tallies = {}
      tallies["yes"].count += 1
      print(tallies["yes"].count)
    why: "The dictionary has no key `yes` yet, so `tallies[\"yes\"]` stops with a `KeyError`. Create the object first: `if \"yes\" not in tallies: tallies[\"yes\"] = Tally()`."

  - type: fill
    after: objects-in-dictionary
    code: |
      class Player:
          def __init__(self, name):
              self.name = name
              self.goals = 0


      players = {}
      for scorer in ["Ana", "Bo", "Ana"]:
          if scorer not in players:
              players[scorer] = [[Player(scorer)]]
          players[scorer].goals += 1
      print(players["Ana"].goals)
    why: "A missing scorer gets a new `Player` object, created with the scorer's name. After that, every goal adds one to that object's `goals`."

