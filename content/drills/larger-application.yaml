topic: larger-application
drills:
  - type: choice
    after: logic
    prompt: "An application has the classes `Library` (the books and the rules for lending them), `LibraryApp` (the text user interface) and `LibraryFile` (reading and saving). Which class should call `input`?"
    choices:
      - "`Library`"
      - "`LibraryApp`"
      - "`LibraryFile`"
      - All three, whenever they need something
    answer: 2
    why: "Talking to the user is the user interface's job. The logic gets what it needs as parameters, and returns its answers."

  - type: choice
    after: logic
    prompt: What does the single responsibility principle say?
    choices:
      - Each class should have one job in the program
      - Each class should have only one method
      - A program should have only one class
    answer: 1
    why: "A class can have many methods, but they should all serve the same one job, such as the logic, the user interface or the storage."

  - type: predict
    after: logic
    code: |
      class Shelf:
          def __init__(self):
              self.__books = {}

          def add(self, title, year):
              self.__books[title] = year

          def year(self, title):
              if title not in self.__books:
                  return None
              return self.__books[title]


      shelf = Shelf()
      shelf.add("Dune", 1965)
      print(shelf.year("Dune"))
      print(shelf.year("Emma"))
    why: "`year` returns the year for a title on the shelf, and `None` for a title that isn't there. The logic returns its answers; printing them is up to the code that calls it."

  - type: bug
    after: user-interface
    stdin: |
      2
      0
    code: |
      while True:
          command = input("command: ")
          if command == "0":
              break
          elif command == 2:  # BUG
              print("searching")
          else:
              print("unknown command")
    fix: 'elif command == "2":'
    why: "`input` always gives a string, and the string `\"2\"` is never equal to the number `2`. Compare with `\"2\"`, as the line above does with `\"0\"`."

  - type: predict
    after: user-interface
    stdin: |
      x
      0
    code: |
      while True:
