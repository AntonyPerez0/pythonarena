topic: objects
drills:
  - type: predict
    after: everything-is-an-object
    code: |
      a = {"name": "Ann", "score": 3}
      b = {"name": "Ann", "score": 3}
      a["score"] = 10
      print(b["score"])
      print(a == b)
    why: "The two dictionaries are separate objects, so changing `a` leaves `b` as it was, and after the change they no longer hold the same values."

  - type: predict
    after: everything-is-an-object
    code: |
      word = "hi"
      other = word
      word = word + "!"
      print(other)
      print(word)
    why: "Strings are immutable. `word + \"!\"` makes a new string and `word` then refers to it, while `other` still refers to the old one."

  - type: predict
    after: everything-is-an-object
    code: |
      print(type(3.5))
      print(type("3.5"))
    why: "Every value is an object of some class. A number with a decimal point is a `float`, and anything in quotes is a `str`."

  - type: choice
    after: everything-is-an-object
    prompt: Which values in Python are objects?
    choices:
      - Only lists and dictionaries
      - Only objects made from classes you write yourself
      - Every value, numbers and strings included
    answer: 3
    why: "In Python every value is an object, and every object has a class: `int`, `str`, `list` and so on."

  - type: bug
    after: methods
    code: |
      name = "ada"
      name.upper()  # BUG
      print(name)
    fix: name = name.upper()
    why: "A string method never changes the string: `upper()` returns a new string, which has to be stored."

  - type: predict
    after: methods
    code: |
      text = "banana"
      print(text.find("n"))
      print(text.find("x"))
      print(text.count("an"))
    why: "`find` gives the index of the first match, or -1 when there is none. `count` counts how many times the text appears."

  - type: runs
    after: methods
    code: |
      numbers = [3, 1, 2].sort()
      print(numbers[0])
    why: "`sort` sorts the list in place and returns `None`, so `numbers` is `None`, and `None[0]` is a `TypeError`."

  - type: predict
    after: methods
    code: |
