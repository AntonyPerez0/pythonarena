    why: "`range(len(letters))` gives the indexes 0, 1 and 2, and `letters[i]` is the item at each index."

  - type: bug
    after: best-item
    code: |
      temps = [-4, -9, -2]
      best = 0  # BUG
      for t in temps:
          if t > best:
              best = t
      print(best)
    fix: best = temps[0]
    why: "Every temperature is below 0, so none of them beats the start value, and the program prints 0, which isn't in the list. Start from the first item instead."

  - type: predict
    after: best-item
    code: |
      words = ["cat", "dog", "emu"]
      best = words[0]
      for w in words:
          if len(w) >= len(best):
              best = w
      print(best)
    why: "All three words are equally long. With `>=`, each equally long word replaces the best so far, so the last one wins. With `>`, the first one would stay."

  - type: boss
    after: best-item
    prompt: |
      Write the function `most_vowels(words: list) -> str`, which returns the word with the most vowels (a, e, i, o, u). If several words have equally many, return the first of them. The words are in small letters. For example, `most_vowels(["sky", "banana", "orange"])` returns `'banana'`.
    seed: |
      def most_vowels(words: list) -> str:
          pass


      if __name__ == "__main__":
          print(most_vowels(["sky", "banana", "orange"]))
    solution: |
      def vowel_count(word: str) -> int:
          count = 0
          for char in word:
              if char in "aeiou":
                  count += 1
          return count


      def most_vowels(words: list) -> str:
          best = words[0]
          for word in words:
              if vowel_count(word) > vowel_count(best):
                  best = word
          return best


      if __name__ == "__main__":
          print(most_vowels(["sky", "banana", "orange"]))
    hints:
      - "A helper function `vowel_count(word)` that counts the vowels of one word keeps the main loop short."
      - "Start with `best = words[0]`, and replace it when a word has more vowels than `best`. Use `>` so the first of equal words stays."
    tests:
      - call: most_vowels(["sky", "banana", "orange"])
      - call: most_vowels(["rhythm"])
        hidden: true
      - call: most_vowels(["tree", "idea", "aqueous", "audio"])
        hidden: true
