topic: for-loops
drills:
  - type: predict
    after: for-lists
    code: |
      for n in [3, 1, 2]:
          print(n * 2)
    why: "The loop takes the items in order, 3, 1 and 2, and prints each one doubled."

  - type: bug
    after: for-lists
    code: |
      numbers = [5, 10, 15]
      total = 0
      for number in numbers:
          total += numbers[number]  # BUG
      print(total)
    fix: total += number
    why: "A `for` loop gives you the items themselves, not their indexes. `numbers[5]` is past the end of the list, so the program crashes."

  - type: predict
    after: for-lists
    code: |
      def has_negative(numbers):
          for n in numbers:
              if n < 0:
                  return True
              return False


      print(has_negative([4, -1]))
    why: "`return False` is inside the loop, so the function ends after looking at the first number, 4. It belongs after the loop, so that every number is checked first."

  - type: predict
    after: for-strings
    code: |
      count = 0
      for char in "a b c":
          count += 1
      print(count)
    why: "The loop goes through every character, and the two spaces are characters too: 5 in all."

  - type: fill
    after: for-strings
    code: |
      word = "loop"
      result = ""
      for char in word:
          result += [[char.upper()]]
      print(result)
    why: "Each round adds the character in capital letters to the new string `result`."

  - type: runs
    after: for-strings
    code: |
      for digit in 123:
          print(digit)
    why: "A `for` loop needs something to go through, like a list, a string or a range. A number has no items, so Python stops with a `TypeError`: `'int' object is not iterable`."

  - type: predict
    after: range
    code: |
      for i in range(3):
          print(i)
    why: "`range(3)` starts from 0 and leaves out the end, 3. That's three numbers: 0, 1 and 2."

  - type: predict
    after: range
    code: |
      for i in range(1, 10, 3):
          print(i)
    why: "The range starts at 1 and goes up in steps of 3: 1, 4 and 7. The next one, 10, is the end, which is left out."

  - type: choice
    after: range
    prompt: Which loop prints the numbers 1 to 5?
    choices:
      - "`for i in range(5):`"
      - "`for i in range(1, 5):`"
      - "`for i in range(1, 6):`"
    answer: 3
    why: "The end of a range is left out, so to reach 5 the end must be 6. `range(5)` gives 0 to 4 and `range(1, 5)` gives 1 to 4."

  - type: bug
    after: range
    code: |
      for i in range(3, 0):  # BUG
          print(i)
      print("Go")
    fix: "for i in range(3, 0, -1):"
    why: "Without a step, a range counts up, and from 3 up to 0 there are no numbers at all, so the loop never runs. Counting down needs the step -1."

  - type: predict
    after: building-lists
    code: |
      print(range(3))
      print(list(range(3)))
    why: "A range isn't a list: printing it shows the call that made it, not its numbers. `list` turns it into a list of its numbers."

