  - type: bug
    after: constructor
    code: |
      class Cat:
          def __init__(self, name, age):
              self.name = name
              age = age  # BUG


      cat = Cat("Tom", 3)
      print(cat.name, cat.age)
    fix: self.age = age
    why: "Without `self.`, `age = age` only assigns the parameter to itself, and the object never gets the attribute `age`."

