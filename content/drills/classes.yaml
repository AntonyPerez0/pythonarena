  - type: boss
    after: attributes
    prompt: |
      Write a class `Contact` whose constructor takes a name, a phone number and an email address, and stores them in the attributes `name`, `phone` and `email`. When no email address is given, it is an empty string. Every new contact also has the attribute `favorite`, which starts as `False`.

      This code:

      ```python fragment
      mia = Contact("Mia", "555-0101", "mia@example.com")
      leo = Contact("Leo", "555-0199")
      leo.favorite = True
      print(mia.name, mia.phone, mia.email, mia.favorite)
      print(leo.name, leo.phone, leo.email, leo.favorite)
      ```

      prints

      ```
      Mia 555-0101 mia@example.com False
      Leo 555-0199  True
      ```
    seed: |
      # Write the class Contact here.


      if __name__ == "__main__":
          mia = Contact("Mia", "555-0101", "mia@example.com")
          print(mia.name, mia.email)
    solution: |
      class Contact:
          def __init__(self, name, phone, email=""):
              self.name = name
              self.phone = phone
              self.email = email
              self.favorite = False


      if __name__ == "__main__":
          mia = Contact("Mia", "555-0101", "mia@example.com")
          print(mia.name, mia.email)
    hints:
      - "The email gets a default value in the parameter list: `email=\"\"`."
      - "`favorite` isn't a parameter. The constructor sets `self.favorite = False`."
