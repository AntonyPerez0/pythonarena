  - type: boss
    after: objects-and-functions
    prompt: |
      The starter code has a class `Book`. Write a function `pages_by(books, author)` that takes a list of `Book` objects and an author's name, and returns the total number of pages in that author's books (0 when there are none).

      This code:

      ```python fragment
      books = [Book("Emma", "Jane Austen", 474), Book("Beloved", "Toni Morrison", 324), Book("Persuasion", "Jane Austen", 249)]
      print(pages_by(books, "Jane Austen"))
      ```

      prints

      ```
      723
      ```
    seed: |
      class Book:
          def __init__(self, title, author, pages):
              self.title = title
              self.author = author
              self.pages = pages


      def pages_by(books, author):
          pass


      if __name__ == "__main__":
          books = [Book("Emma", "Jane Austen", 474), Book("Beloved", "Toni Morrison", 324)]
          print(pages_by(books, "Jane Austen"))
    solution: |
      class Book:
          def __init__(self, title, author, pages):
              self.title = title
              self.author = author
              self.pages = pages


      def pages_by(books, author):
          total = 0
          for book in books:
              if book.author == author:
                  total += book.pages
          return total


      if __name__ == "__main__":
          books = [Book("Emma", "Jane Austen", 474), Book("Beloved", "Toni Morrison", 324)]
          print(pages_by(books, "Jane Austen"))
    hints:
      - Go through the books with a loop and keep a running total.
      - "Add `book.pages` only when `book.author == author`, and return the total at the end."
    tests:
      - call: |
          books = [Book("Emma", "Jane Austen", 474), Book("Beloved", "Toni Morrison", 324), Book("Persuasion", "Jane Austen", 249)]
          print(pages_by(books, "Jane Austen"))
      - call: |
          books = [Book("Sula", "Toni Morrison", 174), Book("Jazz", "Toni Morrison", 229), Book("Emma", "Jane Austen", 474)]
          print(pages_by(books, "Toni Morrison"))
          print(pages_by(books, "Mary Shelley"))
          print(pages_by([], "Jane Austen"))
        hidden: true
