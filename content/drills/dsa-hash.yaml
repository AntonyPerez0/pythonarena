    why: "A tuple is hashable, a list isn't: `TypeError: cannot use 'list' as a set element (unhashable type: 'list')`. A list can change after it goes in, which would leave it in the wrong bucket. `tuple([3, 4])` works."

  - type: runs
    after: own-keys
    code: |
      class Card:
          def __init__(self, rank):
              self.rank = rank

          def __eq__(self, other):
              return self.rank == other.rank


      hand = {Card(5), Card(5)}
      print(len(hand))
    why: "A class that writes `__eq__` loses the default hash, so its objects can't go in a set: `TypeError: cannot use 'Card' as a set element (unhashable type: 'Card')`. It needs a `__hash__` that agrees with `__eq__`, such as `hash(self.rank)`."

  - type: choice
    after: own-keys
    prompt: "`__eq__` says two tags are equal when `self.name.lower() == other.name.lower()`. Which `__hash__` breaks the rule that equal objects have equal hashes?"
    choices:
      - "`return hash(self.name)`"
      - "`return hash(self.name.lower())`"
      - "`return 0`"
    answer: 1
    why: "`Tag(\"Red\")` and `Tag(\"red\")` are equal, but `hash(\"Red\")` and `hash(\"red\")` differ, so a set keeps both. `return 0` keeps the rule, though every tag collides and lookups become O(n)."

  - type: predict
    after: own-keys
    code: |
      class Seat:
          def __init__(self, number):
              self.number = number

          def __eq__(self, other):
              return self.number == other.number

          def __hash__(self):
              return hash(self.number)


      s = Seat(3)
      taken = {s}
      s.number = 4
      print(s in taken, Seat(3) in taken, len(taken))
    why: "The seat is still in the set, but its hash changed. `s in taken` looks in the bucket for 4, and `Seat(3)` finds the bucket for 3 but no seat equal to it there. Keys must not change while they are in a table."

