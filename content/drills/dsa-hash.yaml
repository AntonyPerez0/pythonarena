    why: "With 8 buckets all three keys share bucket 6. With 16, 14 moves to bucket 14: that's why growing a table moves every key to the bucket worked out with the new size."

  - type: choice
    after: rehashing
    prompt: "This table grows by 10 buckets whenever it's more than 75% full, and each time it moves every pair. How does the total number of moves grow with the number of keys n?"
    code: |
      buckets = 8
      moves = 0
      for count in range(1, 10_001):
          if count / buckets > 0.75:
              moves += count
              buckets += 10
      print(moves)
    choices:
      - "O(n)"
      - "O(n log n)"
      - "O(n²)"
    answer: 3
    why: "It rebuilds every few keys, and each rebuild moves all the keys so far: about n²/15 moves in all. Doubling instead makes each rebuild rarer as the table grows, so the moves add up to about 2n: O(1) amortized per key."

