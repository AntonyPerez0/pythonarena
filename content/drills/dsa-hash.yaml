  - type: choice
    after: buckets
    prompt: "A hash table has 10 buckets that never grow, and it holds 1,000,000 keys spread evenly. About how many keys does a search for a key that isn't there compare with?"
    choices:
      - "About 1"
      - "About 20"
      - "About 100,000"
    answer: 3
    why: "Each chain holds 1,000,000 / 10 = 100,000 keys, and a missing key is compared with every key of its chain. Lookups are O(1) only while the number of buckets keeps up with the number of keys."

  - type: predict
