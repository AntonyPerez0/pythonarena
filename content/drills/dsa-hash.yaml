  - type: predict
    after: lru-cache
    code: |
      from functools import lru_cache


      @lru_cache(maxsize=None)
      def fib(n):
          if n < 2:
              return n
          return fib(n - 1) + fib(n - 2)


      print(fib(30), fib.cache_info().misses)
    why: "Each of fib(0) to fib(30) is worked out once, a miss each: 31. Every other call is a hit. Without the cache, fib(30) makes more than a million calls."

  - type: boss
    after: own-keys
    prompt: |
      Write `count_dominoes(tiles)`. Each tile is a list of two numbers, such as `[2, 5]`, and a tile turned around is the same domino: `[5, 2]` is `[2, 5]`. Return how many different dominoes `tiles` holds. A set is the tool, but a list can't go in one.

      For example, `count_dominoes([[2, 5], [6, 6], [5, 2], [0, 3]])` returns (`[2, 5]` and `[5, 2]` are one domino):

      ```
      3
      ```
    seed: |
      def count_dominoes(tiles):
          pass


      if __name__ == "__main__":
          print(count_dominoes([[2, 5], [6, 6], [5, 2], [0, 3]]))
    solution: |
      def count_dominoes(tiles):
          seen = set()
          for a, b in tiles:
              seen.add((min(a, b), max(a, b)))
          return len(seen)


      if __name__ == "__main__":
          print(count_dominoes([[2, 5], [6, 6], [5, 2], [0, 3]]))
    hints:
      - "A set can't hold the lists, but it can hold tuples. For `[2, 5]` and `[5, 2]` to give the same key, turn every tile the same way first."
      - "Put the smaller number first: `(min(a, b), max(a, b))` is `(2, 5)` for both tiles. Add that tuple to a set, and return the size of the set."
    tests:
      - call: count_dominoes([[2, 5], [6, 6], [5, 2], [0, 3]])
      - call: count_dominoes([])
        hidden: true
      - call: count_dominoes([[4, 4], [4, 4], [4, 4]])
        hidden: true
      - call: count_dominoes([[1, 0], [0, 1], [0, 2], [2, 1], [1, 2]])
        hidden: true
      - call: count_dominoes([[i % 7, i % 5] for i in range(1000)])
        hidden: true

  - type: boss
    after: like-a-dict
    prompt: |
      Write a class `Tally` that counts things, with an ordinary dict inside:

      - `add(item)` adds one to the item's count.
      - `t[item]` gives the item's count, and 0 for an item that was never added (no `KeyError`, and the item isn't added).
      - `item in t` says whether the item was added.
      - `len(t)` gives the number of different items.

      For example, this program:

      ```python fragment
      t = Tally()
      for word in ["to", "be", "or", "not", "to", "be"]:
          t.add(word)
      print(t["to"], t["xyz"], "or" in t, "xyz" in t, len(t))
      ```

      prints:

      ```
      2 0 True False 4
      ```
    seed: |
      class Tally:
          def __init__(self):
              self.counts = {}


      if __name__ == "__main__":
          t = Tally()
          for word in ["to", "be", "or", "not", "to", "be"]:
              t.add(word)
          print(t["to"], t["xyz"], "or" in t, "xyz" in t, len(t))
    solution: |
      class Tally:
          def __init__(self):
              self.counts = {}

          def add(self, item):
              self.counts[item] = self.counts.get(item, 0) + 1

          def __getitem__(self, item):
              return self.counts.get(item, 0)

          def __contains__(self, item):
              return item in self.counts

          def __len__(self):
              return len(self.counts)


      if __name__ == "__main__":
          t = Tally()
          for word in ["to", "be", "or", "not", "to", "be"]:
              t.add(word)
          print(t["to"], t["xyz"], "or" in t, "xyz" in t, len(t))
    hints:
      - "`t[item]` calls `__getitem__`, `item in t` calls `__contains__`, and `len(t)` calls `__len__`."
      - "`self.counts.get(item, 0)` gives 0 for a missing item without adding it, both in `add` and in `__getitem__`."
    tests:
      - call: |
          t = Tally()
          for word in ["to", "be", "or", "not", "to", "be"]:
              t.add(word)
          print(t["to"], t["xyz"], "or" in t, "xyz" in t, len(t))
      - call: |
          t = Tally()
          print(t["a"], "a" in t, len(t))
        hidden: true
      - call: |
          t = Tally()
          for n in [3, 1, 3, 3, 2]:
              t.add(n)
          print(t[3], t[2], t[7], len(t), 7 in t)
        hidden: true
