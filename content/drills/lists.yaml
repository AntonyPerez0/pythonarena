topic: lists
drills:
  - type: predict
    after: items
    code: |
      prices = [10, 20, 30]
      print(prices[1])
      print(prices[-1])
    why: "Indexes start at 0, so `prices[1]` is the second item. Index -1 is the last item."

  - type: runs
    after: items
    code: |
      numbers = [1, 2, 3]
      print(numbers[len(numbers)])
    why: "The list has 3 items, at indexes 0 to 2. `len(numbers)` is 3, one past the end, so Python stops with an `IndexError`. The last item is `numbers[len(numbers) - 1]`, or `numbers[-1]`."

  - type: fill
    after: items
    code: |
      colors = ["red", "green", "blue"]
      colors[[[0]]] = "pink"
      print(colors)
    why: "The first item is at index 0, so `colors[0] = \"pink\"` replaces `\"red\"`."

  - type: predict
    after: adding
    code: |
      letters = ["a", "b"]
      letters.insert(1, "x")
      letters.append("y")
      print(letters)
    why: "`insert(1, \"x\")` puts `\"x\"` at index 1, moving `\"b\"` one place right. `append` adds to the end."

  - type: runs
    after: adding
    code: |
      numbers = [1]
      numbers.append(2, 3)
    why: "`append` adds exactly one item, so a call with two arguments is a `TypeError`. Call it twice to add two items."

  - type: bug
    after: adding
    code: |
      items = []
      items = items.append("pen")  # BUG
      print(items)
    fix: items.append("pen")
    why: "`append` changes the list and returns `None`. Storing that return value in `items` loses the list, so the program prints `None`."

  - type: predict
    after: removing
    code: |
      numbers = [3, 1, 3, 2]
      numbers.remove(3)
      print(numbers)
    why: "`remove` removes only the first item with that value. The second 3 stays."

  - type: predict
    after: removing
    code: |
      stack = [4, 7, 9]
      top = stack.pop()
      print(top)
      print(stack)
    why: "`pop()` without an index removes the last item and returns it, so `top` is 9."

  - type: choice
    after: removing
    prompt: Which line removes the item at index 2 of the list `items`?
    choices:
      - "`items.remove(2)`"
      - "`items.pop(2)`"
      - "`items.delete(2)`"
    answer: 2
    why: "`pop` removes by index. `remove(2)` would look for the value 2, and lists have no `delete` method."

  - type: runs
    after: removing
    code: |
      names = ["Ada", "Linus"]
      names.remove("ada")
    why: "`\"ada\"` and `\"Ada\"` are different strings, so the value isn't in the list, and `remove` stops with a `ValueError`. Check with `in` first."

  - type: predict
    after: sorting
    code: |
      numbers = [3, 1, 2]
      ordered = sorted(numbers)
      print(numbers)
      print(ordered)
    why: "`sorted` returns a new sorted list and leaves the original as it was."

  - type: bug
    after: sorting
    code: |
      numbers = [5, 2, 8]
      numbers = numbers.sort()  # BUG
      print(numbers[0])
    fix: numbers.sort()
    why: "`sort` sorts the list itself and returns `None`, so after this line `numbers` is `None`, and `None[0]` is an error. Just call `numbers.sort()`."

  - type: predict
    after: sorting
    code: |
      print(sorted(["b", "C", "a"]))
    why: "Python puts every capital letter before every small letter, so `\"C\"` comes first."

  - type: predict
    after: max-min-sum
    code: |
      numbers = [4, 9, 2]
      print(max(numbers) - min(numbers))
      print(sum(numbers) / len(numbers))
    why: "9 - 2 is 7. The sum is 15, and 15 / 3 is `5.0`: `/` always gives a `float`."

  - type: choice
    after: max-min-sum
    prompt: Which of these is a method call?
    choices:
      - "`len(numbers)`"
      - "`sorted(numbers)`"
      - "`numbers.sort()`"
      - "`sum(numbers)`"
    answer: 3
    why: "A method is written after the list with a dot. `len`, `sorted` and `sum` are functions that take the list as an argument."

  - type: runs
    after: max-min-sum
    code: |
      numbers = [4, 9]
      print(numbers.sum())
    why: "Lists have no `sum` method, so Python stops with an `AttributeError`. `sum` is a function: `sum(numbers)`."

  - type: predict
    after: lists-and-functions
    code: |
      def evens_up_to(n):
          result = []
          i = 2
          while i <= n:
              result.append(i)
              i += 2
          return result


      print(evens_up_to(7))
      print(len(evens_up_to(10)))
    why: "The function builds a new list and returns it. Up to 10 there are five even numbers: 2, 4, 6, 8 and 10."

  - type: boss
    after: lists-and-functions
    prompt: |
      Write the function `top_two_sum(numbers: list) -> int`, which returns the sum of the two greatest numbers in the list. The list has at least two numbers. Don't change the list itself. For example, `top_two_sum([5, 1, 9, 7])` returns `16`.
    seed: |
      def top_two_sum(numbers: list) -> int:
          pass


      if __name__ == "__main__":
          print(top_two_sum([5, 1, 9, 7]))
    solution: |
      def top_two_sum(numbers: list) -> int:
          ordered = sorted(numbers)
          return ordered[-1] + ordered[-2]


      if __name__ == "__main__":
          print(top_two_sum([5, 1, 9, 7]))
    hints:
      - "A sorted copy, `sorted(numbers)`, has the greatest numbers at its end and leaves the original list alone."
      - "The two last items of the sorted copy are at indexes -1 and -2."
    tests:
      - call: top_two_sum([5, 1, 9, 7])
      - call: top_two_sum([3, 3])
        hidden: true
      - call: |
          numbers = [10, -2, 4, 8]
          print(top_two_sum(numbers))
          print(numbers)
        hidden: true
