  - type: boss
    after: heaps
    prompt: |
      Write `merge_lists(lists)` that merges a list of sorted lists into one sorted list, with a heap. Keep the next item of each list in the heap as `(value, list number, index)`. Pop the smallest, add its value to the result, and push the next item of the same list, if it has one. Some lists may be empty. Don't use `sorted`, `sort` or `heapq.merge`.

      For example, this call:

      ```python fragment
      print(merge_lists([[1, 4, 9], [2, 3, 10], [], [5]]))
      ```

      prints:

      ```
      [1, 2, 3, 4, 5, 9, 10]
      ```
    seed: |
      import heapq


      def merge_lists(lists):
          pass


      if __name__ == "__main__":
          print(merge_lists([[1, 4, 9], [2, 3, 10], [], [5]]))
    solution: |
      import heapq


      def merge_lists(lists):
          heap = []
          for number in range(len(lists)):
              if len(lists[number]) > 0:
                  heapq.heappush(heap, (lists[number][0], number, 0))
          merged = []
          while heap:
              value, number, index = heapq.heappop(heap)
              merged.append(value)
              if index + 1 < len(lists[number]):
                  heapq.heappush(heap, (lists[number][index + 1], number, index + 1))
          return merged


      if __name__ == "__main__":
          print(merge_lists([[1, 4, 9], [2, 3, 10], [], [5]]))
    hints:
      - "Start by pushing the first item of every list that isn't empty: `(lists[number][0], number, 0)`. The list number and the index say where the value came from."
      - "Then, while the heap isn't empty, pop the smallest tuple and append its value to the result."
      - "If that list has an item after `index`, push `(lists[number][index + 1], number, index + 1)`. The heap never holds more than one item per list, so each step is O(log k) for k lists."
    forbid:
      - pattern: \bsorted\s*\(|\.sort\s*\(|\bmerge\s*\(
        message: Merge the lists with your own heap, without `sorted`, `sort` or `heapq.merge`.
