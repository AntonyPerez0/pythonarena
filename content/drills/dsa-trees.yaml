  - type: boss
    after: binary-trees
    prompt: |
      Write `mirror(node)` that turns a binary tree into its mirror image: it swaps the left and right children of every node, in place, and returns the root. An empty tree stays empty.

      For example, this program:

      ```python fragment
      root = mirror(Node(1, Node(2, Node(4), Node(5)), Node(3)))
      print(root.value, root.left.value, root.right.value)
      print(root.right.left.value, root.right.right.value)
      ```

      prints:

      ```
      1 3 2
      5 4
      ```
    seed: |
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def mirror(node):
          pass


      if __name__ == "__main__":
          root = mirror(Node(1, Node(2, Node(4), Node(5)), Node(3)))
          print(root.value, root.left.value, root.right.value)
          print(root.right.left.value, root.right.right.value)
    solution: |
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def mirror(node):
          if node is not None:
              node.left, node.right = mirror(node.right), mirror(node.left)
          return node


      if __name__ == "__main__":
          root = mirror(Node(1, Node(2, Node(4), Node(5)), Node(3)))
          print(root.value, root.left.value, root.right.value)
          print(root.right.left.value, root.right.right.value)
    hints:
      - "The base case is the empty tree: there's nothing to swap, so return it as it is."
      - "For a node, mirror both subtrees, then put the mirrored right subtree on the left and the mirrored left subtree on the right."
      - "One line does both with tuple assignment: `node.left, node.right = mirror(node.right), mirror(node.left)`. Then return the node."
