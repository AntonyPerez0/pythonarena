  - type: bug
    after: level-order
    code: |
      from collections import deque


      class Node:
          def __init__(self, value, left=None, right=None):
              self.value, self.left, self.right = value, left, right


      order = []
      queue = deque([Node(1, Node(2, Node(4)), Node(3))])
      while queue:
          node = queue.pop()  # BUG
          order.append(node.value)
          for child in [node.left, node.right]:
              if child is not None:
                  queue.append(child)
      print(order)
    fix: node = queue.popleft()
    why: "`pop` takes from the back, the node added last, so the deque works as a stack and the walk goes deep first: 1, 3, 2, 4. Level order takes the oldest node from the front with `popleft`: 1, 2, 3, 4."

  - type: choice
    after: level-order
    prompt: A level-order traversal uses a plain list as its queue and takes each node with `queue.pop(0)`. What does that cost for a full binary tree of n nodes?
    choices:
      - "O(n), the same as with a deque"
      - "O(n log n)"
      - "O(n²), because each `pop(0)` moves every item behind it"
    answer: 3
    why: "`pop(0)` shifts every remaining item one place to the left, which is O(n) per pop. In a full tree, the queue holds up to about n/2 nodes, so the n pops cost O(n²) in all. `deque.popleft()` is O(1)."

