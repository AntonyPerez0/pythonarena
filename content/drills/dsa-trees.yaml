    code: |
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value, self.left, self.right = value, left, right


      def best(node):
          if node is None:
              return 0
          return node.value + max(best(node.left), best(node.right))


      print(best(Node(3, Node(8, Node(1)), Node(5, Node(2), Node(9)))))
    why: "`best` adds each node's value to the larger answer of its two subtrees. With only positive values, that finds the root-to-leaf path with the greatest sum: 3 + 5 + 9 = 17, more than 3 + 8 + 1 = 12. With negative values, the 0 for a missing child is a trap: `best(Node(3, Node(-1)))` gives 3, as if a path could end at the root, which isn't a leaf."

