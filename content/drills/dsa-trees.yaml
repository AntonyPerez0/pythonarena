  - type: choice
    after: search-trees
    prompt: You insert the values 1, 2, 3, ..., n, in this order, into an empty binary search tree that doesn't balance itself. What does building the whole tree cost?
    choices:
      - "O(n log n)"
      - "O(n²)"
      - "O(n)"
    answer: 2
    why: "Each new value is the greatest so far, so it walks past every node already in the tree, which has become a chain: 0 + 1 + 2 + ... + (n - 1) steps, about n²/2. In a balanced tree, each insert would cost O(log n)."

  - type: predict
    after: traversals
    code: |
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value, self.left, self.right = value, left, right


      def visit(node, out):
          if node is not None:
              visit(node.right, out)
              out.append(node.value)
              visit(node.left, out)


      out = []
      visit(Node(8, Node(3, Node(1), Node(6)), Node(12, None, Node(15))), out)
      print(out)
    why: "This is in-order with the sides swapped: the right subtree, the node, then the left subtree. In a BST, the greater values now come out first, so the list is sorted from the largest down."

  - type: choice
    after: traversals
    prompt: This in-order traversal returns the right list. What does it cost on a chain of n nodes, where every node has only a right child?
    code: |
      def inorder(node):
          if node is None:
              return []
          return inorder(node.left) + [node.value] + inorder(node.right)
    choices:
      - "O(n)"
      - "O(n log n)"
      - "O(n²)"
    answer: 3
    why: "`+` copies the lists it joins. On a chain, the call at depth d returns a list of n - d values, which the call above it copies again: n + (n - 1) + ... + 1 copies, O(n²). Appending to one shared list, as the lesson does, is O(n)."

