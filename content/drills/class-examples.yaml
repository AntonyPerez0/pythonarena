  - type: boss
    after: keeping-a-list
    prompt: |
      Write a class `Scoreboard`. Give it these methods:

      - `add(name, points)` records a player's points.
      - `best()` returns the name of the player with the most points, the one added first when there's a tie, or `nobody` when no points have been recorded.
      - `__str__` returns the players and their points in the order they were added, separated by commas, as shown below.

      This code:

      ```python fragment
      board = Scoreboard()
      board.add("Ann", 12)
      board.add("Bo", 17)
      board.add("Cy", 9)
      print(board)
      print(board.best())
      ```

      prints

      ```
      Ann 12, Bo 17, Cy 9
      Bo
      ```
    seed: |
      class Scoreboard:
          pass


      if __name__ == "__main__":
          board = Scoreboard()
          board.add("Ann", 12)
          print(board)
          print(board.best())
    solution: |
      class Scoreboard:
          def __init__(self):
              self.scores = []

          def add(self, name, points):
              self.scores.append((name, points))

          def best(self):
              if len(self.scores) == 0:
                  return "nobody"
              top = self.scores[0]
              for score in self.scores:
                  if score[1] > top[1]:
                      top = score
              return top[0]

          def __str__(self):
              parts = []
              for name, points in self.scores:
                  parts.append(f"{name} {points}")
              return ", ".join(parts)


      if __name__ == "__main__":
          board = Scoreboard()
          board.add("Ann", 12)
          print(board)
          print(board.best())
    hints:
      - "Keep a list of `(name, points)` tuples, made empty in the constructor."
      - "For `__str__`, build a list of strings such as `\"Ann 12\"` and join it with `\", \"`."
    tests:
      - call: |
          board = Scoreboard()
          board.add("Ann", 12)
          board.add("Bo", 17)
          board.add("Cy", 9)
          print(board)
          print(board.best())
      - call: |
          board = Scoreboard()
          print(board.best())
          board.add("Zed", 5)
          board.add("Yin", 5)
          print(board.best())
          board.add("Xia", 6)
          print(board)
          print(board.best())
