  - type: choice
    after: printing-objects
    prompt: When does Python call an object's `__str__` method?
    choices:
      - When the object is made
      - When the object has to be turned into a string, for example by `print`
      - Only when you write `obj.__str__()` yourself
    answer: 2
    why: "Python calls `__str__` by itself in `print`, in `str(obj)` and in f-strings. The constructor `__init__` is the one called when the object is made."

