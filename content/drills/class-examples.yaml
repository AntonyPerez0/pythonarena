  - type: boss
    after: searching
    prompt: |
      The starter code has a class `Recipe`. Write a class `Cookbook` that keeps `Recipe` objects in a list, with these methods:

      - `add(name, minutes)` makes a new `Recipe` and puts it in the cookbook.
      - `quick(max_minutes)` returns a list of the recipes that take at most that many minutes, in the order they were added.
      - `slowest()` returns the recipe that takes the longest (the first one of them when there's a tie), or `None` when the cookbook is empty.

      This code:

      ```python fragment
      book = Cookbook()
      book.add("Omelet", 10)
      book.add("Lasagna", 90)
      book.add("Salad", 15)
      for recipe in book.quick(15):
          print(recipe)
      print(book.slowest())
      ```

      prints

      ```
      Omelet, 10 min
      Salad, 15 min
      Lasagna, 90 min
      ```
    seed: |
      class Recipe:
          def __init__(self, name, minutes):
              self.name = name
              self.minutes = minutes

          def __str__(self):
              return f"{self.name}, {self.minutes} min"


      # Write the class Cookbook here.


      if __name__ == "__main__":
          book = Cookbook()
          book.add("Omelet", 10)
          print(book.slowest())
    solution: |
      class Recipe:
          def __init__(self, name, minutes):
              self.name = name
              self.minutes = minutes

          def __str__(self):
              return f"{self.name}, {self.minutes} min"


      class Cookbook:
          def __init__(self):
              self.recipes = []

          def add(self, name, minutes):
              self.recipes.append(Recipe(name, minutes))

          def quick(self, max_minutes):
              found = []
              for recipe in self.recipes:
                  if recipe.minutes <= max_minutes:
                      found.append(recipe)
              return found

          def slowest(self):
              if len(self.recipes) == 0:
                  return None
              best = self.recipes[0]
              for recipe in self.recipes:
                  if recipe.minutes > best.minutes:
                      best = recipe
              return best


      if __name__ == "__main__":
          book = Cookbook()
          book.add("Omelet", 10)
          print(book.slowest())
    hints:
      - "`add` makes the object itself: `self.recipes.append(Recipe(name, minutes))`."
      - "`quick` collects the matching recipes in a new list; `slowest` remembers the slowest so far, after checking for an empty list first."
    tests:
      - call: |
          book = Cookbook()
          book.add("Omelet", 10)
          book.add("Lasagna", 90)
          book.add("Salad", 15)
          for recipe in book.quick(15):
              print(recipe)
          print(book.slowest())
      - call: |
          book = Cookbook()
          print(book.slowest(), book.quick(30))
          book.add("Soup", 40)
          book.add("Stew", 40)
          book.add("Toast", 3)
          print(book.slowest())
          print(len(book.quick(2)), len(book.quick(40)))
        hidden: true
