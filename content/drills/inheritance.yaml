  - type: boss
    after: isinstance
    prompt: |
      Write a class `Gadget` that inherits `Product`. Its constructor takes a name, a price and a warranty in years, and lets `Product`'s constructor set the name and the price. A gadget prints as a product does, followed by ` (X years warranty)`. Use `super()` for both. For example,

      ```python fragment
      phone = Gadget("Phone", 300, 2)
      print(phone)
      print(phone.warranty)
      ```

      should print:

      ```
      Phone: 300 euros (2 years warranty)
      2
      ```
    seed: |
      class Product:
          def __init__(self, name, price):
              self.name = name
              self.price = price

          def __str__(self):
              return f"{self.name}: {self.price} euros"


      # Write the class Gadget here.


      if __name__ == "__main__":
          phone = Gadget("Phone", 300, 2)
          print(phone)
    solution: |
      class Product:
          def __init__(self, name, price):
              self.name = name
              self.price = price

          def __str__(self):
              return f"{self.name}: {self.price} euros"


      class Gadget(Product):
          def __init__(self, name, price, warranty):
              super().__init__(name, price)
              self.warranty = warranty

          def __str__(self):
              return super().__str__() + f" ({self.warranty} years warranty)"


      if __name__ == "__main__":
          phone = Gadget("Phone", 300, 2)
          print(phone)
    hints:
      - "Start with `class Gadget(Product):` and a constructor that calls `super().__init__(name, price)` before it sets `self.warranty`."
      - "`__str__` returns `super().__str__()` plus the warranty part."
    require:
      - pattern: class\s+Gadget\s*\(\s*Product\s*\)
        message: "`Gadget` should inherit `Product`."
      - pattern: super\(\)\.__init__\(
        message: "Use `Product`'s constructor with `super().__init__(...)`."
      - pattern: super\(\)\.__str__\(
        message: "Build the text on `Product`'s version with `super().__str__()`."
    tests:
      - call: |
          phone = Gadget("Phone", 300, 2)
          print(phone)
          print(phone.warranty)
      - call: |
          kettle = Gadget("Kettle", 25, 5)
          print(kettle)
          print(kettle.name)
          print(Product("Mug", 8))
        hidden: true
