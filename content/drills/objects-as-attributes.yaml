  - type: boss
    after: none
    prompt: |
      Write the method `heaviest(self)` in the class `Basket`. It returns the heaviest `Fruit` object in the basket, or `None` if the basket is empty. If two fruits are equally heavy, it returns the one added first.

      For example, this code:

      ```python fragment
      basket = Basket()
      print(basket.heaviest())
      basket.add(Fruit("apple", 180))
      basket.add(Fruit("melon", 950))
      basket.add(Fruit("plum", 60))
      print(basket.heaviest())
      ```

      prints:

      ```
      None
      melon (950 g)
      ```
    seed: |
      class Fruit:
          def __init__(self, name, grams):
              self.name = name
              self.grams = grams

          def __str__(self):
              return f"{self.name} ({self.grams} g)"


      class Basket:
          def __init__(self):
              self.fruits = []

          def add(self, fruit):
              self.fruits.append(fruit)

          def heaviest(self):
              pass


      if __name__ == "__main__":
          basket = Basket()
          print(basket.heaviest())
          basket.add(Fruit("apple", 180))
          basket.add(Fruit("melon", 950))
          basket.add(Fruit("plum", 60))
          print(basket.heaviest())
    solution: |
      class Fruit:
          def __init__(self, name, grams):
              self.name = name
              self.grams = grams

          def __str__(self):
              return f"{self.name} ({self.grams} g)"


      class Basket:
          def __init__(self):
              self.fruits = []

          def add(self, fruit):
              self.fruits.append(fruit)

          def heaviest(self):
              if len(self.fruits) == 0:
                  return None
              best = self.fruits[0]
              for fruit in self.fruits:
                  if fruit.grams > best.grams:
                      best = fruit
              return best


      if __name__ == "__main__":
          basket = Basket()
          print(basket.heaviest())
          basket.add(Fruit("apple", 180))
          basket.add(Fruit("melon", 950))
          basket.add(Fruit("plum", 60))
          print(basket.heaviest())
    hints:
      - "First handle the empty basket: if the list is empty, return `None`."
      - "Otherwise start with the first fruit as the heaviest and compare the `grams` of each fruit with it, using `>` so the first of two equal fruits stays."
