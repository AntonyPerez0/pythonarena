  - type: fill
    after: object-in-object
    code: |
      class Battery:
          def __init__(self):
              self.charge = 100


      class Phone:
          def __init__(self):
              self.battery = Battery()

          def call(self):
              self.[[battery]].charge -= 5


      phone = Phone()
      phone.call()
      print(phone.battery.charge)
    why: "The charge belongs to the phone's battery, so the method goes through the attribute: `self.battery.charge`."

  - type: runs
    after: imports
    code: |
      from point import Point


      class Point:
          def __init__(self, x, y):
              self.x = x
              self.y = y


      print(Point(1, 2).x)
    why: "There's no file `point.py`, so the import stops the program with a `ModuleNotFoundError`. The class is in the same file, so the program needs no import at all."

  - type: choice
    after: imports
    prompt: When does your program need an `import` to use a class?
    choices:
      - Always, before a class can be used
      - When the class is defined in another file
      - When a class uses another class as an attribute
    answer: 2
    why: "An `import` is for code in another file, a module of Python's own or a file of yours. A class in the same file can be used just by its name."

  - type: predict
    after: list-of-objects
    code: |
      class Team:
          def __init__(self):
              self.players = []

          def add(self, name):
              self.players.append(name)


      reds = Team()
      blues = Team()
