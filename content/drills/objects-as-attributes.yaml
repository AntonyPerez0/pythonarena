  - type: runs
    after: object-in-object
    code: |
      class Author:
          def __init__(self, name):
              self.name = name


      class Book:
          def __init__(self, title, author):
              self.title = title
              self.author = author


      book = Book("The Quiet Sea", "Ana Lind")
