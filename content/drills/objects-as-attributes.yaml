  - type: predict
    after: none
    code: |
      def find(names, wanted):
          for name in names:
              if name == wanted:
                  return name
              else:
                  return None


      print(find(["Ann", "Bo"], "Ann"))
      print(find(["Ann", "Bo"], "Bo"))
    why: "The `else: return None` is inside the loop, so the function gives up after checking only the first name. `return None` belongs after the loop, once every name has been checked."

