  - type: bug
    after: list-of-objects
    code: |
      class Basket:
          def __init__(self):
              self.fruits = []

          def add(self, fruit):
              fruits.append(fruit)  # BUG


      basket = Basket()
      basket.add("apple")
      print(basket.fruits)
    fix: self.fruits.append(fruit)
    why: "Inside a method, the list is the attribute `self.fruits`. Plain `fruits` is a local name that doesn't exist, so Python stops with a `NameError`."

  - type: predict
    after: list-of-objects
    code: |
      class Item:
          def __init__(self, kg):
              self.kg = kg


      class Bag:
          def __init__(self):
              self.items = []

          def weight(self):
              total = 0
              for item in self.items:
                  total += item.kg
              return total


      bag = Bag()
      bag.items.append(Item(2))
      bag.items.append(Item(3))
      print(bag.weight())
    why: "`weight` adds up the `kg` of every item in the bag's list: 2 + 3 is 5."

