topic: objects-as-attributes
drills:
  - type: predict
    after: object-in-object
    code: |
      class Customer:
          def __init__(self, name):
              self.name = name


      class Order:
          def __init__(self, number, customer):
              self.number = number
              self.customer = customer


      order = Order(17, Customer("Ida"))
      print(order.customer.name)
    why: "`order.customer` is the `Customer` object, and `.name` is that customer's name."

  - type: predict
    after: object-in-object
