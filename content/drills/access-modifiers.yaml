  - type: boss
    after: protected-methods
    prompt: |
      The class `Player` keeps its score in a protected attribute and changes it with its protected method `_add_points`, which never lets the score go below zero. Write a class `Striker` that inherits `Player`, with two methods: `goal()` adds 3 points and `foul()` takes away 2 points. Use `_add_points` for both. For example,

      ```python fragment
      kai = Striker("Kai")
      kai.foul()
      kai.goal()
      kai.goal()
      kai.foul()
      print(kai)
      ```

      should print:

      ```
      Kai: 4 points
      ```
    seed: |
      class Player:
          def __init__(self, name):
              self.name = name
              self._score = 0

          def _add_points(self, points):
              self._score += points
              if self._score < 0:
                  self._score = 0

          def __str__(self):
              return f"{self.name}: {self._score} points"


      # Write the class Striker here.


      if __name__ == "__main__":
          kai = Striker("Kai")
          kai.goal()
          print(kai)
    solution: |
      class Player:
          def __init__(self, name):
              self.name = name
              self._score = 0

          def _add_points(self, points):
              self._score += points
              if self._score < 0:
                  self._score = 0

          def __str__(self):
              return f"{self.name}: {self._score} points"


      class Striker(Player):
          def goal(self):
              self._add_points(3)

          def foul(self):
              self._add_points(-2)


      if __name__ == "__main__":
          kai = Striker("Kai")
          kai.goal()
          print(kai)
    hints:
      - "`Striker` needs only the two methods. It inherits the constructor and `__str__`."
      - "`goal` calls `self._add_points(3)`, and `foul` calls it with a negative number."
    require:
      - pattern: class\s+Striker\s*\(\s*Player\s*\)
        message: "`Striker` should inherit `Player`."
      - pattern: self\._add_points\(
        min: 2
        message: "Change the score with the protected helper, `self._add_points(...)`, in both methods."
    tests:
      - call: |
          kai = Striker("Kai")
          kai.foul()
          kai.goal()
          kai.goal()
          kai.foul()
          print(kai)
      - call: |
          mo = Striker("Mo")
          mo.goal()
          mo.foul()
          mo.foul()
          print(mo)
          mo.goal()
          mo.goal()
          print(mo)
        hidden: true
