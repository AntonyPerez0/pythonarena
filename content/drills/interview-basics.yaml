  - type: bug
    code: |
      numbers = [1, 2, 2, 3, 2]
      for n in numbers:  # BUG
          if n == 2:
              numbers.remove(n)
      print(numbers)
    fix: "for n in numbers[:]:"
    why: "Removing items from a list while looping over it makes the loop skip the item after each removal. Loop over a copy, or build a new list of the items to keep."

  - type: fill
    prompt: Fill the blank so that `ordered` is sorted but `numbers` stays as it was.
    code: |
      numbers = [3, 1, 2]
      ordered = [[sorted]](numbers)
      print(ordered, numbers)
    why: "`sorted(numbers)` returns a new sorted list. The method `numbers.sort()` sorts the list itself and returns `None`, a classic surprise."

  - type: boss
    prompt: |
      The classic: write a function `fizzbuzz(n)` that **returns** a list of strings for the numbers from 1 to `n`. A multiple of both 3 and 5 is `"FizzBuzz"`, another multiple of 3 is `"Fizz"`, another multiple of 5 is `"Buzz"`, and any other number is the number itself as a string.

      `fizzbuzz(5)` returns:

      ```
      ['1', '2', 'Fizz', '4', 'Buzz']
      ```
    seed: |
      def fizzbuzz(n):
          result = []
          return result
    solution: |
      def fizzbuzz(n):
          result = []
          for number in range(1, n + 1):
              if number % 15 == 0:
                  result.append("FizzBuzz")
              elif number % 3 == 0:
                  result.append("Fizz")
              elif number % 5 == 0:
                  result.append("Buzz")
              else:
                  result.append(str(number))
          return result
    hints:
      - "Loop over `range(1, n + 1)`, and use `%` to test for multiples: `number % 3 == 0`."
      - "Check for multiples of both first (`number % 15 == 0`), or 15 would come out as `Fizz`. Remember `str(number)` for the other numbers."
    tests:
      - call: fizzbuzz(5)
      - call: fizzbuzz(15)
        hidden: true
      - call: fizzbuzz(1)
        hidden: true
      - call: fizzbuzz(0)
        hidden: true
      - call: fizzbuzz(30)[-1]
        hidden: true

  - type: boss
    prompt: |
      Write a function `is_palindrome(text)` that returns `True` when the text reads the same forwards and backwards, and `False` otherwise. Upper and lower case don't matter, and neither do spaces: `"Never odd or even"` is a palindrome. An empty text is one too.

      `is_palindrome("Never odd or even")` returns:

      ```
      True
      ```
    seed: |
      def is_palindrome(text):
          return False
    solution: |
      def is_palindrome(text):
          letters = text.lower().replace(" ", "")
          return letters == letters[::-1]
    hints:
      - "First make a cleaned-up version of the text: `lower()` for the case, and `replace(\" \", \"\")` to drop the spaces."
      - "A string reversed is `s[::-1]`. The text is a palindrome when the cleaned-up string equals its reverse."
    tests:
      - call: is_palindrome("Never odd or even")
      - call: is_palindrome("Python")
      - call: is_palindrome("racecar")
        hidden: true
      - call: is_palindrome("Step on no pets")
        hidden: true
      - call: is_palindrome("ab")
        hidden: true
      - call: is_palindrome("")
        hidden: true
      - call: is_palindrome("Abca")
        hidden: true
