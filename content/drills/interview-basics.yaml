  - type: predict
    code: |
      def describe(first, *rest, **options):
          print(first, rest, options)


      describe(1, 2, 3, sep="-")
      describe("solo")
    why: "`*rest` collects the extra positional arguments into a tuple, and `**options` the extra keyword arguments into a dictionary. Both are empty when there are none."

  - type: predict
    code: |
      for text in ["42", "x"]:
          try:
              number = int(text)
          except ValueError:
              print("bad", text)
