  - type: boss
    after: pruning
    prompt: |
      A palindrome reads the same forward and backward, like `noon` or `eve`. Write `palindrome_splits(text)`: every way to cut `text` into pieces that are all palindromes, each way as a list of its pieces. Choose the first piece, then cut the rest of the text the same way, and prune while you build: a piece that isn't a palindrome ends that branch at once. Try the shortest first piece first, so the ways come in the order the search finds them, starting with the one where every letter is a piece of its own.

      For example, `palindrome_splits("noon")` returns:

      ```
      [['n', 'o', 'o', 'n'], ['n', 'oo', 'n'], ['noon']]
      ```
    seed: |
      def palindrome_splits(text):
          pass


      if __name__ == "__main__":
          print(palindrome_splits("noon"))
    solution: |
      def cut(text, start, path, result):
          if start == len(text):
              result.append(path[:])
              return
          for end in range(start + 1, len(text) + 1):
              piece = text[start:end]
              if piece == piece[::-1]:
                  path.append(piece)
                  cut(text, end, path, result)
                  path.pop()


      def palindrome_splits(text):
          result = []
          cut(text, 0, [], result)
          return result


      if __name__ == "__main__":
          print(palindrome_splits("noon"))
    hints:
      - "Write a helper with `(text, start, path, result)`: `start` is where the uncut rest of the text begins. When `start == len(text)`, the whole text is cut: append a copy of the path to the result."
      - "Otherwise loop `end` from `start + 1` to `len(text)`, and take the piece `text[start:end]`. A piece is a palindrome when `piece == piece[::-1]`."
      - "For a palindrome piece, append it, recurse from `end`, then pop it. Skip the other pieces: no way that starts with them can work."
    tests:
      - call: palindrome_splits("noon")
      - call: palindrome_splits("abc")
        hidden: true
      - call: palindrome_splits("")
        hidden: true
      - call: palindrome_splits("aaa")
        hidden: true
      - call: palindrome_splits("racecar")
        hidden: true
      - call: |
          ways = palindrome_splits("abacabadabacaba")
          print(len(ways), ways[-1], len(palindrome_splits("a" * 14)))
        hidden: true

  - type: boss
    after: n-queens
    prompt: |
      A balance scale has two pans, and you have a box of weights. Write `can_balance(weights)`: `True` when every weight can go on one of the two pans so that both pans hold the same total, and `False` otherwise. The weights are positive whole numbers. Backtrack over the weights one at a time, putting each on the left pan or leaving it for the right one, and prune: an odd total can never be halved, only the left pan needs a running total (the right gets the rest), and a branch ends as soon as the left pan holds more than half the total.

      For example, `print(can_balance([3, 8, 4, 7]), can_balance([6, 1, 3]))` prints this (3 + 8 = 4 + 7, but no group of 6, 1 and 3 weighs 5, half of their total):

      ```
      True False
      ```
    seed: |
      def can_balance(weights):
          pass


      if __name__ == "__main__":
          print(can_balance([3, 8, 4, 7]), can_balance([6, 1, 3]))
    solution: |
      def fill(weights, i, left, half):
          if left == half:
              return True
          if left > half or i == len(weights):
              return False
          return fill(weights, i + 1, left + weights[i], half) or fill(weights, i + 1, left, half)


      def can_balance(weights):
          total = sum(weights)
          if total % 2 != 0:
              return False
          return fill(sorted(weights, reverse=True), 0, 0, total // 2)


      if __name__ == "__main__":
          print(can_balance([3, 8, 4, 7]), can_balance([6, 1, 3]))
    hints:
      - "Add up the weights first. If the total is odd, return `False` at once. Otherwise the left pan must hold exactly `total // 2`."
      - "Write a helper with `(weights, i, left, half)`: `True` when `left == half`, `False` when `left > half` or every weight has been placed."
      - "Otherwise put `weights[i]` on the left pan or leave it for the right one: two calls joined with `or`. Trying the heavy weights first, by sorting in reverse, makes the left pan go over half sooner, so more branches are cut."
    tests:
      - call: print(can_balance([3, 8, 4, 7]), can_balance([6, 1, 3]))
      - call: can_balance([9])
        hidden: true
      - call: can_balance([12, 12])
        hidden: true
      - call: print(can_balance([5, 2, 4, 1]), can_balance([2, 4, 8]))
        hidden: true
      - call: can_balance([2 * i + 1 for i in range(16)])
        hidden: true
      - call: can_balance([5 ** i for i in range(9)] + [1])
        hidden: true
      - call: can_balance([100 * i + 3 for i in range(1, 19)])
        hidden: true
