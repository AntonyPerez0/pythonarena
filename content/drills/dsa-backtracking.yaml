  - type: choice
    after: sudoku
    prompt: A sudoku solver may fill any empty cell next. Which one is the best choice?
    choices:
      - "The one with the fewest allowed digits"
      - "The first one in reading order"
      - "The one with the most allowed digits"
    answer: 1
