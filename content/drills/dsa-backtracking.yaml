  - type: runs
    after: n-queens
    code: |
      diag = set()
      row, col = 1, 3
      diag.add(row - col)
      diag.remove(col - row)
      print(diag)
    why: "The choose added -2, but the un-choose removes 2, which isn't in the set: `KeyError`. Un-choosing must use exactly the key the choose added. (`discard` would hide the mistake: no error, but -2 would stay and block that diagonal for the rest of the search.)"

  - type: choice
    after: n-queens
    prompt: What makes the row-by-row N queens search so much faster than trying every board?
    choices:
      - "It checks each queen before placing it, so a board that's already dead is never finished"
      - "It keeps the queens in a list instead of a grid"
      - "It places the queens from the last row up"
    answer: 1
    why: "Pruning a dead board in an early row cuts off every board that would grow from it. For n = 8 that's 2,057 calls instead of 16,777,216 complete boards. The sets only make each check O(1)."

  - type: bug
    after: grid-paths
    code: |
      def paths(n, row, col, on_path):
          if not (0 <= row < n and 0 <= col < n) or (row, col) in on_path:
              return 0
          if row == col == n - 1:
              return 1
          on_path.add((row, col))
          total = 0
          for dr, dc in [(1, 0), (-1, 0), (0, 1), (0, -1)]:
              total += paths(n, row + dr, col + dc, on_path)
          on_path.add((row, col))  # BUG
          return total


      print(paths(3, 0, 0, set()))
    fix: on_path.remove((row, col))
    why: "A cell must leave the path when the search backs out of it. Left marked, the cells of the first paths block every later path that would cross them, and the count for a 3 × 3 grid comes out 2 instead of 12."

  - type: choice
    after: grid-paths
    prompt: Breadth-first search marks a cell as seen for good. Why does a search for every path through a grid unmark a cell when it backs out of it?
    choices:
      - "Another path may go through that cell later"
      - "To keep the set of marked cells small"
      - "A set can hold the cells of only one path"
    answer: 1
    why: "A cell is off limits only while it's on the current path. Breadth-first search wants only the shortest way to each cell, so the first visit is enough; a search for every path, or the longest one, must let other paths use the cell."

