topic: dsa-backtracking
drills:
  - type: predict
    after: subsets
    code: |
      def explore(items, i, path):
          if i == len(items):
              print(path)
              return
          explore(items, i + 1, path)
          path.append(items[i])
          explore(items, i + 1, path)
          path.pop()


      explore(["x", "y"], 0, [])
    why: "Each call leaves its item out first, so the empty subset comes first. `y` is decided by the deeper calls, so it changes fastest: `[]`, then `['y']`, and only then is `x` taken."

  - type: bug
    after: subsets
    code: |
      def collect(items, i, path, result):
          if i == len(items):
              result.append(path)  # BUG
              return
          path.append(items[i])
          collect(items, i + 1, path, result)
          path.pop()
          collect(items, i + 1, path, result)


      result = []
      collect([1, 2], 0, [], result)
      print(result)
    fix: result.append(path[:])
    why: "`result.append(path)` stores the one list `path` four times, and the pops empty it, so the result is four empty lists. A copy, `path[:]`, keeps each subset as it was when it was found."

  - type: choice
    after: subsets
    prompt: A list has 20 different items. How many subsets does it have, counting the empty one and the whole list?
    choices:
      - "40"
      - "400"
      - "1,048,576"
      - "2,432,902,008,176,640,000"
    answer: 3
    why: "Each item is taken or left out: 2 choices, 20 times, so 2²⁰ = 1,048,576 subsets. The last number is 20!, the number of orderings of the 20 items."

  - type: predict
    after: subsets
    code: |
      calls = 0


      def explore(n, i):
          global calls
          calls += 1
          if i < n:
              explore(n, i + 1)
              explore(n, i + 1)


      explore(3, 0)
      print(calls)
    why: "Every call above the last level makes two more: 1 + 2 + 4 + 8 = 15 calls. The decision tree for n items has 2ⁿ⁺¹ - 1 calls, so each extra item doubles the work."

  - type: bug
    after: permutations
    code: |
      def permute(letters, used, path):
          if len(path) == len(letters):
              print("".join(path))
              return
          for i in range(len(letters)):
              if not used[i]:
                  used[i] = True
                  path.append(letters[i])
                  permute(letters, used, path)
                  path.pop()
                  used[i] = True  # BUG


      permute("xyz", [False] * 3, [])
    fix: used[i] = False
    why: "The un-choose must undo the choose. Setting the flag to `True` again leaves every letter used once the first path is done, so only `xyz` is printed instead of all six orderings."

  - type: predict
    after: permutations
    code: |
      from itertools import permutations

      words = ["".join(p) for p in permutations("deed")]
      print(len(words), len(set(words)))
    why: "`permutations` treats the two d's as different items, and the two e's too, so it makes 4! = 24 orderings, and each of the 6 different strings comes 2 × 2 = 4 times. A set removes the repeats, but only after all n! orderings were made."

  - type: runs
    after: permutations
    code: |
      def permute_swap(items, i):
          if i == len(items):
              print("".join(items))
              return
          for j in range(i, len(items)):
              items[i], items[j] = items[j], items[i]
              permute_swap(items, i + 1)
              items[i], items[j] = items[j], items[i]


      permute_swap("abc", 0)
    why: "A string can't be changed in place, so the swap `items[i], items[j] = ...` stops with a `TypeError`. The swap version needs a list: `permute_swap(list(\"abc\"), 0)`."

  - type: fill
    after: pruning
    code: |
      def combos(n, k, start, path):
          if len(path) == k:
              print(path)
              return
          for x in range(start, n + 1):
              path.append(x)
              combos(n, k, [[x + 1]], path)
              path.pop()


      combos(3, 2, 1, [])
    why: "Starting the next call after `x` keeps the numbers in each combination increasing, so each combination is built once: `[2, 1]` never comes after `[1, 2]`, and no number is used twice."

  - type: choice
    after: pruning
    prompt: "The numbers are sorted, and in the loop over the next number to take, `numbers[i]` is already bigger than what's still missing of the target. What's the best thing to do?"
    choices:
      - "`break`: every later number is bigger too, so none of them can fit"
      - "`continue`: skip this number and try the next one"
      - "`return 0`: no subset can be found from here"
    answer: 1
    why: "In a sorted list, every number after `numbers[i]` is at least as big, so the rest of the loop can't find anything: `break` cuts it all. `continue` gives the same answer but tries every bigger number for nothing, and `return 0` would throw away the ways already counted in this loop."

