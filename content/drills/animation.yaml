  - type: choice
    after: circles
    prompt: "What does `pygame.transform.rotate(robot, 90)` do?"
    choices:
      - It gives a new image, the robot turned 90 degrees counterclockwise
      - It turns the robot image itself by 90 radians
      - It moves the robot 90 pixels round a circle
