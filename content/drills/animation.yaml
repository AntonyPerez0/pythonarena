  - type: choice
    after: moving
    prompt: What does `clock.tick(60)` at the end of the main loop do?
    choices:
      - It keeps the loop from going round more than 60 times a second
      - It moves every image 60 pixels
      - It ends the program after 60 frames
    answer: 1
    why: "`tick(60)` waits for the rest of a 60th of a second when a round was quicker. So the animation has the same speed on every computer."

  - type: choice
    after: moving
    prompt: "Where does `clock = pygame.time.Clock()` go?"
    choices:
      - Inside the main loop, before `tick`
      - Once, before the main loop
      - In the event loop, when an event comes
    answer: 2
    why: "The program needs one clock that measures every round. Make it once before the main loop and call `clock.tick(60)` in every round."

  - type: choice
    after: moving
    prompt: "An animation forgets to call `window.fill` at the start of each frame. What happens to a moving robot?"
    choices:
      - It stays where it started
      - It leaves a trail of old pictures behind it
      - The window turns black
    answer: 2
    why: "Without the fill, nothing paints over the earlier frames, so every old picture of the robot stays in the window."

