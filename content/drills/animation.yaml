  - type: choice
    after: circles
    prompt: Why does a spinning image get centered by the size of the turned image, not the original's?
    choices:
      - Because the turned image is bigger, its corners sticking out, and its size changes with the angle
      - Because the original image is removed when it's turned
      - Because `blit` can't draw images that aren't turned
    answer: 1
    why: "A 40 x 40 image turned 45 degrees needs 56 x 56 pixels. Centering by the turned size keeps the image's center in place as it spins."

  - type: boss
    after: bouncing
    prompt: |
      An object 40 pixels wide moves back and forth in a window 320 pixels wide, as in the lesson. It starts at x = 0. In each frame it's drawn first; then its x changes by the speed, and if `x + 40 >= 320` or `x <= 0`, the speed turns around.

      Write a function `bounce_positions(speed, frames)` that returns a list of the x positions the first `frames` frames show. For example,

      ```python fragment
      print(bounce_positions(100, 6))
      ```

      should print:

      ```
      [0, 100, 200, 300, 200, 100]
      ```
    seed: |
      def bounce_positions(speed, frames):
          pass


      if __name__ == "__main__":
          print(bounce_positions(100, 6))
    solution: |
      def bounce_positions(speed, frames):
          positions = []
          x = 0
          for frame in range(frames):
              positions.append(x)
              x += speed
              if x + 40 >= 320 or x <= 0:
                  speed = -speed
          return positions


      if __name__ == "__main__":
          print(bounce_positions(100, 6))
    hints:
      - "Start with `x = 0` and an empty list. A loop goes round once for each frame."
      - "In each round, first append x (that's the frame being drawn), then add the speed to x and turn the speed around when the object is at a wall."
    tests:
      - call: print(bounce_positions(100, 6))
      - call: bounce_positions(70, 12)
        hidden: true
      - call: bounce_positions(3, 4)
        hidden: true
