  - type: fill
    after: first-methods
    code: |
      class Square:
          def __init__(self, side):
              self.side = side

          def area([[self]]):
              return self.side * self.side


      print(Square(4).area())
    why: "Every method's first parameter is `self`, the object the method is called on."

