  - type: boss
    after: keeping-it-valid
    prompt: |
      Write a class `Elevator` whose constructor takes the number of the top floor and stores it in the attribute `top`. A new elevator is on floor 0, in the attribute `floor`. Give it these methods:

      - `up()` moves the elevator one floor up, but not above the top floor.
      - `down()` moves it one floor down, but not below 0.
      - `go_to(floor)` moves the elevator to the given floor and returns `True`, if the floor is between 0 and the top floor. Otherwise it returns `False` and the elevator stays where it is.

      This code:

      ```python fragment
      lift = Elevator(3)
      lift.down()
      print(lift.floor)
      print(lift.go_to(5), lift.floor)
      print(lift.go_to(3), lift.floor)
      lift.up()
      print(lift.floor)
      ```

      prints

      ```
      0
      False 0
      True 3
      3
      ```
    seed: |
      class Elevator:
          pass


      if __name__ == "__main__":
          lift = Elevator(3)
          lift.up()
          print(lift.floor)
    solution: |
      class Elevator:
          def __init__(self, top):
              self.top = top
              self.floor = 0

          def up(self):
              if self.floor < self.top:
                  self.floor += 1

          def down(self):
              if self.floor > 0:
                  self.floor -= 1

          def go_to(self, floor):
              if 0 <= floor <= self.top:
                  self.floor = floor
                  return True
              return False


      if __name__ == "__main__":
          lift = Elevator(3)
          lift.up()
          print(lift.floor)
    hints:
      - "`up` moves only `if self.floor < self.top`, and `down` only `if self.floor > 0`."
      - "In `go_to`, check `0 <= floor <= self.top` before changing anything, and return `True` or `False`."
    tests:
      - call: |
          lift = Elevator(3)
          lift.down()
          print(lift.floor)
          print(lift.go_to(5), lift.floor)
          print(lift.go_to(3), lift.floor)
          lift.up()
          print(lift.floor)
      - call: |
          tower = Elevator(10)
          for i in range(4):
              tower.up()
          print(tower.floor)
          print(tower.go_to(-1), tower.go_to(0), tower.floor)
          tower.down()
          print(tower.floor, tower.top)
        hidden: true

  - type: boss
    after: helper-methods
    prompt: |
      Write a class `Grades` that collects exam grades from 0 to 5. Give it these methods:

      - `add(grade)` records the grade and returns `True`, but only if it is from 0 to 5. Otherwise it records nothing and returns `False`. Check the grade with a helper method `valid(grade)` that returns `True` or `False`.
      - `count()` returns how many grades have been recorded.
      - `mean()` returns their mean, or 0 when there are none.

      This code:

      ```python fragment
      course = Grades()
      print(course.add(4), course.add(9), course.add(5))
      print(course.count(), course.mean())
      ```

      prints

      ```
      True False True
      2 4.5
      ```
    seed: |
      class Grades:
          pass


      if __name__ == "__main__":
          course = Grades()
          print(course.add(4), course.add(9))
          print(course.count(), course.mean())
    solution: |
      class Grades:
          def __init__(self):
              self.number = 0
              self.total = 0

          def valid(self, grade):
              return 0 <= grade <= 5

          def add(self, grade):
              if not self.valid(grade):
                  return False
              self.number += 1
              self.total += grade
              return True

          def count(self):
              return self.number

          def mean(self):
              if self.number == 0:
                  return 0
              return self.total / self.number


      if __name__ == "__main__":
          course = Grades()
          print(course.add(4), course.add(9))
          print(course.count(), course.mean())
    hints:
      - "A count and a total are enough to give the mean. Don't call the attribute `count`, or it would hide the method of the same name."
      - "`add` calls the helper through `self`: `if not self.valid(grade): return False`."
    require:
      - pattern: self\.valid\(
        message: "Check the grade in `add` with the helper method: `self.valid(grade)`."
    tests:
      - call: |
          course = Grades()
          print(course.add(4), course.add(9), course.add(5))
          print(course.count(), course.mean())
      - call: |
          g = Grades()
          print(g.count(), g.mean())
          print(g.add(-1), g.add(0), g.add(6), g.add(3))
          print(g.count(), g.mean(), g.valid(5), g.valid(7))
        hidden: true
