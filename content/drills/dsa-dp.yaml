topic: dsa-dp
drills:
  - type: predict
    after: memoization
    code: |
      calls = 0


      def fib(n, memo):
          global calls
          calls += 1
          if n < 2:
              return n
          if n not in memo:
              memo[n] = fib(n - 1, memo) + fib(n - 2, memo)
          return memo[n]


      print(fib(6, {}), calls)
    why: "Each of `fib(2)` to `fib(6)` is worked out once. The first call for each n goes down the `n - 1` side, and the `n - 2` side then finds its answer in the memo: 2 × 6 - 1 = 11 calls, instead of 25 without the memo."

  - type: bug
    after: memoization
    code: |
      def choose(n, k, memo):
          if k == 0 or k == n:
              return 1
          key = n  # BUG
          if key not in memo:
              memo[key] = choose(n - 1, k - 1, memo) + choose(n - 1, k, memo)
          return memo[key]


      print(choose(5, 2, {}))
    fix: key = (n, k)
    why: "The answer depends on `n` and `k`, but the key holds only `n`, so `choose(4, 1)` and `choose(4, 2)` share one entry, and the second gets the first one's answer: 4 instead of 6, and 8 in all instead of 10. The key must hold every argument that changes: `(n, k)`."

  - type: runs
    after: memoization
    code: |
      from functools import cache


      @cache
      def total(values):
          if not values:
              return 0
          return values[0] + total(values[1:])


      print(total([3, 4, 5]))
    why: "`@cache` stores its answers in a dict keyed by the arguments, and a list can't be a dict key: `TypeError: unhashable type: 'list'`. Pass a tuple, or an index into the list, instead."

  - type: choice
    after: memoization
    prompt: What does the memoized `fib(n)` cost in time, with the memo starting empty?
    choices:
      - "O(1.6ⁿ), like the plain recursion"
      - "O(n)"
      - "O(n²)"
      - "O(log n)"
    answer: 2
    why: "There are n + 1 different questions, `fib(0)` to `fib(n)`, each worked out once with O(1) work, and every repeat is one dict lookup. A memoized function costs the number of different questions times the work for each."

  - type: runs
    after: memoization
    code: |
      def fib(n, memo):
          if n < 2:
              return n
          if n not in memo:
              memo[n] = fib(n - 1, memo) + fib(n - 2, memo)
          return memo[n]


      print(fib(3000, {}) % 1000)
    why: "The memo makes the calls fewer, not shallower: `fib(3000)` waits for `fib(2999)`, which waits for `fib(2998)`, and so on, 3,000 calls at once. Python stops at about 1,000 with a `RecursionError`. For big inputs, fill the answers in bottom-up, with a loop."

  - type: bug
    after: bottom-up
    code: |
      def stairs(n):
          ways = [0] * n  # BUG
          ways[0] = 1
          for i in range(1, n + 1):
              ways[i] = ways[i - 1]
              if i >= 2:
                  ways[i] += ways[i - 2]
          return ways[n]


      print(stairs(5))
    fix: ways = [0] * (n + 1)
    why: "The table needs a place for every number of steps from 0 to n: that's n + 1 places. With only n, `ways[n]` is past the end, and the loop stops with an `IndexError` at `i == n`."

  - type: fill
    after: bottom-up
    code: |
      def fib(n):
          a, b = 0, 1
          for _ in range(n):
              a, b = [[b, a + b‖(b, a + b)‖b, b + a‖(b, b + a)]]
          return a


      print(fib(10))
    why: "Both values on the right are worked out from the old `a` and `b` before either is assigned, so the pair moves one step along the sequence each round: only the last two values are kept, O(1) memory."

