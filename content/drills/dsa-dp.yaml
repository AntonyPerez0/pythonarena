    why: "`before = current` runs first, so the next line adds `current` to itself: the numbers double, 2, 4, 8, 16, instead of following the sequence 2, 3, 5, 8. Assign both at once: `before, current = current, before + current`."

  - type: predict
    after: coin-change
    code: |
      coins = [1, 6, 10]
      amount = 12
      count = 0
      for coin in sorted(coins, reverse=True):
          count += amount // coin
          amount %= coin
      print(count)
    why: "Greedy takes the 10 first and then needs two 1s: 3 coins. But 6 + 6 makes 12 with 2. Greedy never asks what its first choice costs later; the DP table looks at every coin for every amount."

  - type: choice
    after: coin-change
    prompt: "`ways[a] += ways[a - coin]` fills a table of the ways to make each amount. Which loop order counts `1 + 2` and `2 + 1` as one way?"
    choices:
      - "The coins in the outer loop, the amounts in the inner loop"
      - "The amounts in the outer loop, the coins in the inner loop"
      - "Either order gives the same count"
    answer: 1
    why: "With the coins outside, every way is built with its coins in the order of the list, so each combination is made once. With the amounts outside, the last coin can be any coin, so `1 + 2` and `2 + 1` are counted as two orderings."

  - type: predict
    after: grid-paths
    code: |
      table = [[0] * 3] * 2
      table[0][1] = 5
      print(table)
    why: "`* 2` repeats the reference to one inner list, so both rows are the same list, and changing a cell of one row changes the other. A table needs a new list for each row: `[[0] * 3 for _ in range(2)]`."

  - type: choice
    after: grid-paths
    prompt: "An open 25 × 25 grid has about 32 trillion right-and-down routes from its top-left cell to its bottom-right cell. How many additions does the DP table take to count them?"
    choices:
      - "About 625, one per cell"
      - "About 32 trillion, one per route"
      - "About 48, one per move of a route"
      - "About 390,000, one per pair of cells"
    answer: 1
    why: "A cell's count is the count above it plus the count on its left, added once and then reused by the cells after it: O(rows × cols). Walking the routes one by one takes as long as there are routes."

  - type: bug
    after: lcs
    code: |
      a, b = "abcd", "acd"
      length = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
      for i in range(1, len(a) + 1):
          for j in range(1, len(b) + 1):
              if a[i] == b[j]:  # BUG
                  length[i][j] = length[i - 1][j - 1] + 1
              else:
                  length[i][j] = max(length[i - 1][j], length[i][j - 1])
      print(length[len(a)][len(b)])
    fix: "if a[i - 1] == b[j - 1]:"
    why: "Entry `i` of the table is about the first `i` characters, and the last of them is at index `i - 1`. With `a[i]` and `b[j]`, the program compares the wrong characters, and already in the first row, at `j == len(b)`, `b[j]` is past the end of `b`: `IndexError`."

  - type: choice
    after: lcs
    prompt: What do the LCS and edit distance tables cost for two strings of n and m characters?
    choices:
      - "O(n × m) time and memory"
      - "O(n + m) time and memory"
      - "O(2ⁿ) time"
      - "O(n × m) time and O(1) memory"
    answer: 1
    why: "There's an entry for every pair of prefix lengths, (n + 1) × (m + 1) of them, and each takes O(1) from entries already there. A row reads only the row above, so two rows are enough when you want just the number, O(m) memory, but walking back to the string needs the whole table."

  - type: bug
    after: knapsack
    code: |
      weights, values, capacity = [3, 4], [5, 6], 8
      best = [0] * (capacity + 1)
      for w, v in zip(weights, values):
          for c in range(w, capacity + 1):  # BUG
              best[c] = max(best[c], v + best[c - w])
      print(best[capacity])
    fix: "for c in range(capacity, w - 1, -1):"
    why: "Going up, `best[c - w]` may already hold this item, so it's packed again: two of the 4 give 12. Going down, `best[c - w]` still holds the items before this one, so each item is used once: 3 + 4 gives 11."

