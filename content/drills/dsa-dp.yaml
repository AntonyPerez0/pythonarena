  - type: boss
    after: bottom-up
    prompt: |
      A secret note turns each letter into its place in the alphabet, A as 1, B as 2 and so on to Z as 26, and then runs the numbers together with no spaces. So the digits can often be split back into letters in more than one way. Write `decodings(digits)`: the number of ways to split the string `digits` into letters. `"1312"` splits in 4 ways: 1 3 1 2 (ACAB), 13 1 2 (MAB), 1 3 12 (ACL) and 13 12 (ML). No letter's number starts with 0, so a 0 has to be the second digit of 10 (J) or 20 (T): `"205"` splits only as 20 5, and `"2005"` can't be split at all. An empty string splits in one way, into no letters.

      Let `ways[i]` count the splits of the first `i` digits. The last letter of such a split is one digit, `digits[i - 1]`, when that digit isn't 0, or two digits, `digits[i - 2:i]`, when they make a number from 10 to 26.

      For example, `print(decodings("1312"), decodings("2005"))` prints:

      ```
      4 0
      ```
    seed: |
      def decodings(digits):
          pass


      if __name__ == "__main__":
          print(decodings("1312"), decodings("2005"))
    solution: |
      def decodings(digits):
          n = len(digits)
          ways = [0] * (n + 1)
          ways[0] = 1
          for i in range(1, n + 1):
              if digits[i - 1] != "0":
                  ways[i] = ways[i - 1]
              if i >= 2 and 10 <= int(digits[i - 2:i]) <= 26:
                  ways[i] += ways[i - 2]
          return ways[n]


      if __name__ == "__main__":
          print(decodings("1312"), decodings("2005"))
    hints:
      - "Make `ways = [0] * (len(digits) + 1)` with `ways[0] = 1`: the empty string splits in one way."
      - "For each `i` from 1: when `digits[i - 1]` isn't `\"0\"`, it can be a letter by itself, so every split of the first `i - 1` digits goes on with it: start from `ways[i - 1]`."
      - "When `i >= 2` and `int(digits[i - 2:i])` is from 10 to 26, the last two digits can be one letter too: add `ways[i - 2]`. A `\"05\"` gives 5, so the 10 to 26 check also stops a 0 from starting a letter. Return `ways[len(digits)]`."
    tests:
      - call: print(decodings("1312"), decodings("2005"))
      - call: print(decodings("205"), decodings("7"), decodings("27"), decodings(""))
        hidden: true
      - call: print(decodings("110"), decodings("2626"), decodings("0"), decodings("301"), decodings("1020"))
        hidden: true
      - call: decodings("12" * 20)
        hidden: true

  - type: boss
    after: lcs
    prompt: |
      A hiker's watch records the height above sea level every few minutes. Pick some of the readings, keeping them in the order they were taken (skipping any you like), so that each picked reading is **higher** than the one picked before it. Write `lis_length(heights)`: the most readings you can pick that way, which is the length of the longest **strictly increasing subsequence**. For `[3, 8, 4, 5, 1, 9, 6, 7]` it's 5: 3, 4, 5, 6 and 7.

      Let `longest[i]` be the most readings you can pick when the last one picked is `heights[i]`. Picking that reading alone gives 1. And every earlier reading `heights[j]` that is lower can come just before it, giving `longest[j] + 1`. Take the biggest of those. The answer is the biggest entry of `longest`, or 0 when there are no readings.

      For example, `lis_length([3, 8, 4, 5, 1, 9, 6, 7])` returns:

      ```
      5
      ```
    seed: |
      def lis_length(heights):
          pass


      if __name__ == "__main__":
          print(lis_length([3, 8, 4, 5, 1, 9, 6, 7]))
    solution: |
      def lis_length(heights):
          if not heights:
              return 0
          longest = [1] * len(heights)
          for i in range(len(heights)):
              for j in range(i):
                  if heights[j] < heights[i] and longest[j] + 1 > longest[i]:
                      longest[i] = longest[j] + 1
          return max(longest)


      if __name__ == "__main__":
          print(lis_length([3, 8, 4, 5, 1, 9, 6, 7]))
    hints:
      - "Start with `longest = [1] * len(heights)`: any reading on its own is a climb of one reading."
      - "For each `i`, go through every `j` before it. When `heights[j] < heights[i]`, the readings picked up to `j` can go on with reading `i`, so `longest[j] + 1` is a candidate for `longest[i]`."
      - "Return the biggest entry with `max(longest)`, but check for an empty list first: `max` of an empty list is an error."
    tests:
      - call: lis_length([3, 8, 4, 5, 1, 9, 6, 7])
      - call: lis_length([6, 6, 6, 6])
        hidden: true
      - call: print(lis_length([]), lis_length([42]))
        hidden: true
      - call: print(lis_length([2, 4, 6, 8]), lis_length([8, 6, 4, 2]))
        hidden: true
      - call: lis_length([5, 1, 6, 2, 7, 3, 8, 4])
        hidden: true
      - call: lis_length([i * 37 % 101 for i in range(300)])
        hidden: true
