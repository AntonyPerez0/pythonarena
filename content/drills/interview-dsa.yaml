  - type: bug
    code: |
      values = [4, 7, 2, 8, 5]
      for i in range(len(values)):  # BUG
          if values[i] % 2 == 0:
              del values[i]
      print(values)
    fix: "for i in reversed(range(len(values))):"
    why: "`range(len(values))` is worked out once, for 5 items. Each `del` moves the items after it one place to the left, so the loop skips each item that moves into the gap (the 7 and the 8), and then runs past the new end with an `IndexError`. Going backwards, a `del` only moves items the loop has already checked. Each `del` moves every item after it, so a loop of them is O(n²) at worst. Simpler and faster is a new list, `[v for v in values if v % 2 != 0]`: one pass, O(n)."

  - type: choice
    prompt: "This greedy way pays an amount with the largest coin that fits, again and again. With coins of 1, 3 and 4, it pays 6 with 3 coins. Is that the fewest?"
    code: |
      def greedy_coins(amount, coins):
          count = 0
          for coin in sorted(coins, reverse=True):
              count += amount // coin
              amount %= coin
          return count


      print(greedy_coins(6, [1, 3, 4]))
    choices:
      - "Yes: taking the largest coin first always gives the fewest coins"
      - "Yes, because the coins are sorted from largest to smallest first"
      - "No: 3 + 3 pays 6 with 2 coins"
    answer: 3
    why: "Taking the 4 first leaves 2, which needs two 1s: 4 + 1 + 1. A greedy choice is never taken back, so it can rule out the best answer. For coins of 1, 5, 10 and 25 the greedy way happens to be right, but in general you have to compare the options: dynamic programming works out the fewest coins for every amount from 0 up to 6."

  - type: choice
    prompt: "This `fib` has no memo. How does the number of calls grow with n?"
    code: |
      calls = 0


      def fib(n):
          global calls
          calls += 1
          if n < 2:
              return n
          return fib(n - 1) + fib(n - 2)


      print(fib(10), calls)
    choices:
      - "O(n)"
      - "O(n²)"
      - "Exponentially: each step up in n multiplies it by about 1.6"
    answer: 3
    why: "Each call makes two more, and the same values are worked out again and again: fib(10) takes 177 calls, fib(20) 21,891 and fib(30) more than 2.6 million. The count grows like the Fibonacci numbers themselves, about 1.618 times for each step. A memo, such as `functools.cache`, works out each of fib(0) to fib(n) once, so the work is O(n)."

