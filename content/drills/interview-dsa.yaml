  - type: boss
    prompt: |
      Write `balanced(text)`: it returns `True` when every bracket in `text` is closed by a bracket of the same kind, in the right order, and `False` otherwise. The brackets are `()`, `[]` and `{}`, and other characters don't matter. So `"([)]"` isn't balanced, and a text without brackets is. A stack of the brackets still open does it in one pass, O(n).

      For example, `balanced("(a[b]{c})")` returns:

      ```
      True
      ```
    seed: |
      def balanced(text):
          pass


      if __name__ == "__main__":
          print(balanced("(a[b]{c})"))
    solution: |
      def balanced(text):
          partner = {")": "(", "]": "[", "}": "{"}
          stack = []
          for char in text:
              if char in "([{":
                  stack.append(char)
              elif char in partner:
                  if not stack or stack.pop() != partner[char]:
                      return False
          return not stack


      if __name__ == "__main__":
          print(balanced("(a[b]{c})"))
    hints:
      - "Keep a list `stack` of the opening brackets that are still open. An opening bracket goes on top with `append`."
      - "A closing bracket must match the bracket on top: if the stack is empty, or `stack.pop()` isn't its partner, return `False`. A dict such as `{\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}` gives each closing bracket its partner. At the end, every bracket must be closed, so the stack must be empty."
    tests:
      - call: balanced("(a[b]{c})")
      - call: balanced("([)]")
        hidden: true
      - call: balanced("")
        hidden: true
      - call: balanced("no brackets")
        hidden: true
      - call: balanced("((")
        hidden: true
      - call: balanced("a)b(")
        hidden: true
      - call: balanced("]")
        hidden: true
      - call: balanced("{[()()]}[]")
        hidden: true
      - call: balanced("{[(])}")
        hidden: true

  - type: boss
    prompt: |
      Write `two_sum(numbers, target)`. It returns a tuple `(i, j)`, with `i < j`, of the positions of two numbers that add up to `target`, or `None` when no two numbers do. At most one pair adds up to `target`. A number can't pair with itself, but two equal numbers at different positions can. It must be fast for 200,000 numbers: a loop inside a loop is O(n²), too slow for the hidden test. With a dict of the numbers seen so far, one pass is enough: O(n).

      For example, `two_sum([4, 9, 4, 2], 8)` returns the positions of the two 4s:

      ```
      (0, 2)
      ```
    seed: |
      def two_sum(numbers, target):
          pass


      if __name__ == "__main__":
          print(two_sum([4, 9, 4, 2], 8))
    solution: |
      def two_sum(numbers, target):
          seen = {}
          for j, number in enumerate(numbers):
              if target - number in seen:
                  return (seen[target - number], j)
              seen[number] = j
          return None


      if __name__ == "__main__":
          print(two_sum([4, 9, 4, 2], 8))
    slow: |
      def two_sum(numbers, target):
          for i in range(len(numbers)):
              for j in range(i + 1, len(numbers)):
                  if numbers[i] + numbers[j] == target:
                      return (i, j)
          return None


      if __name__ == "__main__":
          print(two_sum([4, 9, 4, 2], 8))
    hints:
      - "The partner a number needs is `target - number`. Keep a dict `seen` that maps each number before the current one to its position."
      - "In one loop with `enumerate`: if the partner is in `seen`, return `(seen[target - number], j)`. Only after that check, add the number itself to `seen`, so it can't pair with itself. After the loop, return `None`."
    tests:
      - call: two_sum([4, 9, 4, 2], 8)
      - call: two_sum([3, 9, 4, 7], 11)
        hidden: true
      - call: two_sum([2, 7, 11, 15], 9)
        hidden: true
      - call: two_sum([5, 5], 10)
        hidden: true
      - call: two_sum([-3, 4, 10], 7)
        hidden: true
      - call: two_sum([0, 4, 3, 0], 0)
        hidden: true
      - call: print(two_sum([1, 6, 2], 12))
        hidden: true
      - call: print(two_sum([], 4))
        hidden: true
      - call: two_sum([3 * i for i in range(200_000)] + [1], 599_998)
        hidden: true
        big: true
