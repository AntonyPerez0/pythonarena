topic: interview
title: "Data structures and algorithms: costs, searching, sorting, hashing, heaps, graphs and dynamic programming"
drills:
  - type: choice
    prompt: "What is the Big-O of `count_steps(n)`?"
    code: |
      def count_steps(n):
          steps = 0
          for _ in range(n):
              j = 1
              while j < n:
                  j *= 2
                  steps += 1
          return steps


      print(count_steps(8))
    choices:
      - "O(n)"
      - "O(log n)"
      - "O(n log n)"
      - "O(n²)"
    answer: 3
    why: "The outer loop runs n times. The inner loop doubles `j` until it reaches n, which takes about log₂ n rounds: 3 for n = 8, so this prints 24. n rounds of about log n steps each is O(n log n)."

  - type: predict
    code: |
      def search(values, target):
          lo, hi = 0, len(values) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if values[mid] == target:
                  return mid
              if values[mid] < target:
                  lo = mid + 1
              else:
                  hi = mid - 1
          return -1


      values = [2, 5, 5, 5, 8, 13]
      print(search(values, 5), search(values, 9))
    why: "The first `mid` is (0 + 5) // 2 = 2, and `values[2]` is already 5, so it returns 2: a 5, but not the first one, which is at index 1. For 9, the range closes in on 8 and 13 and ends empty, with `lo` past `hi`, so it returns -1. To find the first copy of a value, use `bisect.bisect_left`."

