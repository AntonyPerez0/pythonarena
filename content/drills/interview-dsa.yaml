  - type: choice
    prompt: "A program adds numbers to a collection and, again and again, takes out the smallest one. Which way does both in O(log n)?"
    choices:
      - "A list sorted with `sort()` after every add, taking the smallest with `pop(0)`"
      - "A heap in a list, with `heapq.heappush` and `heapq.heappop`"
      - "A list with `append`, finding the smallest with `min` and taking it out with `remove`"
    answer: 2
    why: "A heap keeps the smallest item at index 0 and only partly orders the rest, so a push or a pop fixes just one path from the top of the heap to the bottom, about log n levels. `pop(0)` moves every other item one place to the left, O(n), however well the list is sorted, and `min` and `remove` each look through the list, O(n)."

  - type: predict
    code: |
      import heapq

      heap = []
      for value in [5, 1, 8, 3]:
          heapq.heappush(heap, value)
      print(heap)
      print(heapq.heappop(heap), heapq.heappop(heap))
      heapq.heappush(heap, 2)
      print([heapq.heappop(heap) for _ in range(3)])
    why: "A heap keeps each item no bigger than the two just below it (`heap[k] <= heap[2*k + 1]` and `heap[k] <= heap[2*k + 2]`), so the smallest is at index 0, but the list itself isn't sorted. `heappush` adds the new item at the end and swaps it with the item just above it while it's smaller: the 1 swaps past the 5 to the top, the 8 stays where it lands, and the 3 lands below the 5 and swaps with it, so the 5 ends up last, after the bigger 8: `[1, 3, 8, 5]`. Each `heappop` takes the smallest item left and repairs the heap in O(log n), so the pops come out in sorted order, the 2 pushed later included."

  - type: predict
    code: |
      import heapq

      tasks = [(2, "test"), (1, "plan"), (3, "ship"), (1, "eat")]
      heapq.heapify(tasks)
      print(heapq.heappop(tasks))
      print(heapq.heappop(tasks))
      prices = [-p for p in [40, 90, 15]]
      heapq.heapify(prices)
      print(-heapq.heappop(prices))
    why: "Tuples compare item by item, so the lowest priority comes out first, and the tie at 1 is settled by the names: `\"eat\"` comes before `\"plan\"`. `heappush`, `heappop` and `heapify` make a min-heap. Storing the values negated turns the largest into the smallest, and the minus sign turns it back, in every version of Python. Python 3.14 also has max-heap versions, such as `heapq.heapify_max` and `heapq.heappop_max`."

  - type: runs
    code: |
      import heapq

      queue = []
      heapq.heappush(queue, (2, {"name": "b"}))
      heapq.heappush(queue, (2, {"name": "a"}))
      print(heapq.heappop(queue))
    why: "A heap compares its items, and tuples compare item by item. The priorities tie at 2, so Python compares the dicts, which have no order: `TypeError: '<' not supported between instances of 'dict' and 'dict'`. Put a counter in between, `(priority, count, item)`, so that a tie is settled before the items are compared."

  - type: choice
    prompt: "`orders` is a list of dicts in order of time. After `orders.sort(key=lambda o: o[\"customer\"])`, in what order are each customer's orders?"
    choices:
      - "Still in order of time"
      - "In no set order: a sort may mix up items with equal keys"
      - "In reverse order of time"
    answer: 1
    why: "Python's `sort` and `sorted` are guaranteed to be stable: items with equal keys keep the order they had. So sorting by a second key first and then by the main key sorts by both, here by customer, and by time within each customer."

  - type: predict
    code: |
      words = ["pear", "fig", "kiwi", "apple", "date"]
      print(sorted(words, key=len))
      print(sorted(words, key=len, reverse=True))
    why: "Python's sort is stable: words of the same length keep the order they had, so pear, kiwi and date stay in that order. `reverse=True` keeps that promise too. It doesn't sort and then reverse the result, which would put date before kiwi and pear."

