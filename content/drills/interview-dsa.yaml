    code: |
      def ways(n, steps, memo={}):  # BUG
          if memo is None:
              memo = {}
          if n < 0:
              return 0
          if n == 0:
              return 1
          if n not in memo:
              memo[n] = sum(ways(n - s, steps, memo) for s in steps)
          return memo[n]


      print(ways(4, [1, 2]), ways(4, [1, 3]))
    fix: "def ways(n, steps, memo=None):"
    why: "The default `{}` is made once, when `def` runs, so every call shares one memo. The second call finds `memo[4]` from the first, which was worked out with other steps, and gives 5 instead of 3. Defaulting to `None` gives each call from outside a new, empty memo, which its recursive calls then share. A memo is right only for one problem: its keys must hold everything the answer depends on."

  - type: runs
    code: |
      def total(values, i=0):
          if i == len(values):
              return 0
          return values[i] + total(values, i + 1)


      print(total(list(range(10))))
      print(total(list(range(5000))))
    why: "Each call waits for the next one, so 5,000 values need 5,000 nested calls. CPython's limit is a depth of 1000 by default (`sys.getrecursionlimit()`), so after printing 45 for the short list it stops with a `RecursionError`. A loop, or `sum(values)`, has no such limit. In Python, recursion suits problems whose depth stays small."

