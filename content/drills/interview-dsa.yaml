  - type: choice
    prompt: "This binary search makes about log n calls. What does a search cost at worst, for a sorted list of n values?"
    code: |
      def contains(values, target):
          if not values:
              return False
          mid = len(values) // 2
          if values[mid] == target:
              return True
          if values[mid] < target:
              return contains(values[mid + 1:], target)
          return contains(values[:mid], target)


      print(contains([1, 3, 5, 7, 9], 7))
    choices:
      - "O(log n)"
      - "O(n)"
      - "O(n log n)"
    answer: 2
    why: "Each call makes a slice of the half it keeps, and a slice copies its items: about n/2, then n/4, and so on, which is O(n) in all. Passing `lo` and `hi` indexes instead of slices makes each call O(1), and the search O(log n)."

  - type: choice
    prompt: "`list.append` is O(1) amortized. What does amortized mean here?"
    choices:
      - "Every single append takes the same short time"
      - "Now and then one append is slow, but n appends take O(n) in all, so each one costs O(1) when the total is shared out"
      - "An append is O(1) for most inputs, and O(n) for unlucky ones"
    answer: 2
    why: "A list keeps spare room at its end. When the room runs out, it may have to copy its items to a bigger block of memory: O(n) for that one append. CPython grows the room by about an eighth of the list's size each time, so the copies get rarer as the list grows, and n appends cost O(n) in all. That holds for every series of appends, which is what sets amortized apart from an average over inputs."

  - type: choice
    prompt: "A lookup `x in s` in a set is O(1) on average. Why can it be O(n) at worst?"
    choices:
      - "Values with the same hash collide, and the lookup compares `x` with each of them in turn"
      - "The set may be growing, and the lookup waits until it's done"
      - "A set keeps its values sorted, and a lookup is a binary search"
    answer: 1
    why: "A set keeps each value at a place worked out from its hash, so `x in s` starts looking where `hash(x)` points, without going through the other values. Values with the same hash compete for the same places and end up one after another along the same path, so a lookup compares `x` with each of them it meets. If all n values collide, a lookup for a value that isn't there compares it with every one of them: O(n). Numbers, strings and tuples hash well (Python even randomizes the hashes of strings), so in practice it's O(1). A class whose `__hash__` returns the same number for every object makes each lookup O(n)."

  - type: choice
    prompt: "A breadth-first search adds each vertex at the back of its queue and takes the next one from the front. Which choice makes both O(1)?"
    choices:
      - "A list, with `append` and `pop(0)`"
      - "A `collections.deque`, with `append` and `popleft`"
      - "A list, with `insert(0, x)` and `pop()`"
      - "A set, with `add` and `pop`"
    answer: 2
    why: "A list keeps its items side by side from index 0, so adding or taking an item at the front moves every other item: O(n). A deque is built for both ends, so `popleft` is O(1). A set's `pop` takes an arbitrary item, not the oldest one."

  - type: predict
    code: |
      from collections import deque

      graph = {"a": ["c", "b"], "b": ["e"], "c": ["d", "b"], "d": ["e"], "e": []}
      seen = {"a"}
      queue = deque(["a"])
      order = []
      while queue:
          node = queue.popleft()
          order.append(node)
          for nxt in graph[node]:
              if nxt not in seen:
                  seen.add(nxt)
                  queue.append(nxt)
      print(order)
    why: "The queue hands out vertices in the order they were found: a, then its neighbors c and b in the order of its list, then what c and b found, d and then e. A vertex is marked as seen when it goes into the queue, so b, reached again from c, isn't added twice. BFS visits everything 1 step from the start before anything 2 steps away."

  - type: choice
    prompt: "In a maze where every step costs the same, you want a shortest path from the start to the exit. Which search should you use?"
    choices:
      - "Breadth-first search, with a queue"
      - "Depth-first search, with a stack"
      - "Either one: the first path either one finds is a shortest one"
    answer: 1
    why: "BFS takes cells in order of distance: every cell 1 step away, then every cell 2 steps away, and so on. So when it first reaches the exit, no shorter path exists. DFS follows one path as deep as it goes, and the first path it finds to the exit can be a long way round. When steps cost different amounts (none negative), use Dijkstra's algorithm, with a heap."

