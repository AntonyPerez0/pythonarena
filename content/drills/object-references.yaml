topic: object-references
drills:
  - type: predict
    after: lists-of-objects
    code: |
      class Box:
          def __init__(self, kg):
              self.kg = kg


      boxes = [Box(3), Box(5), Box(2)]
      total = 0
      for box in boxes:
          total += box.kg
      print(total)
    why: "The loop visits each `Box` object and adds its `kg` attribute: 3 + 5 + 2 is 10."

  - type: runs
    after: lists-of-objects
    code: |
      class Box:
          def __init__(self, kg):
              self.kg = kg


      a = Box(3)
      b = Box(5)
      print(a < b)
    why: "Python doesn't know how to compare two `Box` objects, so it stops with a `TypeError`. Compare an attribute instead: `a.kg < b.kg`."

