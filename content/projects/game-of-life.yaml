          print()


      def main():
          print("Type the grid, one row per line, and an empty line at the end:")
          grid = read_grid()
          generations = int(input("Generations: "))
          print_generation(grid, 0)
          for number in range(1, generations + 1):
              grid = next_generation(grid)
              print_generation(grid, number)


      if __name__ == "__main__":
          main()

  - id: stopping-early
    title: Stopping early
    task: |
      Many patterns die out or freeze after a while, and printing the same empty grid fifty times helps nobody. Before it works out each new generation, the program now looks at the generation it printed last:

      - When it has no live cells, the program prints `Everything is dead.` and stops.
      - When the next generation would be exactly the same as it, the program prints `Nothing changes any more.` and stops.

      Otherwise it goes on as before, up to the number of generations asked for. Comparing two grids takes no loops: `==` compares two lists item by item, and the lists inside them as well, so `new_grid == grid` is `True` when every cell is the same.

      With the input

      ```text
      #...
      .#..
      ....

      5
      ```

      the two lonely cells die at once, and the program prints:

      ```
      Type the grid, one row per line, and an empty line at the end:
      #...
      .#..
      ....

      Generations: 5
      Generation 0: 2 alive
      #...
      .#..
      ....

      Generation 1: 0 alive
      ....
      ....
      ....

      Everything is dead.
      ```
    hints:
      - "Both checks go at the start of each round of the `for` loop, before the program prints the next generation, and both leave the loop with `break` after their message."
      - "`count_alive(grid) == 0` tells you everything is dead. For the other check, keep the next generation in a variable of its own, `new_grid = next_generation(grid)`, so you can compare it with `grid` before it replaces it."
      - "When `new_grid == grid`, print the message and `break`. Otherwise `grid = new_grid` and print it as before."
    tests:
      - name: Dying out
        stdin: |
          #...
          .#..
          ....

          5
      - name: A block never changes
        hidden: true
        stdin: |
          ....
          .##.
          .##.
          ....

          10
      - name: Settling into a beehive
        hidden: true
        stdin: |
          ......
          .###..
          .#....
          ......
          ......

          9
      - name: A blinker never stops
        hidden: true
        stdin: |
          ...
          ###
          ...

          3
      - name: Nothing alive from the start
        hidden: true
        stdin: |
          ...
          ...

          4
    solution: |
      # Conway's Game of Life on a grid of 0s and 1s: 1 is a live cell, 0 a dead one.


      def print_grid(grid):
          for row in grid:
              line = ""
              for cell in row:
                  if cell == 1:
                      line += "#"
                  else:
                      line += "."
              print(line)


      def count_alive(grid):
          count = 0
          for row in grid:
              for cell in row:
                  count += cell
          return count


      def count_neighbors(grid, row, column):
          count = 0
          for r in range(row - 1, row + 2):
              for c in range(column - 1, column + 2):
                  if r == row and c == column:
                      continue
                  if r >= 0 and r < len(grid) and c >= 0 and c < len(grid[0]):
                      count += grid[r][c]
          return count


      def will_live(grid, row, column):
          neighbors = count_neighbors(grid, row, column)
          if grid[row][column] == 1:
              return neighbors == 2 or neighbors == 3
          return neighbors == 3


      def next_generation(grid):
          new_grid = []
          for row in range(len(grid)):
              new_row = []
              for column in range(len(grid[0])):
                  if will_live(grid, row, column):
                      new_row.append(1)
                  else:
                      new_row.append(0)
              new_grid.append(new_row)
          return new_grid


      def read_grid():
          grid = []
          while True:
              line = input()
              if line == "":
                  break
              row = []
              for character in line:
                  if character == "#":
                      row.append(1)
                  else:
                      row.append(0)
              grid.append(row)
          return grid


      def print_generation(grid, number):
          print(f"Generation {number}: {count_alive(grid)} alive")
          print_grid(grid)
          print()


      def main():
          print("Type the grid, one row per line, and an empty line at the end:")
          grid = read_grid()
          generations = int(input("Generations: "))
          print_generation(grid, 0)
          for number in range(1, generations + 1):
              if count_alive(grid) == 0:
                  print("Everything is dead.")
                  break
              new_grid = next_generation(grid)
              if new_grid == grid:
                  print("Nothing changes any more.")
                  break
              grid = new_grid
              print_generation(grid, number)


      if __name__ == "__main__":
          main()
