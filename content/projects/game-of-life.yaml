milestones:
  - id: grid
    title: The grid
    task: |
      The starting code has a grid called `glider`: a list of 5 rows, each a list of 5 cells, where `1` is a live cell and `0` a dead one. Its main block uses two functions that aren't written yet. Write them:

      1. `print_grid(grid)` prints the grid, one row per line: `#` for a live cell and `.` for a dead one, with nothing between the cells.
      2. `count_alive(grid)` returns how many cells of the grid are alive.

      Both work for a grid of any size: any number of rows, each with the same number of cells. The check runs:

      ```python fragment
      grid = [[0, 1, 0, 0], [0, 1, 1, 0], [0, 0, 0, 1]]
      print_grid(grid)
      print(count_alive(grid))
      ```

      and expects:

      ```
      .#..
      .##.
      ...#
      4
      ```
    hints:
      - "Both functions go through every cell with two loops, one inside the other: `for row in grid:` gives each row, a list, and `for cell in row:` each cell of it."
      - "In `print_grid`, build one line of text per row: start it as `\"\"` before the inner loop, add `\"#\"` or `\".\"` for each cell, and print it after the inner loop."
      - "In `count_alive`, keep a count that starts at 0. A live cell is 1 and a dead one 0, so adding every cell to the count gives the number of live cells."
    tests:
