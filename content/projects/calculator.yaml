  - id: last-answer
    title: The last answer
    task: |
      A calculation often goes on from the one before: double that, then take a quarter of it. The word `ans` in a command stands for the last answer, so `mul ans 2` doubles it.

      - `ans` is the answer of the last calculation that worked. Before the first one, it is 0.
      - An error message doesn't change it, and neither do `history` and `clear`.
      - In the history, a calculation is saved with the number in place of `ans`: `mul 7 2 = 14`, not `mul ans 2 = 14`.

      Do it in `main`, before the line goes to `calculate`: put the last answer into the line where it says `ans`. The string method `replace` from module 18 does exactly that, and `calculate` then gets an ordinary line of numbers. Keep the last answer as a string, as `calculate` returns it, so it can go straight into the line.

      With the input `add 3 4`, `mul ans 2`, `div ans 4`, `sub ans ans`, `history` and `quit`, the program prints:

      ```
      > add 3 4
      7
      > mul ans 2
      14
      > div ans 4
      3.5
      > sub ans ans
      0.0
      > history
      1: add 3 4 = 7
      2: mul 7 2 = 14
      3: div 14 4 = 3.5
      4: sub 3.5 3.5 = 0.0
      > quit
      Bye!
      ```
    hints:
      - "Keep the last answer in a variable that starts as `\"0\"` before the loop, a string like the answers of `calculate`."
      - "Just before calling `calculate`, `line = line.replace(\"ans\", last)` puts the number in. The history then saves that line, numbers and all."
      - "Change the last answer only next to `history.append(...)`, where you already know the answer isn't an error: `last = answer`."
    tests:
      - name: Going on from the last answer
        stdin: |
          add 3 4
          mul ans 2
          div ans 4
          sub ans ans
          history
          quit
      - name: Before the first answer, and after an error
        hidden: true
        stdin: |
          add ans 5
          div ans 0
          mul ans 3
          sum ans ans ans
          sub 1 50
          clear
          mul ans ans
          history
          quit
      - name: Long commands keep working
        hidden: true
        call: |
          print(calculate("max 4 10 2"))
          print(is_number("4.5.6"))
          print_history(["add 1 1 = 2"])
    forbid:
      - pattern: \beval\s*\(
        message: "Do the calculation with your own functions instead of `eval`."
    solution: |
      # A calculator that reads commands such as "add 3 4" and answers them.


      def add(a, b):
          return a + b


      def subtract(a, b):
          return a - b


      def multiply(a, b):
          return a * b


      def divide(a, b):
          return a / b


      def total(numbers):
          return sum(numbers)


      def largest(numbers):
          return max(numbers)


      def smallest(numbers):
          return min(numbers)


      def mean(numbers):
          return sum(numbers) / len(numbers)


      def is_number(text):
          digits = 0
          points = 0
          for i in range(len(text)):
              character = text[i]
              if character in "0123456789":
                  digits += 1
              elif character == ".":
                  points += 1
              elif character != "-" or i > 0:
                  return False
          return digits > 0 and points <= 1


      def to_number(text):
          if "." in text:
              return float(text)
          return int(text)


      def calculate(line):
          parts = line.split()
          command = parts[0]
          texts = parts[1:]
          if command in ["add", "sub", "mul", "div"]:
              if len(texts) != 2:
                  return f"Error: {command} needs 2 numbers"
          elif command in ["sum", "max", "min", "mean"]:
              if len(texts) == 0:
                  return f"Error: {command} needs at least 1 number"
          else:
              return f"Error: unknown command {command}"
          numbers = []
          for text in texts:
              if not is_number(text):
                  return f"Error: {text} is not a number"
              numbers.append(to_number(text))
          if command == "add":
              return str(add(numbers[0], numbers[1]))
          if command == "sub":
              return str(subtract(numbers[0], numbers[1]))
          if command == "mul":
              return str(multiply(numbers[0], numbers[1]))
          if command == "div":
              if numbers[1] == 0:
                  return "Error: can't divide by zero"
              return str(divide(numbers[0], numbers[1]))
          if command == "sum":
              return str(total(numbers))
          if command == "max":
              return str(largest(numbers))
          if command == "min":
              return str(smallest(numbers))
          return str(mean(numbers))


      def print_history(history):
          if len(history) == 0:
              print("No calculations yet.")
          for i in range(len(history)):
              print(f"{i + 1}: {history[i]}")


      def main():
          history = []
          last = "0"
          while True:
              line = input("> ")
              if line == "quit":
                  print("Bye!")
                  break
              if len(line.split()) == 0:
                  continue
              if line == "history":
                  print_history(history)
              elif line == "clear":
                  history = []
                  print("History cleared.")
              else:
                  line = line.replace("ans", last)
                  answer = calculate(line)
                  print(answer)
                  if "Error" not in answer:
                      history.append(f"{line} = {answer}")
                      last = answer


      if __name__ == "__main__":
          main()
