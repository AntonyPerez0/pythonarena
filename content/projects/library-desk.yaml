      library.add_member(Member("M1", "Ada"))
      library.add_member(Member("M2", "Ben"))
      print(library.lend("B1", "M1", 2))
      print(library.lend("B2", "M1", 2))
      print(library.lend("B3", "M1", 3))
      print(library.lend("B4", "M1", 3))
      library.print_member("M1")
      library.print_member("M2")
      print(library.give_back("B2", 9))
      print(library.lend("B4", "M1", 9))
      library.print_member("M1")
      ```

      and expects:

      ```
      Lent: Emma (B1) to Ada (M1), due day 16
      Lent: Dracula (B2) to Ada (M1), due day 16
      Lent: Persuasion (B3) to Ada (M1), due day 17
      Ada already has 3 books.
      Ada (M1) has 3 books:
      Emma (B1) to Ada (M1), due day 16
      Dracula (B2) to Ada (M1), due day 16
      Persuasion (B3) to Ada (M1), due day 17
      Ben (M2) has no books.
      Dracula is back.
      Lent: Frankenstein (B4) to Ada (M1), due day 23
      Ada (M1) has 3 books:
      Emma (B1) to Ada (M1), due day 16
      Persuasion (B3) to Ada (M1), due day 17
      Frankenstein (B4) to Ada (M1), due day 23
      ```
    hints:
