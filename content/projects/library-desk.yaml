              self.loans.remove(loan)
              loan.member.loans.remove(loan)
              book.loan = None
              days = loan.days_late(today)
              if days > 0:
                  return f"{book.title} is back, {plural(days, 'day')} late."
              return f"{book.title} is back."

          def print_loans(self):
              if len(self.loans) == 0:
                  print("No loans.")
              for loan in self.loans:
                  print(loan)

          def print_late(self, today: int):
              late = 0
              for loan in self.loans:
                  days = loan.days_late(today)
                  if days > 0:
                      print(f"{loan}, {plural(days, 'day')} late")
                      late += 1
              if late == 0:
                  print("Nothing is late.")

          def print_member(self, card: str):
              member = self.find_member(card)
              if member is None:
                  print(f"There is no member {card}.")
              elif len(member.loans) == 0:
                  print(f"{member} has no books.")
              else:
                  print(f"{member} has {plural(len(member.loans), 'book')}:")
                  for loan in member.loans:
                      print(loan)


      def read_library(filename: str):
          library = Library()
          with open(filename) as file:
              for line in file:
                  parts = line.strip().split(";")
                  if parts[0] == "book":
                      library.add_book(Book(parts[1], parts[2], parts[3]))
                  elif parts[0] == "member":
                      library.add_member(Member(parts[1], parts[2]))
          return library


      def main():
          library = read_library("library.txt")
          today = 1
          print(f"Day {today} at the desk.")
          while True:
              command = input("> ")
              words = command.split()
              if command == "quit":
                  print("The desk is closed.")
                  break
              if command == "books":
                  library.print_books()
              elif command == "loans":
                  library.print_loans()
              elif command == "late":
                  library.print_late(today)
              elif len(words) == 3 and words[0] == "lend":
                  print(library.lend(words[1], words[2], today))
              elif len(words) == 2 and words[0] == "return":
                  print(library.give_back(words[1], today))
              elif len(words) == 2 and words[0] == "member":
                  library.print_member(words[1])
              elif len(words) == 2 and words[0] == "search":
                  books = library.search(words[1])
                  if len(books) == 0:
                      print("No books found.")
                  for book in books:
                      print(book)
              elif len(words) == 2 and words[0] == "day":
                  try:
                      today = int(words[1])
                      print(f"It is day {today}.")
                  except ValueError:
                      print("The day must be a whole number.")
              else:
                  print("I don't know that command.")


      if __name__ == "__main__":
          main()
