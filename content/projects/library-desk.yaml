    solution: |
      # The loan desk of a small library. Days are plain numbers: day 1, day 2, and so on.

      LOAN_DAYS = 14


      class Book:
          def __init__(self, code: str, title: str, author: str):
              self.code = code
              self.title = title
              self.author = author
              self.loan = None

          def __str__(self):
              return f"{self.code} {self.title} by {self.author}"


      class Member:
          def __init__(self, card: str, name: str):
              self.card = card
              self.name = name

          def __str__(self):
              return f"{self.name} ({self.card})"


      class Loan:
          def __init__(self, book: Book, member: Member, due_day: int):
              self.book = book
              self.member = member
              self.due_day = due_day

          def __str__(self):
              return f"{self.book.title} ({self.book.code}) to {self.member}, due day {self.due_day}"


      class Library:
          def __init__(self):
              self.books = []
              self.members = []
              self.loans = []

          def add_book(self, book: Book):
              self.books.append(book)

          def add_member(self, member: Member):
              self.members.append(member)

          def print_books(self):
              if len(self.books) == 0:
                  print("No books.")
              for book in self.books:
                  if book.loan is None:
                      print(book)
                  else:
                      print(f"{book}, out until day {book.loan.due_day}")

          def print_members(self):
              if len(self.members) == 0:
                  print("No members.")
              for member in self.members:
                  print(member)

          def find_book(self, code: str):
              for book in self.books:
                  if book.code == code:
                      return book
              return None

          def find_member(self, card: str):
              for member in self.members:
                  if member.card == card:
                      return member
              return None

          def search(self, word: str):
              found = []
              for book in self.books:
                  if word.lower() in book.title.lower() or word.lower() in book.author.lower():
                      found.append(book)
              return found

          def lend(self, code: str, card: str, today: int):
              book = self.find_book(code)
              if book is None:
                  return f"There is no book {code}."
              member = self.find_member(card)
              if member is None:
                  return f"There is no member {card}."
              if book.loan is not None:
                  return f"{book.title} is out until day {book.loan.due_day}."
              loan = Loan(book, member, today + LOAN_DAYS)
              self.loans.append(loan)
              book.loan = loan
              return f"Lent: {loan}"

          def print_loans(self):
              if len(self.loans) == 0:
                  print("No loans.")
              for loan in self.loans:
                  print(loan)


      if __name__ == "__main__":
          library = Library()
          library.add_book(Book("B1", "Emma", "Jane Austen"))
          library.add_book(Book("B2", "Dracula", "Bram Stoker"))
          library.add_member(Member("M1", "Ada"))
          library.print_books()
          library.print_members()

  - id: returns
    title: Returns and late books
    task: |
      Books come back, some of them late.

      1. Give `Loan` a method `days_late(today)`, which returns how many days after the due day `today` is: 3 for a book due on day 17 when today is day 20. A book that isn't late, returned on its due day or before, is 0 days late.
      2. Write a function `plural(count, word)` outside the classes, which returns the count and the word, with an `s` added when the count isn't 1: `plural(3, "day")` returns `"3 days"`, and `plural(1, "day")` returns `"1 day"`.
      3. `give_back(code, today)` in `Library` returns the book with that code on the day `today`, and returns a message, checking in this order:
         - `There is no book B9.` when no book has that code;
         - `Emma is not on loan.` when the book is on the shelf;
         - otherwise the loan is removed from the library's loans, the book's `loan` is `None` again, and the message is `Emma is back.`, or `Emma is back, 3 days late.` for a late book.
      4. `print_late(today)` prints each loan that is late on the day `today`, in the order of the loans, with how late it is after it: `Emma (B1) to Ada (M1), due day 15, 4 days late`. When nothing is late, it prints `Nothing is late.`

      The check runs:

      ```python fragment
      library = Library()
      library.add_book(Book("B1", "Emma", "Jane Austen"))
      library.add_book(Book("B2", "Dracula", "Bram Stoker"))
      library.add_book(Book("B3", "Persuasion", "Jane Austen"))
      library.add_member(Member("M1", "Ada"))
      library.lend("B1", "M1", 1)
      library.lend("B2", "M1", 4)
      library.lend("B3", "M1", 10)
      library.print_late(19)
      print(library.give_back("B1", 19))
      print(library.give_back("B1", 19))
      print(library.give_back("B3", 20))
      library.print_late(19)
      library.print_loans()
      ```

      and expects:

      ```
      Emma (B1) to Ada (M1), due day 15, 4 days late
      Dracula (B2) to Ada (M1), due day 18, 1 day late
      Emma is back, 4 days late.
      Emma is not on loan.
      Persuasion is back.
      Dracula (B2) to Ada (M1), due day 18, 1 day late
      Dracula (B2) to Ada (M1), due day 18
      ```
    hints:
      - "`days_late` is an `if`: when `today > self.due_day`, return the difference, and otherwise 0."
      - "In `give_back`, the book's own `loan` attribute tells you which loan to end: `loan = book.loan`. `self.loans.remove(loan)` takes that very object out of the list."
      - "In `print_late`, count the late loans as you print them, and print `Nothing is late.` after the loop when the count is still 0. The text `4 days late` is `f\"{plural(days, 'day')} late\"`."
    tests:
      - name: Give back on time and late
        call: |
          library = Library()
          library.add_book(Book("B1", "Emma", "Jane Austen"))
