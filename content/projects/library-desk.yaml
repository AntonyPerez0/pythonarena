    title: The desk
    task: |
      Everything is ready for the desk itself. The library's books and members are in the file `library.txt`, one per line, with the parts separated by `;`:

      ```text
      book;B1;Emma;Jane Austen
      member;M1;Ada
      ```

      1. Write a function `read_library(filename)`, outside the classes, which reads the file and returns a new `Library` with its books and members, in the order of the file.
      2. Write a function `main()`, and replace everything in the main block with a call to it. `main` reads `library.txt`, starts on day 1, and prints `Day 1 at the desk.` Then it reads commands with the prompt `> ` until `quit`:
         - `books`, `loans` and `late` print the books, the loans, and the loans that are late today.
         - `lend B1 M1` lends that book to that member today, and `return B1` gives that book back today. Both print the message they get.
         - `member M1` prints that member and their books.
         - `search austen` prints the books that match the word, or `No books found.`
         - `day 20` makes it day 20, and prints `It is day 20.` When the day isn't a whole number, it prints `The day must be a whole number.` instead, and the day stays as it was.
         - `quit` prints `The desk is closed.` and ends the program.
         - Anything else, also a known command with the wrong number of words, prints `I don't know that command.`

      With the `library.txt` and the commands shown at the top of this page, the program prints:

      ```
      Day 1 at the desk.
      > books
      B1 Emma by Jane Austen
      B2 Dracula by Bram Stoker
      B3 Persuasion by Jane Austen
      > lend B1 M1
      Lent: Emma (B1) to Ada (M1), due day 15
      > lend B1 M2
      Emma is out until day 15.
      > day 20
      It is day 20.
      > late
      Emma (B1) to Ada (M1), due day 15, 5 days late
      > return B1
      Emma is back, 5 days late.
      > lend B3 M2
      Lent: Persuasion (B3) to Ben (M2), due day 34
      > member M2
      Ben (M2) has 1 book:
      Persuasion (B3) to Ben (M2), due day 34
      > search austen
      B1 Emma by Jane Austen
      B3 Persuasion by Jane Austen
      > dance
      I don't know that command.
      > quit
      The desk is closed.
      ```
    hints:
