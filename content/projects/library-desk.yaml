    solution: |
      # The loan desk of a small library. Days are plain numbers: day 1, day 2, and so on.

      LOAN_DAYS = 14


      class Book:
          def __init__(self, code: str, title: str, author: str):
              self.code = code
              self.title = title
              self.author = author
              self.loan = None

          def __str__(self):
              return f"{self.code} {self.title} by {self.author}"


      class Member:
          def __init__(self, card: str, name: str):
              self.card = card
              self.name = name

          def __str__(self):
              return f"{self.name} ({self.card})"


      class Loan:
          def __init__(self, book: Book, member: Member, due_day: int):
              self.book = book
              self.member = member
              self.due_day = due_day

          def days_late(self, today: int):
              if today > self.due_day:
                  return today - self.due_day
              return 0

          def __str__(self):
              return f"{self.book.title} ({self.book.code}) to {self.member}, due day {self.due_day}"


      def plural(count: int, word: str):
          if count == 1:
              return f"{count} {word}"
          return f"{count} {word}s"


      class Library:
          def __init__(self):
              self.books = []
              self.members = []
              self.loans = []

          def add_book(self, book: Book):
              self.books.append(book)

          def add_member(self, member: Member):
              self.members.append(member)

          def print_books(self):
              if len(self.books) == 0:
                  print("No books.")
              for book in self.books:
                  if book.loan is None:
                      print(book)
                  else:
                      print(f"{book}, out until day {book.loan.due_day}")

          def print_members(self):
              if len(self.members) == 0:
                  print("No members.")
              for member in self.members:
                  print(member)

          def find_book(self, code: str):
              for book in self.books:
                  if book.code == code:
                      return book
              return None

          def find_member(self, card: str):
              for member in self.members:
                  if member.card == card:
                      return member
              return None

          def search(self, word: str):
              found = []
              for book in self.books:
                  if word.lower() in book.title.lower() or word.lower() in book.author.lower():
                      found.append(book)
              return found

          def lend(self, code: str, card: str, today: int):
              book = self.find_book(code)
              if book is None:
                  return f"There is no book {code}."
              member = self.find_member(card)
              if member is None:
                  return f"There is no member {card}."
              if book.loan is not None:
                  return f"{book.title} is out until day {book.loan.due_day}."
              loan = Loan(book, member, today + LOAN_DAYS)
              self.loans.append(loan)
              book.loan = loan
              return f"Lent: {loan}"

          def give_back(self, code: str, today: int):
              book = self.find_book(code)
              if book is None:
                  return f"There is no book {code}."
              loan = book.loan
              if loan is None:
                  return f"{book.title} is not on loan."
              self.loans.remove(loan)
              book.loan = None
              days = loan.days_late(today)
              if days > 0:
                  return f"{book.title} is back, {plural(days, 'day')} late."
              return f"{book.title} is back."

          def print_loans(self):
              if len(self.loans) == 0:
                  print("No loans.")
              for loan in self.loans:
                  print(loan)

          def print_late(self, today: int):
              late = 0
              for loan in self.loans:
                  days = loan.days_late(today)
                  if days > 0:
                      print(f"{loan}, {plural(days, 'day')} late")
                      late += 1
              if late == 0:
                  print("Nothing is late.")


      if __name__ == "__main__":
          library = Library()
          library.add_book(Book("B1", "Emma", "Jane Austen"))
          library.add_book(Book("B2", "Dracula", "Bram Stoker"))
          library.add_member(Member("M1", "Ada"))
          library.print_books()
          library.print_members()

