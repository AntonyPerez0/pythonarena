    solution: |
      # The loan desk of a small library. Days are plain numbers: day 1, day 2, and so on.


      class Book:
          def __init__(self, code: str, title: str, author: str):
              self.code = code
              self.title = title
              self.author = author

          def __str__(self):
              return f"{self.code} {self.title} by {self.author}"


      class Member:
          def __init__(self, card: str, name: str):
              self.card = card
              self.name = name

          def __str__(self):
              return f"{self.name} ({self.card})"


      class Library:
          def __init__(self):
              self.books = []
              self.members = []

          def add_book(self, book: Book):
              self.books.append(book)

          def add_member(self, member: Member):
              self.members.append(member)

          def print_books(self):
              if len(self.books) == 0:
                  print("No books.")
              for book in self.books:
                  print(book)

          def print_members(self):
              if len(self.members) == 0:
                  print("No members.")
              for member in self.members:
                  print(member)

          def find_book(self, code: str):
              for book in self.books:
                  if book.code == code:
                      return book
              return None

          def find_member(self, card: str):
              for member in self.members:
                  if member.card == card:
                      return member
              return None

          def search(self, word: str):
              found = []
              for book in self.books:
                  if word.lower() in book.title.lower() or word.lower() in book.author.lower():
                      found.append(book)
              return found


      if __name__ == "__main__":
          library = Library()
          library.add_book(Book("B1", "Emma", "Jane Austen"))
          library.add_book(Book("B2", "Dracula", "Bram Stoker"))
          library.add_member(Member("M1", "Ada"))
          library.print_books()
          library.print_members()

  - id: loans
    title: Loans
    task: |
      Now the desk lends books. A loan lasts 14 days: a book lent on day 3 is due on day 17.

      1. Write the class `Loan`. Its constructor `Loan(book, member, due_day)` stores a `Book` object, a `Member` object and the due day, a whole number, in the attributes `book`, `member` and `due_day`. Its `__str__` returns the book's title and code, the member, and the due day: `Emma (B1) to Ada (M1), due day 17`.
      2. A book gets the attribute `loan`, which is `None` when the book is on the shelf and the `Loan` object while it's lent.
      3. The library gets a third list, the attribute `loans`, empty at first.
      4. `lend(code, card, today)` in `Library` lends the book with that code to the member with that card on the day `today`, and returns a message as a string, checking in this order:
         - `There is no book B9.` when no book has that code;
         - `There is no member M9.` when no member has that card;
         - `Emma is out until day 17.` when the book is already lent (with the book's title and its loan's due day);
         - otherwise it creates the loan, adds it to the library's loans, sets it as the book's `loan`, and returns `Lent: ` followed by the loan: `Lent: Emma (B1) to Ada (M1), due day 17`.
      5. `print_loans()` prints the loans one per line, in the order they were made, or `No loans.`
      6. `print_books()` shows a lent book with its due day after it: `B1 Emma by Jane Austen, out until day 17`.

      The check runs:

      ```python fragment
      library = Library()
      library.add_book(Book("B1", "Emma", "Jane Austen"))
      library.add_book(Book("B2", "Dracula", "Bram Stoker"))
      library.add_member(Member("M1", "Ada"))
      library.add_member(Member("M2", "Ben"))
      print(library.lend("B1", "M1", 3))
      print(library.lend("B1", "M2", 5))
      print(library.lend("B9", "M2", 5))
      print(library.lend("B2", "M9", 5))
      library.print_loans()
      library.print_books()
      ```

      and expects:

      ```
      Lent: Emma (B1) to Ada (M1), due day 17
      Emma is out until day 17.
      There is no book B9.
      There is no member M9.
      Emma (B1) to Ada (M1), due day 17
      B1 Emma by Jane Austen, out until day 17
      B2 Dracula by Bram Stoker
      ```
    hints:
      - "In `Loan.__str__`, the book and the member are objects, so you can reach their attributes: `self.book.title` and `self.book.code`. `{self.member}` in an f-string uses the member's own `__str__`."
      - "In `lend`, find both objects first with `find_book` and `find_member`, and return the message as soon as one of them `is None`. `book.loan is not None` means the book is out."
      - "Create the loan with `Loan(book, member, today + 14)`, then `self.loans.append(loan)` and `book.loan = loan`, and return `f\"Lent: {loan}\"`."
    tests:
      - name: Lend and list
        call: |
          library = Library()
          library.add_book(Book("B1", "Emma", "Jane Austen"))
          library.add_book(Book("B2", "Dracula", "Bram Stoker"))
          library.add_member(Member("M1", "Ada"))
          library.add_member(Member("M2", "Ben"))
          print(library.lend("B1", "M1", 3))
          print(library.lend("B1", "M2", 5))
          print(library.lend("B9", "M2", 5))
          print(library.lend("B2", "M9", 5))
          library.print_loans()
          library.print_books()
      - name: A loan on its own
        hidden: true
        call: |
          book = Book("B5", "Frankenstein", "Mary Shelley")
          member = Member("M4", "Dev")
          loan = Loan(book, member, 30)
          print(loan)
          print(loan.book is book, loan.member is member, loan.due_day)
          print(book.loan)
      - name: The loan belongs to the book
        hidden: true
        call: |
          library = Library()
          library.add_book(Book("B1", "Emma", "Jane Austen"))
          library.add_member(Member("M1", "Ada"))
          library.print_loans()
          print(library.find_book("B1").loan)
          print(library.lend("B1", "M1", 10))
          loan = library.find_book("B1").loan
          print(loan.member.name, loan.due_day)
          print(library.lend("B1", "M1", 11))
          print(library.lend("B7", "M7", 11))
          print(len(library.loans))
      - name: Several loans in order
        hidden: true
        call: |
          library = Library()
          library.add_book(Book("B1", "Emma", "Jane Austen"))
          library.add_book(Book("B2", "Dracula", "Bram Stoker"))
          library.add_book(Book("B3", "Persuasion", "Jane Austen"))
          library.add_member(Member("M1", "Ada"))
          library.add_member(Member("M2", "Ben"))
          print(library.lend("B3", "M2", 1))
