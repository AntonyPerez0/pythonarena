    title: A member's books
    task: |
      The library's rule is that a member may have at most 3 books at a time. To know how many books a member has, each member now keeps a list of their own loans.

      1. A member gets the attribute `loans`, a list that is empty for a new member.
      2. `lend` adds the new loan to the member's list as well as to the library's, and `give_back` removes it from both. Before lending, `lend` checks one more thing, after the other checks: a member who already has 3 books gets `Ada already has 3 books.` (with their name), and no loan is made.
      3. `print_member(card)` in `Library` prints the member and how many books they have, and then their loans, one per line, in the order they were made:

         ```text
         Ada (M1) has 2 books:
         Emma (B1) to Ada (M1), due day 16
         Dracula (B2) to Ada (M1), due day 16
         ```

         With exactly one book, the first line says `has 1 book:`, and a member without books prints only `Ben (M2) has no books.` When no member has that card, it prints `There is no member M9.`

      The library's list and the member's list hold the very same `Loan` objects: a loan isn't copied when you add it to a second list.

      The check runs:

      ```python fragment
