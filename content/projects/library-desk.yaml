      # The loan desk of a small library. Days are plain numbers: day 1, day 2, and so on.


      class Book:
          def __init__(self, code: str, title: str, author: str):
              self.code = code
              self.title = title
              self.author = author

          def __str__(self):
              return f"{self.code} {self.title} by {self.author}"


      class Member:
          def __init__(self, card: str, name: str):
              self.card = card
              self.name = name

          def __str__(self):
              return f"{self.name} ({self.card})"


      class Library:
          def __init__(self):
              self.books = []
              self.members = []

          def add_book(self, book: Book):
              self.books.append(book)

          def add_member(self, member: Member):
              self.members.append(member)

          def print_books(self):
              if len(self.books) == 0:
                  print("No books.")
              for book in self.books:
                  print(book)

          def print_members(self):
              if len(self.members) == 0:
                  print("No members.")
              for member in self.members:
                  print(member)


      if __name__ == "__main__":
          library = Library()
          library.add_book(Book("B1", "Emma", "Jane Austen"))
          library.add_book(Book("B2", "Dracula", "Bram Stoker"))
          library.add_member(Member("M1", "Ada"))
          library.print_books()
          library.print_members()

  - id: finding
    title: Finding things
    task: |
      At the desk, people say a code or a word, and the program has to find what they mean. Add three methods to `Library`:

      1. `find_book(code)` returns the `Book` object with that code, or `None` when the library has no such book.
      2. `find_member(card)` returns the `Member` object with that card, or `None`.
      3. `search(word)` returns a list of the books whose title or author contains the word, in the order of the library's list. Upper and lower case don't matter: `austen` finds Jane Austen's books, and so does `AUSTEN`. The string method `lower()` returns a string in lower case, so compare the lower-case versions.

      The check runs:

      ```python fragment
      library = Library()
      library.add_book(Book("B1", "Emma", "Jane Austen"))
      library.add_book(Book("B2", "Dracula", "Bram Stoker"))
      library.add_book(Book("B3", "Persuasion", "Jane Austen"))
      library.add_member(Member("M1", "Ada"))
      print(library.find_book("B2"))
      print(library.find_book("B9"))
      print(library.find_member("M1"))
      print(library.find_member("M2"))
      for book in library.search("austen"):
          print(book)
      print(len(library.search("zombies")))
      ```

      and expects:

      ```
      B2 Dracula by Bram Stoker
      None
      Ada (M1)
      None
      B1 Emma by Jane Austen
      B3 Persuasion by Jane Austen
      0
      ```
    hints:
      - "`find_book` loops over `self.books` and returns a book as soon as `book.code == code`. After the loop, nothing was found: `return None`."
      - "`search` starts from an empty list, `found = []`, and appends each book that matches. Return the list after the loop, even when it's empty."
      - "A book matches when `word.lower() in book.title.lower() or word.lower() in book.author.lower()`."
    tests:
      - name: Find by code and by word
        call: |
          library = Library()
          library.add_book(Book("B1", "Emma", "Jane Austen"))
          library.add_book(Book("B2", "Dracula", "Bram Stoker"))
          library.add_book(Book("B3", "Persuasion", "Jane Austen"))
          library.add_member(Member("M1", "Ada"))
