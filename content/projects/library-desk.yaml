      1. `Member`, with a constructor `Member(card, name)` that stores the member's library card (its code, such as `M1`) and name in the attributes `card` and `name`, and a `__str__` method that returns the name and the card in parentheses: `Ada (M1)`.
      2. `Library`, whose constructor takes no arguments and creates two empty lists, the attributes `books` and `members`, and these methods:
         - `add_book(book)` adds a `Book` object to the library, and `add_member(member)` adds a `Member` object.
         - `print_books()` prints the books one per line, in the order they were added, or `No books.` when there are none.
         - `print_members()` prints the members the same way, or `No members.`

      The check runs:

      ```python fragment
      library = Library()
      library.add_book(Book("B1", "Emma", "Jane Austen"))
      library.add_book(Book("B2", "Dracula", "Bram Stoker"))
      library.add_member(Member("M1", "Ada"))
      library.add_member(Member("M2", "Ben"))
      library.print_books()
      library.print_members()
      ```

      and expects:

      ```
      B1 Emma by Jane Austen
      B2 Dracula by Bram Stoker
      Ada (M1)
      Ben (M2)
      ```
