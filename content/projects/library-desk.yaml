      - "In `main`, keep `today = 1` before the loop. Split each command into words, and tell the commands apart by the first word and the number of words: `len(words) == 3 and words[0] == \"lend\"`."
      - "For `day`, put `today = int(words[1])` inside `try:`, and catch the `ValueError` that `int` raises for a text that isn't a whole number."
