    solution: |
      # A text adventure. The world is read from the file world.txt.


      def read_world(filename):
          rooms = {}
          start = ""
          with open(filename) as file:
              for line in file:
                  parts = line.strip().split(";")
                  if parts[0] == "room":
                      rooms[parts[1]] = {"description": parts[2]}
                      if start == "":
                          start = parts[1]
          return rooms, start


      def show_room(rooms, name):
          print(f"== {name} ==")
          print(rooms[name]["description"])


      def main():
          rooms, start = read_world("world.txt")
          location = start
          show_room(rooms, location)
          while True:
              command = input("> ")
              if command == "quit":
                  print("Goodbye!")
                  break
              if command == "look":
                  show_room(rooms, location)
              else:
                  print("I don't understand that.")


      if __name__ == "__main__":
          main()

  - id: exits
    title: Exits
    task: |
      Now the rooms get exits. A line such as `exit;Workshop;north;Hallway` means: from the Workshop, the way north leads to the Hallway. The room lines come first in the file, so every room that an exit line names already exists when the line is read.

      1. Give each room's dictionary the key `"exits"`, with an empty dictionary as its value when the room is created. For each exit line, `read_world` adds the direction as a key to that dictionary, with the name of the room it leads to as the value.
      2. When a room has exits, `show_room` prints one more line after the description, with their directions in the order of the file, separated by a comma and a space: `Exits: south, east`. A room without exits prints no such line.
      3. A new command: `go` and a direction, such as `go north`, takes the player through that exit and shows the new room. When the room has no exit that way, it prints `You can't go west from here.` (with the direction the player typed). Only a command of exactly these two words is a move; `go` on its own is still a command the game doesn't understand.

      With this `world.txt`

      ```text
      room;Workshop;Half-built clocks tick on every shelf.
      room;Hallway;A long hallway. The grandfather clock here has stopped.
      room;Kitchen;A kettle sits on a cold stove.
      exit;Workshop;north;Hallway
      exit;Hallway;south;Workshop
      exit;Hallway;east;Kitchen
      exit;Kitchen;west;Hallway
      ```

      and the commands `go north`, `go up`, `go east` and `quit`, the program prints:

      ```
      == Workshop ==
      Half-built clocks tick on every shelf.
      Exits: north
      > go north
      == Hallway ==
      A long hallway. The grandfather clock here has stopped.
      Exits: south, east
      > go up
      You can't go up from here.
      > go east
      == Kitchen ==
      A kettle sits on a cold stove.
      Exits: west
      > quit
      Goodbye!
      ```
    hints:
      - "A room is now created as `{\"description\": parts[2], \"exits\": {}}`. For an exit line, `rooms[parts[1]][\"exits\"][parts[2]] = parts[3]`: the room, then its exits, then the direction."
      - "`join` from module 18 puts the comma and the space between the directions. Going through a dictionary gives its keys in order, and so does joining one: `\", \".join(room[\"exits\"])` joins the directions."
      - "Split the command into words with `words = command.split()`. It's a move when `len(words) == 2 and words[0] == \"go\"`, and `words[1]` is the direction: `if direction in room[\"exits\"]:` tells whether there's a way."
