            exit;Workshop;north;Hallway
            exit;Hallway;south;Workshop
            exit;Hallway;east;Kitchen
            exit;Kitchen;west;Hallway
            item;Workshop;key
            item;Kitchen;gear
            item;Kitchen;spoon
        stdin: |
          take key
          take gear
          go north
          go east
          take gear
          drop key
          inventory
          look
          quit
      - name: Carry things to another room
        hidden: true
        files:
          world.txt: |
            room;Deck;Wet planks creak under your feet.
            room;Cabin;A hammock swings from the ceiling.
            exit;Deck;down;Cabin
            exit;Cabin;up;Deck
            item;Deck;rope
            item;Deck;map
            item;Cabin;lantern
        stdin: |
          inventory
          drop rope
          take map
          take map
          take rope
          inventory
          go down
          drop map
