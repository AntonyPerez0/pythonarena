        hidden: true
        files:
          world.txt: |
            room;Cellar;Shelves of jam jars line the walls.
            room;Garden;Bees buzz between the roses.
            exit;Cellar;up;Garden
            item;Garden;rake
            item;Cellar;jar
            item;Garden;seeds
