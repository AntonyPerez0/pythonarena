milestones:
  - id: rooms
    title: Rooms
    task: |
      The starting code opens `world.txt` and splits each of its lines at `;`. A line such as `room;Workshop;Half-built clocks tick on every shelf.` is a room: the word `room`, the room's name and its description.

      1. In `read_world`, add each room to the dictionary `rooms`. The key is the room's name, and the value is a dictionary of its own, for everything the game knows about that room. For now that's only the description: `{"description": "Half-built clocks tick on every shelf."}`. The game starts in the first room of the file, so `start` is the name of that room. A line of another kind (the next milestones read those) is simply skipped.
      2. Write `show_room(rooms, name)`, which prints the room's name between `==` signs, and its description under it:

         ```text
         == Workshop ==
         Half-built clocks tick on every shelf.
         ```

      3. In `main`, show the room where the game starts. Then read commands with the prompt `> `, one at a time, until the player types `quit`:
         - `look` shows the room again.
         - `quit` prints `Goodbye!` and ends the game.
         - Anything else prints `I don't understand that.`

      With this `world.txt`

      ```text
      room;Workshop;Half-built clocks tick on every shelf.
      room;Hallway;A long hallway. The grandfather clock here has stopped.
      ```

      and the commands `look`, `dance` and `quit`, the program prints:

      ```
      == Workshop ==
      Half-built clocks tick on every shelf.
      > look
      == Workshop ==
      Half-built clocks tick on every shelf.
      > dance
      I don't understand that.
      > quit
      Goodbye!
      ```
    hints:
      - "In the loop of `read_world`, `if parts[0] == \"room\":` picks the room lines. Then `parts[1]` is the name and `parts[2]` the description: `rooms[parts[1]] = {\"description\": parts[2]}`."
      - "`start` begins as `\"\"`, so the first room line is the one that finds it still empty: `if start == \"\":` then `start = parts[1]`."
      - "`show_room` prints `f\"== {name} ==\"` and then `rooms[name][\"description\"]`. In `main`, a `while True:` loop reads `command = input(\"> \")` and leaves with `break` after `Goodbye!`."
    tests:
