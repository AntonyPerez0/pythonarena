    solution: |
      # A text adventure. The world is read from the file world.txt.


      def read_world(filename):
          rooms = {}
          start = ""
          with open(filename) as file:
              for line in file:
                  parts = line.strip().split(";")
                  if parts[0] == "room":
                      rooms[parts[1]] = {"description": parts[2], "exits": {}}
                      if start == "":
                          start = parts[1]
                  elif parts[0] == "exit":
                      rooms[parts[1]]["exits"][parts[2]] = parts[3]
          return rooms, start


      def show_room(rooms, name):
          room = rooms[name]
          print(f"== {name} ==")
          print(room["description"])
          if len(room["exits"]) > 0:
              print("Exits: " + ", ".join(room["exits"]))


      def move(rooms, location, direction):
          room = rooms[location]
          if direction not in room["exits"]:
              print(f"You can't go {direction} from here.")
              return location
          return room["exits"][direction]


      def main():
          rooms, start = read_world("world.txt")
          location = start
          show_room(rooms, location)
          while True:
              command = input("> ")
              words = command.split()
              if command == "quit":
                  print("Goodbye!")
                  break
              if command == "look":
                  show_room(rooms, location)
              elif len(words) == 2 and words[0] == "go":
                  new_location = move(rooms, location, words[1])
                  if new_location != location:
                      location = new_location
                      show_room(rooms, location)
              else:
                  print("I don't understand that.")


      if __name__ == "__main__":
          main()

  - id: items
    title: Things to carry
    task: |
      An adventure needs things to find. A line such as `item;Kitchen;gear` means that a gear lies in the Kitchen. Item names are single words.

      1. Give each room's dictionary the key `"items"`, with an empty list when the room is created. For each item line, `read_world` appends the item to that room's list.
      2. When a room has items, `show_room` prints one more line after the exits: `You see: gear, spoon`, in the order of the list.
      3. The player carries an **inventory**, a list that starts empty, and three new commands use it:
         - `take gear`: when the gear is in the room, it moves from the room's list to the end of the inventory, and the game prints `You take the gear.` Otherwise it prints `There is no gear here.`
         - `drop gear`: when the player carries the gear, it moves from the inventory to the end of the room's list, with `You drop the gear.` Otherwise `You don't have the gear.`
         - `inventory` prints `You carry: key, gear`, in the order of the list, or `You carry nothing.`

      With the world of the last milestone and three item lines at the end of it

      ```text
      item;Workshop;key
      item;Kitchen;gear
      item;Kitchen;spoon
      ```

      and the commands `take key`, `take gear`, `go north`, `go east`, `take gear`, `drop key`, `inventory`, `look` and `quit`, the program prints:

      ```
      == Workshop ==
      Half-built clocks tick on every shelf.
      Exits: north
      You see: key
      > take key
      You take the key.
      > take gear
      There is no gear here.
      > go north
      == Hallway ==
      A long hallway. The grandfather clock here has stopped.
      Exits: south, east
      > go east
      == Kitchen ==
      A kettle sits on a cold stove.
      Exits: west
      You see: gear, spoon
      > take gear
      You take the gear.
      > drop key
      You drop the key.
      > inventory
      You carry: gear
      > look
      == Kitchen ==
      A kettle sits on a cold stove.
      Exits: west
      You see: spoon, key
      > quit
      Goodbye!
      ```
    hints:
      - "A room is now created with `\"items\": []` as well, and an item line does `rooms[parts[1]][\"items\"].append(parts[2])`. `join` works for the list of items as well."
      - "In `main`, `inventory = []` goes before the loop. A take is `len(words) == 2 and words[0] == \"take\"`, like a move. `rooms[location][\"items\"]` is the list of the room the player is in."
      - "Moving an item is two steps: `remove` it from one list and `append` it to the other. A function such as `take(room, item, inventory)` keeps `main` short: a list passed to a function is the same list, so the function's changes show in `main` too."
    tests:
