    solution: |
      # A text adventure. The world is read from the file world.txt.


      def read_world(filename):
          rooms = {}
          start = ""
          with open(filename) as file:
              for line in file:
                  parts = line.strip().split(";")
                  if parts[0] == "room":
                      rooms[parts[1]] = {"description": parts[2], "exits": {}, "items": [], "locks": {}}
                      if start == "":
                          start = parts[1]
                  elif parts[0] == "exit":
                      rooms[parts[1]]["exits"][parts[2]] = parts[3]
                  elif parts[0] == "item":
                      rooms[parts[1]]["items"].append(parts[2])
                  elif parts[0] == "lock":
                      rooms[parts[1]]["locks"][parts[2]] = parts[3]
          return rooms, start


      def show_room(rooms, name):
          room = rooms[name]
          print(f"== {name} ==")
          print(room["description"])
          if len(room["exits"]) > 0:
              print("Exits: " + ", ".join(room["exits"]))
          if len(room["items"]) > 0:
              print("You see: " + ", ".join(room["items"]))


      def move(rooms, location, direction, inventory):
          room = rooms[location]
          if direction not in room["exits"]:
              print(f"You can't go {direction} from here.")
              return location
          if direction in room["locks"]:
              item = room["locks"][direction]
              if item not in inventory:
                  print(f"The way {direction} is locked.")
                  return location
              print(f"You unlock the way {direction} with the {item}.")
              del room["locks"][direction]
          return room["exits"][direction]


      def take(room, item, inventory):
          if item in room["items"]:
              room["items"].remove(item)
              inventory.append(item)
              print(f"You take the {item}.")
          else:
              print(f"There is no {item} here.")


      def drop(room, item, inventory):
          if item in inventory:
              inventory.remove(item)
              room["items"].append(item)
              print(f"You drop the {item}.")
          else:
              print(f"You don't have the {item}.")


      def main():
          rooms, start = read_world("world.txt")
          location = start
          inventory = []
          show_room(rooms, location)
          while True:
              command = input("> ")
              words = command.split()
              if command == "quit":
                  print("Goodbye!")
                  break
              if command == "look":
                  show_room(rooms, location)
              elif command == "inventory":
                  if len(inventory) == 0:
                      print("You carry nothing.")
                  else:
                      print("You carry: " + ", ".join(inventory))
              elif len(words) == 2 and words[0] == "go":
                  new_location = move(rooms, location, words[1], inventory)
                  if new_location != location:
                      location = new_location
                      show_room(rooms, location)
              elif len(words) == 2 and words[0] == "take":
                  take(rooms[location], words[1], inventory)
              elif len(words) == 2 and words[0] == "drop":
                  drop(rooms[location], words[1], inventory)
              else:
                  print("I don't understand that.")


      if __name__ == "__main__":
          main()

  - id: goal
    title: The goal
    task: |
      Last, the game gets a goal. A line such as `goal;Clock Tower;gear;You fit the gear into place, and the great clock starts ticking again.` means: the player wins by being in the Clock Tower with the gear in their inventory, and then the game prints that message.

      1. For a goal line, `read_world` gives that room's dictionary the key `"goal"`, with a **tuple** of the item and the message as its value: `("gear", "You fit the gear ...")`. Rooms without a goal don't get the key at all.
      2. The game counts the player's **moves**: each `go` that takes the player to another room is one move. A way that is closed, or locked, is no move.
      3. After every command, the game checks whether the player has won. If so, it prints the goal's message and then `You won in 5 moves.` (with the number of moves; for exactly one move, `You won in 1 move.`), and the game ends. It doesn't matter how the player got there: walking in with the item, or picking it up in that room.

      A world without a goal line is played as before, until `quit`.

      With the world and the commands at the top of this page, the program prints:

      ```
      == Workshop ==
      Half-built clocks tick on every shelf.
      Exits: north
      You see: key
      > take key
      You take the key.
      > go north
      == Hallway ==
      A long hallway. The grandfather clock here has stopped.
      Exits: south, east, up
      > go east
      == Kitchen ==
      A kettle sits on a cold stove.
      Exits: west
      You see: gear
      > take gear
      You take the gear.
      > go west
      == Hallway ==
      A long hallway. The grandfather clock here has stopped.
      Exits: south, east, up
      > go up
      == Attic ==
      Dusty boxes stand under a round window.
      Exits: down, up
      You see: oil
      > go up
      You unlock the way up with the key.
      == Clock Tower ==
      Huge wheels fill the tower. One gear is missing.
      Exits: down
      You fit the gear into place, and the great clock starts ticking again.
      You won in 5 moves.
      ```
    hints:
      - "A goal line does `rooms[parts[1]][\"goal\"] = (parts[2], parts[3])`. Then `room[\"goal\"][0]` is the item and `room[\"goal\"][1]` the message."
      - "Keep `moves = 0` before the loop, and add one where the player arrives in a new room, next to the call that shows it."
      - "At the end of each round of the loop, `room = rooms[location]` and `if \"goal\" in room and room[\"goal\"][0] in inventory:` tell you the player has won. Print the two lines there and `break`."
