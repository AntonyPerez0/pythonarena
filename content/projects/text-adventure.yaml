    solution: |
      # A text adventure. The world is read from the file world.txt.


      def read_world(filename):
          rooms = {}
          start = ""
          with open(filename) as file:
              for line in file:
                  parts = line.strip().split(";")
                  if parts[0] == "room":
                      rooms[parts[1]] = {"description": parts[2], "exits": {}, "items": []}
                      if start == "":
                          start = parts[1]
                  elif parts[0] == "exit":
                      rooms[parts[1]]["exits"][parts[2]] = parts[3]
                  elif parts[0] == "item":
                      rooms[parts[1]]["items"].append(parts[2])
          return rooms, start


      def show_room(rooms, name):
          room = rooms[name]
          print(f"== {name} ==")
          print(room["description"])
          if len(room["exits"]) > 0:
              print("Exits: " + ", ".join(room["exits"]))
          if len(room["items"]) > 0:
              print("You see: " + ", ".join(room["items"]))


      def move(rooms, location, direction):
          room = rooms[location]
          if direction not in room["exits"]:
              print(f"You can't go {direction} from here.")
              return location
          return room["exits"][direction]


      def take(room, item, inventory):
          if item in room["items"]:
              room["items"].remove(item)
              inventory.append(item)
              print(f"You take the {item}.")
          else:
              print(f"There is no {item} here.")


      def drop(room, item, inventory):
          if item in inventory:
              inventory.remove(item)
              room["items"].append(item)
              print(f"You drop the {item}.")
          else:
              print(f"You don't have the {item}.")


      def main():
          rooms, start = read_world("world.txt")
          location = start
          inventory = []
          show_room(rooms, location)
          while True:
              command = input("> ")
              words = command.split()
              if command == "quit":
                  print("Goodbye!")
                  break
              if command == "look":
                  show_room(rooms, location)
              elif command == "inventory":
                  if len(inventory) == 0:
                      print("You carry nothing.")
                  else:
                      print("You carry: " + ", ".join(inventory))
              elif len(words) == 2 and words[0] == "go":
                  new_location = move(rooms, location, words[1])
                  if new_location != location:
                      location = new_location
                      show_room(rooms, location)
              elif len(words) == 2 and words[0] == "take":
                  take(rooms[location], words[1], inventory)
              elif len(words) == 2 and words[0] == "drop":
                  drop(rooms[location], words[1], inventory)
              else:
                  print("I don't understand that.")


      if __name__ == "__main__":
          main()

  - id: locks
    title: A locked door
    task: |
      Some ways are locked. A line such as `lock;Attic;up;key` means that the exit `up` from the Attic is locked, and that the key opens it. The exit itself has its own exit line, as before.

      1. Give each room's dictionary the key `"locks"`, with an empty dictionary when the room is created. For each lock line, `read_world` adds the direction as a key, with the item that opens it as the value.
      2. When the player tries to go through a locked exit:
         - If they carry the item that opens it, the game prints `You unlock the way up with the key.`, the lock is gone for good, and the player goes through as usual.
         - Otherwise the game prints `The way up is locked.` and the player stays where they are.

      A locked exit is listed among the exits as usual: the player only finds out it's locked when they try it.

      With this `world.txt`

      ```text
      room;Hallway;A long hallway. The grandfather clock here has stopped.
      room;Attic;Dusty boxes stand under a round window.
      room;Clock Tower;Huge wheels fill the tower. One gear is missing.
      room;Workshop;Half-built clocks tick on every shelf.
      exit;Hallway;up;Attic
      exit;Hallway;south;Workshop
      exit;Attic;down;Hallway
      exit;Attic;up;Clock Tower
      exit;Clock Tower;down;Attic
      exit;Workshop;north;Hallway
      item;Workshop;key
      lock;Attic;up;key
      ```

      and the commands `go up`, `go up`, `go down`, `go south`, `take key`, `go north`, `go up`, `go up`, `go down`, `go up` and `quit`, the program prints:

      ```
      == Hallway ==
      A long hallway. The grandfather clock here has stopped.
      Exits: up, south
      > go up
      == Attic ==
      Dusty boxes stand under a round window.
      Exits: down, up
      > go up
      The way up is locked.
      > go down
      == Hallway ==
      A long hallway. The grandfather clock here has stopped.
      Exits: up, south
      > go south
      == Workshop ==
      Half-built clocks tick on every shelf.
      Exits: north
      You see: key
      > take key
      You take the key.
      > go north
      == Hallway ==
      A long hallway. The grandfather clock here has stopped.
      Exits: up, south
      > go up
      == Attic ==
      Dusty boxes stand under a round window.
      Exits: down, up
      > go up
      You unlock the way up with the key.
      == Clock Tower ==
      Huge wheels fill the tower. One gear is missing.
      Exits: down
      > go down
      == Attic ==
      Dusty boxes stand under a round window.
      Exits: down, up
      > go up
      == Clock Tower ==
      Huge wheels fill the tower. One gear is missing.
      Exits: down
      > quit
      Goodbye!
      ```

      The last `go up` passes without a word: the lock was opened before.
    hints:
      - "A room is now created with `\"locks\": {}` too, and a lock line does `rooms[parts[1]][\"locks\"][parts[2]] = parts[3]`."
      - "Whoever handles `go` now needs the inventory as well: give your move function one more parameter. After finding that the exit exists, check `if direction in room[\"locks\"]:`, and look up the item that opens it."
      - "`del room[\"locks\"][direction]` removes the lock for good, because the room's dictionary is the same one that `rooms` keeps."
