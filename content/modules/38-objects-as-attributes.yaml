      - task: |
          Add the method `names_longer_than(self, limit)` to the class `Aquarium`. It returns a list of the names of the fish that are longer than `limit` centimeters, in the order they were added. If there are none, it returns an empty list.

          For example, this code:

          ```python fragment
          tank = Aquarium()
          tank.add(Fish("Bubbles", 5))
          tank.add(Fish("Nemo", 12))
          tank.add(Fish("Spike", 21))
          print(tank.names_longer_than(10))
          print(tank.names_longer_than(30))
          ```

          prints:

          ```
          ['Nemo', 'Spike']
          []
          ```
        seed: |
          class Fish:
              def __init__(self, name, length):
                  self.name = name
                  self.length = length


          class Aquarium:
              def __init__(self):
                  self.fish = []

              def add(self, fish):
                  self.fish.append(fish)


          if __name__ == "__main__":
              tank = Aquarium()
              tank.add(Fish("Bubbles", 5))
              tank.add(Fish("Nemo", 12))
              tank.add(Fish("Spike", 21))
              print(tank.names_longer_than(10))
              print(tank.names_longer_than(30))
        solution: |
          class Fish:
              def __init__(self, name, length):
                  self.name = name
                  self.length = length


          class Aquarium:
              def __init__(self):
                  self.fish = []

              def add(self, fish):
                  self.fish.append(fish)

              def names_longer_than(self, limit):
                  names = []
                  for fish in self.fish:
                      if fish.length > limit:
                          names.append(fish.name)
                  return names


          if __name__ == "__main__":
              tank = Aquarium()
              tank.add(Fish("Bubbles", 5))
              tank.add(Fish("Nemo", 12))
              tank.add(Fish("Spike", 21))
              print(tank.names_longer_than(10))
              print(tank.names_longer_than(30))
        hints:
          - Start with an empty list of names in a local variable, then go through `self.fish`.
          - "For each fish longer than `limit`, append its name (`fish.name`), not the fish itself."
