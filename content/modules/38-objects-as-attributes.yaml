      - task: |
          A kennel at a dog hotel has room for one dog at a time. Write the class `Kennel`:

          - The constructor takes the kennel's number. A new kennel is empty: its attribute `dog` is `None`.
          - `check_in(self, dog)` puts the dog in the kennel and returns `True`, but only if the kennel is empty. If there's already a dog, nothing changes and it returns `False`.
          - `check_out(self)` takes the dog out and returns it (the `Dog` object), leaving the kennel empty. If the kennel is empty, it returns `None`.
          - `__str__(self)` returns `Kennel 3: empty` or, with a dog in it, `Kennel 3: Rex`.

          For example, this code:

          ```python fragment
          kennel = Kennel(3)
          print(kennel)
          print(kennel.check_in(Dog("Rex")))
          print(kennel.check_in(Dog("Bella")))
          print(kennel)
          leaving = kennel.check_out()
          print(leaving.name)
          print(kennel)
          ```

          prints:

          ```
          Kennel 3: empty
          True
          False
          Kennel 3: Rex
          Rex
          Kennel 3: empty
          ```
        seed: |
          class Dog:
              def __init__(self, name):
                  self.name = name


          class Kennel:
              pass


          if __name__ == "__main__":
              kennel = Kennel(3)
              print(kennel)
              print(kennel.check_in(Dog("Rex")))
              print(kennel.check_in(Dog("Bella")))
              print(kennel)
              leaving = kennel.check_out()
              print(leaving.name)
              print(kennel)
        solution: |
          class Dog:
              def __init__(self, name):
                  self.name = name


          class Kennel:
              def __init__(self, number):
                  self.number = number
                  self.dog = None

              def check_in(self, dog):
                  if self.dog is not None:
                      return False
                  self.dog = dog
                  return True

              def check_out(self):
                  leaving = self.dog
                  self.dog = None
                  return leaving

              def __str__(self):
                  if self.dog is None:
                      return f"Kennel {self.number}: empty"
                  return f"Kennel {self.number}: {self.dog.name}"


          if __name__ == "__main__":
              kennel = Kennel(3)
              print(kennel)
              print(kennel.check_in(Dog("Rex")))
              print(kennel.check_in(Dog("Bella")))
              print(kennel)
              leaving = kennel.check_out()
              print(leaving.name)
              print(kennel)
        hints:
          - "In `__init__`, set `self.dog = None`, and check `self.dog is None` wherever you need to know whether the kennel is empty."
          - "`check_out` has to return the dog after emptying the kennel, so keep the dog in a local variable first: `leaving = self.dog`, then `self.dog = None`, then `return leaving`."
          - "When the kennel is already empty, `self.dog` is `None`, so the same three lines return `None` with no extra `if`."
        tests:
