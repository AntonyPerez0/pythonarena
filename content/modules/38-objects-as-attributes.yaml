id: objects-as-attributes
summary: Objects made of other objects. An object as an attribute, when you need an import, a list of objects inside an object, and `None` for "no object here".
steps:
  - id: objects-as-attributes-object
    slug: object-in-object
    title: An object as an attribute
    text: |
      Things are often made of other things, or belong to them: a book has an author, an order has a customer, a car has an engine. A program models that with an attribute whose value is another object, made from a class of your own:

      ```python run
      class Author:
          def __init__(self, name, country):
              self.name = name
              self.country = country


      class Book:
          def __init__(self, title, author):
              self.title = title
              self.author = author


      writer = Author("Ana Lind", "Sweden")
      novel = Book("The Quiet Sea", writer)
      poems = Book("Salt and Stone", writer)

      print(novel.title)
      print(novel.author.name)
      print(poems.author.country)
      ```

      ```output
      The Quiet Sea
      Ana Lind
      Sweden
      ```

      `novel.author.name` takes two hops. `novel.author` gives the `Author` object stored in the book, and `.name` then reads that author's name. It means the same as these two lines, with a variable in between:

      ```python fragment
      who = novel.author
      print(who.name)
      ```

      The attribute holds a reference, as every variable does. Both books refer to the same `Author` object, so if the author changed her name with `writer.name = "Ana Berg"`, both books would show the new name at once.

      ### The outer object uses the inner one

      The methods of the outer object can use the inner object's attributes and call its methods. And when an f-string has an object in its braces, Python uses that object's own `__str__`:

      ```python run
      class Engine:
          def __init__(self, horsepower):
              self.horsepower = horsepower
              self.running = False

          def start(self):
              self.running = True

          def __str__(self):
              state = "running" if self.running else "off"
              return f"{self.horsepower} hp, {state}"


      class Car:
          def __init__(self, model, engine):
              self.model = model
              self.engine = engine

          def start(self):
              self.engine.start()
              print(f"{self.model}: vroom")

          def __str__(self):
              return f"{self.model} (engine: {self.engine})"


      car = Car("Roadster", Engine(150))
      print(car)
      car.start()
      print(car)
      ```

      ```output
      Roadster (engine: 150 hp, off)
      Roadster: vroom
      Roadster (engine: 150 hp, running)
      ```

      The car doesn't know how to start an engine; `self.engine.start()` asks the engine to do it. Each class looks after its own attributes, and the car only talks to its engine through the engine's methods. The engine object is created right in the call, `Car("Roadster", Engine(150))`: it doesn't need a variable of its own, because the car keeps a reference to it.

      **Your turn:** fill in the blanks so the program prints the customer's shipping label:

      ```
      Lea Park
      12 Elm Street
      Springfield
      ```
    fill: |
      class Address:
          def __init__(self, street, city):
              self.street = street
              self.city = city


      class Customer:
          def __init__(self, name, address):
              self.name = name
              self.address = address


      home = Address("12 Elm Street", "Springfield")
      customer = Customer("Lea Park", home)
      print(customer.name)
      print(customer.[[address]].street)
      print(customer.address.[[city]])
    hints:
      - "The customer's address is in the attribute `address`, and it's an `Address` object."
      - "An `Address` has the attributes `street` and `city`. `customer.address.city` goes from the customer to its address, and from there to the city."
    tests:
      - expect: |
          Lea Park
          12 Elm Street
          Springfield
    more:
      - task: |
          What does this program print? Type each line it prints.
        predict: |
          class Coach:
              def __init__(self, name):
                  self.name = name


          class Team:
              def __init__(self, name, coach):
                  self.name = name
                  self.coach = coach


          lee = Coach("Lee")
          reds = Team("Reds", lee)
          blues = Team("Blues", lee)
          blues.coach.name = "Kim"
          print(reds.coach.name)
          print(blues.name, blues.coach.name)
        hints:
          - "`Coach(...)` is called only once, so both teams have the same coach object."
          - "`blues.coach.name = \"Kim\"` renames that one coach, so the Reds see the change too."
      - task: |
          An `Airport` has a code and a city, and a `Flight` has a flight number and two airports, where it leaves from (`origin`) and where it lands (`destination`). Write two methods in the class `Flight`:

          - `__str__(self)` returns a string such as `AY 123: Helsinki (HEL) to Oslo (OSL)`, using the airports' own `__str__`.
          - `return_flight(self, number)` returns a new `Flight` object with the given number that flies the same route the other way around.

          For example, this code:

          ```python fragment
          hel = Airport("HEL", "Helsinki")
          osl = Airport("OSL", "Oslo")
          there = Flight("AY 123", hel, osl)
          back = there.return_flight("AY 124")
          print(there)
          print(back)
          ```

          prints:

          ```
          AY 123: Helsinki (HEL) to Oslo (OSL)
          AY 124: Oslo (OSL) to Helsinki (HEL)
          ```
        seed: |
          class Airport:
              def __init__(self, code, city):
                  self.code = code
                  self.city = city

              def __str__(self):
                  return f"{self.city} ({self.code})"


          class Flight:
              def __init__(self, number, origin, destination):
                  self.number = number
                  self.origin = origin
                  self.destination = destination


          if __name__ == "__main__":
              hel = Airport("HEL", "Helsinki")
              osl = Airport("OSL", "Oslo")
              there = Flight("AY 123", hel, osl)
              back = there.return_flight("AY 124")
              print(there)
              print(back)
        solution: |
          class Airport:
              def __init__(self, code, city):
                  self.code = code
                  self.city = city

              def __str__(self):
                  return f"{self.city} ({self.code})"


          class Flight:
              def __init__(self, number, origin, destination):
                  self.number = number
                  self.origin = origin
                  self.destination = destination

              def __str__(self):
                  return f"{self.number}: {self.origin} to {self.destination}"

              def return_flight(self, number):
                  return Flight(number, self.destination, self.origin)


          if __name__ == "__main__":
              hel = Airport("HEL", "Helsinki")
              osl = Airport("OSL", "Oslo")
              there = Flight("AY 123", hel, osl)
              back = there.return_flight("AY 124")
              print(there)
              print(back)
        hints:
          - "In an f-string, `{self.origin}` uses the `Airport` class's `__str__`, so it becomes `Helsinki (HEL)`."
          - "`__str__` can be one line: `return f\"{self.number}: {self.origin} to {self.destination}\"`."
          - "`return_flight` creates a new flight with the two airports swapped: `Flight(number, self.destination, self.origin)`."
        tests:
          - call: |
              hel = Airport("HEL", "Helsinki")
              osl = Airport("OSL", "Oslo")
              there = Flight("AY 123", hel, osl)
              back = there.return_flight("AY 124")
              print(there)
              print(back)
          - call: |
              rome = Airport("FCO", "Rome")
              lima = Airport("LIM", "Lima")
              flight = Flight("XQ 7", lima, rome)
              print(flight)
              back = flight.return_flight("XQ 8")
              print(back.origin.city, back.destination.code)
              print(flight)
            hidden: true

  - id: objects-as-attributes-imports
    slug: imports
    title: When you need an import
    text: |
      In the challenges on this site, all the classes of a program are usually in one file, `main.py`. A class can use any other class in the same file just by its name. **You don't need an `import` for a class in the same file.**

      A common mistake is to copy an `import` line from an example where the classes were in separate files. Python then looks for a file that isn't there, and stops before it even gets to your classes:

      ```python run crash
      from author import Author


      class Author:
          def __init__(self, name):
              self.name = name


      print(Author("Ana Lind").name)
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 1, in <module>
          from author import Author
      ModuleNotFoundError: No module named 'author'
      ```

      The fix is to delete the `import` line: the class `Author` is right there in the file.

      ### Classes in a file of their own

      As a program grows, its classes often move into files of their own. Each file is a module, just like the modules you wrote yourself in part 7, and a file that uses a class from another file has to import it. Here the class `Product` is in the file `shop.py`, and `main.py` imports it:

      ```python run
      from shop import Product

      cart = [Product("Tea", 3.5), Product("Bread", 2.25)]
      for item in cart:
          print(item)

      # ==== shop.py ====
      class Product:
          def __init__(self, name, price):
              self.name = name
              self.price = price

          def __str__(self):
              return f"{self.name}: {self.price}"
      ```

      ```output
      Tea: 3.5
      Bread: 2.25
      ```

      `from shop import Product` means: in the file `shop.py`, find the name `Product`. Without that line, `main.py` would stop with `NameError: name 'Product' is not defined`, because the class isn't in `main.py`.

      ### Python's own modules

      Classes from Python's standard library live in other files too, so they need an import as well. An object from the `datetime` module can be an attribute like any other object:

      ```python run
      from datetime import date


      class Loan:
          def __init__(self, title, due):
              self.title = title
              self.due = due

          def is_late(self, today):
              return today > self.due


      loan = Loan("World Atlas", date(2026, 3, 14))
      print(loan.due)
      print(loan.is_late(date(2026, 3, 10)))
      print(loan.is_late(date(2026, 3, 20)))
      ```

      ```output
      2026-03-14
      False
      True
      ```

      So the rule is short: you need an `import` for code that is in another file, either a module of Python's own or a file of yours. A class in the same file never needs one.

      **Your turn:** the program below has everything in one file, but it stops with a `ModuleNotFoundError`. Fix it so that it prints:

      ```
      Hamlet: row 7, seat 15
      ```
    seed: |
      from seat import Seat


      class Seat:
          def __init__(self, row, number):
              self.row = row
              self.number = number


      class Ticket:
          def __init__(self, show, seat):
              self.show = show
              self.seat = seat

          def __str__(self):
              return f"{self.show}: row {self.seat.row}, seat {self.seat.number}"


      print(Ticket("Hamlet", Seat(7, 15)))
    solution: |
      class Seat:
          def __init__(self, row, number):
              self.row = row
              self.number = number


      class Ticket:
          def __init__(self, show, seat):
              self.show = show
              self.seat = seat

          def __str__(self):
              return f"{self.show}: row {self.seat.row}, seat {self.seat.number}"


      print(Ticket("Hamlet", Seat(7, 15)))
    hints:
      - Read the error message. Which line does it point at, and which file is Python looking for?
      - The class `Seat` is in this same file, so the program doesn't need to import it. Delete the `import` line.
    forbid:
      - pattern: \bimport\b
        message: Everything is in this one file, so the program needs no `import`.
    tests:
      - expect: "Hamlet: row 7, seat 15"
    more:
      - task: |
          This program has two files. The classes are in `garden.py`, and `main.py` uses them, but `main.py` stops with a `NameError`. Add what `main.py` is missing (and don't change `garden.py`), so the program prints:

          ```
          Herb bed: Basil, Mint, Thyme
          ```
