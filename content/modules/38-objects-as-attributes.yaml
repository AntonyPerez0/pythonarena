              self.contacts.append(contact)

          def find(self, name):
              for contact in self.contacts:
                  if contact.name == name:
                      return contact
              return [[None]]


      book = PhoneBook()
      book.add(Contact("Lea", "040 123 4567"))
      book.add(Contact("Sam", "050 765 4321"))

