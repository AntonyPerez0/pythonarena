              print(tank.total_length())
              print(tank)
        solution: |
          class Fish:
              def __init__(self, name, length):
                  self.name = name
                  self.length = length


          class Aquarium:
              def __init__(self):
                  self.fish = []

              def add(self, fish):
                  self.fish.append(fish)

              def total_length(self):
