        solution: |
          class Message:
              def __init__(self, sender, text):
                  self.sender = sender
                  self.text = text
                  self.read = False

              def __str__(self):
                  return f"{self.sender}: {self.text}"


          class Inbox:
              def __init__(self):
                  self.messages = []

              def add(self, message):
                  self.messages.append(message)

              def first_unread(self):
                  for message in self.messages:
                      if not message.read:
                          return message
                  return None


          if __name__ == "__main__":
              inbox = Inbox()
              print(inbox.first_unread())
              inbox.add(Message("Ana", "Lunch?"))
              inbox.add(Message("Ben", "Meeting at 3"))
              inbox.messages[0].read = True
              print(inbox.first_unread())
