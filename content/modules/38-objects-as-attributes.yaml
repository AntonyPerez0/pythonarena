      - task: |
          A gym membership is valid until its expiry date. Write the class `Membership`:

          - The constructor takes the member's name and the expiry date (a `date` object) and keeps them in the attributes `name` and `expires`.
          - `valid_on(self, day)` returns `True` if the membership is valid on the given day (the expiry day itself still counts), and `False` otherwise.
          - `days_left(self, day)` returns the number of days from the given day to the expiry date (0 on the expiry day itself).

          `date` comes from Python's `datetime` module, so your program needs an import. For example, this code:

          ```python fragment
          card = Membership("Sami", date(2026, 6, 30))
          print(card.valid_on(date(2026, 6, 1)))
          print(card.days_left(date(2026, 6, 1)))
          print(card.valid_on(date(2026, 7, 1)))
          ```

          prints:

          ```
          True
          29
          False
          ```
        seed: |
          class Membership:
              pass


          if __name__ == "__main__":
              card = Membership("Sami", date(2026, 6, 30))
              print(card.valid_on(date(2026, 6, 1)))
              print(card.days_left(date(2026, 6, 1)))
              print(card.valid_on(date(2026, 7, 1)))
        solution: |
          from datetime import date


          class Membership:
              def __init__(self, name, expires):
                  self.name = name
                  self.expires = expires

              def valid_on(self, day):
                  return day <= self.expires

              def days_left(self, day):
                  return (self.expires - day).days


          if __name__ == "__main__":
              card = Membership("Sami", date(2026, 6, 30))
              print(card.valid_on(date(2026, 6, 1)))
              print(card.days_left(date(2026, 6, 1)))
              print(card.valid_on(date(2026, 7, 1)))
        hints:
          - "Start the program with `from datetime import date`, so that `date(...)` works."
          - "Dates can be compared with `<` and `<=`: an earlier date is smaller. The membership is valid when `day <= self.expires`."
          - "Subtracting two dates gives a time difference whose `.days` is the number of days: `(self.expires - day).days`."
        tests:
          - call: |
              card = Membership("Sami", date(2026, 6, 30))
              print(card.valid_on(date(2026, 6, 1)))
              print(card.days_left(date(2026, 6, 1)))
              print(card.valid_on(date(2026, 7, 1)))
          - call: |
              card = Membership("Ines", date(2027, 1, 15))
              print(card.name, card.expires)
              print(card.valid_on(date(2027, 1, 15)))
              print(card.days_left(date(2027, 1, 15)))
              print(card.days_left(date(2026, 12, 25)))
              print(card.valid_on(date(2027, 1, 16)))
            hidden: true

  - id: objects-as-attributes-list
    slug: list-of-objects
    title: A list of objects as an attribute
    text: |
      You have already written classes that keep a list. Often that list holds objects of another class of yours: a playlist has songs, a team has players, a shopping cart has products. The usual pattern has three parts:

      1. `__init__` creates an empty list: `self.songs = []`.
      2. A method adds an object to the list.
      3. Other methods go through the list to work out something about all the objects.

      ```python run
      class Song:
          def __init__(self, title, seconds):
              self.title = title
              self.seconds = seconds

          def __str__(self):
              return f"{self.title} ({self.seconds} s)"


      class Playlist:
          def __init__(self, name):
              self.name = name
              self.songs = []

          def add(self, song):
              self.songs.append(song)

          def total_seconds(self):
              total = 0
              for song in self.songs:
                  total += song.seconds
              return total

          def print_songs(self):
              print(f"{self.name}: {len(self.songs)} songs, {self.total_seconds()} s")
              for song in self.songs:
                  print(song)


      road_trip = Playlist("Road trip")
      road_trip.add(Song("Morning Light", 215))
      road_trip.add(Song("Neon Rain", 187))
      road_trip.print_songs()
      ```

      ```output
      Road trip: 2 songs, 402 s
      Morning Light (215 s)
      Neon Rain (187 s)
      ```

      Each playlist gets its own empty list when it's created, because `__init__` runs once for every new object. Every method reaches the list as `self.songs`.

      A method can call another method of the same object, with `self.` in front: `print_songs` uses `self.total_seconds()` instead of adding up the seconds a second time. Writing each calculation once, in its own method, keeps the class short and easy to change.

      ### Forgetting `self.`

      Inside a method, the list is `self.songs`, never plain `songs`. Without `self.`, Python looks for a local variable called `songs`, which doesn't exist:

      ```python run crash
      class Playlist:
          def __init__(self, name):
              self.name = name
              self.songs = []

          def add(self, song):
              songs.append(song)


      mix = Playlist("Mix")
      mix.add("Neon Rain")
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 11, in <module>
          mix.add("Neon Rain")
          ~~~~~~~^^^^^^^^^^^^^
        File "main.py", line 7, in add
          songs.append(song)
          ^^^^^
      NameError: name 'songs' is not defined. Did you mean: 'self.songs'?
      ```

      The traceback shows two places: line 11, the call, and line 7 inside `add`, where the error really happened. The last place listed is usually the one to fix, and here Python even suggests the fix.

      **Your turn:** a shelf holds books. Fill in the blanks so that `add` puts the book on the shelf and `total_pages` adds up the pages of all its books. The program should print:

      ```
      3 books, 1086 pages
      ```
    fill: |
      class Book:
          def __init__(self, title, pages):
              self.title = title
              self.pages = pages


      class Shelf:
          def __init__(self):
              self.books = []

          def add(self, book):
              self.books.[[append]](book)

          def total_pages(self):
              total = 0
              for book in [[self.books]]:
                  total += book.pages
              return total


      shelf = Shelf()
      shelf.add(Book("Small Gods", 290))
      shelf.add(Book("The Quiet Sea", 318))
      shelf.add(Book("Field Notes", 478))
      print(len(shelf.books), "books,", shelf.total_pages(), "pages")
    hints:
      - "`add` should put the book at the end of the list, with the list method you use for that."
      - "The loop in `total_pages` goes through the shelf's list. Inside a method, the list is `self.books`."
    tests:
      - expect: 3 books, 1086 pages
    more:
      - task: |
          A fish has a name and a length in centimeters. Write the class `Aquarium`, which holds fish:

          - The constructor takes no arguments (other than `self`); a new aquarium has no fish.
          - `add(self, fish)` adds a `Fish` object to the aquarium.
          - `total_length(self)` returns the combined length of all the fish.
          - `__str__(self)` returns a string such as `fish: 2, total length: 17 cm`.

          For example, this code:

          ```python fragment
          tank = Aquarium()
          print(tank)
          tank.add(Fish("Bubbles", 5))
          tank.add(Fish("Nemo", 12))
          print(tank.total_length())
          print(tank)
          ```

          prints:

          ```
          fish: 0, total length: 0 cm
          17
          fish: 2, total length: 17 cm
          ```
        seed: |
          class Fish:
              def __init__(self, name, length):
                  self.name = name
                  self.length = length


          class Aquarium:
              pass


          if __name__ == "__main__":
              tank = Aquarium()
              print(tank)
              tank.add(Fish("Bubbles", 5))
