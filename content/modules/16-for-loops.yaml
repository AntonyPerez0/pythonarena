  - id: for-loops-range
    slug: range
    title: Counting with range
    text: |
      Often you want to repeat something a given number of times, or go through numbers in order. The function **`range`** gives the numbers, and `for` goes through them. With one argument, `range(n)` gives the numbers from 0 to `n - 1`:

      ```python run
      for i in range(4):
          print(i)
      ```

      ```output
      0
      1
      2
      3
      ```

      That's 4 numbers, starting from 0: `range(4)` stops just before 4. So `for i in range(4):` repeats its block 4 times, which is often all you need.

      ### Start, end and step

      With two arguments, `range(start, end)` starts from `start` instead of 0. The end is still left out:

      ```python run
      for number in range(1, 6):
          print(number, "squared is", number * number)
      ```

      ```output
      1 squared is 1
      2 squared is 4
      3 squared is 9
      4 squared is 16
      5 squared is 25
      ```

      To go up to 5, the end must be 6. Forgetting that is the most common `range` mistake: the loop stops one number too early.

      A third argument is the **step**, how much the number changes each time:

      ```python run
      for year in range(2000, 2025, 8):
          print(year)
      ```

      ```output
      2000
      2008
      2016
      2024
      ```

      The step can also be negative, which counts down. Then the start is the greater number, and the end (left out again) is the smaller one:

      ```python run
      for i in range(5, 0, -1):
          print(i)
      print("Liftoff!")
      ```

      ```output
      5
      4
      3
      2
      1
      Liftoff!
      ```

      Compare this with the `while` loop that would do the same: a counter, a condition and a `-= 1`. With `range`, all three are in one line.

      The variable of the loop can be used like any other variable. Here a function uses it to build a line of numbers:

      ```python run
      def number_line(n: int) -> str:
          line = ""
          for i in range(1, n + 1):
              line += str(i) + " "
          return line


      print(number_line(5))
      ```

      ```output
      1 2 3 4 5
      ```

      **Your turn:** fill in the blanks so the loop prints the even numbers from 2 to 10:

      ```
      2
      4
      6
      8
      10
      ```
    fill: |
      for number in range([[2]], [[11‖12]], [[2]]):
          print(number)
    hints:
      - "Start from 2 and take steps of 2. The end is left out, so it must be greater than 10."
      - "`range(2, 11, 2)` gives 2, 4, 6, 8 and 10."
    tests:
      - expect: |
          2
          4
          6
          8
          10
    more:
      - task: |
          Write a program that asks for a whole number and counts down from it to 1, one number per line, and then prints `Liftoff!`. Use `for` and `range`:

          ```
          Count down from: 3
          3
          2
          1
          Liftoff!
          ```
        seed: |
          # Count down with for and range.
        solution: |
          # Count down with for and range.
          start = int(input("Count down from: "))
          for i in range(start, 0, -1):
              print(i)
          print("Liftoff!")
        hints:
          - "Counting down needs a negative step: `range(start, ..., -1)`."
          - "The end is left out, so to stop at 1 the end must be 0."
          - "`for i in range(start, 0, -1):` prints `i`, and `Liftoff!` comes after the loop."
        require:
          - pattern: \brange\s*\(
            message: "Count down with `for` and `range`."
        tests:
          - stdin: "3"
          - stdin: "1"
            hidden: true
          - stdin: "7"
            hidden: true
      - task: |
          Write the function `sum_of_squares(n: int) -> int`, which returns the sum 1 · 1 + 2 · 2 + ... + n · n. For example, `sum_of_squares(3)` returns `14`, because 1 + 4 + 9 is 14.
        seed: |
          def sum_of_squares(n: int) -> int:
              pass


          if __name__ == "__main__":
              print(sum_of_squares(3))
        solution: |
          def sum_of_squares(n: int) -> int:
              total = 0
              for i in range(1, n + 1):
                  total += i * i
              return total


          if __name__ == "__main__":
              print(sum_of_squares(3))
        hints:
          - "The numbers go from 1 to `n`, so the range is `range(1, n + 1)`."
          - "Keep a helper variable `total` and add `i * i` to it in the loop."
          - Return `total` after the loop.
        tests:
          - call: sum_of_squares(3)
          - call: sum_of_squares(1)
            hidden: true
          - call: sum_of_squares(10)
            hidden: true
          - call: sum_of_squares(0)
            hidden: true

  - id: for-loops-building-lists
    slug: building-lists
    title: Ranges, lists and new lists
    text: |
      `range` doesn't make a list. A range hands out its numbers one at a time, whenever a loop asks for the next one, so it never needs to hold them all. That's why printing a range shows just the call that made it, not its numbers:

      ```python run
      hours = range(8, 13)
      print(hours)
      print(list(hours))
      print(list(range(10, 0, -3)))
      ```

      ```output
      range(8, 13)
      [8, 9, 10, 11, 12]
      [10, 7, 4, 1]
      ```

      The function **`list`** turns a range into a real list with all its numbers. A `for` loop doesn't need that: it goes through a range just as well as through a list.

      ### Building a new list

      A common job is to make a new list from an old one. Start with an empty list and `append` to it in the loop. The new list can keep only some of the items:

      ```python run
      def passed(scores: list) -> list:
          result = []
          for score in scores:
              if score >= 50:
                  result.append(score)
          return result


      scores = [72, 35, 50, 90, 48]
      print(passed(scores))
      print(scores)
      ```

      ```output
      [72, 50, 90]
      [72, 35, 50, 90, 48]
      ```

      or change each item on the way:

      ```python run
      def half_price(prices: list) -> list:
          result = []
          for price in prices:
              result.append(price / 2)
          return result


      print(half_price([10, 4, 30]))
      ```

      ```output
      [5.0, 2.0, 15.0]
      ```

      Either way, the original list stays as it was, and the function returns the new one.

      ### When you need the index

      Sometimes the item alone isn't enough: you need its index too, for example to compare it with the item next to it, or with the item at the same index in another list. Then go through the indexes with `range(len(...))`:

      ```python run
      home = [2, 0, 3]
      away = [1, 0, 4]
      for i in range(len(home)):
          print(f"Game {i + 1}: {home[i]}-{away[i]}")
      ```

      ```output
      Game 1: 2-1
      Game 2: 0-0
      Game 3: 3-4
      ```

      `range(len(home))` gives the indexes 0, 1 and 2, and `home[i]` and `away[i]` are the items at the same index in the two lists.

      **Your turn:** write the function `multiples(number: int, count: int) -> list`, which returns a list of the first `count` multiples of `number`. For example, `multiples(3, 4)` returns `[3, 6, 9, 12]`.
    seed: |
      def multiples(number: int, count: int) -> list:
          pass


      if __name__ == "__main__":
          print(multiples(3, 4))
    solution: |
      def multiples(number: int, count: int) -> list:
          result = []
          for i in range(1, count + 1):
              result.append(number * i)
          return result


      if __name__ == "__main__":
          print(multiples(3, 4))
    hints:
      - "Start with an empty list `result`, and return it after a loop that adds one item in each round."
      - "The items are `number * 1`, `number * 2` and so on, up to `number * count`. Go through those multipliers with `for i in range(1, count + 1):`."
      - "In the loop, `result.append(number * i)`."
    tests:
      - call: multiples(3, 4)
      - call: multiples(5, 1)
        hidden: true
      - call: multiples(7, 6)
        hidden: true
    more:
      - task: |
          Write the function `long_words(words: list, min_length: int) -> list`, which returns a new list of the words that have at least `min_length` characters, in their original order. For example, `long_words(["sun", "planet", "moon", "galaxy"], 5)` returns `['planet', 'galaxy']`.
        seed: |
          def long_words(words: list, min_length: int) -> list:
              pass


          if __name__ == "__main__":
              print(long_words(["sun", "planet", "moon", "galaxy"], 5))
        solution: |
          def long_words(words: list, min_length: int) -> list:
              result = []
              for word in words:
                  if len(word) >= min_length:
                      result.append(word)
              return result


          if __name__ == "__main__":
              print(long_words(["sun", "planet", "moon", "galaxy"], 5))
        hints:
          - "Start with an empty list `result` and go through `words` with a `for` loop."
          - "Append a word when `len(word) >= min_length`."
          - "Return `result` after the loop. A list with no long words gives the empty list `[]`."
        tests:
          - call: long_words(["sun", "planet", "moon", "galaxy"], 5)
          - call: long_words(["a", "bb", "ccc"], 2)
            hidden: true
          - call: long_words(["tiny", "word"], 9)
            hidden: true
      - task: |
          Write the function `changes(values: list) -> list`, which returns a list of how much each value changed from the one before it. The new list has one item less than the original. For example, `changes([3, 5, 4, 10])` returns `[2, -1, 6]`: 5 - 3 is 2, 4 - 5 is -1 and 10 - 4 is 6.
        seed: |
          def changes(values: list) -> list:
              pass


          if __name__ == "__main__":
              print(changes([3, 5, 4, 10]))
        solution: |
          def changes(values: list) -> list:
              result = []
              for i in range(1, len(values)):
                  result.append(values[i] - values[i - 1])
              return result


          if __name__ == "__main__":
              print(changes([3, 5, 4, 10]))
        hints:
          - "Each change needs two items next to each other, so go through the indexes instead of the items."
          - "Start from index 1, since the first item has no item before it: `for i in range(1, len(values)):`."
          - "The change at index `i` is `values[i] - values[i - 1]`. Append it to a new list and return the list after the loop."
        tests:
          - call: changes([3, 5, 4, 10])
          - call: changes([7])
            hidden: true
          - call: changes([10, 8, 8, 1, 20])
            hidden: true

  - id: for-loops-best-item
    slug: best-item
    title: The best item so far
    text: |
      `max` and `min` know only one kind of best: the greatest or the smallest value. Often you want another kind: the longest word, the day with the most rain, the number closest to a target. Then you write the search yourself. The trick is one variable, set before the loop, that holds **the best item so far**. Every item is compared with it, and the winner of each comparison stays:

      ```python run
      def longest(words: list) -> str:
          best = words[0]
          for word in words:
              if len(word) > len(best):
                  best = word
          return best


      print(longest(["fig", "banana", "kiwi", "cherry"]))
      ```

      ```output
      banana
      ```

      `best` starts as the first word, so there's always a real word to compare with. In each round, a word that is longer than `best` takes its place. When the loop ends, every word has had its turn, so `best` is the longest of all. `cherry` is as long as `banana`, but not longer, so the first of the two stays.

      ### Where to start

      Start the helper variable from an item of the list, not from a number you made up. A start of 0 looks harmless, but it breaks whenever no item can beat it: for the warmest, a list where every item is below 0; for the coldest, a list where every item is above 0:

      ```python run
      def coldest(temperatures: list) -> int:
          best = 0
          for t in temperatures:
              if t < best:
                  best = t
          return best


      def warmest(temperatures: list) -> int:
          best = 0
          for t in temperatures:
              if t > best:
                  best = t
          return best


      winter = [-8, -3, -12, -5]
      summer = [21, 18, 25]
      print(coldest(winter))
      print(warmest(winter))
      print(coldest(summer))
      ```

      ```output
      -12
      0
      0
      ```

      The warmest winter temperature isn't 0: it's -3. The coldest summer temperature isn't 0 either: it's 18. In both wrong answers no temperature beat the start value 0, so 0 was returned, though it isn't even in the list. With `best = temperatures[0]`, both functions are right for any list.

      ### Remembering where the best item is

      To know where the best item is, and not only what it is, remember its index. Go through the indexes, and keep the index of the best item so far:

      ```python run
      def rainiest_day(rain: list) -> int:
          best = 0
          for i in range(len(rain)):
              if rain[i] > rain[best]:
                  best = i
          return best + 1


      week = [2, 0, 14, 5, 14, 1, 0]
      print("Most rain on day", rainiest_day(week))
      ```

      ```output
      Most rain on day 3
      ```

      Here `best` is an index, so starting it from 0 is right: it means the first day. The function returns `best + 1` because people count days from 1.

      **Your turn:** fill in the blanks so that `first_in_dictionary(words)` returns the word that comes first in alphabetical order when capital letters don't matter, as in a dictionary. (`min` won't do here: it puts every word that starts with a capital letter before the words in small letters.) For example, `first_in_dictionary(["melon", "Cherry", "apple"])` returns `'apple'`.
    fill: |
      def first_in_dictionary(words: list) -> str:
          best = words[0]
          for word in words:
              if word.lower() < [[best.lower()]]:
                  best = [[word]]
          return best


      if __name__ == "__main__":
          print(first_in_dictionary(["melon", "Cherry", "apple"]))
    hints:
      - "Compare both words in small letters, so that capital letters don't change the order: the word in the loop is already written as `word.lower()`."
      - "The other side of `<` is the best word so far, in small letters too. When the word comes earlier, it becomes the new `best` (the word itself, as it was written)."
    tests:
      - call: first_in_dictionary(["melon", "Cherry", "apple"])
      - call: first_in_dictionary(["one"])
        hidden: true
      - call: first_in_dictionary(["kiwi", "Banana", "berry", "Apricot"])
        hidden: true
      - call: first_in_dictionary(["Zebra", "yak", "Walrus"])
        hidden: true
    more:
      - task: |
          Write the function `coldest_day(temperatures: list) -> int`, which returns the number of the day with the lowest temperature. Days are numbered from 1. If several days are equally cold, return the first of them. For example, `coldest_day([5, -2, 3, -2])` returns `2`.
        seed: |
          def coldest_day(temperatures: list) -> int:
              pass


          if __name__ == "__main__":
              print(coldest_day([5, -2, 3, -2]))
        solution: |
          def coldest_day(temperatures: list) -> int:
              best = 0
              for i in range(len(temperatures)):
                  if temperatures[i] < temperatures[best]:
                      best = i
              return best + 1


          if __name__ == "__main__":
              print(coldest_day([5, -2, 3, -2]))
        hints:
          - "Remember the index of the coldest day so far, starting from 0, and go through the indexes with `range(len(temperatures))`."
          - "When `temperatures[i] < temperatures[best]`, set `best = i`. Using `<` and not `<=` keeps the first of equally cold days."
