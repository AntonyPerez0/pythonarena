id: for-loops
summary: The for loop, which goes through the items of a list or the characters of a string one by one. Counting with range, turning a range into a list, building new lists in a loop, and searching a list for its best item by hand.
steps:
  - id: for-loops-lists
    slug: for-lists
    title: Going through a list with for
    text: |
      Lists are made to be gone through: print every price, add up every score, check every name. Python has a loop made for exactly this job, the **`for`** loop:

      ```python run
      prices = [12, 5, 30]
      for price in prices:
          print(price)
      ```

      ```output
      12
      5
      30
      ```

      Read it as "for each price in prices". In the first round, the variable after `for` (here `price`) is the first item, 12, and the indented block runs with it. In the next round `price` is 5, and in the last one 30. After the last item, the loop is over and the program goes on with the line after it.

      The variable can have any name. Choose one that says what an item is: `for price in prices`, `for name in names`.

      With only `while`, the same job takes a counter of your own:

      ```python fragment
      index = 0
      while index < len(prices):
          print(prices[index])
          index += 1
      ```

      That's four lines instead of two, and three chances to slip: start the counter at the wrong number, write `<=` where `<` belongs, or forget `index += 1` and loop forever. A `for` loop has no counter, so none of those mistakes can happen.

      ### Definite and indefinite loops

      A `while` loop repeats as long as its condition is true, and you can't always tell in advance how many rounds that will be: it might wait for the user to type `quit`. That's called **indefinite iteration**. A `for` loop goes through a collection that's already there, so the number of rounds is known when it starts: one per item. That's **definite iteration**.

      ### Working with each item

      Most loops do more than print. A helper variable before the loop collects a result while the loop goes through the items:

      ```python run
      prices = [12, 5, 30, 8]
      total = 0
      cheap = 0
      for price in prices:
          total += price
          if price < 10:
              cheap += 1
      print("Total:", total)
      print("Under 10:", cheap)
      ```

      ```output
      Total: 55
      Under 10: 2
      ```

      `sum(prices)` would give the total too, but the loop can do anything with each item: here it also counts the cheap ones, which no ready function does.

      Inside a function, a `return` in the loop ends the whole function at once. Put the `return` after the loop (not indented under it) when the function needs to see every item first.

      **Your turn:** fill in the blanks so the loop prints every guest's name with a greeting:

      ```
      Welcome, Ada!
      Welcome, Linus!
      Welcome, Grace!
      ```
    fill: |
      guests = ["Ada", "Linus", "Grace"]
      [[for]] guest [[in]] guests:
          print(f"Welcome, {guest}!")
    hints:
      - "The loop line reads like \"for each guest in guests\"."
      - "The two missing words are the keywords `for` and `in`."
    tests:
      - expect: |
          Welcome, Ada!
          Welcome, Linus!
          Welcome, Grace!
    more:
      - task: |
          Write the function `count_over(numbers: list, limit: int) -> int`, which returns how many numbers in the list are greater than `limit`. For example, `count_over([3, 12, 7, 20], 5)` returns `3`.
        seed: |
          def count_over(numbers: list, limit: int) -> int:
              pass


          if __name__ == "__main__":
              print(count_over([3, 12, 7, 20], 5))
        solution: |
          def count_over(numbers: list, limit: int) -> int:
              count = 0
              for number in numbers:
                  if number > limit:
                      count += 1
              return count


          if __name__ == "__main__":
              print(count_over([3, 12, 7, 20], 5))
        hints:
          - "Start a helper variable `count` at 0 before the loop."
          - "Go through the list with `for number in numbers:` and add 1 to `count` when `number > limit`."
          - "Return `count` after the loop, at the same indentation as the `for` line."
        require:
