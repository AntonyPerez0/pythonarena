  - id: for-loops-strings
    slug: for-strings
    title: Going through a string
    text: |
      A `for` loop goes through a string too, one character at a time:

      ```python run
      word = input("Word: ")
      for char in word:
          print(char)
      ```

      ```input
      Hello
      ```

      ```output
      Word: Hello
      H
      e
      l
      l
      o
      ```

      Spaces and punctuation are characters as well, so the loop sees them too. `char` is just a variable name; `letter` or `c` would work as well.

      ### Counting characters

      With a helper variable, the loop can count characters of some kind. Here `in` checks whether a character is one of the vowels in the string `"aeiou"`:

      ```python run
      text = "Programming is fun"
      vowels = 0
      for char in text.lower():
          if char in "aeiou":
              vowels += 1
      print("Vowels:", vowels)
      ```

      ```output
      Vowels: 5
      ```

      The loop goes through `text.lower()`, a copy of the text in small letters, so a capital `A` would be counted as well.

      ### Building a new string

      A loop can also build a new string, character by character. Start with the empty string `""` and add to it with `+=`:

      ```python run
      text = "a quiet, calm day"
      result = ""
      for char in text:
          if char == " ":
              result += "_"
          else:
              result += char
      print(result)
      ```

      ```output
      a_quiet,_calm_day
      ```

      The original string doesn't change: `result` is a new string, with an underscore wherever `text` has a space.

      The same loops work in functions. A function that gets a string as a parameter goes through it in just the same way, and returns the count or the new string at the end:

      ```python run
      def count_char(text: str, wanted: str) -> int:
          count = 0
          for char in text:
              if char == wanted:
                  count += 1
          return count


      print(count_char("banana", "a"))
      print(count_char("banana", "x"))
      ```

      ```output
      3
      0
      ```

      **Your turn:** fill in the blanks so the program counts how many times the letter `a` is in the text the user types, as a small or a capital letter:

      ```
      Text: Banana Split
      Letter a: 3
      ```
    fill: |
      text = input("Text: ")
      count = 0
      for char in [[text]]:
          if char.[[lower]]() == "a":
              count += 1
      print("Letter a:", count)
    hints:
      - "The loop goes through the string that the user typed, in the variable `text`."
      - "To count a capital `A` too, compare the character in small letters: `char.lower()`."
    tests:
      - stdin: Banana Split
      - stdin: Ada and ANNA ate apples
        hidden: true
      - stdin: Python
        hidden: true
    more:
      - task: |
          Write the function `hide_digits(text: str) -> str`, which returns a copy of the text where every digit (0 to 9) is replaced with `#`. Everything else stays as it is. For example, `hide_digits("Call 555-0123")` returns `'Call ###-####'`.
        seed: |
          def hide_digits(text: str) -> str:
              pass


          if __name__ == "__main__":
              print(hide_digits("Call 555-0123"))
        solution: |
          def hide_digits(text: str) -> str:
              result = ""
              for char in text:
                  if char in "0123456789":
                      result += "#"
                  else:
                      result += char
              return result


          if __name__ == "__main__":
              print(hide_digits("Call 555-0123"))
        hints:
          - "Build a new string: start with `result = \"\"` and go through `text` with a `for` loop."
          - "`char in \"0123456789\"` is true for a digit. Then add `\"#\"` to `result`, and otherwise the character itself."
          - "Return `result` after the loop."
        tests:
          - call: hide_digits("Call 555-0123")
          - call: hide_digits("no digits here")
            hidden: true
          - call: hide_digits("PIN 2580, code 7")
            hidden: true
      - task: |
          What does this program print? Type each line it prints.
        predict: |
