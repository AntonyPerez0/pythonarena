      - task: |
          Write the function `closest_to(numbers: list, target: int) -> int`, which returns the number in the list that is closest to `target`. If two numbers are equally close, return the one that comes first. For example, `closest_to([10, 25, 18, 40], 20)` returns `18`.

          Python's function `abs` helps here: it returns a number without its minus sign, so `abs(18 - 20)` and `abs(22 - 20)` are both `2`, the distance from 20.
        seed: |
          def closest_to(numbers: list, target: int) -> int:
              pass


          if __name__ == "__main__":
              print(closest_to([10, 25, 18, 40], 20))
        solution: |
          def closest_to(numbers: list, target: int) -> int:
              best = numbers[0]
              for number in numbers:
                  if abs(number - target) < abs(best - target):
                      best = number
              return best


          if __name__ == "__main__":
              print(closest_to([10, 25, 18, 40], 20))
        hints:
          - "Start with `best = numbers[0]`, the best number so far."
          - "A number is closer than `best` when `abs(number - target) < abs(best - target)`."
          - "Use `<`, not `<=`, so that the first of two equally close numbers stays the best."
