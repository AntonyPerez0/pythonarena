        solution: |
          import pygame

          pygame.init()
          window = pygame.display.set_mode((320, 240))
          monster = pygame.image.load("monster.png")

          places = [(40, 40), (240, 160), (140, 100), (240, 40)]
          place = 0
          hits = 0

          while True:
              for event in pygame.event.get():
                  if event.type == pygame.MOUSEBUTTONDOWN and event.button == 1:
                      x, y = places[place]
                      mouse_x, mouse_y = event.pos
                      if x <= mouse_x < x + 40 and y <= mouse_y < y + 40:
                          hits += 1
                          place = (place + 1) % len(places)
                  if event.type == pygame.QUIT:
                      print("Hits:", hits)
                      exit()

              window.fill((0, 0, 0))
              window.blit(monster, places[place])
              pygame.display.flip()
        hints:
