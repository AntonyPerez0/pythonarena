      ```

      Instead of jumping, the robot can also walk toward the pointer: keep the point it's heading for in variables of its own, and in each frame move the robot a step closer to it, as the second challenge below does.

      ### Did the click hit?

      A click hits an image when its point is inside the image's rectangle. The image covers x from its left edge up to (but not including) its left edge plus its width, and the same for y:

      ```python fragment
      mouse_x, mouse_y = event.pos
      if x <= mouse_x < x + robot.get_width() and y <= mouse_y < y + robot.get_height():
          print("Got the robot!")
      ```

      Python lets you chain comparisons like this: `x <= mouse_x < x + 40` means `x <= mouse_x and mouse_x < x + 40`.

