          - "On a `pygame.MOUSEBUTTONDOWN` event with `event.button == 1`, take the monster's corner `x, y` and the click's `event.pos`, and check `x <= mouse_x < x + 40` and the same for y."
          - "On a hit, add one to the hits and move to the next place: `(index + 1) % len(places)` goes back to 0 after the last one. Print the hits in the `QUIT` branch, before `exit()`."
