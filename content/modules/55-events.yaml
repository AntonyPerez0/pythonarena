  - id: events-mouse
    slug: mouse
    title: The mouse
    text: |
      A mouse click is two events: `pygame.MOUSEBUTTONDOWN` when the button goes down, and `pygame.MOUSEBUTTONUP` when it comes back up. Both have two attributes: `pos`, the point in the window where it happened, as a tuple (x, y), and `button`, which button it was: 1 is the left button, 2 the middle one and 3 the right one.

      ```python window
      import pygame

      pygame.init()
      window = pygame.display.set_mode((320, 240))

      while True:
          for event in pygame.event.get():
              if event.type == pygame.MOUSEBUTTONDOWN:
                  print("button", event.button, "at", event.pos)
              if event.type == pygame.QUIT:
                  exit()

          window.fill((0, 0, 0))
          pygame.display.flip()
      ```

      ```window
      {frames: 20, events: [{at: 4, type: mousedown, pos: [50, 40], button: 1}, {at: 5, type: mouseup, pos: [50, 40], button: 1}, {at: 10, type: mousedown, pos: [270, 200], button: 3}, {at: 11, type: mouseup, pos: [270, 200], button: 3}]}
      ```

      ```output
      button 1 at (50, 40)
      button 3 at (270, 200)
      ```

      `event.pos[0]` is the x of the click and `event.pos[1]` its y.

      ### Drawing where the player clicks

      This program moves the robot to each click. The click should be at the robot's center, so its top-left corner goes half its size to the left and up:

      ```asset robot.png
      ```

      ```python window
      import pygame

      pygame.init()
