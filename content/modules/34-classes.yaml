          print(toast.name, toast.servings, toast.ingredients)
          ```

          prints

          ```
          Tomato soup 4 ['tomatoes', 'onion']
          Cheese toast 2 []
          ```
        seed: |
          # Write the class Recipe here.


          if __name__ == "__main__":
              soup = Recipe("Tomato soup", 4)
              print(soup.name, soup.servings, soup.ingredients)
