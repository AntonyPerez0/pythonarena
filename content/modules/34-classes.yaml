      - task: |
          Write an empty class `Song` and a function `make_song(title, artist, seconds)` that makes a new `Song` object, attaches the attributes `title`, `artist` and `seconds` to it, and returns the object.

          This code:

          ```python fragment
          song = make_song("Rainy Bus Stop", "The Umbrellas", 214)
          print(song.title)
          print(song.artist, song.seconds)
          ```

          prints

          ```
          Rainy Bus Stop
          The Umbrellas 214
          ```
        seed: |
          # Write the class Song here.


          def make_song(title, artist, seconds):
              pass


          if __name__ == "__main__":
              song = make_song("Rainy Bus Stop", "The Umbrellas", 214)
              print(song.title)
        solution: |
          class Song:
              pass


          def make_song(title, artist, seconds):
              song = Song()
              song.title = title
              song.artist = artist
              song.seconds = seconds
              return song


          if __name__ == "__main__":
              song = make_song("Rainy Bus Stop", "The Umbrellas", 214)
              print(song.title)
        hints:
          - "The class needs only two lines: `class Song:` and an indented `pass`."
          - "In the function, make the object with `song = Song()`, then set each attribute: `song.title = title`, and so on."
          - Return the object itself at the end, not one of its attributes.
        require:
          - pattern: \bclass\s+Song\b
            message: Define the class with `class Song:`.
        tests:
          - call: |
              song = make_song("Rainy Bus Stop", "The Umbrellas", 214)
              print(song.title)
              print(song.artist, song.seconds)
          - call: |
              first = make_song("Lighthouse", "Kai Noor", 187)
              second = make_song("Static", "Volt Sisters", 245)
              print(second.title, second.artist, second.seconds)
              print(first.title, first.artist, first.seconds)
            hidden: true

  - id: classes-constructor
    slug: constructor
    title: The constructor and self
    text: |
      A **constructor** sets up each new object as it is made, so that every object gets the same attributes. In Python, the constructor is a method with the special name `__init__` (two underscores on each side of `init`), written inside the class:

      ```python run
      class Planet:
          def __init__(self, name, moons):
              self.name = name
              self.moons = moons


      home = Planet("Earth", 1)
      far = Planet("Neptune", 16)

      print(home.name, home.moons)
      print(far.name, far.moons)
      ```

      ```output
      Earth 1
      Neptune 16
      ```

      A function defined inside a class is a method, and `__init__` is the one that Python calls by itself whenever a new object is made.

      ### self

      The first parameter of `__init__` is always `self`: the object being set up. You never pass it yourself, because Python does that. So `__init__` here has three parameters, but you call `Planet` with two arguments.

      Follow one call, `Planet("Earth", 1)`, from start to end:

      1. Python makes a new, empty `Planet` object.
      2. It calls `__init__`. Inside the call there are three local variables, the parameters: `self` refers to the new object, `name` is `"Earth"` and `moons` is `1`.
      3. `self.name = name` reads the local variable `name` and stores its value in the object, under the attribute name `name`. The next line does the same for `moons`.
      4. `__init__` ends, and its local variables end with it, as in any function. What was stored in the object stays there: the object now has `name` `"Earth"` and `moons` `1`.
      5. The finished object is the value of `Planet("Earth", 1)`, and it is stored in `home`, so `home.name` is `"Earth"`.

      So in `self.name = name`, the `name` on the right is the parameter and the `name` after `self.` is the attribute. They only share the spelling. A constructor `def __init__(self, planet_name, moons):` with `self.name = planet_name` would make exactly the same objects, though it is more to read.

      Forgetting `self.` is a common mistake. Then `name = name` only assigns the local variable to itself, and the object gets nothing:

      ```python run crash
      class Planet:
          def __init__(self, name, moons):
              name = name
              self.moons = moons


      home = Planet("Earth", 1)
      print(home.moons)
      print(home.name)
      ```

      ```output
      1
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 9, in <module>
          print(home.name)
                ^^^^^^^^^
      AttributeError: 'Planet' object has no attribute 'name'
      ```

      ### The right arguments

      The constructor's parameters decide what you must give when you make an object. Leave one out, and Python names the missing one:

      ```python run crash
      class Planet:
          def __init__(self, name, moons):
              self.name = name
              self.moons = moons


      far = Planet("Neptune")
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 7, in <module>
          far = Planet("Neptune")
      TypeError: Planet.__init__() missing 1 required positional argument: 'moons'
      ```

      If the error says `Planet() takes no arguments` instead, Python didn't find a constructor at all: check the spelling of `__init__`, with two underscores on each side.

      As in functions, type hints are welcome in a constructor: `def __init__(self, name: str, moons: int):`. They don't change what the code does.

      **Your turn:** fill in the blanks, so that the constructor stores all three arguments in the object and the program prints:

      ```
      Kindred by Octavia Butler (1979)
      ```
    fill: |
      class Book:
          def __init__([[self]], title, author, year):
              self.title = title
              [[self.author]] = author
              self.year = [[year]]


      novel = Book("Kindred", "Octavia Butler", 1979)
      print(f"{novel.title} by {novel.author} ({novel.year})")
    hints:
      - The first parameter of every constructor is the object itself.
      - "Each attribute is set with `self.` in front of its name: `self.author = author`."
      - "The year comes from the parameter `year`."
    tests:
      - expect: Kindred by Octavia Butler (1979)
    more:
