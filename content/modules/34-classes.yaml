        solution: |
          class Movie:
              def __init__(self, title, year, minutes):
                  self.title = title
                  self.year = year
                  self.minutes = minutes


          def from_decade(movies, decade):
              found = []
              for movie in movies:
                  if decade <= movie.year < decade + 10:
                      found.append(movie)
              return found


          if __name__ == "__main__":
              movies = [Movie("Heat", 1995, 170), Movie("Up", 2009, 96), Movie("Fargo", 1996, 98)]
              for movie in from_decade(movies, 1990):
                  print(movie.title, movie.year)
