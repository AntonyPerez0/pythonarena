          ```
          Ada 21
          Ben 7
          Cy 1
          ```
        seed: |
          class Bike:
              pass


          road = Bike()
          road.owner = "Ada"
          road.gears = 21

          city = Bike()
          city.owner = "Ben"
          city.gear = 7

          kids = Bike()
          kids.owner = "Cy"

          for bike in [road, city, kids]:
              print(bike.owner, bike.gears)
        solution: |
          class Bike:
              pass


          road = Bike()
          road.owner = "Ada"
          road.gears = 21

          city = Bike()
          city.owner = "Ben"
          city.gears = 7

          kids = Bike()
          kids.owner = "Cy"
          kids.gears = 1

          for bike in [road, city, kids]:
              print(bike.owner, bike.gears)
        hints:
          - "Check it and read the error: it names the attribute that one of the bikes doesn't have, and Python even guesses what was meant. The line printed before it shows which bike was fine."
          - "Ben's bike got its gears under a misspelled name, `gear`. The loop asks every bike for `gears`."
