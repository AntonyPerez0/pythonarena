          This class has two mistakes. Fix them, so that the program prints:

          ```
          Up 2009
          ```
        seed: |
          class Movie:
              def _init_(self, title, year):
                  self.title = title
                  year = year


          film = Movie("Up", 2009)
          print(film.title, film.year)
        solution: |
