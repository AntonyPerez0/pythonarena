      - task: |
          Write a class `Flight` with a constructor that takes the flight's code, where it leaves from, where it goes to and how long it takes in minutes, and stores them in the attributes `code`, `origin`, `destination` and `minutes`.

          This code:

          ```python fragment
          flight = Flight("PA101", "Lisbon", "Oslo", 230)
