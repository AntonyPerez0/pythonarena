      - task: |
          Write a class `Trip` whose constructor takes the destination and the first and last day of the trip as `date` objects. It stores them in the attributes `destination`, `start` and `end`, and also sets these two:

          - `nights`: how many nights the trip has, which is the number of days between the start and the end.
          - `packed`: `False` for every new trip.

          (In part 7 you subtracted dates: the result has the attribute `days`.) This code:

          ```python fragment
          trip = Trip("Lisbon", date(2026, 6, 1), date(2026, 6, 8))
          print(trip.destination, trip.nights, trip.packed)
          trip.packed = True
          print(trip.start, trip.end, trip.packed)
          ```

          prints

          ```
          Lisbon 7 False
          2026-06-01 2026-06-08 True
          ```
        seed: |
          from datetime import date


          # Write the class Trip here.


          if __name__ == "__main__":
              trip = Trip("Lisbon", date(2026, 6, 1), date(2026, 6, 8))
              print(trip.destination, trip.nights, trip.packed)
        solution: |
          from datetime import date


          class Trip:
              def __init__(self, destination, start, end):
                  self.destination = destination
                  self.start = start
                  self.end = end
                  self.nights = (end - start).days
                  self.packed = False


          if __name__ == "__main__":
              trip = Trip("Lisbon", date(2026, 6, 1), date(2026, 6, 8))
              print(trip.destination, trip.nights, trip.packed)
        hints:
          - "The constructor has the parameters `self, destination, start, end`, and stores the three arguments as attributes."
          - "`end - start` is a time difference, and its attribute `days` is the number of nights: `self.nights = (end - start).days`."
          - "`packed` isn't a parameter: set `self.packed = False` in the constructor."
        tests:
          - call: |
              trip = Trip("Lisbon", date(2026, 6, 1), date(2026, 6, 8))
              print(trip.destination, trip.nights, trip.packed)
              trip.packed = True
              print(trip.start, trip.end, trip.packed)
          - call: |
              long = Trip("Hokkaido", date(2026, 12, 20), date(2027, 1, 6))
              short = Trip("Tallinn", date(2026, 5, 9), date(2026, 5, 10))
              print(long.destination, long.nights, long.packed)
              print(short.destination, short.nights, short.start.month)
            hidden: true

  - id: classes-objects-in-functions
    slug: objects-and-functions
    title: Your objects in functions and lists
    text: |
      Objects of your own classes are values like any others. Functions can take them as arguments and return them, and lists can hold them.

      ### Functions that make and change objects

      A function can create a new object and return it, and a function can change an object it is given:

      ```python run
      class Hike:
          def __init__(self, name, km, climb):
              self.name = name
              self.km = km
              self.climb = climb


      def short_version(hike):
          return Hike(hike.name + " (short)", hike.km / 2, hike.climb / 2)


      def add_detour(hike, km):
          hike.km += km


      ridge = Hike("Ridge Loop", 12, 600)
      easy = short_version(ridge)
      add_detour(ridge, 3)

      print(ridge.name, ridge.km)
      print(easy.name, easy.km)
      ```

      ```output
      Ridge Loop 15
      Ridge Loop (short) 6.0
      ```

      `add_detour` gets a reference to the same object that `ridge` refers to, so the change is still there after the function ends, just as with a list passed to a function. `short_version` makes a new, separate object, so the detour added to `ridge` afterwards doesn't change `easy`.

      ### Lists of objects

      A list of objects works like any list. Loop through it and use each object's attributes:

      ```python run
      class Hike:
          def __init__(self, name, km, climb):
              self.name = name
              self.km = km
              self.climb = climb


      def hikes_up_to(hikes, max_km):
          found = []
          for hike in hikes:
              if hike.km <= max_km:
                  found.append(hike)
          return found


      hikes = [Hike("Ridge Loop", 12, 600), Hike("Lake Path", 5, 40), Hike("Old Mill", 8, 150)]

      for hike in hikes_up_to(hikes, 8):
          print(f"{hike.name}: {hike.km} km")

      total = 0
      for hike in hikes:
          total += hike.climb
      print("Total climb:", total, "m")
      ```

      ```output
      Lake Path: 5 km
      Old Mill: 8 km
      Total climb: 790 m
      ```

      `hikes_up_to` returns a new list, but the objects in it are the same `Hike` objects as in the original list, not copies.

      ### Printing an object

      What about `print(hike)`? For an object of your own class, Python doesn't know what to show, so it prints the class's name and the object's address in memory, something like this:

      ```text
      <__main__.Hike object at 0x7f2b5c3e1a90>
      ```

      The address changes from run to run, so for now, print the attributes you want to see. A later module shows how to teach a class to print itself nicely.

      **Your turn:** what does this program print? Type each line it prints.
    predict: |
      class Cup:
          def __init__(self, ml):
              self.ml = ml


      def fill_up(cup):
          cup.ml = 250


      def new_cup():
          return Cup(100)


      a = new_cup()
      b = new_cup()
      fill_up(a)
      print(a.ml, b.ml)
      b.ml -= 30
      print(a.ml, b.ml)
    hints:
      - Each call of `new_cup` makes a new, separate cup with 100 ml.
      - "`fill_up(a)` changes the cup that `a` refers to, so it has 250 ml after the call. `b` is another cup."
      - Taking 30 ml out of `b` changes only that cup.
    more:
      - task: |
          The starter code has a class `Movie`. Write a function `longest(movies)` that takes a list of `Movie` objects and returns the longest one: the `Movie` object itself, not its title. When two movies are equally long, return the one that comes first. The list always has at least one movie.

          This code:

          ```python fragment
          movies = [Movie("Up", 2009, 96), Movie("Dune", 2021, 155), Movie("Coco", 2017, 105)]
          best = longest(movies)
          print(best.title, best.minutes)
          ```

          prints

          ```
          Dune 155
          ```
        seed: |
          class Movie:
              def __init__(self, title, year, minutes):
                  self.title = title
                  self.year = year
                  self.minutes = minutes


          def longest(movies):
