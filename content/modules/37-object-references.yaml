      - task: |
          Write a function `copy_of(plant)` that returns a new `Plant` object with the same name and height as the plant it gets. Changing the copy must not change the original.

          For example, this code:

          ```python fragment
          fern = Plant("Fern")
          fern.height = 30
          twin = copy_of(fern)
          twin.height += 5
          print(fern)
          print(twin)
          print(twin is fern)
