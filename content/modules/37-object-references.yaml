        solution: |
          class Product:
              def __init__(self, name, price):
                  self.name = name
                  self.price = price

              def __str__(self):
                  return f"{self.name} ({self.price})"


          def cheapest(products):
              best = products[0]
              for product in products:
                  if product.price < best.price:
                      best = product
              return best


          if __name__ == "__main__":
              items = [Product("Tea", 3.5), Product("Bread", 2.25), Product("Cheese", 6.0)]
              print(cheapest(items))
        hints:
