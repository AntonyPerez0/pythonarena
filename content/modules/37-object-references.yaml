      - task: |
          A ferry has room for cars up to a total length in meters. Write the method `board(self, car)` in the class `Ferry`:

          - If the car fits in the space that's left, it boards: the ferry's `space_left` goes down by the car's `length`, its `cars` goes up by one, and the method returns `True`.
          - If the car doesn't fit, nothing changes and the method returns `False`.

          For example, this code:

          ```python fragment
          ferry = Ferry(10)
          print(ferry.board(Car("ABC-123", 4)))
          print(ferry.board(Car("XYZ-789", 7)))
          print(ferry)
          ```

          prints:

          ```
          True
          False
          cars: 1, space left: 6 m
          ```
        seed: |
          class Car:
              def __init__(self, plate, length):
                  self.plate = plate
                  self.length = length


          class Ferry:
              def __init__(self, space):
                  self.space_left = space
                  self.cars = 0

              def board(self, car):
                  pass

              def __str__(self):
                  return f"cars: {self.cars}, space left: {self.space_left} m"


          if __name__ == "__main__":
              ferry = Ferry(10)
              print(ferry.board(Car("ABC-123", 4)))
              print(ferry.board(Car("XYZ-789", 7)))
              print(ferry)
        solution: |
          class Car:
              def __init__(self, plate, length):
                  self.plate = plate
                  self.length = length


          class Ferry:
              def __init__(self, space):
                  self.space_left = space
                  self.cars = 0

              def board(self, car):
                  if car.length > self.space_left:
                      return False
                  self.space_left -= car.length
                  self.cars += 1
                  return True

              def __str__(self):
                  return f"cars: {self.cars}, space left: {self.space_left} m"


          if __name__ == "__main__":
              ferry = Ferry(10)
              print(ferry.board(Car("ABC-123", 4)))
              print(ferry.board(Car("XYZ-789", 7)))
              print(ferry)
        hints:
          - "Inside `board`, the car's length is `car.length` and the space the ferry has left is `self.space_left`."
          - First check whether the car is too long for the space that's left. If it is, return `False` right away.
          - "Otherwise change the ferry's two attributes (`self.space_left -= car.length` and `self.cars += 1`) and return `True`."
        tests:
          - call: |
              ferry = Ferry(10)
              print(ferry.board(Car("ABC-123", 4)))
              print(ferry.board(Car("XYZ-789", 7)))
              print(ferry)
          - call: |
