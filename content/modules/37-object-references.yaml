          Write the method `larger(self, other)` in the class `Rectangle`. It compares the areas (width times height) of the two rectangles and returns the one with the larger area: the object itself. When the areas are equal, it returns `self`.

          For example, this code:

          ```python fragment
          tile = Rectangle(3, 4)
          door = Rectangle(2, 7)
          print(tile.larger(door))
          print(door.larger(tile))
          ```

          prints:

          ```
          2 x 7
          2 x 7
          ```
        seed: |
          class Rectangle:
              def __init__(self, width, height):
                  self.width = width
                  self.height = height

              def larger(self, other):
                  pass

              def __str__(self):
                  return f"{self.width} x {self.height}"


          if __name__ == "__main__":
              tile = Rectangle(3, 4)
              door = Rectangle(2, 7)
              print(tile.larger(door))
              print(door.larger(tile))
        solution: |
          class Rectangle:
              def __init__(self, width, height):
                  self.width = width
                  self.height = height

              def larger(self, other):
                  my_area = self.width * self.height
                  other_area = other.width * other.height
                  if other_area > my_area:
                      return other
                  return self

              def __str__(self):
                  return f"{self.width} x {self.height}"


          if __name__ == "__main__":
              tile = Rectangle(3, 4)
              door = Rectangle(2, 7)
              print(tile.larger(door))
              print(door.larger(tile))
