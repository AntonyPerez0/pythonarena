      - task: |
          A program's version number has three parts, such as `2.10.3`: major, minor and patch. One version is newer than another when its major number is bigger. If the major numbers are the same, the minor numbers decide, and if those are the same too, the patch numbers decide.

          Write the method `newer_than(self, other)` in the class `Version`. It returns `True` when `self` is newer than `other`, and `False` otherwise (also when they are the same version).

          For example, this code:

          ```python fragment
          old = Version(2, 9, 7)
          new = Version(2, 10, 0)
          print(new.newer_than(old))
          print(old.newer_than(new))
          ```

          prints:

          ```
          True
          False
          ```
        seed: |
          class Version:
              def __init__(self, major, minor, patch):
                  self.major = major
                  self.minor = minor
                  self.patch = patch

              def newer_than(self, other):
                  pass

              def __str__(self):
                  return f"{self.major}.{self.minor}.{self.patch}"


          if __name__ == "__main__":
              old = Version(2, 9, 7)
              new = Version(2, 10, 0)
              print(new.newer_than(old))
              print(old.newer_than(new))
        solution: |
          class Version:
              def __init__(self, major, minor, patch):
                  self.major = major
                  self.minor = minor
                  self.patch = patch

              def newer_than(self, other):
                  if self.major != other.major:
                      return self.major > other.major
                  if self.minor != other.minor:
                      return self.minor > other.minor
                  return self.patch > other.patch

              def __str__(self):
                  return f"{self.major}.{self.minor}.{self.patch}"


          if __name__ == "__main__":
              old = Version(2, 9, 7)
              new = Version(2, 10, 0)
              print(new.newer_than(old))
              print(old.newer_than(new))
        hints:
          - Compare the major numbers first. If they differ, they alone decide the answer.
          - "`if self.major != other.major: return self.major > other.major`. Do the same for the minor numbers next."
          - When both the major and the minor numbers are the same, the answer is `self.patch > other.patch`.
        tests:
