        seed: |
          class Plant:
              def __init__(self, name):
                  self.name = name
                  self.height = 10

              def __str__(self):
                  return f"{self.name}, {self.height} cm"


          def copy_of(plant):
              return plant


          if __name__ == "__main__":
              fern = Plant("Fern")
              fern.height = 30
              twin = copy_of(fern)
              twin.height += 5
              print(fern)
