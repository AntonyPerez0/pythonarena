          Write a function `cheapest(products)`. It gets a list of `Product` objects and returns the cheapest product: the object itself, not its name. You can assume the list has at least one product and that no two products cost the same.

          For example, this code:

          ```python fragment
          items = [Product("Tea", 3.5), Product("Bread", 2.25), Product("Cheese", 6.0)]
          print(cheapest(items))
          ```

          prints:

          ```
          Bread (2.25)
          ```
        seed: |
