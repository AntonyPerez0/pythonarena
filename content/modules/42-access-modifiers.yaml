        solution: |
          class Log:
              def __init__(self):
                  self._entries = []

              def _write(self, level, text):
                  self._entries.append((level, text))

              def show(self):
                  for level, text in self._entries:
                      print(f"[{level}] {text}")


          class AppLog(Log):
              def info(self, text):
                  self._write("INFO", text)

              def error(self, text):
                  self._write("ERROR", text)

              def error_count(self):
                  count = 0
                  for level, text in self._entries:
                      if level == "ERROR":
                          count += 1
                  return count


          if __name__ == "__main__":
              log = AppLog()
              log.info("Program started")
              log.error("File not found")
              log.show()
              print(log.error_count())
