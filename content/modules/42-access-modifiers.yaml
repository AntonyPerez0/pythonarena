      - task: |
          A `Grades` object keeps a student's grades in a protected list. Write a class `CheckedGrades` that inherits `Grades` and accepts only grades on a scale:

          - The constructor takes the scale's `lowest` and `highest` grade.
          - The protected method `_check(grade)` raises a `ValueError` with a message such as `grade must be from 1 to 5` (with the scale's own numbers) when the grade is outside the scale. For a grade on the scale it does nothing.
          - `add(grade)` overrides `Grades`'s: it checks the grade, and then adds it with `super()`.
          - `add_all(grades)` adds a whole list of grades, but only if every one of them is on the scale. It checks them all first, so a list with even one bad grade adds none of them.

          For example,

          ```python fragment
          grades = CheckedGrades(1, 5)
          grades.add(4)
          grades.add_all([5, 3])
          try:
              grades.add_all([2, 7, 4])
          except ValueError as error:
              print("Error:", error)
          try:
              grades.add(0)
          except ValueError as error:
              print("Error:", error)
          print(grades.all())
          print(grades.average())
          ```

          should print:

          ```
          Error: grade must be from 1 to 5
          Error: grade must be from 1 to 5
          [4, 5, 3]
          4.0
          ```
        seed: |
          class Grades:
              def __init__(self):
                  self._grades = []

              def add(self, grade):
                  self._grades.append(grade)

              def all(self):
                  return self._grades[:]

              def average(self):
                  return sum(self._grades) / len(self._grades)


          # Write the class CheckedGrades here.


          if __name__ == "__main__":
              grades = CheckedGrades(1, 5)
              grades.add(4)
              grades.add_all([5, 3])
              print(grades.all())
        solution: |
          class Grades:
              def __init__(self):
                  self._grades = []

              def add(self, grade):
                  self._grades.append(grade)

              def all(self):
                  return self._grades[:]

              def average(self):
                  return sum(self._grades) / len(self._grades)


          class CheckedGrades(Grades):
              def __init__(self, lowest, highest):
                  super().__init__()
                  self._lowest = lowest
                  self._highest = highest

              def _check(self, grade):
                  if grade < self._lowest or grade > self._highest:
                      raise ValueError(f"grade must be from {self._lowest} to {self._highest}")

              def add(self, grade):
                  self._check(grade)
                  super().add(grade)

              def add_all(self, grades):
                  for grade in grades:
                      self._check(grade)
                  for grade in grades:
                      super().add(grade)


          if __name__ == "__main__":
              grades = CheckedGrades(1, 5)
              grades.add(4)
              grades.add_all([5, 3])
              print(grades.all())
        hints:
          - "The constructor calls `super().__init__()`, which creates the list of grades, and then stores the lowest and the highest grade in attributes of its own."
          - "`_check` raises the error when `grade < self._lowest or grade > self._highest`: `raise ValueError(f\"grade must be from {self._lowest} to {self._highest}\")`."
          - "`add` calls `self._check(grade)` and then `super().add(grade)`: if the check raises, the method stops before anything is added. `add_all` needs two loops: one that checks every grade, and only after it one that adds them."
        require:
          - pattern: class\s+CheckedGrades\s*\(\s*Grades\s*\)
            message: "`CheckedGrades` should inherit `Grades`."
          - pattern: def\s+_check\s*\(
            message: "Write the check in a protected method `_check(grade)`."
          - pattern: self\._check\(
            min: 2
            message: "Both `add` and `add_all` should check the grades with `self._check(...)`."
          - pattern: super\(\)\.add\(
            message: "Let `Grades`'s `add` add a grade: `super().add(...)`."
        tests:
