          - "`withdraw` can hand the whole job to the base class: withdrawing 30 with a fee of 2 is the same as a plain withdrawal of 32."
          - "Return what the base class's version returns: `return super().withdraw(...)`, with the amount plus the fee in the parentheses."
        require:
          - pattern: class\s+FeeAccount\s*\(\s*BankAccount\s*\)
            message: "`FeeAccount` should inherit `BankAccount`."
          - pattern: super\(\)\.__init__\(
            message: Let `BankAccount`'s constructor set the owner and the balance with `super().__init__(...)`.
          - pattern: super\(\)\.withdraw\(
            message: "Let `BankAccount`'s `withdraw` do the work: call it with `super().withdraw(...)`."
