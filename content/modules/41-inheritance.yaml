      - task: |
          Build a small class hierarchy of your own on top of `Character`:

          - `Wizard` inherits `Character`. Its constructor takes a name, health and mana. Its method `spell_cost()` returns 10. Its method `cast_spell()` uses up `spell_cost()` mana and returns `NAME casts a spell`. If the wizard has less mana than a spell costs, nothing is used up and it returns `NAME is out of mana`. A wizard prints as a character does, followed by `, MANA mana`.
          - `Archmage` inherits `Wizard`. An archmage's spells cost only 5 mana: override `spell_cost()`, and nothing else.

          For example,

          ```python fragment
          ozma = Archmage("Ozma", 40, 12)
          print(ozma.cast_spell())
          print(ozma.cast_spell())
          print(ozma.cast_spell())
          print(ozma)
          print(isinstance(ozma, Character))
          ```

          should print:

          ```
          Ozma casts a spell
          Ozma casts a spell
          Ozma is out of mana
          Ozma (40 health), 2 mana
          True
          ```
        seed: |
          class Character:
              def __init__(self, name, health):
                  self.name = name
                  self.health = health

              def __str__(self):
                  return f"{self.name} ({self.health} health)"


          # Write the classes Wizard and Archmage here.


          if __name__ == "__main__":
              ozma = Archmage("Ozma", 40, 12)
              print(ozma.cast_spell())
              print(ozma)
        solution: |
          class Character:
              def __init__(self, name, health):
                  self.name = name
                  self.health = health

              def __str__(self):
                  return f"{self.name} ({self.health} health)"


          class Wizard(Character):
              def __init__(self, name, health, mana):
                  super().__init__(name, health)
                  self.mana = mana

              def spell_cost(self):
                  return 10

              def cast_spell(self):
                  if self.mana < self.spell_cost():
                      return f"{self.name} is out of mana"
                  self.mana -= self.spell_cost()
                  return f"{self.name} casts a spell"

              def __str__(self):
                  return super().__str__() + f", {self.mana} mana"


          class Archmage(Wizard):
              def spell_cost(self):
                  return 5


          if __name__ == "__main__":
              ozma = Archmage("Ozma", 40, 12)
              print(ozma.cast_spell())
              print(ozma)
        hints:
          - "Write `Wizard` first and try it on its own: a constructor that calls `super().__init__(name, health)` and sets `self.mana`, then `spell_cost`, `cast_spell` and `__str__`."
          - "In `cast_spell`, compare `self.mana` with `self.spell_cost()`, not with 10: then an archmage's own `spell_cost` is used automatically."
          - "`__str__` can return `super().__str__() + f\", {self.mana} mana\"`."
          - "`Archmage` needs only one method: `spell_cost`, returning 5. It inherits the constructor, `cast_spell` and `__str__` from `Wizard`."
        require:
