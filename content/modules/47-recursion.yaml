        solution: |
          def find_name(names, name, low, high):
              if low > high:
                  return -1
              middle = (low + high) // 2
              if names[middle] == name:
                  return middle
              if names[middle] < name:
                  return find_name(names, name, middle + 1, high)
              return find_name(names, name, low, middle - 1)


          if __name__ == "__main__":
