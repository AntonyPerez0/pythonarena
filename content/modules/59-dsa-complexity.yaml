              [[total += values[i] - leaving‖total = total + values[i] - leaving]]
              if total >= goal:
                  count += 1
          return count


      if __name__ == "__main__":
          print(count_windows([4, 2, 12, 3, 8, 1, 7], 3, 16))
    slow: |
