id: dsa-complexity
summary: How the work of a program grows with its input, in Big-O, and the classic ways to make it grow slower. Sets and dicts that trade memory for speed, binary search and the bisect module, two pointers on sorted data, prefix sums and sliding windows, each with tests big enough that a slow way runs out of time.
steps:
  - id: dsa-complexity-big-o
    slug: big-o
    title: Big-O in practice
    text: |
      Two programs can give the same answer while one finishes in a blink and the other runs for an hour. The computer isn't the difference. What matters is **how the work grows** as the input grows: with 10 values both are instant, with a million values only one of them is.

      You could time a program with a clock, but the time changes from computer to computer and with whatever else the computer is doing. Counting steps doesn't. Here three functions count how many times their innermost line runs:

      ```python run
      def one_loop(n):
          steps = 0
          for i in range(n):
              steps += 1
          return steps


      def every_pair(n):
          steps = 0
          for i in range(n):
              for j in range(i + 1, n):
                  steps += 1
          return steps


      def halving(n):
          steps = 0
          while n > 1:
              n = n // 2
              steps += 1
          return steps


      for n in [10, 100, 1000]:
          print(n, one_loop(n), every_pair(n), halving(n))
      ```

      ```output
      10 10 45 3
      100 100 4950 6
      1000 1000 499500 9
      ```

      Read the columns down. `one_loop` grows with n: ten times the input, ten times the work. `every_pair` meets each pair of values once, n × (n - 1) / 2 steps: ten times the input, about a hundred times the work. `halving` halves n until 1 is left, so ten times the input adds only about three steps.

      ### Big-O

      **Big-O notation** names that growth and leaves out the details. `one_loop` is **O(n)**, `every_pair` is **O(n²)** and `halving` is **O(log n)**. Two more come up all the time: **O(1)**, the same work whatever the size, and **O(n log n)**, the cost of sorting.

      | Big-O | n = 1,000 | n = 1,000,000 | For example |
      | --- | --- | --- | --- |
      | O(1) | 1 | 1 | `values[i]`, `len(values)` |
      | O(log n) | 10 | 20 | binary search |
      | O(n) | 1,000 | 1,000,000 | one loop over the list |
      | O(n log n) | 10,000 | 20,000,000 | `sorted(values)` |
      | O(n²) | 1,000,000 | 1,000,000,000,000 | a loop over every pair |

      Big-O drops **constant factors**: `every_pair` does about n²/2 steps, and that is still O(n²). Two loops one after the other do 2n steps, still O(n). For big inputs, the growth beats any constant. Plain Python does roughly ten to fifty million simple steps a second, so an O(n²) loop over 200,000 values, 20 billion steps, runs for many minutes, while an O(n) loop over them takes a fraction of a second.

      ### Loops you don't see

      A line can be a loop in disguise. `x in values` on a list, `values.index(x)`, `values.count(x)`, `values.remove(x)`, `max(values)` and `sum(values)` go through the items one by one: O(n) each. A slice `values[a:b]` copies its items, and `values.pop(0)` or `values.insert(0, x)` moves every other item by one place. Put one of them in a loop over the list and you have O(n²) without a second `for`. (To take items from the front again and again, use a `collections.deque`, the queue of the module on trees: it removes its first item in O(1).)

      These two functions find the best profit from buying on one day and selling on a later day. Both are right:

      ```python run
      def best_profit_slow(prices):
          best = 0
          for i in range(len(prices) - 1):
              best = max(best, max(prices[i + 1:]) - prices[i])
          return best


      def best_profit(prices):
          best = 0
          lowest = prices[0]
          for price in prices:
              lowest = min(lowest, price)
              best = max(best, price - lowest)
          return best


      prices = [9, 11, 8, 5, 7, 10, 6]
      print(best_profit_slow(prices))
      print(best_profit(prices))
      ```

      ```output
      5
      5
      ```

      `best_profit_slow` has one `for`, but `max(prices[i + 1:])` copies and scans the rest of the list in every round: O(n²) in all. `best_profit` remembers the lowest price so far instead, so each round is O(1): the function is O(n) time, with O(1) extra memory (two variables, whatever the length of the list). Remembering something as you go is the most common way to remove a hidden loop.

      ### Sorting first

      Sorting costs O(n log n), and it often pays: after sorting, equal and close values sit next to each other. To find out whether a list has a repeated value, comparing every pair is O(n²). In a sorted list, a repeated value sits right next to its twin, so one pass over the neighbors is enough: O(n log n) for the sort plus O(n) for the pass, O(n log n) in all.

      ```python run
      def has_repeat(values):
          ordered = sorted(values)
          for i in range(len(ordered) - 1):
              if ordered[i] == ordered[i + 1]:
                  return True
          return False


      print(has_repeat([31, 7, 19, 7, 2]))
      print(has_repeat([31, 7, 19, 8, 2]))
      ```

      ```output
      True
      False
      ```

      `sorted` makes a new sorted list, O(n) extra memory, and leaves the original as it was.

      **Your turn:** what does this program print? Count the steps of each function by hand, and watch how each count grows when n doubles. Type each line it prints.
    predict: |
      def a(n):
          steps = 0
          for i in range(n):
              for j in range(3):
                  steps += 1
          return steps


      def b(n):
          steps = 0
          for i in range(n):
              for j in range(i):
                  steps += 1
          return steps


      def c(n):
          steps = 0
          while n > 1:
              n = n // 2
              steps += 1
          return steps


      print(a(8), b(8), c(8))
      print(a(16), b(16), c(16))
    hints:
      - "In `a`, the inner loop always runs 3 times, whatever `i` is. In `b`, it runs `i` times: 0 times, then 1, then 2, and so on."
      - "`b(8)` is 0 + 1 + 2 + ... + 7 = 28. `c` halves n until it reaches 1: 8, 4, 2, 1 is three halvings."
      - "When n doubles, `a` doubles (O(n)), `b` grows about four times (O(n²)), and `c` grows by one (O(log n))."
    more:
      - task: |
          A **record** is a value greater than every value before it. The first value is always a record. This function counts the records in a list, and it gives the right answers, but `max(values[:i])` is a hidden loop: it makes the function O(n²), and the hidden test has 200,000 values. Make it O(n), without changing what it returns.

          For example, `count_records([3, 1, 4, 1, 5, 9, 2, 6])` returns (the records are 3, 4, 5 and 9):

          ```
          4
          ```
        seed: |
          def count_records(values):
              count = 0
              for i in range(len(values)):
                  if i == 0 or values[i] > max(values[:i]):
                      count += 1
              return count


          if __name__ == "__main__":
              print(count_records([3, 1, 4, 1, 5, 9, 2, 6]))
        solution: |
          def count_records(values):
              count = 0
              highest = None
              for value in values:
                  if highest is None or value > highest:
                      count += 1
                      highest = value
              return count


          if __name__ == "__main__":
              print(count_records([3, 1, 4, 1, 5, 9, 2, 6]))
        slow: |
          def count_records(values):
              count = 0
              for i in range(len(values)):
                  if i == 0 or values[i] > max(values[:i]):
                      count += 1
              return count


          if __name__ == "__main__":
              print(count_records([3, 1, 4, 1, 5, 9, 2, 6]))
        hints:
          - "`max(values[:i])` is the highest value before position `i`. Instead of working it out again in every round, remember it as you go, as `best_profit` remembers the lowest price."
          - "Keep a variable `highest`, the greatest value so far. A value greater than `highest` is a record, and it becomes the new `highest`."
          - "Mind the first value and negative values: don't start `highest` at 0. Start it at `None` (and treat the first value as a record), or at `values[0]` when the list isn't empty."
        tests:
          - call: count_records([3, 1, 4, 1, 5, 9, 2, 6])
          - call: count_records([])
            hidden: true
          - call: count_records([5, 5, 5])
            hidden: true
          - call: count_records([-3, -1, -2, 0])
            hidden: true
          - call: count_records([10, 9, 8, 7])
            hidden: true
          - call: count_records([i * 7919 % 200_003 for i in range(200_000)])
            hidden: true
            big: true
      - task: |
          Write `smallest_gap(values)`: the smallest difference between two values of the list (the larger one minus the smaller one). The list has at least two values. Comparing every pair is O(n²), too slow for the hidden test's 100,000 values: sort first, and the closest values sit next to each other.

          For example, `smallest_gap([40, 7, 22, 31, 15])` returns (22 - 15):

          ```
          7
          ```
        seed: |
          def smallest_gap(values):
              pass


          if __name__ == "__main__":
              print(smallest_gap([40, 7, 22, 31, 15]))
        solution: |
          def smallest_gap(values):
              ordered = sorted(values)
              best = ordered[1] - ordered[0]
              for i in range(1, len(ordered) - 1):
                  gap = ordered[i + 1] - ordered[i]
                  if gap < best:
                      best = gap
              return best


          if __name__ == "__main__":
              print(smallest_gap([40, 7, 22, 31, 15]))
        slow: |
          def smallest_gap(values):
              best = abs(values[0] - values[1])
              for i in range(len(values)):
                  for j in range(i + 1, len(values)):
                      if abs(values[i] - values[j]) < best:
                          best = abs(values[i] - values[j])
              return best


          if __name__ == "__main__":
              print(smallest_gap([40, 7, 22, 31, 15]))
        hints:
          - "In a sorted list, the two closest values are always neighbors: any value between two others is closer to each of them than they are to each other."
          - "Sort the values with `sorted`, then go through the neighbors `ordered[i]` and `ordered[i + 1]` and keep the smallest difference."
          - "Start `best` from the first pair of neighbors, `ordered[1] - ordered[0]`, so you have a real difference to compare with."
        tests:
          - call: smallest_gap([40, 7, 22, 31, 15])
          - call: smallest_gap([5, 1])
            hidden: true
          - call: smallest_gap([3, 9, 3])
            hidden: true
          - call: smallest_gap([-10, 4, -2, 15])
            hidden: true
          - call: smallest_gap([100, 1, 50, 120, 70])
            hidden: true
          - call: smallest_gap([50, 2, 30, 49])
            hidden: true
          - call: smallest_gap([i * i % 1_000_003 for i in range(1, 100_001)])
            hidden: true
            big: true

  - id: dsa-complexity-sets-and-dicts
    slug: sets-and-dicts
    title: Sets and dicts for speed
    text: |
      The last step removed hidden loops by remembering something as you go. Very often, what you need to remember is *which values you have seen*, and then everything depends on how fast you can ask "have I seen this one?"

      ### `in` on a list and on a set

      `x in values` on a list compares `x` with the items one by one, from the start: O(n). A **set** keeps its values in a table, each at a place worked out from the value's **hash**, a number Python computes from the value. To answer `x in seen`, Python computes the hash of `x` and looks in that one place, so the answer takes O(1) on average, however big the set is. A dict finds its keys in the same way. (The worst case, when many values land in the same place, is O(n), and it's rare. The module on hash tables shows how the table works.)

      ```python repl
      >>> numbers = [4, 8, 15, 16, 23, 42]
      >>> 23 in numbers
      True
      >>> lookup = set(numbers)
      >>> 23 in lookup
      True
      >>> 7 in lookup
      False
      ```

      The answers are the same; the cost isn't. Building `set(numbers)` costs O(n) time once, and the set takes O(n) extra memory: you **trade memory for speed**. In a loop over n values, `in` on a list makes the loop O(n²); on a set, O(n).

      One trap: `if x in set(numbers):` inside the loop builds a new set in every round, which is O(n) again. Build the set once, before the loop.

      ### Duplicates and the first repeated value

      `set(values)` drops repeats, so a list has a duplicate when its set is smaller than the list. To find *which* value repeats first, keep a set of the values seen so far:

      ```python run
      def has_duplicate(values):
          return len(set(values)) != len(values)


      def first_repeat(values):
          seen = set()
          for value in values:
              if value in seen:
                  return value
              seen.add(value)
          return None


      print(has_duplicate([3, 1, 4, 1, 5]))
      print(has_duplicate([2, 7, 1, 8]))
      print(first_repeat([5, 3, 9, 3, 5]))
      print(first_repeat([1, 2, 3]))
      ```

      ```output
      True
      False
      3
      None
      ```

      Each round does one lookup and one `add`, both O(1) on average, so `first_repeat` is O(n) time and O(n) memory. With `seen = []` and `append`, it gives the same answers in O(n²).

      ### Counting with Counter

      How often does each value appear? You counted with a dict in the dictionaries module. **`collections.Counter`** does that loop for you, in one O(n) pass. It's a dict from each value to its count, a value it hasn't seen counts as 0, and `most_common(k)` gives the k most common values with their counts, the most common first:

      ```python repl
      >>> from collections import Counter
      >>> votes = Counter(["tea", "coffee", "tea", "juice", "tea", "coffee"])
      >>> votes["tea"]
      3
      >>> votes["water"]
      0
      >>> votes.most_common(2)
      [('tea', 3), ('coffee', 2)]
      ```

      "The k most common values" is a classic interview question. Counting is O(n) on average. Then `most_common(k)` picks the top k of the m different values in O(m log k) (the module on sorting shows how), and without a k it sorts all of them, O(m log m).

      ### Two values that add up to a target

      Is there a pair of values that adds up to `target`? Comparing every pair is O(n²). Turn the question around: for each value `x`, the partner it needs is `target - x`. If that partner is among the values seen so far, there's a pair:

      ```python run
      def has_pair(values, target):
          seen = set()
          for x in values:
              if target - x in seen:
                  return True
              seen.add(x)
          return False


      print(has_pair([8, 3, 11, 5], 16))
      print(has_pair([8, 3, 11, 5], 10))
      print(has_pair([5], 10))
      ```

      ```output
      True
      False
      False
      ```

      11 and 5 make 16, and no two values make 10. The order of the two lines in the loop matters: the check comes before the `add`, so a value never pairs with itself, and the lone 5 doesn't count as 5 + 5.

      When you need *where* the partner is, not just whether it exists, use a dict instead of a set: map each value seen to its index, `positions[x] = i`, and `positions[target - x]` gives the partner's index. That's the classic interview question "two sum".

      To have each index together with its value, loop with **`enumerate`**, in place of `for i in range(len(values))` and `values[i]`:

      ```python repl
      >>> for i, x in enumerate([8, 3, 11]):
      ...     print(i, x)
      ...
      0 8
      1 3
      2 11
      ```

      **Your turn:** a shop sent out some orders, and `missing` lists the ones that never arrived, in the order they were sent. Fill in the blank so that each `not in` check is O(1): the hidden test has 200,000 orders. The call `print(missing([101, 102, 103, 104, 105], [104, 101, 105]))` should print:

      ```
      [102, 103]
      ```
    fill: |
      def missing(sent, received):
          received_set = [[set(received)]]
          result = []
          for order in sent:
              if order not in received_set:
                  result.append(order)
          return result


      if __name__ == "__main__":
          print(missing([101, 102, 103, 104, 105], [104, 101, 105]))
    slow: |
      def missing(sent, received):
          received_set = received
          result = []
          for order in sent:
              if order not in received_set:
                  result.append(order)
          return result


      if __name__ == "__main__":
          print(missing([101, 102, 103, 104, 105], [104, 101, 105]))
    hints:
      - "`order not in received` would look through the whole list of received orders for every order sent: O(n²)."
      - "Turn the list into a set once, before the loop, so each lookup is O(1) on average: `set(received)`."
    tests:
      - call: print(missing([101, 102, 103, 104, 105], [104, 101, 105]))
      - call: missing([1, 2, 3], [])
        hidden: true
      - call: missing([7, 8], [8, 7, 9])
        hidden: true
      - call: len(missing(list(range(200_000)), list(range(0, 400_000, 2))))
        hidden: true
        big: true
    more:
      - task: |
          Write `two_sum(numbers, target)`: return a tuple `(i, j)` with the indexes of two values that add up to `target`, with `i < j`, or `None` if no two values do. A value can't pair with itself. In the tests, the values are all different, and at most one pair adds up to the target. It must be O(n): the hidden test has 200,000 values.

          For example, `two_sum([7, 2, 13, 11], 24)` returns (13 + 11):

          ```
          (2, 3)
          ```
        seed: |
          def two_sum(numbers, target):
              pass


          if __name__ == "__main__":
              print(two_sum([7, 2, 13, 11], 24))
        solution: |
          def two_sum(numbers, target):
              positions = {}
              for j, x in enumerate(numbers):
                  if target - x in positions:
                      return (positions[target - x], j)
                  positions[x] = j
              return None


          if __name__ == "__main__":
              print(two_sum([7, 2, 13, 11], 24))
        slow: |
          def two_sum(numbers, target):
              for i in range(len(numbers)):
                  for j in range(i + 1, len(numbers)):
                      if numbers[i] + numbers[j] == target:
                          return (i, j)
              return None


          if __name__ == "__main__":
              print(two_sum([7, 2, 13, 11], 24))
        hints:
          - "Use a dict that maps each value seen so far to its index. For each value `x` at index `j`, its partner is `target - x`."
          - "`for j, x in enumerate(numbers):` gives each index with its value. If `target - x` is a key of the dict, its index comes first: return `(positions[target - x], j)`. Otherwise add `x` to the dict."
          - "Check before you add `x`, so a value doesn't pair with itself: `two_sum([5, 1, 4], 10)` must give `None`."
        tests:
          - call: two_sum([7, 2, 13, 11], 24)
          - call: two_sum([3, 9], 12)
            hidden: true
          - call: print(two_sum([4, 6, 1], 20))
            hidden: true
          - call: two_sum([-5, 10, 0, 8], 3)
            hidden: true
          - call: print(two_sum([5, 1, 4], 10))
            hidden: true
          - call: print(two_sum([], 1))
            hidden: true
          - call: two_sum([2 * i for i in range(200_000)] + [7], 400_005)
            hidden: true
            big: true
      - task: |
          Write `longest_streak(values)`: the length of the longest run of consecutive whole numbers that are all in the list, such as 4, 5, 6, 7. The values can be in any order and can repeat. An empty list gives 0. It must be O(n): the hidden test has 200,000 values that form one long run, and counting up from every value of it is O(n²).

          For example, `longest_streak([10, 4, 20, 1, 3, 2, 11])` returns (1, 2, 3 and 4):

          ```
          4
          ```
        seed: |
          def longest_streak(values):
              pass


          if __name__ == "__main__":
              print(longest_streak([10, 4, 20, 1, 3, 2, 11]))
        solution: |
          def longest_streak(values):
              present = set(values)
              best = 0
              for value in present:
                  if value - 1 not in present:
                      length = 1
                      while value + length in present:
                          length += 1
                      best = max(best, length)
              return best


          if __name__ == "__main__":
              print(longest_streak([10, 4, 20, 1, 3, 2, 11]))
        slow: |
          def longest_streak(values):
              present = set(values)
              best = 0
              for value in present:
                  length = 1
                  while value + length in present:
                      length += 1
                  best = max(best, length)
              return best


          if __name__ == "__main__":
              print(longest_streak([10, 4, 20, 1, 3, 2, 11]))
        hints:
          - "Put the values in a set, so that \"is `value + 1` in the list?\" is an O(1) question."
          - "From a value, count upward while `value + length` is in the set. But counting from every value of a run of 200,000 numbers is O(n²) again."
          - "Only start counting at the first value of a run: a value whose `value - 1` is not in the set. Then every value is counted at most twice in all."
        tests:
          - call: longest_streak([10, 4, 20, 1, 3, 2, 11])
          - call: longest_streak([])
            hidden: true
          - call: longest_streak([5, 5, 5])
            hidden: true
          - call: longest_streak([-2, 0, -1, 7, 1])
            hidden: true
          - call: longest_streak([9, 1, 5])
            hidden: true
          - call: longest_streak([6, 8, 7, 7, 9, 2, 3])
            hidden: true
          - call: longest_streak(list(range(200_000, 0, -1)))
            hidden: true
            big: true

  - id: dsa-complexity-binary-search
    slug: binary-search
    title: Binary search
    text: |
      You met binary search in the recursion module: look at the middle item of a sorted list, and drop the half where the target can't be. Interviews usually want it as a loop. It needs no recursion, only two variables, `lo` and `hi`, the edges of the part still to search. This one prints what it looks at:

      ```python run
      def find(values, target):
          lo = 0
          hi = len(values) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              print("looks at index", mid, "value", values[mid])
              if values[mid] == target:
                  return mid
              if values[mid] < target:
                  lo = mid + 1
              else:
                  hi = mid - 1
          return -1


      values = [3, 8, 14, 21, 30, 42, 57, 61, 77]
      print(find(values, 57))
      print(find(values, 10))
      ```

      ```output
      looks at index 4 value 30
      looks at index 6 value 57
      6
      looks at index 4 value 30
      looks at index 1 value 8
      looks at index 2 value 14
      -1
      ```

      **Why it's right:** the loop keeps one promise: if the target is in the list, it's somewhere from `lo` to `hi`. When `values[mid]` is smaller than the target, so is every value before it, since the list is sorted, and the target can only be after `mid`: `lo = mid + 1`. When it's greater, `hi = mid - 1`. Each round also drops `mid` itself, so the range shrinks and the loop ends. Once `lo` passes `hi`, the range is empty, and the promise says the target isn't there.

      **What it costs:** each round halves the range, so it's O(log n) time: 20 looks for a million values, 30 for a billion. The memory is O(1). The list must be sorted, though. Sorting costs O(n log n), which pays when you search the same list many times.

      ### The off-by-one traps

      Every `+ 1` and `- 1` matters:

      - With `while lo < hi`, the loop stops when one item is left, without looking at it. `find(values, 77)` would return -1.
      - With `lo = mid` instead of `mid + 1`, once `lo` and `hi` are neighbors, `mid` is `lo`. If the target is greater, `lo = mid` changes nothing, and the loop never ends.
      - With `hi = len(values)`, the range reaches one place past the end of the list, and a search for a big value looks there:

      ```python run crash
      def find(values, target):
          lo = 0
          hi = len(values)
          while lo <= hi:
              mid = (lo + hi) // 2
              if values[mid] == target:
                  return mid
              if values[mid] < target:
                  lo = mid + 1
              else:
                  hi = mid - 1
          return -1


      print(find([3, 8, 14], 99))
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 15, in <module>
          print(find([3, 8, 14], 99))
                ~~~~^^^^^^^^^^^^^^^^
        File "main.py", line 6, in find
          if values[mid] == target:
             ~~~~~~^^^^^
      IndexError: list index out of range
      ```

      ### Where would it go?

      Often you want the place where a value *would* go: the first index whose value is at least the target. That answer can be "after everything", so `hi` starts at `len(values)`, one past the end, and the range is from `lo` up to but not including `hi`. Since `mid` may be the answer, it stays in the range, `hi = mid`, and the loop runs while the range isn't empty, `lo < hi`:

      ```python fragment
      def first_at_least(values, target):
          lo = 0
          hi = len(values)
          while lo < hi:
              mid = (lo + hi) // 2
              if values[mid] < target:
                  lo = mid + 1
              else:
                  hi = mid
          return lo
      ```

      Both styles work. Mixing them causes the first and the last bug above. The middle one is a bug in both styles: `hi` may stay at `mid`, but `lo` must always move past it, `lo = mid + 1`.

      ### The `bisect` module

      Python has this search ready-made in the **`bisect`** module, O(log n) and written in C. `bisect_left(values, x)` is `first_at_least`. `bisect_right(values, x)` is the first index whose value is greater than `x`. Between the two sit exactly the copies of `x`:

      ```python repl
      >>> from bisect import bisect_left, bisect_right
      >>> prices = [5, 8, 8, 12, 20, 20, 20, 35, 50]
      >>> bisect_left(prices, 20)
      4
      >>> bisect_right(prices, 20)
      7
      >>> bisect_right(prices, 20) - bisect_left(prices, 20)
      3
      >>> bisect_left(prices, 10)
      3
      >>> bisect_right(prices, 35) - bisect_left(prices, 8)
      7
      ```

      A shop's prices, sorted: 3 items cost 20. `bisect_left(prices, 10)` is 3, which says two things at once: a 10 would go at index 3, and 3 items cost less than 10, since everything before that index is smaller. The last line counts the items that cost from 8 to 35: 7 of them. In general, the number of values from `low` to `high` is `bisect_right(values, high) - bisect_left(values, low)`: two O(log n) searches, however many values there are between. `bisect.insort(values, x)` puts `x` in its place, finding it in O(log n), but inserting it is O(n), since every item after it moves.

      ### Searching for the answer

      Binary search works on more than lists. Some questions ask for the smallest number that passes a check. A truck ships parcels in the order they're listed, as many each day as fit: what's the smallest capacity that ships them all in `days` days? Checking one capacity is easy: load the parcels in order, start a new day when the next one doesn't fit, and count the days. And the check flips only once: a capacity that's too small fails, and every capacity from the answer up passes. So binary-search the capacity with the loop of `first_at_least`, calling the check at `mid` where it read `values[mid]`:

      ```python run
      def days_needed(weights, capacity):
          days = 1
          load = 0
          for weight in weights:
              if load + weight > capacity:
                  days += 1
                  load = 0
              load += weight
          return days


      def least_capacity(weights, days):
          lo = max(weights)
          hi = sum(weights)
          while lo < hi:
              mid = (lo + hi) // 2
              if days_needed(weights, mid) <= days:
                  hi = mid
              else:
                  lo = mid + 1
          return lo


      weights = [3, 2, 2, 4, 1, 4]
      print([days_needed(weights, capacity) for capacity in range(4, 9)])
      print(least_capacity(weights, 3))
      ```

      ```output
      [5, 4, 3, 3, 3]
      6
      ```

      The capacities 4 to 8 need 5, 4, 3, 3 and 3 days: for 3 days, the check fails for 4 and 5 and passes from 6 on. The capacity is at least the heaviest parcel and at most all of them together, so those are `lo` and `hi`. Each check is O(n), and the search makes O(log S) of them, where S is the total weight: O(n log S) in all, where trying every capacity would take O(n·S). This is **binary search on the answer**. Look for it when a question asks for the smallest or the largest value for which something is possible.

