        solution: |
          def read_steps() -> list:
              steps = []
              while True:
                  line = input("Steps: ")
                  if line == "":
                      break
                  steps.append(int(line))
              return steps


          def print_chart(steps: list):
              for i in range(len(steps)):
                  print(f"Day {i + 1}: {steps[i]:6} {'#' * (steps[i] // 1000)}")


          def best_day(steps: list) -> int:
              best = 0
              for i in range(len(steps)):
                  if steps[i] > steps[best]:
                      best = i
              return best + 1


          def main():
              steps = read_steps()
              print_chart(steps)
              print("Total:", sum(steps))
              print(f"Average: {sum(steps) / len(steps):.1f}")
              print("Best day:", best_day(steps))


          main()
        hints:
          - "Write and try one function at a time. `read_steps` is like reading names until an empty line, but it converts each line with `int` before appending it and returns the list."
          - "In `print_chart`, go through the indexes. The number of `#` characters is `steps[i] // 1000`, and `\"#\" * n` makes n of them. In the f-string, write the `#` in single quotes: `{'#' * (steps[i] // 1000)}`."
          - "In `best_day`, find the index of the greatest count, as you did when finding the best item of a list, and return that index plus 1."
