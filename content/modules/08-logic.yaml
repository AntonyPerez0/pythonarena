  - id: logic-nested
    slug: nested-conditionals
    title: Conditions inside conditions
    text: |
      The block of an `if` can contain any statements, another `if` among them. A conditional statement inside another one is a **nested conditional**. Here the outer `if` checks that the price makes sense at all, and the inner one whether there's enough money:

      ```python run
      balance = 50
      price = int(input("Price: "))
      if price > 0:
          if price <= balance:
              print("Purchase approved.")
          else:
              print("Not enough money.")
      else:
          print("That's not a valid price.")
      ```

      ```input
      80
      ```

      ```output
      Price: 80
      Not enough money.
      ```

      The inner statement is checked only when the outer condition is true. With a price of -5, Python goes straight to the outer `else`.

      ### The indentation decides

      In nested statements the indentation shows which `else` belongs to which `if`: an `else` belongs to the `if` above it at the same indentation. Move the inner `else` four spaces to the left, and the program means something else:

      ```python run
      balance = 50
      price = int(input("Price: "))
      if price > 0:
          if price <= balance:
              print("Purchase approved.")
      else:
          print("Not enough money.")
      ```

      ```input
      80
      ```

      ```output
      Price: 80
      ```

      Now the `else` belongs to the outer `if`. A price of 80 prints nothing at all, and a price of -5 would say `Not enough money.` Python has no way to know which one you meant, so get the indentation right.

      ### Nested or combined?

      The same decision can often be written with `and` instead of nesting:

      ```python run
      balance = 50
      price = 30
      if price > 0 and price <= balance:
          print("Purchase approved.")
      elif price > 0:
          print("Not enough money.")
      else:
          print("That's not a valid price.")
      ```

      ```output
      Purchase approved.
      ```

      Pick whichever version is easier to follow. Nesting fits well when a second question only makes sense after the first one, for example when the program asks for more input in only one branch. A combined condition keeps short checks flat and easy to scan.

      **Your turn:** what does this program print? Type each line it prints.
    predict: |
      weight = 3
      destination = "home"
      if destination == "home":
          if weight <= 2:
              print("Small parcel: 5 euros")
          else:
              print("Large parcel: 9 euros")
      else:
          print("Abroad: 15 euros")
      print("Label printed")
    hints:
      - The outer condition `destination == "home"` is true, so Python goes into its block and checks the inner `if`.
      - "3 is more than 2, so the inner `else` runs. The outer `else` is skipped, and the last line is in the main block."
    more:
      - task: |
          The program should say `Take an umbrella.` when it's warm (15 degrees or more) and raining, and `Enjoy the sunshine!` when it's warm and not raining. When it's colder, it should say `Stay inside and read a book.`, rain or not. One `else` is in the wrong place, and one branch is missing. Fix the program.

          ```
          Temperature: 20
          Is it raining? (yes/no) no
          Enjoy the sunshine!
          ```
        seed: |
          temperature = int(input("Temperature: "))
          raining = input("Is it raining? (yes/no) ")
          if temperature >= 15:
              if raining == "yes":
                  print("Take an umbrella.")
          else:
              print("Enjoy the sunshine!")
        solution: |
          temperature = int(input("Temperature: "))
          raining = input("Is it raining? (yes/no) ")
          if temperature >= 15:
              if raining == "yes":
                  print("Take an umbrella.")
              else:
                  print("Enjoy the sunshine!")
          else:
              print("Stay inside and read a book.")
        hints:
          - "`Enjoy the sunshine!` is for warm days without rain, so its `else` belongs to the inner `if raining == \"yes\":`. Indent it to the same level as that `if`."
          - The cold days need an `else` of their own at the left edge, the same indentation as `if temperature >= 15:`.
        tests:
          - stdin: |
              20
