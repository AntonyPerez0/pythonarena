id: logic
summary: "Conditions made of several parts: and, or and not, how Python groups them when they're mixed, the short way to check a range with a chained comparison, and conditional statements nested inside each other."
steps:
  - id: logic-and
    slug: and
    title: "Both at once: and"
    text: |
      Sometimes one condition isn't enough. A roller coaster might let you ride only if you are at least 10 years old and also at least 140 cm tall. The **logical operator** `and` combines two conditions into one, which is true only when both of them are true:

      ```python run
      age = int(input("Age: "))
      height = int(input("Height in cm: "))
      if age >= 10 and height >= 140:
          print("Enjoy the ride!")
      else:
          print("Sorry, you can't ride yet.")
      ```

      ```input
      12
      135
      ```

      ```output
      Age: 12
      Height in cm: 135
      Sorry, you can't ride yet.
      ```

      The rider is old enough but not tall enough, so the whole condition is false. The interpreter shows all four combinations:

      ```python repl
      >>> True and True
      True
      >>> True and False
      False
      >>> False and True
      False
      >>> False and False
      False
      ```

      Only `True and True` gives `True`. You can also join more than two conditions: `a and b and c` is true only when all three are.

      ### Between two limits

      The most common use of `and` is to check that a number is in a range. Here `hour >= 9 and hour < 17` is true for the hours 9 to 16:

      ```python run
      hour = int(input("Hour (0 to 23): "))
      if hour >= 9 and hour < 17:
          print("The shop is open.")
      else:
          print("The shop is closed.")
      ```

      ```input
      18
      ```

      ```output
      Hour (0 to 23): 18
      The shop is closed.
      ```

      ### Each side is a whole condition

      In English you could say "if the hour is at least 9 and less than 17", and leave out the second "the hour". Python can't fill in the missing part:

      ```python run crash
      hour = 10
      if hour >= 9 and < 17:
          print("The shop is open.")
      ```

      ```crash
        File "main.py", line 2
          if hour >= 9 and < 17:
                           ^
      SyntaxError: invalid syntax
      ```

      After `and`, Python expects a whole new condition, but it finds `<`. Write the variable again: `hour >= 9 and hour < 17`.

      **Your turn:** fill in the blank so the program says the water is perfect for swimming when it's from 24 to 30 degrees, limits included:

      ```
      Water temperature: 26
      Perfect for swimming!
      ```
    fill: |
      temperature = int(input("Water temperature: "))
      if temperature >= 24 [[and]] temperature <= 30:
          print("Perfect for swimming!")
      else:
          print("Maybe another day.")
    hints:
      - Both conditions must be true at the same time.
      - "The operator that needs both sides to be true is `and`."
    tests:
      - stdin: "26"
      - stdin: "20"
        hidden: true
      - stdin: "24"
        hidden: true
      - stdin: "30"
        hidden: true
      - stdin: "31"
        hidden: true
    more:
      - task: |
          Write a program that asks for a username and a password. It welcomes the user only when the username is `robin` and the password is `hood123`. In every other case it prints `Wrong username or password.`

          ```
          Username: robin
          Password: hood123
          Welcome, robin!
          ```
        seed: |
          username = input("Username: ")
          password = input("Password: ")
        solution: |
          username = input("Username: ")
          password = input("Password: ")
          if username == "robin" and password == "hood123":
              print(f"Welcome, {username}!")
          else:
              print("Wrong username or password.")
        hints:
          - Both the username and the password must match, so join the two comparisons with `and`.
          - "`username == \"robin\" and password == \"hood123\"`. Everything else goes to the `else`."
        require:
          - pattern: \band\b
            message: Check both at once with `and`.
        tests:
          - stdin: |
              robin
              hood123
          - stdin: |
              robin
              hood321
            hidden: true
          - stdin: |
              marian
              hood123
            hidden: true
          - stdin: |
              Robin
              hood123
            hidden: true
      - task: |
          A climbing course ends with three tests, each scored from 0 to 10 points. A climber gets the certificate only if every test has at least 5 points and the three scores add up to at least 20. Write a program that asks for the three scores and prints `Certificate earned!` or `No certificate this time.`

          ```
          Test 1: 8
          Test 2: 5
          Test 3: 9
          Certificate earned!
          ```
        seed: |
          first = int(input("Test 1: "))
          second = int(input("Test 2: "))
          third = int(input("Test 3: "))
        solution: |
          first = int(input("Test 1: "))
          second = int(input("Test 2: "))
          third = int(input("Test 3: "))
          total = first + second + third
          if first >= 5 and second >= 5 and third >= 5 and total >= 20:
              print("Certificate earned!")
          else:
              print("No certificate this time.")
        hints:
          - "The certificate needs four things at once: three scores of at least 5 each, and a total of at least 20."
          - "Work out the total first and store it: `total = first + second + third`."
          - "Join the four comparisons with `and`, starting `first >= 5 and second >= 5 and ...`. Every other case goes to the `else`."
        require:
          - pattern: \band\b
            message: Join the conditions with `and`.
        tests:
          - stdin: |
              8
              5
              9
          - stdin: |
              10
              10
              4
            hidden: true
          - stdin: |
