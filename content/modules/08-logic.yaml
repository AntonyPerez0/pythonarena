  - id: logic-or
    slug: or
    title: "At least one: or"
    text: |
      The operator `or` combines two conditions into one that is true when at least one of them is true:

      ```python run
      day = input("Day: ")
      if day == "Saturday" or day == "Sunday":
          print("No school today!")
      else:
          print("Time for school.")
      ```

      ```input
      Sunday
      ```

      ```output
      Day: Sunday
      No school today!
      ```

      Here are all four combinations:

      ```python repl
      >>> True or True
      True
      >>> True or False
      True
      >>> False or True
      True
      >>> False or False
      False
      ```

      Only `False or False` gives `False`. Notice that `or` is also true when both sides are true: it doesn't mean "one or the other, but not both".

      ### Outside a range

      With `or`, you can check that a number is outside a range, below the lower limit or above the upper one:

      ```python run
      number = int(input("Pick a number from 1 to 10: "))
      if number < 1 or number > 10:
          print("That's not between 1 and 10!")
      else:
          print(f"You picked {number}.")
      ```

      ```input
      12
      ```

      ```output
      Pick a number from 1 to 10: 12
      That's not between 1 and 10!
      ```

      A number can't be below 1 and above 10 at the same time, so `number < 1 and number > 10` would never be true. When you check for a value outside a range, the operator is `or`.

      ### A mistake that hides

      Each side of `or` must be a whole condition, just as with `and`. This time, though, leaving out part of it doesn't cause an error, which makes the mistake hard to spot:

      ```python run
      day = "Monday"
      if day == "Saturday" or "Sunday":
          print("Weekend!")
      ```

      ```output
      Weekend!
      ```

      Python reads the condition as `(day == "Saturday") or ("Sunday")`. The right side isn't a comparison at all, just a string, and in a condition Python treats any string that isn't empty as true. So the whole condition is always true, whatever the day. The fix is to compare the variable again: `day == "Saturday" or day == "Sunday"`.

      **Your turn:** fill in the blank so the program says `Winter month` for December, January and February (months 12, 1 and 2):

      ```
      Month (1 to 12): 1
      Winter month
      ```
    fill: |
      month = int(input("Month (1 to 12): "))
      if month == 12 [[or]] month == 1 or month == 2:
          print("Winter month")
      else:
          print("Not a winter month")
    hints:
      - The condition should be true when any one of the three comparisons is true.
      - "The operator for \"at least one\" is `or`."
    tests:
      - stdin: "1"
      - stdin: "12"
        hidden: true
      - stdin: "6"
        hidden: true
      - stdin: "2"
        hidden: true
    more:
      - task: |
          A die shows the numbers 1 to 6. Write a program that asks for the number a player rolled. If the number is less than 1 or greater than 6, it prints `A die has no such number.` Otherwise it prints `You rolled` and the number.

          ```
          Your roll: 7
          A die has no such number.
          ```
        seed: |
          roll = int(input("Your roll: "))
        solution: |
          roll = int(input("Your roll: "))
          if roll < 1 or roll > 6:
              print("A die has no such number.")
          else:
              print(f"You rolled {roll}")
        hints:
          - The number is wrong when it's below 1 or above 6, so the two comparisons are joined with `or`.
          - "`if roll < 1 or roll > 6:` catches the wrong numbers, and the `else` prints the roll with an f-string."
        require:
          - pattern: \bor\b
            message: Check the two limits with `or`.
        tests:
          - stdin: "7"
          - stdin: "3"
            hidden: true
          - stdin: "0"
            hidden: true
          - stdin: "6"
            hidden: true
          - stdin: "1"
            hidden: true
      - task: |
          This program should continue when the user types `yes` or `y`, and stop for anything else. But it always continues. Fix the condition.

          ```
          Do you want to continue? no
          Stopping.
          ```
        seed: |
          answer = input("Do you want to continue? ")
          if answer == "yes" or "y":
              print("Continuing...")
          else:
              print("Stopping.")
        solution: |
          answer = input("Do you want to continue? ")
          if answer == "yes" or answer == "y":
              print("Continuing...")
          else:
              print("Stopping.")
        hints:
          - "The right side of `or` is just the string `\"y\"`, and a string that isn't empty counts as true."
          - "Make the right side a whole comparison: `answer == \"y\"`."
        tests:
          - stdin: "no"
          - stdin: "yes"
            hidden: true
          - stdin: "y"
            hidden: true
          - stdin: "n"
            hidden: true

  - id: logic-not
    slug: not
    title: "Turning a condition around: not"
    text: |
      The operator `not` turns a condition around: `not` of something true is false, and `not` of something false is true.

      ```python repl
      >>> not True
      False
      >>> not False
      True
      >>> not 3 > 5
      True
      ```

      Python works out the comparison before `not`, so `not 3 > 5` means `not (3 > 5)`. Often `not` is handy in front of a combined condition in parentheses. In the step about `or`, `day == "Saturday" or day == "Sunday"` checked for the weekend. With `not` in front, the same condition checks for a weekday:

      ```python run
      day = "Tuesday"
      if not (day == "Saturday" or day == "Sunday"):
          print("The library opens at 8 today.")
      ```

      ```output
      The library opens at 8 today.
      ```

      The parentheses matter here: without them, the `not` would turn around only the first comparison, and the condition would be true on Sundays too.

      ### Truth values in variables

      You saw in part 1 that the value of a comparison, `True` or `False`, can be stored in a variable like any other value. With `not`, such a variable reads almost like English:

      ```python run
      answer = input("Is the door locked? (yes/no) ")
      locked = answer == "yes"
      if not locked:
          print("Remember to lock the door!")
      print("Good night.")
      ```

      ```input
      no
      ```

      ```output
      Is the door locked? (yes/no) no
      Remember to lock the door!
      Good night.
      ```

      The line `locked = answer == "yes"` first evaluates the comparison, then stores its value in `locked`. Here that value is `False`, so `not locked` is `True`.

      ### Which goes first

      When a condition mixes the operators, Python groups it as if there were parentheses around each comparison first, then around each `not`, then around each `and`, with `or` last. So `a or b and c` means `a or (b and c)`, which can surprise you. (The grouping only decides which parts belong together. Python still reads the condition from left to right.) Children under 12 and seniors 65 or older should get a discount, but not on Sundays:

      ```python run
      age = 8
      day = "Sunday"
      if age < 12 or age >= 65 and day != "Sunday":
          print("Discount price")
      else:
          print("Full price")
      ```

      ```output
      Discount price
      ```

      Because `and` is grouped before `or`, Python reads the condition as `age < 12 or (age >= 65 and day != "Sunday")`, and a child gets the discount every day. Parentheses say what is meant: `(age < 12 or age >= 65) and day != "Sunday"`. When a condition mixes `and` and `or`, add parentheses even where they aren't needed. They make the condition easier to read.

      **Your turn:** drum practice is allowed from 8 to 21 o'clock. Fill in the blank so the program asks for quiet at every other hour:

      ```
      Hour: 23
      Quiet hours, no drums please.
      ```
    fill: |
      hour = int(input("Hour: "))
      if [[not]] (hour >= 8 and hour <= 21):
          print("Quiet hours, no drums please.")
      else:
          print("Go ahead and practice!")
    hints:
      - The condition in parentheses is true during practice hours, but the first message is for the other hours.
      - "Turn the whole condition around with `not`."
    tests:
      - stdin: "23"
      - stdin: "8"
        hidden: true
      - stdin: "21"
        hidden: true
      - stdin: "7"
        hidden: true
      - stdin: "15"
        hidden: true
    more:
      - task: |
          What does this program print? Type each line it prints.
        predict: |
          a = True
          b = False
          print(not a)
          print(a and not b)
          print(not a or b)
          print(not (a or b))
        hints:
          - "`not` goes before `and` and `or`, so in `a and not b` the `not` belongs to `b` only."
          - "`not a or b` means `(not a) or b`: both sides are `False`."
          - "In the last line the parentheses come first: `a or b` is `True`, and `not` turns it around."
      - task: |
          Children under 12 and seniors 65 or older get a discount, but never on Sundays. The program below gives a child the discount on Sundays too. Fix the condition.

          ```
          Age: 8
          Day: Sunday
          Full price: 10 euros
          ```
        seed: |
          age = int(input("Age: "))
          day = input("Day: ")
          if age < 12 or age >= 65 and day != "Sunday":
              print("Discount price: 5 euros")
          else:
              print("Full price: 10 euros")
        solution: |
          age = int(input("Age: "))
          day = input("Day: ")
          if (age < 12 or age >= 65) and day != "Sunday":
              print("Discount price: 5 euros")
          else:
              print("Full price: 10 euros")
        hints:
          - "`and` goes before `or`, so Python groups the condition as `age < 12 or (age >= 65 and day != \"Sunday\")`."
          - The two age checks belong together. Put parentheses around them, so the day check applies to both.
        tests:
          - stdin: |
              8
              Sunday
          - stdin: |
              8
              Monday
            hidden: true
          - stdin: |
              70
              Sunday
            hidden: true
          - stdin: |
              65
              Friday
            hidden: true
          - stdin: |
              30
              Tuesday
            hidden: true

  - id: logic-chained
    slug: chained-comparisons
    title: Ranges and longer conditions
    text: |
      Checking that a value is between two limits is so common that Python has a shorter way to write it. Instead of `grade >= 4 and grade <= 10`, you can write `4 <= grade <= 10`, as in mathematics:

      ```python run
      grade = int(input("Grade (4 to 10): "))
      if 4 <= grade <= 10:
          print("Grade saved.")
      else:
          print("That's not a valid grade.")
      ```

      ```input
      11
      ```

      ```output
      Grade (4 to 10): 11
      That's not a valid grade.
      ```

      This is called a **chained comparison**. Python reads `4 <= grade <= 10` as `4 <= grade and grade <= 10`, so the value in the middle is compared with both limits. Any comparison operators can be chained:

      ```python repl
      >>> x = 7
      >>> 0 < x < 10
      True
      >>> 1 <= x <= 5
      False
      >>> a = 3
      >>> b = 3
      >>> a == b == 3
      True
      ```

      The two ways mean exactly the same, and you'll meet both in Python code. The chained one is shorter, and it shows the variable between its two limits, the way you'd write it in a math class.

      ### Longer conditions

      A condition can combine as many parts as it needs, and conditions with `and` and `or` work in an `elif` like anywhere else. In this quiz game, a player who scores at least 90 points within 60 seconds wins gold, a player who manages one of the two wins silver, and 50 points are enough for bronze:

      ```python run
      points = int(input("Points: "))
      seconds = int(input("Time in seconds: "))
      if points >= 90 and seconds <= 60:
          print("Gold medal")
      elif points >= 90 or seconds <= 60:
          print("Silver medal")
      elif points >= 50:
          print("Bronze medal")
      else:
          print("No medal this time")
      ```

      ```input
      95
      75
      ```

      ```output
      Points: 95
      Time in seconds: 75
      Silver medal
      ```

      Notice the order. The `and` condition comes first, because it is the strictest one: it needs both parts. A result that has both parts also has at least one of them, so if the `or` condition came first, it would catch every gold result too, and nobody would ever win gold. The order of conditions matters just as much with `and` and `or` as without them.

      **Your turn:** fill in the blank with a chained comparison, so the program accepts the days of a month, 1 to 31:

      ```
      Day of the month: 31
      OK
      ```
    fill: |
      day = int(input("Day of the month: "))
      if [[1 <= day <= 31]]:
          print("OK")
      else:
          print("No month has that day.")
    hints:
      - "A chained comparison puts the variable between the two limits: `low <= variable <= high`."
      - "Here the limits are 1 and 31: `1 <= day <= 31`."
    require:
      - pattern: \d\s*<=?\s*day\s*<=?\s*\d
        message: "Write the range as a chained comparison, with `day` between the two limits."
    tests:
      - stdin: "31"
      - stdin: "32"
        hidden: true
      - stdin: "0"
        hidden: true
      - stdin: "1"
        hidden: true
    more:
      - task: |
          Write a program that asks for the hours and the minutes of a time on a 24-hour clock and tells whether the time is valid. The hours must be from 0 to 23 and the minutes from 0 to 59. Use two chained comparisons.

          ```
          Hours: 23
          Minutes: 59
          That's a valid time.
          ```

          Otherwise the program prints `That's not a valid time.`
        seed: |
          hours = int(input("Hours: "))
          minutes = int(input("Minutes: "))
        solution: |
          hours = int(input("Hours: "))
          minutes = int(input("Minutes: "))
          if 0 <= hours <= 23 and 0 <= minutes <= 59:
              print("That's a valid time.")
          else:
              print("That's not a valid time.")
        hints:
          - "Each part has its own range: `0 <= hours <= 23` and `0 <= minutes <= 59`."
          - Both parts must be valid at the same time, so join the two chained comparisons with `and`.
        require:
          - pattern: \d\s*<=?\s*hours\s*<=?\s*\d
            message: "Check the hours with a chained comparison, such as `0 <= hours <= 23`."
          - pattern: \d\s*<=?\s*minutes\s*<=?\s*\d
            message: "Check the minutes with a chained comparison, such as `0 <= minutes <= 59`."
        tests:
          - stdin: |
              23
              59
          - stdin: |
              24
              0
            hidden: true
          - stdin: |
              7
              65
            hidden: true
          - stdin: |
              0
              0
            hidden: true
          - stdin: |
              -1
              30
            hidden: true
      - task: |
          Write a program that asks for the lengths of the three sides of a triangle and tells what kind of triangle it is: `Equilateral` when all three sides are equal, `Isosceles` when exactly two are equal, and `Scalene` when all are different.

          ```
          Side 1: 5
          Side 2: 3
          Side 3: 5
          Isosceles
          ```
        seed: |
          a = int(input("Side 1: "))
          b = int(input("Side 2: "))
          c = int(input("Side 3: "))
        solution: |
          a = int(input("Side 1: "))
          b = int(input("Side 2: "))
          c = int(input("Side 3: "))
          if a == b == c:
              print("Equilateral")
          elif a == b or b == c or a == c:
              print("Isosceles")
          else:
              print("Scalene")
        hints:
          - "All three are equal when `a == b == c`, a chained comparison. Check that first, since it's the strictest case."
          - "Two sides are equal when `a == b`, `b == c` or `a == c`: join the three with `or`."
          - Whatever is left has three different sides.
        tests:
          - stdin: |
              5
