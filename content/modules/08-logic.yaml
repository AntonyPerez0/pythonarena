      - task: |
          Write a program for a theme park ride. It asks for the rider's height in centimeters. Riders under 120 cm get the message `Sorry, you must be at least 120 cm tall.` Taller riders are asked whether they want the fast lane: `yes` gives `Fast lane ticket: 30 euros`, anything else `Regular ticket: 20 euros`. Only riders who are tall enough are asked the second question.

          ```
          Height in cm: 150
          Fast lane? (yes/no) yes
          Fast lane ticket: 30 euros
          ```
        seed: |
          height = int(input("Height in cm: "))
        solution: |
          height = int(input("Height in cm: "))
          if height >= 120:
              fast = input("Fast lane? (yes/no) ")
              if fast == "yes":
                  print("Fast lane ticket: 30 euros")
              else:
                  print("Regular ticket: 20 euros")
          else:
              print("Sorry, you must be at least 120 cm tall.")
