id: simple-loops
summary: "Repeating code with a while True loop and leaving it with break. Loops that count, helper variables that keep a count or a total, debugging prints inside loops, and building a string piece by piece."
steps:
  - id: simple-loops-while-true
    slug: while-true
    title: Repeating with while True
    text: |
      So far every line of a program has run at most once. But programs often need to do the same thing many times: ask for one more number, play one more round. A **loop** repeats a block of code. The simplest loop in Python is `while True`, and the command `break` ends it:

      ```python run
      while True:
          word = input("Say something (bye to quit): ")
          if word == "bye":
              break
          print(f"You said: {word}")
      print("Goodbye!")
      ```

      ```input
      hello
      loops are fun
      bye
      ```

      ```output
      Say something (bye to quit): hello
      You said: hello
      Say something (bye to quit): loops are fun
      You said: loops are fun
      Say something (bye to quit): bye
      Goodbye!
      ```

      Here is how it works:

      - `while True:` starts the loop, and the indented lines after it are the loop's block.
      - When Python gets to the end of the block, it jumps back to the `while` line and runs the block again. One run through the block is called an **iteration**.
      - `break` ends the loop at once. Python goes on from the first line after the loop's block, here the `print("Goodbye!")`.

      The `break` is inside an `if`, so the loop ends only when the user types `bye`. On that iteration the last line of the block never runs, because the loop has already ended.

      ### A loop that never ends

      If no `break` can ever run, the loop goes on forever. This is called an **infinite loop**. This one should stop when the user types 0, but it never does:

      ```python fragment
      while True:
          answer = input("Play another round? (1 = yes, 0 = no) ")
          if answer == 0:
              break
          print("Here we go again!")
      ```

      `input` returns a string, so when the user types 0, `answer` is the string `"0"`, not the number `0`, and `"0" == 0` is false. The condition can never be true, so whatever the user types, the loop asks again, forever. The fix is to compare with a string, `answer == "0"`, or to convert the answer with `int` first. Every `while True` loop needs a `break` that will run sooner or later. (A loop that doesn't wait for input and never reaches its `break` keeps running as fast as it can; on this site, a program that runs for more than a few seconds is stopped.)

      ### Asking until the answer is acceptable

      A loop is also the way to ask again until the user types something the program can use:

      ```python run
      while True:
          age = int(input("Your age: "))
          if age >= 0:
              break
          print("An age can't be negative. Try again.")
      print(f"Thanks! You are {age}.")
      ```

      ```input
      -5
      31
      ```

      ```output
      Your age: -5
      An age can't be negative. Try again.
      Your age: 31
      Thanks! You are 31.
      ```

      Notice the order inside the loop: read the input, stop if it's fine, and only then print the complaint. The complaint is printed only when the loop didn't stop.

      **Your turn:** fill in the blanks, so the program keeps asking for commands until the user types `quit`:

      ```
      Command: jump
      Running jump...
      Command: run
      Running run...
      Command: quit
      Shutting down.
      ```
    fill: |
      [[while]] True:
          command = input("Command: ")
          if command == "quit":
              [[break]]
          print(f"Running {command}...")
      print("Shutting down.")
    hints:
      - The first line starts a loop that repeats until something ends it.
      - "The loop starts with `while True:`, and the command that ends it is `break`."
    tests:
      - stdin: |
          jump
          run
          quit
      - stdin: quit
        hidden: true
      - stdin: |
          fly
          quit
        hidden: true
    more:
      - task: |
          Write a program for a café. It keeps asking what the customer would like and answers each order, until the customer types `nothing`. Then it says goodbye.

          ```
          What would you like? tea
          One tea coming up!
          What would you like? cake
          One cake coming up!
          What would you like? nothing
          Thank you, see you again!
          ```
        seed: |
          # Write your program below this line.
        solution: |
          # Write your program below this line.
          while True:
              order = input("What would you like? ")
              if order == "nothing":
                  break
              print(f"One {order} coming up!")
          print("Thank you, see you again!")
        hints:
          - "Start with `while True:` and read the order inside the loop, so each iteration asks again."
          - "Check for `nothing` right after reading, and `break` if that's what was typed. Otherwise print the answer with an f-string."
          - The goodbye line comes after the loop, at the left edge.
        require:
          - pattern: \bwhile\s+True\b
            message: Use a `while True` loop.
          - pattern: \bbreak\b
            message: End the loop with `break`.
        tests:
          - stdin: |
              tea
              cake
              nothing
          - stdin: nothing
            hidden: true
          - stdin: |
              coffee
              water
              muffin
              nothing
            hidden: true
      - task: |
          Write a program that turns minutes into hours and minutes. It keeps asking for minutes until the user types 0, and then prints `Bye!`

          ```
          Minutes (0 to quit): 135
          2 h 15 min
          Minutes (0 to quit): 59
          0 h 59 min
          Minutes (0 to quit): 0
          Bye!
          ```
        seed: |
          # Write your program below this line.
        solution: |
          # Write your program below this line.
          while True:
              minutes = int(input("Minutes (0 to quit): "))
              if minutes == 0:
                  break
              print(f"{minutes // 60} h {minutes % 60} min")
          print("Bye!")
        hints:
          - "Read the number inside a `while True` loop and `break` when it's 0."
          - "The whole hours are `minutes // 60`, and the minutes left over are `minutes % 60`."
          - "Print both in one f-string: `f\"{minutes // 60} h {minutes % 60} min\"`."
        require:
          - pattern: \bwhile\s+True\b
            message: Use a `while True` loop.
        tests:
          - stdin: |
              135
              59
              0
          - stdin: |
              60
              0
            hidden: true
          - stdin: |
              1000
              7
              121
              0
            hidden: true

  - id: simple-loops-counting
    slug: counting
    title: Loops that count
    text: |
      A loop doesn't have to read input. Often a variable changes a little on every iteration, and the loop stops when the variable reaches a limit:

      ```python run
      number = 1
      while True:
          print(number)
          number += 1
          if number > 5:
              break
      print("Done!")
      ```

      ```output
      1
      2
      3
      4
      5
      Done!
      ```

      Follow it through: `number` starts at 1. Each iteration prints it and adds one to it. After printing 5, `number` becomes 6, the condition `number > 5` is true, and `break` ends the loop.

      The variable can change in other ways too. Remember `-=` and `*=` from part 1: `seconds -= 3` is short for `seconds = seconds - 3`, and `n *= 2` doubles `n`. Here is a countdown in steps of 3:

      ```python run
      seconds = 10
      while True:
          if seconds < 0:
              break
          print(seconds)
          seconds -= 3
      print("Liftoff!")
      ```

      ```output
      10
      7
      4
      1
      Liftoff!
      ```

      After 1 comes -2, which is below 0, so the loop stops before printing it.

      ### Where the check goes

      In the first loop the check comes after the `print`, in the second one before it. Where you put the `if` with the `break` decides which values get printed. Here the check comes right after the variable changes, but before the `print`:

      ```python run
      number = 1
      while True:
          number += 1
          if number > 5:
              break
          print(number)
      ```

      ```output
      2
      3
      4
      5
      ```

      Now the first value printed is 2, because `number` grows before it's printed for the first time. When a loop prints one value too many or too few, follow the variable one iteration at a time, on paper or with a `print`, and you'll see where the check should go.

      One more thing: the variable must change inside the loop. Leave out `number += 1`, and `number > 5` never becomes true, so the loop never ends.

      **Your turn:** fill in the blanks, so the program prints four laps and then ends the race:

      ```
      Lap 1
      Lap 2
      Lap 3
      Lap 4
      Race over!
      ```
    fill: |
      lap = 1
      while True:
          print(f"Lap {lap}")
          if lap == [[4]]:
              break
          lap [[+=]] 1
      print("Race over!")
    hints:
      - The loop should stop right after it prints the last lap.
      - "The check compares `lap` with the number of the last lap, 4. After it, `lap += 1` moves on to the next lap."
    tests:
      - expect: |
          Lap 1
          Lap 2
          Lap 3
          Lap 4
          Race over!
    more:
      - task: |
          What does this program print? Type each line it prints.
        predict: |
          n = 1
          while True:
              n *= 2
              if n > 20:
                  break
              print(n)
          print("end", n)
        hints:
          - "`n *= 2` doubles `n`, so it goes 2, 4, 8 and so on."
          - The check comes before the `print`, so a value over 20 is never printed inside the loop.
          - After the loop, `n` still holds the value that ended it.
      - task: |
          Write a program that asks for a number and prints its multiplication table, from 1 to 10 times the number:

          ```
          Number: 7
          7 x 1 = 7
          7 x 2 = 14
          7 x 3 = 21
          7 x 4 = 28
          7 x 5 = 35
          7 x 6 = 42
          7 x 7 = 49
          7 x 8 = 56
          7 x 9 = 63
          7 x 10 = 70
          ```
        seed: |
          number = int(input("Number: "))
        solution: |
          number = int(input("Number: "))
          factor = 1
          while True:
              print(f"{number} x {factor} = {number * factor}")
              factor += 1
              if factor > 10:
                  break
        hints:
          - "You need a second variable that counts from 1 to 10. Set it to 1 before the loop."
          - "Each iteration prints one line, `f\"{number} x {factor} = {number * factor}\"`, and adds one to the counter."
          - Stop the loop with `break` once the counter has gone past 10.
        require:
          - pattern: \bwhile\s+True\b
            message: Use a `while True` loop.
          - pattern: \bprint\s*\(
            max: 1
            message: Print the lines with one `print` inside the loop.
        tests:
          - stdin: "7"
          - stdin: "3"
            hidden: true
          - stdin: "12"
            hidden: true

  - id: simple-loops-helper-variables
    slug: helper-variables
    title: "Helper variables: counting and summing"
    text: |
      Variables that keep track of something while a loop runs are called **helper variables**. A typical one counts things, and another adds up a total:

      ```python run
      items = 0
      total = 0
      while True:
          price = int(input("Price (0 to finish): "))
          if price == 0:
              break
          items += 1
          total += price
      print(f"{items} items, total {total} euros")
      ```

      ```input
      3
      12
      5
      0
      ```

      ```output
      Price (0 to finish): 3
      Price (0 to finish): 12
      Price (0 to finish): 5
      Price (0 to finish): 0
      3 items, total 20 euros
      ```

      Both helpers get their starting value, 0, before the loop, and each iteration updates them. The 0 that ends the loop isn't counted, because the `break` comes before the updates.

      ### Start before the loop

      Where the starting value is set matters. If it is set inside the loop, the helper starts over on every iteration:

      ```python run
      while True:
          count = 0
          word = input("Word (stop to finish): ")
          if word == "stop":
              break
          count += 1
      print(f"You typed {count} words.")
      ```

      ```input
      sun
      moon
      stop
      ```

      ```output
      Word (stop to finish): sun
      Word (stop to finish): moon
      Word (stop to finish): stop
      You typed 0 words.
      ```

      On the last iteration, `count = 0` runs once more just before the `break`, so the count is lost. Move that line above `while True:`, and the program says 2.

      ### Remembering how the loop ended

      A loop can have more than one `break`. A helper variable can remember which one ended it, so that the code after the loop knows what happened. This minibus has 3 seats. It leaves when every seat is taken, or earlier, when nobody else is waiting:

      ```python run
      seats = 3
      on_board = 0
      while True:
          name = input("Passenger (end when nobody is left): ")
          if name == "end":
              full = False
              break
          on_board += 1
          print(f"Welcome aboard, {name}!")
          if on_board == seats:
              full = True
              break
      if full:
          print("The bus is full. Next stop!")
      else:
          print(f"The bus leaves with {on_board} passengers.")
      ```

      ```input
      Ada
      Ben
      end
      ```

      ```output
      Passenger (end when nobody is left): Ada
      Welcome aboard, Ada!
      Passenger (end when nobody is left): Ben
      Welcome aboard, Ben!
      Passenger (end when nobody is left): end
      The bus leaves with 2 passengers.
      ```

      With a third name instead of `end`, the second `break` would end the loop, with `full` set to `True`. `full` holds `True` or `False`, so it can be the condition of an `if` all by itself.

      **Your turn:** fill in the blanks, so the program adds up the minutes of exercise the user types:

      ```
      Minutes of exercise (0 to finish): 30
      Minutes of exercise (0 to finish): 45
      Minutes of exercise (0 to finish): 0
      Total: 75 minutes
      ```
    fill: |
      total = [[0]]
      while True:
          minutes = int(input("Minutes of exercise (0 to finish): "))
          if minutes == 0:
              break
          total [[+=]] minutes
      print(f"Total: {total} minutes")
    hints:
      - Before the first number, nothing has been added yet.
      - "The total starts at `0`, and `total += minutes` adds each number to it."
    tests:
      - stdin: |
          30
          45
          0
      - stdin: "0"
        hidden: true
      - stdin: |
          10
          20
          15
          5
          0
        hidden: true
    more:
      - task: |
          Write a program that reads daily temperatures until the user types `end`, and then prints how many of the days were below zero, out of all the days.

          ```
          Temperature: 3
          Temperature: -2
          Temperature: -7
          Temperature: 1
          Temperature: end
          Frosty days: 2 of 4
          ```
        seed: |
          # Write your program below this line.
        solution: |
          # Write your program below this line.
          days = 0
          frosty = 0
          while True:
              text = input("Temperature: ")
              if text == "end":
