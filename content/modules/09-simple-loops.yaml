              0
              12
              -3
              end
            hidden: true
      - task: |
          Write a program for a savings goal of 100 euros. It keeps asking for deposits and prints the amount saved after each one. As soon as the savings reach at least 100, it prints how many deposits it took.

          ```
          Deposit: 40
          Saved so far: 40
          Deposit: 35
          Saved so far: 75
          Deposit: 30
          Saved so far: 105
          Goal reached! Deposits made: 3
          ```
        seed: |
          # Write your program below this line.
        solution: |
          # Write your program below this line.
          saved = 0
          deposits = 0
          while True:
              deposit = int(input("Deposit: "))
              saved += deposit
              deposits += 1
              print(f"Saved so far: {saved}")
              if saved >= 100:
                  break
          print(f"Goal reached! Deposits made: {deposits}")
        hints:
          - "Two helper variables start at 0 before the loop: the amount saved and the number of deposits."
          - Each iteration reads a deposit, adds it to the savings, counts it and prints the amount saved.
          - "The check `if saved >= 100: break` comes after the `print`, so the last amount is printed too."
        tests:
