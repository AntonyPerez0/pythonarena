  - id: simple-loops-debugging
    slug: debugging-loops
    title: Debugging loops with print
    text: |
      In a loop the same lines run many times, with different values each time, so a bug can hide in any one of the iterations. Debugging prints are especially useful here: a `print` inside the loop shows what happens on every iteration.

      This program should print the average of the numbers typed, but for 4 and 8 it prints 4.0 instead of 6.0:

      ```python run
      total = 0
      count = 0
      while True:
          number = int(input("Number (0 to finish): "))
          count += 1
          if number == 0:
              break
          total += number
      print(f"Average: {total / count}")
      ```

      ```input
      4
      8
      0
      ```

      ```output
      Number (0 to finish): 4
      Number (0 to finish): 8
      Number (0 to finish): 0
      Average: 4.0
      ```

      Add a debugging print at the end of the loop's block, and another one right after the loop. Give each value a label, so you can tell them apart:

      ```python run
      total = 0
      count = 0
      while True:
          number = int(input("Number (0 to finish): "))
          count += 1
          if number == 0:
              break
          total += number
          print("number:", number, "count:", count, "total:", total)
      print("after the loop, count:", count, "total:", total)
      print(f"Average: {total / count}")
      ```

      ```input
      4
      8
      0
      ```

      ```output
      Number (0 to finish): 4
      number: 4 count: 1 total: 4
      Number (0 to finish): 8
      number: 8 count: 2 total: 12
      Number (0 to finish): 0
      after the loop, count: 3 total: 12
      Average: 4.0
      ```

      The values are right during the loop, but after it `count` is 3: the 0 that ends the input was counted too, because `count += 1` comes before the check. Moving that line below the `if` fixes the program. Then the debugging prints can go.

      ### What a break skips

      A `break` ends the loop right where it stands, so on the last iteration the lines below it never run. Often that's just what you want: in the fixed program above, the 0 that ends the input must not be counted. But a check that comes too early makes the loop lose its last value. Suppose a loop should stop after the fifth score, but its `if count == 5:` with the `break` comes before the line that adds the score to the total. Then the fifth score is read and counted, but never added. A debugging print after the loop shows that the total is one value short, and following the last iteration line by line shows which line it never reached.

      When you debug a loop, keep the number of iterations small at first: two or three are usually enough to see the problem, and the printed lines are still easy to read.

      **Your turn:** a hike has at most 4 stages. This program reads the length of each stage until the user types 0 or all 4 stages are in, and then prints the number of stages and the distance. With four stages, the distance comes out too short. Find the bug (debugging prints help) and fix it:

      ```
      Stage length in km (0 to stop): 3
      Stage length in km (0 to stop): 5
      Stage length in km (0 to stop): 2
      Stage length in km (0 to stop): 4
      Stages: 4, distance: 14 km
      ```
    seed: |
      stages = 0
      total = 0
      while True:
          km = int(input("Stage length in km (0 to stop): "))
          if km == 0:
              break
          stages += 1
          if stages == 4:
              break
          total += km
      print(f"Stages: {stages}, distance: {total} km")
    solution: |
      stages = 0
      total = 0
      while True:
          km = int(input("Stage length in km (0 to stop): "))
          if km == 0:
              break
          stages += 1
          total += km
          if stages == 4:
              break
      print(f"Stages: {stages}, distance: {total} km")
    hints:
      - "Add `print(\"stages:\", stages, \"total:\", total)` as the last line of the loop's block and run the example. Which stage never shows up in the total?"
      - "On the fourth stage, `if stages == 4:` ends the loop before `total += km` runs, so that stage is counted but never added."
      - Every stage must be added before the loop can end. Move the line that adds it above the check.
    tests:
      - stdin: |
          3
          5
          2
          4
      - stdin: |
          7
          0
        hidden: true
      - stdin: "0"
        hidden: true
      - stdin: |
          1
          1
          1
          1
        hidden: true
      - stdin: |
          10
          20
          0
        hidden: true
      - stdin: |
          2
          2
          2
          2
          9
        hidden: true
    more:
      - task: |
          What does this program print? Type each line it prints.
        predict: |
          x = 1
          total = 0
          while True:
              total += x
              print("x:", x, "total:", total)
              if total > 10:
                  break
              x += 2
        hints:
          - "Follow the two variables one iteration at a time: first `total` grows by `x`, then the line is printed."
          - "`x` grows by 2 after the check: it is 1, then 3, then 5 and so on."
          - The loop stops after the first line where the total is over 10.
      - task: |
          This program should tell how long the longest word was, but it always says 0. Find the bug and fix it, so it prints:

          ```
          Word (end to finish): sun
          Word (end to finish): banana
          Word (end to finish): kiwi
          Word (end to finish): end
          The longest word has 6 characters.
          ```
        seed: |
          while True:
              longest = 0
              word = input("Word (end to finish): ")
              if word == "end":
                  break
              if len(word) > longest:
                  longest = len(word)
          print(f"The longest word has {longest} characters.")
        solution: |
          longest = 0
          while True:
              word = input("Word (end to finish): ")
              if word == "end":
                  break
              if len(word) > longest:
                  longest = len(word)
          print(f"The longest word has {longest} characters.")
        hints:
          - "Print `longest` at the start of each iteration. What is it every time?"
          - The helper variable is set back to 0 on every iteration, the last one too.
          - Move `longest = 0` above the loop, so it's set only once.
        tests:
          - stdin: |
              sun
              banana
              kiwi
              end
          - stdin: |
              strawberry
              fig
              end
            hidden: true
          - stdin: |
              a
              bb
              ccc
              end
            hidden: true

  - id: simple-loops-building-strings
    slug: building-strings
    title: Building strings in a loop
    text: |
      A helper variable doesn't have to hold a number. A string can grow in a loop too: start with the **empty string** `""` and add to it with `+=`, which joins strings just as `+` does:

      ```python run
      stars = ""
      count = 0
      while True:
          stars += "*"
          count += 1
          if count == 5:
              break
      print(stars)
      ```

      ```output
      *****
      ```

      Each iteration adds one `*` to the end of `stars`, and the whole string is printed once, after the loop.

      ### Collecting input

      In the same way, a program can collect what the user types:

      ```python run
      guests = ""
      while True:
          name = input("Guest (done to finish): ")
          if name == "done":
              break
          guests += name
      print("Guests: " + guests)
      ```

      ```input
      Ada
      Alan
      Grace
      done
      ```

      ```output
      Guest (done to finish): Ada
      Guest (done to finish): Alan
      Guest (done to finish): Grace
      Guest (done to finish): done
      Guests: AdaAlanGrace
      ```

      Almost: `+=` joins the strings exactly as they are, so the names run together. They need a comma and a space between them, but not before the first name, and not after the last one either. So add the separator in front of each name, except the first:

      ```python run
      guests = ""
      while True:
          name = input("Guest (done to finish): ")
          if name == "done":
              break
          if guests == "":
              guests = name
          else:
              guests += ", " + name
      print("Guests: " + guests)
      ```

      ```input
      Ada
      Alan
      Grace
      done
      ```

      ```output
      Guest (done to finish): Ada
      Guest (done to finish): Alan
      Guest (done to finish): Grace
      Guest (done to finish): done
      Guests: Ada, Alan, Grace
      ```

      `guests == ""` is true only for the first name, while nothing has been added yet.

      ### Numbers into the string

      `+` joins only strings, so a number must be converted with `str` before it's added:

      ```python repl
      >>> row = ""
      >>> row += str(1) + " "
      >>> row += str(2) + " "
      >>> row
      '1 2 '
      ```

      Without `str`, Python stops with the `TypeError` you saw earlier: `can only concatenate str (not "int") to str`.

      **Your turn:** write a program that asks for a number and prints a countdown from it on one line, followed by `Liftoff!`:

      ```
      Count down from: 5
      5 4 3 2 1 Liftoff!
      ```
    seed: |
      number = int(input("Count down from: "))
    solution: |
      number = int(input("Count down from: "))
      line = ""
      while True:
          if number == 0:
              break
          line += str(number) + " "
          number -= 1
      print(line + "Liftoff!")
    hints:
      - "Start with an empty string, `line = \"\"`, before the loop, and print it only once, after the loop."
      - "Each iteration adds the number and a space: `line += str(number) + \" \"`. Then `number -= 1` counts down."
      - "Stop with `break` when the number reaches 0, and print `line + \"Liftoff!\"` at the end."
    require:
      - pattern: \bwhile\s+True\b
        message: Use a `while True` loop.
      - pattern: \bprint\s*\(
        max: 1
        message: Build the whole line in a string and print it once, after the loop.
    tests:
      - stdin: "5"
      - stdin: "1"
        hidden: true
      - stdin: "12"
        hidden: true
