          Item: bread
          Item: eggs
          Item: done
          Shopping list: milk, bread, eggs
          ```
        seed: |
          # Write your program below this line.
        solution: |
          # Write your program below this line.
          items = ""
          while True:
              item = input("Item: ")
              if item == "done":
                  break
              if items == "":
                  items = item
              else:
                  items += ", " + item
          if items == "":
              print("The list is empty.")
          else:
              print("Shopping list: " + items)
        hints:
