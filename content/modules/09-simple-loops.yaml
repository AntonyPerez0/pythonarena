          print(f"Frosty days: {frosty} of {days}")
        hints:
          - "Read the input as a string first and compare it with `\"end\"`. Only after that, convert it with `int(...)`."
          - You need two helper variables, both starting at 0 before the loop. One counts every day, the other only the days below zero.
          - "Inside the loop, `days += 1` runs for every temperature, and `frosty += 1` only inside `if temperature < 0:`."
        tests:
          - stdin: |
              3
              -2
              -7
              1
              end
          - stdin: |
              5
              end
            hidden: true
          - stdin: |
              -1
              -1
              -1
              end
            hidden: true
