          - "The points come row by row: first the three of row 0, with y = 0, then the three of row 1, with y = 40."
          - "`places[2]` is the last point of the first row, and `places[3]` the first point of the second row."
      - task: |
          Draw a room in a 320 x 240 window, which is 8 tiles wide and 6 tiles high (each tile is 40 x 40). The tiles along the four edges of the window are walls, and all the others are floor. Draw the tiles row by row from the top, each row from left to right, with two loops, one inside the other (`for` or `while`). Then draw the robot in the room at (120, 80).
        assets: [wall.png, floor.png, robot.png]
        seed: |
          import pygame

          pygame.init()
          window = pygame.display.set_mode((320, 240))
          wall = pygame.image.load("wall.png")
          floor = pygame.image.load("floor.png")
          robot = pygame.image.load("robot.png")

          while True:
              for event in pygame.event.get():
