          - "A tile is on an edge when its row is the first or the last one (0 or 5), or its column is the first or the last one (0 or 7)."
          - "In the inner loop, an `if` with that condition draws `wall`, and its `else` draws `floor`."
        require:
          - pattern: \b(?:for|while)\b
            min: 4
            message: "Draw the tiles with two loops, one inside the other: an outer loop over the rows, and in it an inner loop over the columns. (With the main loop and its event loop, the program then has four loops.)"
        tests:
          - window: {frames: 10}
          - window: {frames: 2}
            hidden: true
