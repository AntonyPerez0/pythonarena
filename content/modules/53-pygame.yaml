  - id: pygame-many-images
    slug: many-images
    title: Centering and many images
    text: |
      An image knows its own size: `robot.get_width()` and `robot.get_height()` give it in pixels. The window has the same methods. They're handy for placing images without typing their sizes into the program.

      ```asset robot.png
      ```

      ### Centering an image

      The center of a 400 x 300 window is (200, 150). To put the robot's center there, its top-left corner goes half of the robot's width to the left and half of its height up from the center. The same thing in one calculation: the space left over next to the image, divided in two.

      ```python window
      import pygame

      pygame.init()
      window = pygame.display.set_mode((400, 300))
      robot = pygame.image.load("robot.png")

      x = (window.get_width() - robot.get_width()) // 2
      y = (window.get_height() - robot.get_height()) // 2
      print(x, y)

      while True:
          for event in pygame.event.get():
              if event.type == pygame.QUIT:
                  exit()

          window.fill((0, 0, 0))
          window.blit(robot, (x, y))
          pygame.display.flip()
      ```

      ```window
      {frames: 30}
      ```

      ```output
      180 130
      ```

      The program calculates the position once, before the main loop, since it never changes. With `/` the position would be `180.0`. pygame accepts that too, but it drops the fraction, and with `//` you see the whole number it really uses. And if you change the window's size or the image, the robot stays in the center without any other change.

      ### Many images with a loop

      A loop draws many images with a few lines of code. This one draws a row of eight coins, one in the middle of each 40-pixel-wide column of the window:

      ```asset coin.png
      ```

      ```python window
      import pygame

      pygame.init()
      window = pygame.display.set_mode((320, 240))
      coin = pygame.image.load("coin.png")

      while True:
          for event in pygame.event.get():
              if event.type == pygame.QUIT:
                  exit()

          window.fill((0, 0, 0))
          for i in range(8):
              window.blit(coin, (8 + i * 40, 20))
          pygame.display.flip()
      ```

      ```window
      {frames: 30}
      ```

      The window as text has a line for each coin, from `blit coin.png at (8, 20)` to `blit coin.png at (288, 20)`, in the order they were drawn.

      Two loops, one inside the other, fill a grid. The window is 8 tiles of 40 pixels wide and 6 high, so these loops cover it with floor tiles, row by row from the top, each row from left to right:

      ```asset floor.png
      ```

      ```python window
      import pygame

      pygame.init()
      window = pygame.display.set_mode((320, 240))
      floor = pygame.image.load("floor.png")
      robot = pygame.image.load("robot.png")

      while True:
          for event in pygame.event.get():
              if event.type == pygame.QUIT:
                  exit()

          window.fill((0, 0, 0))
          for row in range(6):
              for column in range(8):
                  window.blit(floor, (column * 40, row * 40))
          window.blit(robot, (120, 80))
          pygame.display.flip()
      ```

      ```window
      {frames: 30}
      ```

      ### Random places

      To scatter coins in random places, choose the places once, before the main loop, and keep them in a list. If you chose them inside the main loop, the coins would jump to new places on every frame.

      ```python window
      import random
      import pygame

      pygame.init()
      window = pygame.display.set_mode((320, 240))
      coin = pygame.image.load("coin.png")

      places = []
      for i in range(12):
          x = random.randint(0, 320 - 24)
          y = random.randint(0, 240 - 24)
          places.append((x, y))

      while True:
          for event in pygame.event.get():
              if event.type == pygame.QUIT:
                  exit()

          window.fill((0, 0, 0))
          for place in places:
              window.blit(coin, place)
          pygame.display.flip()
      ```

      ```window
      {frames: 30}
      ```

      The site starts `random` the same way in every run of a window, so here the coins land in the same places each time you press Play. On your own computer they'd land somewhere new in every run. That's also why no challenge here asks for random places: the checks couldn't know where your coins went.

      **Your turn:** the window is 400 x 300. Fill in the blanks so the program draws the monster exactly in the center of the window, whatever the sizes of the window and the image. The monster happens to be square, so its width and height are the same number; the check also looks at which of them you used for x and which for y.
    assets: [monster.png]
    fill: |
      import pygame

      pygame.init()
      window = pygame.display.set_mode((400, 300))
      monster = pygame.image.load("monster.png")

      x = (window.get_width() - monster.[[get_width]]()) // 2
      y = (window.get_height() - monster.[[get_height]]()) // 2

      while True:
          for event in pygame.event.get():
              if event.type == pygame.QUIT:
                  exit()

          window.fill((0, 0, 0))
          window.blit(monster, (x, y))
          pygame.display.flip()
    hints:
      - The space left over next to the monster is the window's width minus the monster's width. Half of it goes on each side.
      - "The image has the same methods as the window: `monster.get_width()` and `monster.get_height()`. Widths go with x, heights with y."
    require:
      - pattern: get_width\(\)\s*-\s*monster\.get_width\(\)
        message: "x goes across the window, so it uses widths: the window's width minus the monster's width, `monster.get_width()`."
      - pattern: get_height\(\)\s*-\s*monster\.get_height\(\)
        message: "y goes down the window, so it uses heights: the window's height minus the monster's height, `monster.get_height()`."
    tests:
      - window: {frames: 10}
      - window: {frames: 4}
        hidden: true
