id: pygame
summary: Your first programs with graphics, written with the pygame library. A window and its main loop, events and closing the window, RGB colors, images and where they go in the window, drawing order, and many images drawn with loops.
steps:
  - id: pygame-first-window
    slug: first-window
    title: A window of your own
    text: |
      So far your programs have printed text and read what the user types. In this part you'll write programs with **graphics**: a window with pictures in it that move and react to the keyboard and the mouse. The tool for it is **pygame**, a library for writing games in Python. A **library** is a collection of modules that someone else has written for you to use. Unlike `math` and `random`, pygame doesn't come with Python: on your own computer you'd install it first with the command `pip install pygame-ce` (pygame-ce is the actively developed edition of pygame, and programs still say `import pygame`). On this site there's nothing to install. The site runs pygame for you and shows its window on the page.

      ### A first window

      Here is a complete pygame program. It opens a window and fills it with dark blue:

      ```python window
      import pygame

      pygame.init()
      window = pygame.display.set_mode((320, 240))

      while True:
          for event in pygame.event.get():
              if event.type == pygame.QUIT:
                  exit()

          window.fill((0, 0, 120))
          pygame.display.flip()
      ```

      ```window
      {frames: 30}
      ```

      Line by line:

      - `import pygame` takes the library into use, and `pygame.init()` starts its parts. Call it once, at the start of the program.
      - `pygame.display.set_mode((320, 240))` opens a window 320 pixels wide and 240 pixels high. A **pixel** is one dot of the picture. Note the two pairs of parentheses: the size is one tuple, `(320, 240)`. The function returns the window, and the variable `window` keeps it, so that the program can draw in it.
      - `while True:` starts the **main loop**. A game runs until the player closes it, so its loop never ends on its own.
      - `pygame.event.get()` returns a list of the **events** that have happened since the program last asked: key presses, mouse clicks, and a click on the window's close button. Closing the window is an event of the type `pygame.QUIT`, and `exit()` ends the program right there. Without these lines the close button would do nothing.
      - `window.fill((0, 0, 120))` paints the whole window with one color.
      - `pygame.display.flip()` shows what has been drawn. The drawing happens out of sight, and `flip` shows the finished picture all at once, so the player never sees a half-drawn one. Each picture shown is a **frame**.

      So every round of the main loop does three things: it handles the events, draws the picture and shows it. Here the picture is the same in every frame. In the next module it changes a little from one frame to the next, and that's animation.

      You may see pygame programs that draw their picture once, before the main loop, and then only wait for events. That works here too: the window keeps showing that picture until it's closed. But games redraw in every round, because their picture changes, and the programs in these lessons do the same from the start.

      ### Colors

      A color is a tuple of three numbers from 0 to 255: how much **red**, **green** and **blue** light it has. It's called an **RGB** color.

      | Color | RGB |
      |---|---|
      | black | `(0, 0, 0)` |
      | white | `(255, 255, 255)` |
      | red | `(255, 0, 0)` |
      | green | `(0, 255, 0)` |
      | blue | `(0, 0, 255)` |
      | yellow | `(255, 255, 0)` |
      | gray | `(128, 128, 128)` |

      The colors mix like light, not like paint: red and green light together make yellow. Smaller numbers make darker colors, so `(0, 0, 120)` is a dark blue.

      pygame also knows the names of many colors. `pygame.Color` turns a name into its RGB numbers:

      ```python run
      import pygame

      orange = pygame.Color("orange")
      print(orange)
      print(orange.r, orange.g, orange.b)
      ```

      ```output
      Color(255, 165, 0, 255)
      255 165 0
      ```

      The fourth number is the color's **alpha**, how solid it is: 255 means not see-through at all. `window.fill("orange")` works too, but with RGB numbers you can mix any color you like.

      ### The window on this site

      The window here has no screen of its own. The site runs your program for a number of frames and then closes the window: the program gets a `pygame.QUIT` event, and `exit()` ends it. Press Play under an example to watch its frames.

      The site also keeps **the window as text**: a line for each thing drawn in the window since it was last filled with one color. The window above, as text, is:

      ```text
      fill (0, 0, 120)
      ```

      The checks of a challenge compare the last frame of your window, as text, with the model solution's, and they compare how many frames it showed. That's what "Your window should end like this" on a task card is: the window your program should end with. Open "The window as text" under its picture to see exactly what your program should draw.

      **Your turn:** fill in the two blanks so the program fills the window with green, `(0, 160, 0)`, and shows it, frame after frame.
    fill: |
      import pygame

      pygame.init()
      window = pygame.display.set_mode((320, 240))

      while True:
          for event in pygame.event.get():
              if event.type == pygame.QUIT:
                  exit()

          window.[[fill]]((0, 160, 0))
          pygame.display.[[flip]]()
    hints:
      - The first blank is the method that paints the whole window with one color. The second shows the finished picture.
      - "The window's method is `fill`, and the function that shows a frame is `pygame.display.flip`."
    tests:
      - window: {frames: 10}
      - window: {frames: 25}
        hidden: true
    more:
      - task: |
          Write a whole pygame program yourself. It opens a window 400 pixels wide and 300 pixels high and fills it with orange, `(255, 140, 0)`, on every frame. Handle `pygame.QUIT` in the main loop, so that closing the window ends the program.

          The window as text doesn't include the window's size, so the check looks for the size in your code: the numbers 400 and 300, with the width first if you write them as one tuple.
        seed: |
          # A 400 x 300 window, orange, until it's closed.
          import pygame
        solution: |
          # A 400 x 300 window, orange, until it's closed.
          import pygame

          pygame.init()
          window = pygame.display.set_mode((400, 300))

          while True:
              for event in pygame.event.get():
                  if event.type == pygame.QUIT:
                      exit()

              window.fill((255, 140, 0))
              pygame.display.flip()
        hints:
          - "Start the program as the lesson does: `pygame.init()`, then `set_mode` with the size as one tuple, `(400, 300)`."
          - "The main loop is `while True:`. In it, a `for` loop goes through `pygame.event.get()` and calls `exit()` when an event's `type` is `pygame.QUIT`."
          - After the event loop, still inside `while True:`, fill the window with the color and call `pygame.display.flip()`.
        require:
          - pattern: \b400\b[\s\S]*\b300\b|\b300\b[\s\S]*\b400\b
            message: "Make the window 400 pixels wide and 300 high: `pygame.display.set_mode((400, 300))`."
          - pattern: pygame\.QUIT
            message: "Handle the `pygame.QUIT` event, so that closing the window ends the program."
        forbid:
          - pattern: '[(\[]\s*300\s*,\s*400\s*[)\]]'
            message: "The size is (width, height), so the width comes first: a window 400 wide and 300 high is `(400, 300)`."
        tests:
          - window: {frames: 20}
          - window: {frames: 7}
            hidden: true
      - task: |
          This program should fill a 320 x 240 window with white, but it stops with an error. Run it and read the message, fix that line, and then fix the next error the same way. Keep the window's size: the check finds it in your code, as in the challenge before.
        seed: |
          import pygame

          pygame.init()
          window = pygame.display.set_mode(320, 240)

          while True:
              for event in pygame.event.get():
                  if event.type == pygame.QUIT:
                      exit()

              window.fill(255, 255, 255)
              pygame.display.flip()
        solution: |
          import pygame

          pygame.init()
          window = pygame.display.set_mode((320, 240))

          while True:
              for event in pygame.event.get():
                  if event.type == pygame.QUIT:
                      exit()

              window.fill((255, 255, 255))
              pygame.display.flip()
        hints:
          - "The first message is `TypeError: size must be two numbers`. `set_mode` takes the size as one value, a tuple, but here it gets two separate numbers."
          - "Put the size in its own parentheses: `set_mode((320, 240))`."
          - "`fill` has the same problem. Given three numbers, it reads the second one as a rectangle to fill (`invalid rectstyle object`). The color is one tuple too."
        require:
          - pattern: \b320\b[\s\S]*\b240\b|\b240\b[\s\S]*\b320\b
            message: "Keep the window 320 pixels wide and 240 high: `pygame.display.set_mode((320, 240))`. Without a size, pygame opens a window of its own default size."
        forbid:
          - pattern: '[(\[]\s*240\s*,\s*320\s*[)\]]'
            message: "The size is (width, height), so the width comes first: a window 320 wide and 240 high is `(320, 240)`."
        tests:
          - window: {frames: 12}
          - window: {frames: 5}
            hidden: true

  - id: pygame-images
    slug: images
    title: Images and coordinates
    text: |
      Most of what a game shows is images. This is `robot.png`, one of the images on this site:

      ```asset robot.png
      ```

      `pygame.image.load("robot.png")` reads an image file and returns it as a **surface**, the same kind of object as the window: a rectangle of pixels. pygame looks for the file next to your program, so on your own computer you keep the two together. On this site, the images that an example or a challenge uses are there already. Load each image once, before the main loop: reading a file takes time, and the image stays the same.

      To draw an image, you give the window's `blit` method the image and a point: `window.blit(robot, (60, 90))` puts the robot so that its top-left corner is at (60, 90). (**Blit** is old graphics slang for copying a block of pixels onto another.)

      ```python window
      import pygame

      pygame.init()
      window = pygame.display.set_mode((320, 240))
      robot = pygame.image.load("robot.png")

      while True:
          for event in pygame.event.get():
              if event.type == pygame.QUIT:
                  exit()

          window.fill((0, 0, 0))
          window.blit(robot, (60, 90))
          pygame.display.flip()
      ```

      ```window
      {frames: 30}
      ```

      As text, this window is:

      ```text
      fill (0, 0, 0)
      blit robot.png at (60, 90)
      ```

      ### Coordinates

      A point in the window is a pair (x, y) of pixel counts, measured from the window's **top-left corner**, which is (0, 0). x says how far right of the left edge the point is, and y how far below the top edge: (60, 90) is 60 pixels in from the left and 90 pixels down. On a graph in math class, y grows upward, but in a window it grows **downward**: a bigger y is lower in the window. Most graphics libraries count this way, so you'll meet it again.

      The robot is 40 by 40 pixels, so at (60, 90) it covers x from 60 to 99 and y from 90 to 129. To put it in the window's bottom-right corner, its top-left corner goes to (320 - 40, 240 - 40), which is (280, 200). At (320, 240) it would be just outside the window, and you wouldn't see it at all.

      An image you've loaded can be drawn as many times as you like. Here is the robot between two coins, which are 24 by 24 pixels:

      ```asset coin.png
      ```

      ```python window
      import pygame

      pygame.init()
      window = pygame.display.set_mode((320, 240))
      robot = pygame.image.load("robot.png")
      coin = pygame.image.load("coin.png")

      while True:
          for event in pygame.event.get():
              if event.type == pygame.QUIT:
                  exit()

          window.fill((0, 0, 0))
          window.blit(robot, (140, 100))
          window.blit(coin, (80, 108))
          window.blit(coin, (216, 108))
          pygame.display.flip()
      ```

      ```window
      {frames: 30}
      ```

      ### Drawing order

      Drawing in the window works like painting: what you draw later covers what's already there. That's why `fill` comes first in each frame. It paints over the previous frame, and then the images go on top. Here the fill comes last by mistake, and it paints over the robot:

      ```python window
      import pygame

      pygame.init()
      window = pygame.display.set_mode((320, 240))
      robot = pygame.image.load("robot.png")

      while True:
          for event in pygame.event.get():
              if event.type == pygame.QUIT:
                  exit()

          window.blit(robot, (60, 90))
          window.fill((0, 0, 0))
          pygame.display.flip()
      ```

      ```window
      {frames: 30}
      ```

      The window is all black, and its text is only `fill (0, 0, 0)`: like the picture, the text starts over at each fill that covers the whole window. When images overlap, the one drawn last is in front. The order is part of the window as text, so the checks compare it too, and when a task has several things to draw, it says in which order.

      **Your turn:** fill in the blanks so the program loads the image `monster.png` and draws it with its top-left corner at (200, 30).
    assets: [monster.png]
    fill: |
      import pygame

      pygame.init()
      window = pygame.display.set_mode((320, 240))
      monster = pygame.image.[[load]]("monster.png")

      while True:
          for event in pygame.event.get():
              if event.type == pygame.QUIT:
                  exit()

          window.fill((0, 0, 0))
          window.[[blit]](monster, (200, 30))
          pygame.display.flip()
    hints:
      - The first blank reads the image file. The second draws the image in the window.
      - "`pygame.image.load` reads the file, and the window's method `blit` draws it."
    tests:
      - window: {frames: 10}
      - window: {frames: 3}
        hidden: true
