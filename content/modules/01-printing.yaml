id: printing
summary: Your first Python programs. Printing text and numbers with print, several commands in order, calculating inside print, quotes and comments, and reading what Python says when it can't understand your code.
steps:
  - id: printing-first-program
    slug: first-program
    title: Your first Python program
    text: |
      A **program** is a list of instructions that a computer carries out one after another. You write the instructions as text, called **source code**, and a program called the **Python interpreter** reads that text and does what it says. When you press **Check** or **Run** on this site, the real Python interpreter (CPython, the same Python you would install on a computer) runs your code right here in your browser.

      ### The print command

      The first command to learn is `print`. It shows a line of text on the screen:

      ```python run
      print("Hello, Python!")
      ```

      ```output
      Hello, Python!
      ```

      - `print` is the name of the command. Python calls commands like this **functions**; later modules show how to write your own.
      - The parentheses `( )` hold what the command works on.
      - The text between the double quotes `"` is what gets printed. Text in quotes is called a **string**. The quotes themselves are not printed: they only show Python where the text starts and ends.

      A Python program needs no other frame around it: the line above is a complete program. Python simply runs the lines of the file from top to bottom.

      ### Small letters matter

      Python reads `print` and `Print` as two different names. Commands like `print` are written in small letters, exactly as shown. If one letter is off, Python stops and tells you which name it doesn't know. Step 5 of this module shows how to read those messages.

      **Your turn:** fill in the blank so the program prints `Grace Hopper`, the name of a computing pioneer.
    fill: |
      [[print]]("Grace Hopper")
    hints:
      - The command that shows a line of text is `print`.
      - "Type only the command's name into the blank: `print`, in small letters. The parentheses and the quotes are already there."
    tests:
      - expect: Grace Hopper
    more:
      - task: |
          The text to print is missing its quotes. Fill in the two blanks with the character that starts and ends a string, so the program prints `Python runs on quotes`.
        fill: |
          print([["]]Python runs on quotes[["]])
        hints:
          - A string starts and ends with a double quote `"`.
          - Type one `"` into each blank.
        tests:
          - expect: Python runs on quotes
      - task: |
          This time the editor is empty. Write the whole program yourself: one line that prints `Ready, set, code!`
        seed: |
          # Write your program below this line.
        solution: |
          # Write your program below this line.
          print("Ready, set, code!")
        hints:
          - "Start with the command's name: `print`."
          - "The text goes inside the parentheses, between double quotes: `print(\"...\")`."
          - Copy the text exactly, with its capital R, the commas and the exclamation mark.
        tests:
          - expect: Ready, set, code!

  - id: printing-several-lines
    slug: several-lines
    title: Several lines, in order
    text: |
      A program usually has many commands, each on its own line. Python runs them from top to bottom, one after another, and each `print` prints one line:

      ```python run
      print("3")
      print("2")
      print("1")
      print("Liftoff!")
      ```

      ```output
      3
      2
      1
      Liftoff!
      ```

      Swap two of the lines and the countdown is in the wrong order: the computer does exactly what the commands say, in the order they are written.

      ### The output has to match exactly

      The checks on this site compare what your program prints with the expected output, character by character. `Liftoff!` and `liftoff!` are different, and so are `Hello, world` and `Hello,world`. The only things ignored are spaces at the very end of a line and empty lines at the very end of the output. Real programs are held to the same standard: another program reading your output won't guess what you meant.

      ### An empty line

      `print()` with nothing inside the parentheses prints an empty line, which is handy for leaving space between parts of the output:

      ```python run
      print("Part one")
      print()
      print("Part two")
      ```

      ```output
      Part one

      Part two
      ```

      **Your turn:** the program prints the first line of a short rhyme. Add the two missing lines so it prints exactly:

      ```
      Line by line the program goes,
      top to bottom, as it flows,
      print shows all that Python knows.
      ```
    seed: |
      print("Line by line the program goes,")
    solution: |
      print("Line by line the program goes,")
      print("top to bottom, as it flows,")
      print("print shows all that Python knows.")
    hints:
      - Each line of the rhyme needs its own `print("...")` command, below the first one.
      - Copy the text exactly, including the commas, the full stop and the small first letters.
    require:
      - pattern: \bprint\s*\(
        min: 3
        max: 3
        message: Print each line of the rhyme with its own `print`, three in all.
    tests:
      - expect: |
          Line by line the program goes,
          top to bottom, as it flows,
          print shows all that Python knows.
    more:
      - task: |
          The morning routine got shuffled. Put the four commands in the right order so the program prints:

          ```
          Wake up
          Brush teeth
          Eat breakfast
          Start coding
          ```
        seed: |
          print("Eat breakfast")
          print("Wake up")
          print("Start coding")
          print("Brush teeth")
        solution: |
          print("Wake up")
          print("Brush teeth")
          print("Eat breakfast")
          print("Start coding")
        hints:
          - The commands run from top to bottom, so the line that should be printed first goes at the top.
          - "Move whole lines. On a phone: select a line, cut it, tap where it should go and paste."
        require:
          - pattern: \bprint\s*\(
            min: 4
            max: 4
            message: Keep the four `print` commands and only change their order.
        tests:
          - expect: |
              Wake up
              Brush teeth
              Eat breakfast
              Start coding
      - task: |
          Print this ticket exactly, spaces and the empty line included:

          ```
          ==================
            PYTHON ARENA

            Admit one
          ==================
          ```
        seed: |
          print("==================")
        solution: |
          print("==================")
          print("  PYTHON ARENA")
          print()
          print("  Admit one")
          print("==================")
        hints:
          - The spaces at the start of a line are part of the text, so they go inside the quotes.
          - "The empty line is `print()`, with nothing between the parentheses."
          - The ticket has five lines, so the program has five `print` commands.
        tests:
          - expect: |
              ==================
                PYTHON ARENA

                Admit one
              ==================

  - id: printing-calculating
    slug: calculating
    title: Calculating with print
    text: |
      `print` can show the result of a calculation as well as text. Write the calculation without quotes:

      ```python run
      print(4 + 9)
      print(6 * 7)
      print(1 + 3 * 5)
      ```

      ```output
      13
      42
      16
      ```

      Python uses `+` to add, `-` to subtract, `*` to multiply and `/` to divide. As in mathematics, multiplication and division come before addition and subtraction, so `1 + 3 * 5` is 16, not 20. Parentheses change the order: `(1 + 3) * 5` is 20.

      ### Quotes or no quotes

      Quotes make all the difference. Without quotes, Python calculates. With quotes, the calculation is just text, printed exactly as it is written:

      ```python run
      print(1 + 3 * 5)
      print("1 + 3 * 5")
      ```

      ```output
      16
      1 + 3 * 5
      ```

      Letting Python do the arithmetic is safer than doing it in your head and typing the answer: `print(52 * 7)` is easy to read and easy to check, and Python never makes a slip.

      **Your turn:** fill in the blank with a calculation, so the program prints the number of seconds in an hour (60 seconds in a minute, 60 minutes in an hour).
    fill: |
      print("Seconds in an hour:")
      print([[60 * 60]])
    hints:
      - An hour has 60 minutes and each minute has 60 seconds, so multiply 60 by 60.
      - "Multiplication is `*`: type `60 * 60` into the blank, without quotes."
    tests:
      - expect: |
          Seconds in an hour:
          3600
    forbid:
      - pattern: \b3600\b
        message: "Let Python do the arithmetic: write the calculation `60 * 60` instead of its result."
    more:
      - task: |
          Write a program that prints the number of minutes in a week. Let Python calculate it from the number of days in a week, hours in a day and minutes in an hour. The program should print:

          ```
          Minutes in a week:
          10080
          ```
        seed: |
          print("Minutes in a week:")
        solution: |
          print("Minutes in a week:")
          print(7 * 24 * 60)
        hints:
          - A week has 7 days, a day has 24 hours and an hour has 60 minutes.
          - "Multiply all three in one calculation: `print(7 * 24 * 60)`."
        forbid:
          - pattern: \b10080\b
            message: Let Python do the arithmetic instead of typing the result 10080.
        require:
          - pattern: \*
            message: Calculate the result with `*` (multiplication).
        tests:
          - expect: |
              Minutes in a week:
              10080
      - task: |
          What does this program print? Type each line it prints.
        predict: |
          print("4 + 4")
          print(4 + 4)
          print((1 + 2) * 3)
        hints:
          - The first line has quotes, so it's text and printed exactly as it is.
          - The second line has no quotes, so Python calculates 4 + 4.
          - The parentheses in the last line are calculated first, so it's 3 * 3.

  - id: printing-quotes-and-comments
    slug: quotes-and-comments
    title: Quotes and comments
    text: |
      Python accepts strings in single quotes `'` as well as double quotes `"`. Both mean the same, as long as the string starts and ends with the same kind. That comes in handy when the text itself has quotes in it:

      ```python run
      print('She said "hi" and left.')
      print("It's a good day.")
      ```

      ```output
      She said "hi" and left.
      It's a good day.
      ```

      The first string is in single quotes, so the double quotes inside it are just characters. The second is in double quotes, so the apostrophe in `It's` doesn't end it.

      ### Comments

      A line that starts with `#` is a **comment**. Python skips it completely: comments are notes for the people who read the code. A comment can also come after the code on a line; everything from the `#` to the end of that line is skipped:

      ```python run
      # How many eggs the bakery needs this week
      print("Eggs needed:")
      print(12 * 6)  # 12 cakes with 6 eggs each
      ```

      ```output
      Eggs needed:
      72
      ```

      Programmers also use `#` to switch a line off for a moment without deleting it. This is called **commenting out** a line.

      **Your turn:** the program should print the line below, double quotes included. Change the program so it works.

      ```
      The sign said "Keep out" in red letters.
      ```
    seed: |
      print("The sign said "Keep out" in red letters.")
    solution: |
      print('The sign said "Keep out" in red letters.')
    hints:
      - As it is, the `"` before `Keep` ends the string, and Python can't read the rest of the line.
      - Put the whole text in single quotes `'` instead, so the double quotes inside it are just characters.
    tests:
      - expect: |
          The sign said "Keep out" in red letters.
    more:
      - task: |
          Write a program that prints this tip for new programmers, exactly as it is:

          ```
          To greet, type print("Hi") and press Run.
          ```
        seed: |
          # Print the tip shown in the task.
        solution: |
          # Print the tip shown in the task.
          print('To greet, type print("Hi") and press Run.')
        hints:
          - The text to print contains double quotes, so put the whole text in single quotes.
          - "The program is one `print` whose string starts and ends with `'`: `print('To greet, ...')`. Only the outer `print` runs; the `print(\"Hi\")` inside the quotes is just text."
        tests:
          - expect: To greet, type print("Hi") and press Run.
      - task: |
          The program prints a test message that shouldn't be there any more. **Comment out** that line (don't delete it), so the program prints only:

          ```
          Welcome!
          Have a nice day.
          ```
        seed: |
          print("Welcome!")
          print("TEST: does this line show up?")
          print("Have a nice day.")
        solution: |
          print("Welcome!")
          # print("TEST: does this line show up?")
          print("Have a nice day.")
        hints:
          - A line that starts with `#` is skipped by Python.
          - "Put a `#` at the very start of the test line: `# print(\"TEST: ...\")`."
        require:
          - pattern: '#\s*print\(\s*"TEST'
            raw: true
            message: Keep the test line in the program, but commented out with `#` in front of it.
        tests:
          - expect: |
              Welcome!
              Have a nice day.

  - id: printing-errors
    slug: errors
    title: When Python can't read your code
    text: |
      Sooner or later every program has a mistake in it. When Python can't understand a line, it stops and prints an **error message** instead of running the program. Learning to read these messages saves a lot of guessing.

      ### A syntax error

      **Syntax** is the set of rules for how code must be written, like grammar for a language. Here the text is missing its quotes:

      ```python run crash
      print(Good morning)
      ```

      ```crash
        File "main.py", line 1
          print(Good morning)
                ^^^^^^^^^^^^
      SyntaxError: invalid syntax. Perhaps you forgot a comma?
      ```

      Read the message from the top:

      - `File "main.py", line 1` says where the problem is: line 1 of your program (on this site, your program's file is called `main.py`).
      - The next line shows that line of code, and the `^` marks point at the part Python couldn't read.
      - The last line names the kind of error, `SyntaxError`, with Python's guess at the cause. Its guess here (a missing comma) is wrong, which happens: the real problem is the missing quotes. The line number and the marks are usually more reliable than the guess.

      With a syntax error, Python runs nothing at all, not even the lines before the mistake.

      ### A name Python doesn't know

      Here every quote is in place, but the command is misspelled:

      ```python run crash
      print("Starting...")
      Print("Hello")
      ```

      ```output
      Starting...
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 2, in <module>
          Print("Hello")
          ^^^^^
      NameError: name 'Print' is not defined. Did you mean: 'print'?
      ```

      This time the first line ran and printed `Starting...`, and the program stopped at line 2. A `NameError` means Python doesn't know the name: `Print` with a capital P isn't `print`. The "Did you mean" part is often exactly right. On this site, a plain-English note under such a message explains it too.

      **Your turn:** the program has two mistakes, and Python stops at the first one. Fix both, so it prints:

      ```
      Errors are normal.
      Reading them is a skill.
      ```
    seed: |
      print("Errors are normal.)
      Print("Reading them is a skill.")
    solution: |
      print("Errors are normal.")
      print("Reading them is a skill.")
    hints:
      - Press Check and read the first error message. Which line does it name, and what is missing there?
      - The first string has no closing quote before its `)`.
      - Once that's fixed, the next message names `Print`. Python's commands are written in small letters.
    tests:
      - expect: |
          Errors are normal.
          Reading them is a skill.
    more:
      - task: |
          Fix the program so it prints:

          ```
          Three lines,
          one for each print,
          all in order.
          ```
        seed: |
          print("Three lines,")
          print("one for each print,"
          print("all in order.")
        solution: |
          print("Three lines,")
          print("one for each print,")
          print("all in order.")
        hints:
          - "Check it and read the message: Python names the line and says which parenthesis was never closed."
          - Every opening parenthesis `(` needs a closing one `)`. Count them on line 2.
        tests:
          - expect: |
              Three lines,
              one for each print,
              all in order.
      - task: |
          What does this program print? Type each line it prints.
        predict: |
          # print("one")
          print("two")
          print("3 + 4")  # print(3 + 4)
          print(3 + 4)
        hints:
          - A line that starts with `#` is a comment, so Python skips it.
          - "On the third line, everything after the `#` is a comment: only `print(\"3 + 4\")` runs, and it prints text."
          - The last line has no quotes, so it's calculated.
