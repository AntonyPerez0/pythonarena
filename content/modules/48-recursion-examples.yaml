id: recursion-examples
summary: Where recursion really shines. Binary trees built from a small Node class, recursive algorithms that count, add up and measure them, a sorted binary tree you can search and add to, and data nested to any depth.
steps:
  - id: recursion-examples-binary-trees
    slug: binary-trees
    title: Binary trees
    text: |
      A list is a row: after each item comes one next item, and a loop walks along the row from the start to the end. Plenty of data isn't a row. A family tree, the folders on a computer and a tournament bracket all branch: one thing leads to two or more, and each of those leads on to more again. The simplest data that branches is a **binary tree**:

      ```text
              8
             / \
            3   10
           / \    \
          1   6    14
      ```

      Each value in it sits in a **node**. A node has a value and at most two **children**, a left one and a right one. The **root** is the node at the top, the one that all the others hang from, and the nodes without children are **leaves**: here 1, 6 and 14.

      A tree needs only one class, for a node that knows its value and its two children. A missing child is `None`:

      ```python fragment
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right
      ```

      Since the children are parameters with default values, the whole tree above can be built by nesting the calls of the constructor:

      ```python fragment
      tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
      ```

      ### A tree made of trees

      Look at the left child of the root in that line: `Node(3, Node(1), Node(6))`. It's built in just the same way as the whole tree, only smaller. Any node, together with everything below it, is a tree in its own right, a **subtree**. So a question about a tree can be answered by asking the same question about its two subtrees and adding what the node at the top brings. That's a recursive function, and the empty tree, `None`, makes a handy base case.

      Counting the nodes shows how. An empty tree has 0 nodes. Any other tree has its root, which is 1 node, plus the nodes of its left subtree, plus the nodes of its right subtree:

      ```python run
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def count_nodes(node):
          if node is None:
              return 0
          return 1 + count_nodes(node.left) + count_nodes(node.right)


      tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
      print(count_nodes(tree))
      print(count_nodes(tree.left))
      ```

      ```output
      6
      3
      ```

      `count_nodes(tree.left)` counts only the subtree of 3, 1 and 6. The calls stop at the leaves: a leaf's `left` and `right` are both `None`, and a call that gets `None` returns 0 straight away.

      Without the check for `None`, the calls run into the missing children of the leaves:

      ```python run crash
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def count_nodes(node):
          return 1 + count_nodes(node.left) + count_nodes(node.right)


      print(count_nodes(Node(5)))
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 12, in <module>
          print(count_nodes(Node(5)))
                ~~~~~~~~~~~^^^^^^^^^
        File "main.py", line 9, in count_nodes
          return 1 + count_nodes(node.left) + count_nodes(node.right)
                     ~~~~~~~~~~~^^^^^^^^^^^
        File "main.py", line 9, in count_nodes
          return 1 + count_nodes(node.left) + count_nodes(node.right)
                                 ^^^^^^^^^
      AttributeError: 'NoneType' object has no attribute 'left'
      ```

      The leaf's `left` is `None`, and `None` has no attributes. Whenever you see `'NoneType' object has no attribute`, look for a missing check for `None`.

      ### Printing every value

      A function that prints the values has the same shape. It has nothing to return, so for an empty tree it simply returns, and for any other tree it prints the node's value and then hands each subtree to a call of its own:

      ```python run
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def print_values(node):
          if node is None:
              return
          print(node.value)
          print_values(node.left)
          print_values(node.right)


      tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
      print_values(tree)
      ```

      ```output
      8
      3
      1
      6
      10
      14
      ```

      Follow the calls. The call for the root prints 8 and then calls the function for the subtree of 3. That call prints 3 and calls the function for 1, which prints 1 and finds `None` on both sides. Next the call for 3 deals with 6. Only when the subtree of 3 is done does the call for the root get to its last line and move on to 10. Where the `print` stands decides the order: here it comes before the two calls, so every node is printed before the nodes below it.

      **Your turn:** the function prints a tree as an outline, each value indented by two spaces per level. Fill in the blank so the left subtree is printed one level deeper. The program should print:

      ```
      8
        3
          1
          6
        10
          14
      ```
    fill: |
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def show(node, depth):
          if node is None:
              return
          print("  " * depth + str(node.value))
          show(node.left, [[depth + 1]])
          show(node.right, depth + 1)


      tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
      show(tree, 0)
    hints:
      - The children are one level deeper than the node itself.
      - "The left subtree gets the same depth as the right one: `depth + 1`."
    tests:
      - expect: |
          8
            3
              1
              6
            10
              14
    more:
      - task: |
          What does this program print? Type each line it prints.
        predict: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def visit(node):
              if node is not None:
                  visit(node.left)
                  visit(node.right)
                  print(node.value)


          visit(Node(1, Node(2), Node(3, Node(4))))
        hints:
          - "Draw the tree first: 1 is the root, 2 its left child and 3 its right child, and 4 is the left child of 3."
          - This time a node prints its value only after both of its subtrees have been visited.
          - "So 2 prints first. In the right subtree, 4 prints before 3, and the root comes last."
      - task: |
          A leaf is a node without children. Write a recursive function `count_leaves(node)` that returns the number of leaves in a tree. An empty tree, `None`, has no leaves.

          For example, this program:

          ```python fragment
          tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
          print(count_leaves(tree))
          ```

          prints:

          ```
          3
          ```
        seed: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def count_leaves(node):
              pass


          if __name__ == "__main__":
              tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
              print(count_leaves(tree))
        solution: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def count_leaves(node):
              if node is None:
                  return 0
              if node.left is None and node.right is None:
                  return 1
              return count_leaves(node.left) + count_leaves(node.right)


          if __name__ == "__main__":
              tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
              print(count_leaves(tree))
        hints:
          - "There are two base cases: an empty tree has 0 leaves, and a node whose children are both `None` is a leaf, 1."
          - "Any other node isn't a leaf itself, so its leaves are the leaves of its left subtree plus those of its right subtree."
          - "`return count_leaves(node.left) + count_leaves(node.right)`"
        require:
          - pattern: def count_leaves\b[^\n]*\n(?:[ \t]*\n|[ \t]+[^\n]*\n)*?[ \t]+[^\n]*\bcount_leaves\s*\(
            message: Make `count_leaves` call itself inside its own body.
        tests:
          - call: |
              tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
              print(count_leaves(tree))
          - call: count_leaves(Node(5))
            hidden: true
          - call: count_leaves(None)
            hidden: true
          - call: count_leaves(Node(1, Node(2, Node(3))))
            hidden: true
          - call: count_leaves(Node(1, Node(2, Node(4), Node(5)), Node(3, Node(6), Node(7))))
            hidden: true

  - id: recursion-examples-sum-max-depth
    slug: sum-max-depth
    title: Sums, the smallest value and depth
    text: |
      Most algorithms on trees have the same shape as `count_nodes`: an answer for the empty tree, and for any other tree, this node's value combined with the answers for its two subtrees. Here is a tree with a negative number in it:

      ```text
               7
             /   \
            2     9
           /     / \
         -4     5   12
                 \
                  6
      ```

      The **sum** of its values is this node's value plus the sums of the two subtrees. An empty tree adds nothing. The **depth** of a tree, also called its height, is the number of nodes on the longest path from the root down to a leaf. An empty tree has depth 0, and any other tree is one level deeper than the deeper of its two subtrees:

      ```python run
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def tree_sum(node):
          if node is None:
              return 0
          return node.value + tree_sum(node.left) + tree_sum(node.right)


      def depth(node):
          if node is None:
              return 0
          return 1 + max(depth(node.left), depth(node.right))


      tree = Node(7, Node(2, Node(-4)), Node(9, Node(5, None, Node(6)), Node(12)))
      print(tree_sum(tree))
      print(depth(tree))
      print(depth(tree.left))
      ```

      ```output
      37
      4
      2
      ```

      The longest path is 7, 9, 5, 6: four nodes. The left subtree, 2 with its child -4, has depth 2.

      ### When the empty tree has no good answer

      What's the smallest value of an empty tree? There's no good answer. If the base case returned 0, a tree with only positive numbers would get 0 as its smallest value, which is wrong. For questions like this, assume the tree isn't empty, start from the node's own value, and compare it with the answer for each subtree that exists:

      ```python run
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def smallest(node):
          result = node.value
          if node.left is not None:
              result = min(result, smallest(node.left))
          if node.right is not None:
              result = min(result, smallest(node.right))
          return result


      tree = Node(7, Node(2, Node(-4)), Node(9, Node(5, None, Node(6)), Node(12)))
      print(smallest(tree))
      print(smallest(tree.right))
      ```

      ```output
      -4
      5
      ```

      Here the base case is a leaf: neither `if` is true, so the leaf returns its own value without calling the function again.

      ### The recipe

      To write a recursive function for a tree, answer two questions. What is the answer for the smallest tree, an empty one or a leaf? And if you already had the answers for the two subtrees, how would you get the answer for the whole tree? The recursive calls give you those answers, so you only need to combine them.

      **Your turn:** the function counts the values in a tree that are greater than `limit`. Fill in the blank so it adds the count for the left subtree. The program should print:

      ```
      3
      6
      ```
    fill: |
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def count_greater(node, limit):
          if node is None:
              return 0
          here = 1 if node.value > limit else 0
          return here + [[count_greater(node.left, limit)]] + count_greater(node.right, limit)


      tree = Node(7, Node(2, Node(-4)), Node(9, Node(5, None, Node(6)), Node(12)))
      print(count_greater(tree, 6))
      print(count_greater(tree, 0))
    hints:
      - The left subtree is counted the same way as the right one.
      - "Copy the call for the right subtree and change `right` to `left`: `count_greater(node.left, limit)`."
    tests:
      - expect: |
          3
          6
    more:
      - task: |
          The values in a tree can be words as well as numbers. Write a recursive function `longest_word(node)` that returns the longest word in a tree of words. The tree is never empty, and in the tests no other word is as long as the longest one.

          For example, this program:

          ```python fragment
          tree = Node("oak", Node("birch", Node("fir")), Node("maple", Node("chestnut"), Node("elm")))
          print(longest_word(tree))
          ```

          prints:

          ```
          chestnut
          ```
        seed: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def longest_word(node):
              pass


          if __name__ == "__main__":
              tree = Node("oak", Node("birch", Node("fir")), Node("maple", Node("chestnut"), Node("elm")))
              print(longest_word(tree))
        solution: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def longest_word(node):
              result = node.value
              if node.left is not None:
                  word = longest_word(node.left)
                  if len(word) > len(result):
                      result = word
              if node.right is not None:
                  word = longest_word(node.right)
                  if len(word) > len(result):
                      result = word
              return result


          if __name__ == "__main__":
              tree = Node("oak", Node("birch", Node("fir")), Node("maple", Node("chestnut"), Node("elm")))
              print(longest_word(tree))
        hints:
          - "An empty tree has no longest word, so the base case is a leaf. Start from the node's own word, `result = node.value`."
          - "For each child that isn't `None`, `longest_word(node.left)` (or `node.right`) gives the longest word of that subtree."
          - "Compare the lengths, not the words: `max` of two strings gives the one that comes later in alphabetical order. If `len(word) > len(result)`, the subtree's word is the new `result`."
        require:
          - pattern: def longest_word\b[^\n]*\n(?:[ \t]*\n|[ \t]+[^\n]*\n)*?[ \t]+[^\n]*\blongest_word\s*\(
            message: Make `longest_word` call itself inside its own body.
        tests:
          - call: |
              tree = Node("oak", Node("birch", Node("fir")), Node("maple", Node("chestnut"), Node("elm")))
              print(longest_word(tree))
          - call: longest_word(Node("sun"))
            hidden: true
          - call: longest_word(Node("zoo", Node("apple"), Node("banana")))
            hidden: true
          - call: longest_word(Node("elephant", Node("cat", Node("ant")), Node("dog")))
            hidden: true
          - call: longest_word(Node("a", Node("bb", None, Node("cccc", Node("ddddddd"))), Node("eee")))
            hidden: true
      - task: |
          Write a recursive function `contains(node, value)` that returns `True` if the value is in the tree and `False` if it isn't. The values can be anywhere in the tree, in no particular order. An empty tree, `None`, contains nothing.

          For example, this program:

          ```python fragment
          tree = Node(7, Node(2, Node(-4)), Node(9, Node(5, None, Node(6)), Node(12)))
          print(contains(tree, 6))
          print(contains(tree, 8))
          ```

          prints:

          ```
          True
          False
          ```
        seed: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def contains(node, value):
              pass


          if __name__ == "__main__":
              tree = Node(7, Node(2, Node(-4)), Node(9, Node(5, None, Node(6)), Node(12)))
              print(contains(tree, 6))
              print(contains(tree, 8))
        solution: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def contains(node, value):
              if node is None:
                  return False
              if node.value == value:
                  return True
              return contains(node.left, value) or contains(node.right, value)


          if __name__ == "__main__":
              tree = Node(7, Node(2, Node(-4)), Node(9, Node(5, None, Node(6)), Node(12)))
              print(contains(tree, 6))
              print(contains(tree, 8))
        hints:
          - "An empty tree doesn't contain the value: return `False`. And if this node's value is the one you want, return `True`."
          - Otherwise the value is in the tree if it's in the left subtree or in the right subtree.
          - "`return contains(node.left, value) or contains(node.right, value)`"
        require:
          - pattern: def contains\b[^\n]*\n(?:[ \t]*\n|[ \t]+[^\n]*\n)*?[ \t]+[^\n]*\bcontains\s*\(
            message: Make `contains` call itself inside its own body.
        tests:
          - call: |
              tree = Node(7, Node(2, Node(-4)), Node(9, Node(5, None, Node(6)), Node(12)))
              print(contains(tree, 6))
              print(contains(tree, 8))
          - call: |
              tree = Node(7, Node(2, Node(-4)), Node(9, Node(5, None, Node(6)), Node(12)))
              print(contains(tree, -4), contains(tree, 7), contains(tree, 12), contains(tree, 0))
            hidden: true
          - call: contains(None, 1)
            hidden: true
          - call: contains(Node(3, Node(1)), 1)
            hidden: true

  - id: recursion-examples-sorted-tree
    slug: sorted-tree
    title: A sorted binary tree
    text: |
      In the trees so far, a value could be anywhere, so a search had to visit every node. A **sorted binary tree** (also called a binary search tree) keeps its values in order. Everything in a node's left subtree is smaller than the node's value, and everything in its right subtree is greater:

      ```text
               50
             /    \
           30      70
          /  \    /  \
        20   40  60   80
      ```

      ### Searching

      The order makes searching fast, in the same way as binary search. Compare the value you're looking for with the node's value. If it's smaller, it can only be in the left subtree, and if it's greater, only in the right one. So the search goes down one path and never needs the other side:

      ```python run
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def find(node, value):
          if node is None:
              return False
          if value == node.value:
              return True
          if value < node.value:
              return find(node.left, value)
          return find(node.right, value)


      tree = Node(50, Node(30, Node(20), Node(40)), Node(70, Node(60), Node(80)))
      print(find(tree, 60))
      print(find(tree, 65))
      ```

      ```output
      True
      False
      ```

      The search for 65 goes from 50 to the right, from 70 to the left, and from 60 to the right, where there's nothing: `None` gives `False`. It looked at three nodes out of seven. In a tree with a million values whose branches are about equally deep, it would look at about twenty.

      ### Adding values

      To add a value, go down the same path as a search. When the way on is `None`, that's the place for the new node:

      ```python run
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def add(node, value):
          if value < node.value:
              if node.left is None:
                  node.left = Node(value)
              else:
                  add(node.left, value)
          elif value > node.value:
              if node.right is None:
                  node.right = Node(value)
              else:
                  add(node.right, value)


      def print_in_order(node):
          if node is not None:
              print_in_order(node.left)
              print(node.value)
              print_in_order(node.right)


      tree = Node(42)
      for value in [17, 99, 8, 23, 61, 23]:
          add(tree, value)
      print_in_order(tree)
      ```

      ```output
      8
      17
      23
      42
      61
      99
      ```

      A value that's already in the tree is neither smaller nor greater than the node that holds it, so neither branch adds it again: the second 23 is left out.

      `print_in_order` visits the left subtree first, then the node, and then the right subtree. In a sorted tree, everything on the left is smaller and everything on the right is greater, so the values come out in increasing order.

      The shape of the tree depends on the order the values are added in. Adding values that are already sorted, such as 1, 2, 3, 4, makes every new node a right child, and the "tree" becomes one long line. Searching it is then no faster than going through a list.

      **Your turn:** fill in the blanks so the search goes into the correct subtree. The program should print:

      ```
      True
      False
      True
      ```
    fill: |
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def find(node, value):
          if node is None:
              return False
          if value == node.value:
              return True
          if value < node.value:
              return find([[node.left]], value)
          return find([[node.right]], value)


      tree = Node(50, Node(30, Node(20), Node(40)), Node(70, Node(60), Node(80)))
      print(find(tree, 20))
      print(find(tree, 75))
      print(find(tree, 80))
    hints:
      - Smaller values are always in the left subtree, and greater ones in the right subtree.
      - "The first blank is `node.left` and the second `node.right`."
    tests:
      - expect: |
          True
          False
          True
    more:
      - task: |
          Write a recursive function `smallest(node)` that returns the smallest value in a sorted binary tree. The tree is never empty. Use the order of the tree: you don't need to look at every node.

          For example, this program:

          ```python fragment
          tree = Node(50, Node(30, Node(20), Node(40)), Node(70))
          print(smallest(tree))
          ```

          prints:

          ```
          20
          ```
        seed: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def smallest(node):
              pass


          if __name__ == "__main__":
              tree = Node(50, Node(30, Node(20), Node(40)), Node(70))
