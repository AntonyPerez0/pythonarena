        solution: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def smallest(node):
              if node.left is None:
                  return node.value
              return smallest(node.left)


          if __name__ == "__main__":
              tree = Node(50, Node(30, Node(20), Node(40)), Node(70))
              print(smallest(tree))
        hints:
          - "In a sorted tree, the smaller values are always on the left. Where is the smallest one, then?"
          - "Keep going left. A node with no left child holds the smallest value of its subtree: that's the base case."
          - "Otherwise, the answer is `smallest(node.left)`."
        require:
          - pattern: def smallest\b[^\n]*\n(?:[ \t]*\n|[ \t]+[^\n]*\n)*?[ \t]+[^\n]*\bsmallest\s*\(
            message: Make `smallest` call itself inside its own body.
        forbid:
          - pattern: \b(?:while|for)\b
            message: Use recursion instead of a loop.
        tests:
