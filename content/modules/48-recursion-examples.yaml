            hidden: true
      - task: |
          Write a recursive function `in_order(node)` that returns a list of all the values in a sorted binary tree, in increasing order. An empty tree, `None`, gives an empty list.

          For example, this program:

          ```python fragment
          tree = Node(50, Node(30, Node(20), Node(40)), Node(70, Node(60), Node(80)))
          print(in_order(tree))
          ```

          prints:

          ```
          [20, 30, 40, 50, 60, 70, 80]
          ```
        seed: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def in_order(node):
              pass


          if __name__ == "__main__":
              tree = Node(50, Node(30, Node(20), Node(40)), Node(70, Node(60), Node(80)))
              print(in_order(tree))
        solution: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def in_order(node):
              if node is None:
                  return []
              return in_order(node.left) + [node.value] + in_order(node.right)


          if __name__ == "__main__":
              tree = Node(50, Node(30, Node(20), Node(40)), Node(70, Node(60), Node(80)))
              print(in_order(tree))
        hints:
          - "The base case is the empty tree, which gives `[]`."
          - "The values of the left subtree come first, then the node's own value, then the values of the right subtree."
          - "Lists can be joined with `+`: `in_order(node.left) + [node.value] + in_order(node.right)`."
        require:
          - pattern: def in_order\b[^\n]*\n(?:[ \t]*\n|[ \t]+[^\n]*\n)*?[ \t]+[^\n]*\bin_order\s*\(
            message: Make `in_order` call itself inside its own body.
        forbid:
          - pattern: \bsorted\s*\(|\.sort\s*\(
            message: Use the order of the tree instead of sorting the values.
