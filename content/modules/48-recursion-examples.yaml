              print(flatten([1, [2, 3], [4, [5, 6]], 7]))
        solution: |
          def flatten(items):
              result = []
              for item in items:
                  if type(item) == list:
                      result += flatten(item)
                  else:
                      result.append(item)
              return result


          if __name__ == "__main__":
              print(flatten([1, [2, 3], [4, [5, 6]], 7]))
