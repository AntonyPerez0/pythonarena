id: recursion-examples
summary: Where recursion really shines. Binary trees built from a small Node class, recursive algorithms that count, add up and measure them, a sorted binary tree you can search and add to, and data nested to any depth.
steps:
  - id: recursion-examples-binary-trees
    slug: binary-trees
    title: Binary trees
    text: |
      So far a loop could have done everything recursion did. Recursion really pays off with data that branches, such as a family tree, folders inside folders or a tournament bracket. The simplest branching structure is a **binary tree**:

      ```text
              8
             / \
            3   10
           / \    \
          1   6    14
      ```

      Each value in it sits in a **node**. A node has a value and at most two **children**, a left one and a right one. The node at the top is the **root** (trees in computer science grow downwards), and the nodes without children are **leaves**: here 1, 6 and 14.

      A tree needs only one class, for a node that knows its value and its two children. A missing child is `None`:

      ```python fragment
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right
      ```

      Since the children are parameters with default values, the whole tree above can be built by nesting the calls of the constructor:

      ```python fragment
      tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
      ```

      ### Every child is a tree too

      Each child is the root of a smaller tree, a **subtree**: the node 3 with its children 1 and 6 is a complete binary tree of its own. That's why recursion fits trees so well. To do something to every node, do it to this node, and then do the same to the left subtree and to the right subtree:

      ```python run
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def print_values(node):
          print(node.value)
          if node.left is not None:
              print_values(node.left)
          if node.right is not None:
              print_values(node.right)


      tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
      print_values(tree)
      ```

      ```output
      8
      3
      1
      6
      10
      14
      ```

      The function goes down the left side first, and each node is printed exactly once, however big the tree is. A loop would struggle here: after the left subtree it would have to remember every right subtree it skipped on the way down. With recursion, the waiting calls remember them for you.

      ### None as the base case

      `print_values` checks each child before calling itself. Another way is to let the function accept `None`, an empty tree, and make that the base case. Counting the nodes works like this: an empty tree has no nodes, and any other tree has this node plus the nodes of its two subtrees:

      ```python run
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def count_nodes(node):
          if node is None:
              return 0
          return 1 + count_nodes(node.left) + count_nodes(node.right)


      tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
      print(count_nodes(tree))
      print(count_nodes(tree.left))
      ```

      ```output
      6
      3
      ```

      Without the check for `None`, the calls run into the missing children of the leaves:

      ```python run crash
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def count_nodes(node):
          return 1 + count_nodes(node.left) + count_nodes(node.right)


      print(count_nodes(Node(5)))
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 12, in <module>
          print(count_nodes(Node(5)))
                ~~~~~~~~~~~^^^^^^^^^
        File "main.py", line 9, in count_nodes
          return 1 + count_nodes(node.left) + count_nodes(node.right)
                     ~~~~~~~~~~~^^^^^^^^^^^
        File "main.py", line 9, in count_nodes
          return 1 + count_nodes(node.left) + count_nodes(node.right)
                                 ^^^^^^^^^
      AttributeError: 'NoneType' object has no attribute 'left'
      ```

      The leaf's `left` is `None`, and `None` has no attributes. Whenever you see `'NoneType' object has no attribute`, look for a missing check for `None`.

      **Your turn:** the function prints a tree as an outline, each value indented by two spaces per level. Fill in the blank so the left subtree is printed one level deeper. The program should print:

      ```
      8
        3
          1
          6
        10
          14
      ```
    fill: |
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def show(node, depth):
          if node is None:
              return
          print("  " * depth + str(node.value))
          show(node.left, [[depth + 1]])
          show(node.right, depth + 1)


      tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
      show(tree, 0)
    hints:
      - The children are one level deeper than the node itself.
      - "The left subtree gets the same depth as the right one: `depth + 1`."
    tests:
      - expect: |
          8
            3
              1
              6
            10
              14
    more:
      - task: |
          What does this program print? Type each line it prints.
        predict: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def visit(node):
              if node is not None:
                  visit(node.left)
                  visit(node.right)
                  print(node.value)


          visit(Node(1, Node(2), Node(3, Node(4))))
        hints:
          - "Draw the tree first: 1 is the root, 2 its left child and 3 its right child, and 4 is the left child of 3."
          - This time a node prints its value only after both of its subtrees have been visited.
          - "So 2 prints first. In the right subtree, 4 prints before 3, and the root comes last."
      - task: |
          A leaf is a node without children. Write a recursive function `count_leaves(node)` that returns the number of leaves in a tree. An empty tree, `None`, has no leaves.

          For example, this program:

          ```python fragment
          tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
          print(count_leaves(tree))
          ```

          prints:

          ```
          3
          ```
        seed: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def count_leaves(node):
              pass


          if __name__ == "__main__":
              tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
              print(count_leaves(tree))
        solution: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def count_leaves(node):
              if node is None:
                  return 0
              if node.left is None and node.right is None:
                  return 1
              return count_leaves(node.left) + count_leaves(node.right)


          if __name__ == "__main__":
              tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
              print(count_leaves(tree))
        hints:
          - "There are two base cases: an empty tree has 0 leaves, and a node whose children are both `None` is a leaf, 1."
          - "Any other node isn't a leaf itself, so its leaves are the leaves of its left subtree plus those of its right subtree."
          - "`return count_leaves(node.left) + count_leaves(node.right)`"
        require:
          - pattern: def count_leaves\b[^\n]*\n(?:[ \t]*\n|[ \t]+[^\n]*\n)*?[ \t]+[^\n]*\bcount_leaves\s*\(
            message: Make `count_leaves` call itself inside its own body.
        tests:
          - call: |
              tree = Node(8, Node(3, Node(1), Node(6)), Node(10, None, Node(14)))
              print(count_leaves(tree))
          - call: count_leaves(Node(5))
            hidden: true
          - call: count_leaves(None)
            hidden: true
          - call: count_leaves(Node(1, Node(2, Node(3))))
            hidden: true
          - call: count_leaves(Node(1, Node(2, Node(4), Node(5)), Node(3, Node(6), Node(7))))
            hidden: true

  - id: recursion-examples-sum-max-depth
    slug: sum-max-depth
    title: Sums, the greatest value and depth
    text: |
      Most algorithms on trees have the same shape as `count_nodes`: an answer for the empty tree, and for any other tree, this node's value combined with the answers for its two subtrees. Here is a tree with a negative number in it:

      ```text
               7
             /   \
            2     9
           /     / \
         -4     5   12
                 \
                  6
      ```

      The **sum** of its values is this node's value plus the sums of the two subtrees. An empty tree adds nothing. The **depth** of a tree, also called its height, is the number of nodes on the longest path from the root down to a leaf. An empty tree has depth 0, and any other tree is one level deeper than the deeper of its two subtrees:

      ```python run
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def tree_sum(node):
          if node is None:
              return 0
          return node.value + tree_sum(node.left) + tree_sum(node.right)


      def depth(node):
          if node is None:
              return 0
          return 1 + max(depth(node.left), depth(node.right))


      tree = Node(7, Node(2, Node(-4)), Node(9, Node(5, None, Node(6)), Node(12)))
      print(tree_sum(tree))
      print(depth(tree))
      print(depth(tree.left))
      ```

      ```output
      37
      4
      2
      ```

      The longest path is 7, 9, 5, 6: four nodes. The left subtree, 2 with its child -4, has depth 2.

      ### When the empty tree has no good answer

      What's the smallest value of an empty tree? There's no good answer. If the base case returned 0, a tree with only positive numbers would get 0 as its smallest value, which is wrong. For questions like this, assume the tree isn't empty, start from the node's own value, and compare it with the answer for each subtree that exists:

      ```python run
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def smallest(node):
          result = node.value
          if node.left is not None:
              result = min(result, smallest(node.left))
          if node.right is not None:
              result = min(result, smallest(node.right))
          return result


      tree = Node(7, Node(2, Node(-4)), Node(9, Node(5, None, Node(6)), Node(12)))
      print(smallest(tree))
      print(smallest(tree.right))
      ```

      ```output
      -4
      5
      ```

      Here the base case is a leaf: neither `if` is true, so the leaf returns its own value without calling the function again.

      ### The recipe

      To write a recursive function for a tree, answer two questions. What is the answer for the smallest tree, an empty one or a leaf? And if you already had the answers for the two subtrees, how would you get the answer for the whole tree? The recursive calls give you those answers, so you only need to combine them.

      **Your turn:** the function counts the values in a tree that are greater than `limit`. Fill in the blank so it adds the count for the left subtree. The program should print:

      ```
      3
      6
      ```
    fill: |
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def count_greater(node, limit):
          if node is None:
              return 0
          here = 1 if node.value > limit else 0
          return here + [[count_greater(node.left, limit)]] + count_greater(node.right, limit)


      tree = Node(7, Node(2, Node(-4)), Node(9, Node(5, None, Node(6)), Node(12)))
      print(count_greater(tree, 6))
      print(count_greater(tree, 0))
    hints:
      - The left subtree is counted the same way as the right one.
      - "Copy the call for the right subtree and change `right` to `left`: `count_greater(node.left, limit)`."
    tests:
      - expect: |
          3
          6
    more:
      - task: |
          Write a recursive function `greatest(node)` that returns the greatest value in a tree. The tree is never empty, but its values can be negative.

          For example, this program:

          ```python fragment
          tree = Node(7, Node(2, Node(-4)), Node(9, Node(5, None, Node(6)), Node(12)))
          print(greatest(tree))
          ```

          prints:

          ```
          12
          ```
        seed: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def greatest(node):
              pass


          if __name__ == "__main__":
              tree = Node(7, Node(2, Node(-4)), Node(9, Node(5, None, Node(6)), Node(12)))
              print(greatest(tree))
        solution: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def greatest(node):
              result = node.value
              if node.left is not None:
                  result = max(result, greatest(node.left))
              if node.right is not None:
                  result = max(result, greatest(node.right))
              return result


          if __name__ == "__main__":
              tree = Node(7, Node(2, Node(-4)), Node(9, Node(5, None, Node(6)), Node(12)))
              print(greatest(tree))
        hints:
          - "Start from the node's own value: `result = node.value`."
          - "For each child that isn't `None`, compare `result` with the greatest value of that subtree."
          - "`result = max(result, greatest(node.left))`, and the same for the right child."
        require:
          - pattern: def greatest\b[^\n]*\n(?:[ \t]*\n|[ \t]+[^\n]*\n)*?[ \t]+[^\n]*\bgreatest\s*\(
            message: Make `greatest` call itself inside its own body.
