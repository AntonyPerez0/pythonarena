      - task: |
          Write a recursive function `flatten(items)` that gets a list whose items can be lists, nested to any depth, and returns a new flat list of all the items that aren't lists, in their original order.

          For example, this call:

          ```python fragment
          print(flatten([1, [2, 3], [4, [5, 6]], 7]))
          ```

          prints:

          ```
          [1, 2, 3, 4, 5, 6, 7]
          ```
        seed: |
          def flatten(items):
              pass


          if __name__ == "__main__":
              print(flatten([1, [2, 3], [4, [5, 6]], 7]))
        solution: |
          def flatten(items):
              result = []
              for item in items:
                  if type(item) == list:
                      result += flatten(item)
                  else:
                      result.append(item)
              return result


          if __name__ == "__main__":
              print(flatten([1, [2, 3], [4, [5, 6]], 7]))
        hints:
          - "Start with an empty list `result` and go through the items with a loop, as in `deep_sum`."
          - "An item that isn't a list goes into `result` with `append`."
          - "For an item that is a list, `flatten(item)` gives its items as a flat list. Add them all to `result` with `+=`."
