          - "`__next__` raises `StopIteration` when the current number is below 1. Otherwise it remembers the current number, makes the current number one smaller, and returns the number it remembered."
          - "Because `__iter__` sets the current number back to `start`, the second `list(launch)` starts from the beginning again."
