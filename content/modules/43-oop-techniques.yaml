      - task: |
          A card has a rank and a suit, and two cards are equal when both their rank and their suit are the same. Add the method `__eq__` to the class `Card`. A card compared with something that isn't a card is not equal to it: that should give `False`, not an error. With `__eq__` in place, lists of cards work with `in` and `count` too. For example,

          ```python fragment
          hand = [Card("K", "hearts"), Card("7", "clubs"), Card("K", "hearts")]
          print(Card("K", "hearts") == Card("K", "hearts"))
          print(Card("K", "hearts") == Card("K", "spades"))
          print(Card("7", "clubs") in hand)
          print(hand.count(Card("K", "hearts")))
          print(Card("7", "clubs") == "7 of clubs")
          ```

          should print:

          ```
          True
          False
          True
          2
          False
          ```
        seed: |
          class Card:
              def __init__(self, rank, suit):
                  self.rank = rank
                  self.suit = suit

              def __str__(self):
                  return f"{self.rank} of {self.suit}"


          if __name__ == "__main__":
              hand = [Card("K", "hearts"), Card("7", "clubs")]
              print(Card("7", "clubs") in hand)
        solution: |
          class Card:
              def __init__(self, rank, suit):
                  self.rank = rank
                  self.suit = suit

              def __str__(self):
                  return f"{self.rank} of {self.suit}"

              def __eq__(self, other):
                  if not isinstance(other, Card):
                      return False
                  return self.rank == other.rank and self.suit == other.suit


          if __name__ == "__main__":
              hand = [Card("K", "hearts"), Card("7", "clubs")]
              print(Card("7", "clubs") in hand)
        hints:
          - "`__eq__(self, other)` returns `True` when the rank and the suit are both the same: combine the two comparisons with `and`."
          - "Check the type first: `if not isinstance(other, Card):` then `return False`. A string has no `rank`, so without the check it would stop with an error."
        require:
          - pattern: def\s+__eq__\s*\(
            message: "Write the method `__eq__(self, other)`."
          - pattern: \bisinstance\s*\(
            message: "Check with `isinstance` that `other` is a card before you compare its rank and suit."
        tests:
          - call: |
              hand = [Card("K", "hearts"), Card("7", "clubs"), Card("K", "hearts")]
              print(Card("K", "hearts") == Card("K", "hearts"))
              print(Card("K", "hearts") == Card("K", "spades"))
              print(Card("7", "clubs") in hand)
              print(hand.count(Card("K", "hearts")))
              print(Card("7", "clubs") == "7 of clubs")
          - call: |
              deck = [Card("A", "spades"), Card("2", "spades"), Card("A", "diamonds")]
              print(Card("A", "spades") != Card("A", "diamonds"))
              print(Card("2", "diamonds") in deck)
              deck.remove(Card("2", "spades"))
              for card in deck:
                  print(card)
              print(Card("A", "spades") == 1)
