      - task: |
          An iterator doesn't need a list: it can work out its items as it goes. Write a class `Countdown`. Its constructor takes a whole number `start`, and a `for` loop over a countdown goes through the numbers from `start` down to 1. A countdown from 0 or less has no numbers at all. Looping over the same countdown again starts from the beginning. For example,

          ```python fragment
          for number in Countdown(3):
              print(number)
          launch = Countdown(5)
          print(list(launch))
          print(list(launch))
          print(list(Countdown(0)))
          ```

          should print:

          ```
          3
          2
          1
          [5, 4, 3, 2, 1]
          [5, 4, 3, 2, 1]
          []
          ```
        seed: |
          # Write the class Countdown here.


          if __name__ == "__main__":
              for number in Countdown(3):
                  print(number)
        solution: |
          class Countdown:
              def __init__(self, start):
                  self.start = start

              def __iter__(self):
                  self._current = self.start
                  return self

              def __next__(self):
                  if self._current < 1:
                      raise StopIteration
                  number = self._current
                  self._current -= 1
                  return number


          if __name__ == "__main__":
              for number in Countdown(3):
                  print(number)
        hints:
