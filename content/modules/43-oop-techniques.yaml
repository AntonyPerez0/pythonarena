  - id: oop-techniques-repr
    slug: str-and-repr
    title: __str__ and __repr__
    text: |
      A value can be shown as text in two ways. One is for people: readable text, with no extra marks. The other is for programmers: a **technical representation** that shows exactly what the value is. For a string, the difference is the quotes. The function `repr` gives the technical one:

      ```python repl
      >>> name = "Ada"
      >>> print(name)
      Ada
      >>> print(repr(name))
      'Ada'
      >>> print(repr(7))
      7
      >>> print([name, "7", 7])
      ['Ada', '7', 7]
      ```

      You have seen the technical text many times without knowing it: a list prints its items with `repr`. That's why the strings in a printed list have quotes, and why `'7'` and `7` look different there. The interactive interpreter shows values with `repr` too.

      ### __repr__ for your own classes

      `print`, `str` and f-strings use an object's `__str__`. The function `repr`, and a list being printed, use its **`__repr__`**. A good `__repr__` returns text that looks like the Python code that would create an object with the same contents:

      ```python run
      class Pet:
          def __init__(self, name, age):
              self.name = name
              self.age = age

          def __str__(self):
              return f"{self.name}, {self.age} years old"

          def __repr__(self):
              return f"Pet({repr(self.name)}, {self.age})"


      rex = Pet("Rex", 3)
      print(rex)
      print(f"My pet is {rex}")
      print(repr(rex))
      pets = [rex, Pet("Tom", 5)]
      print(pets)
      ```

      ```output
      Rex, 3 years old
      My pet is Rex, 3 years old
      Pet('Rex', 3)
      [Pet('Rex', 3), Pet('Tom', 5)]
      ```

      Notice `repr(self.name)` inside `__repr__`. It puts quotes around the name, so the text reads like code: `Pet('Rex', 3)`. Without it, you'd get `Pet(Rex, 3)`, which isn't how you'd write the call.

      Without a `__repr__`, a printed list of pets would show something like `<__main__.Pet object at 0x7f3a2c1d5e50>` for each one: the class and an address in the computer's memory, which helps nobody.

      ### When there's only __repr__

      If a class has `__repr__` but no `__str__`, `print` uses `__repr__`. For a small class whose technical text reads well, that one method is enough for both:

      ```python run
      class Point:
          def __init__(self, x, y):
              self.x = x
              self.y = y

          def __repr__(self):
              return f"Point({self.x}, {self.y})"


      p = Point(2, 5)
      print(p)
      print([p, Point(0, 0)])
      ```

      ```output
      Point(2, 5)
      [Point(2, 5), Point(0, 0)]
      ```

      It doesn't work the other way round: a list never uses `__str__` for its items. So when your objects end up in lists, and you want to see them while you test your program, give the class a `__repr__`.

      **Your turn:** what does this program print? Type each line it prints.
    predict: |
      class Tag:
          def __init__(self, text):
              self.text = text

          def __str__(self):
              return "#" + self.text

          def __repr__(self):
              return f"Tag({repr(self.text)})"


      tag = Tag("python")
      print(tag)
      print(repr(tag))
      print([tag])
      print(f"Tagged {tag}")
    hints:
      - "`print` and f-strings use `__str__`; `repr` and a printed list use `__repr__`."
      - "`repr(self.text)` gives the text with single quotes around it: `'python'`."
