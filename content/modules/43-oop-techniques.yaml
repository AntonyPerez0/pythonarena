            message: "Write `__eq__` for `==`."
          - pattern: def\s+__le__\s*\(
            message: "Write `__le__` for `<=`."
          - pattern: def\s+__ge__\s*\(
            message: "Write `__ge__` for `>=`."
        tests:
          - call: |
