id: oop-techniques
summary: Making your own objects work with Python's operators and loops. Methods that return objects, comparisons with < and ==, arithmetic with + and -, a technical text for an object with __repr__, and iterators that let a for loop go through your object.
steps:
  - id: oop-techniques-comparisons
    slug: comparisons
    title: Comparing objects with operators
    text: |
      A method can return an object, including an object of its own class. And since `self` is the object itself, a method can return `self` too. Here `heavier` compares two parcels and returns the heavier one, whichever it is:

      ```python run
      class Parcel:
          def __init__(self, label, weight):
              self.label = label
              self.weight = weight

          def __str__(self):
              return f"{self.label} ({self.weight} kg)"

          def heavier(self, other):
              if self.weight > other.weight:
                  return self
              return other


      books = Parcel("Books", 12)
      pillow = Parcel("Pillow", 2)
      print(books.heavier(pillow))
      print(pillow.heavier(books))
      ```

      ```output
      Books (12 kg)
      Books (12 kg)
      ```

      That works, but it would be nicer to compare parcels the way you compare numbers, with `>` and `<`. As it is, Python doesn't know how:

      ```python run crash
      class Parcel:
          def __init__(self, label, weight):
              self.label = label
              self.weight = weight


      books = Parcel("Books", 12)
      pillow = Parcel("Pillow", 2)
      print(books > pillow)
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 9, in <module>
          print(books > pillow)
                ^^^^^^^^^^^^^^
      TypeError: '>' not supported between instances of 'Parcel' and 'Parcel'
      ```

      ### Operator overloading

      A class can decide what an operator means for its objects. This is called **operator overloading**. Each operator has a method with a special name, with two underscores on both sides, like `__init__` and `__str__`. When Python meets `a > b` and `a` is an object of your class, it calls `a.__gt__(b)` ("gt" for greater than). The method returns `True` or `False`:

      ```python run
      class Parcel:
          def __init__(self, label, weight):
              self.label = label
              self.weight = weight

          def __str__(self):
              return f"{self.label} ({self.weight} kg)"

          def __gt__(self, other):
              return self.weight > other.weight

          def __lt__(self, other):
              return self.weight < other.weight


      books = Parcel("Books", 12)
      pillow = Parcel("Pillow", 2)
      lamp = Parcel("Lamp", 5)
      print(books > pillow)
      print(books < pillow)

      parcels = [books, pillow, lamp]
      for parcel in sorted(parcels):
          print(parcel)
      print("Heaviest:", max(parcels))
      ```

      ```output
      True
      False
      Pillow (2 kg)
      Lamp (5 kg)
      Books (12 kg)
      Heaviest: Books (12 kg)
      ```

      You decide what "greater" means. Here it's the weight; for another class it could be a price, a date, or the alphabetical order of names. And there's a bonus: `sorted`, `min` and `max` compare items with `<` and `>`, so they work with your objects too, as soon as the class has these methods.

      These are the comparison operators and their methods:

      | Operator | Meaning | Method |
      |---|---|---|
      | `<` | less than | `__lt__(self, other)` |
      | `>` | greater than | `__gt__(self, other)` |
      | `<=` | less than or equal to | `__le__(self, other)` |
      | `>=` | greater than or equal to | `__ge__(self, other)` |
      | `==` | equal to | `__eq__(self, other)` |
      | `!=` | not equal to | `__ne__(self, other)` |

      You only need to write the ones that make sense for your class. The next step looks at `==`, which works a little differently.

      **Your turn:** the faster runner is the one with fewer seconds. Fill in the blank with the name of the method that makes `<` work for runners, so the program prints:

      ```
      True
      False
      ```
    fill: |
      class Runner:
          def __init__(self, name, seconds):
              self.name = name
              self.seconds = seconds

          def [[__lt__]](self, other):
              return self.seconds < other.seconds


      if __name__ == "__main__":
          ada = Runner("Ada", 61)
          ben = Runner("Ben", 58)
          print(ben < ada)
          print(ada < ben)
    hints:
      - "Look at the table: which method does Python call for `<`?"
      - "\"Less than\" is `lt`, with two underscores on both sides: `__lt__`."
    tests:
      - expect: |
          True
          False
    more:
      - task: |
          A room is bigger than another when its floor area, width times length, is bigger. Add the methods `__lt__` and `__gt__` to the class `Room`, so that rooms can be compared with `<` and `>`, and `max` finds the biggest room. For example,

          ```python fragment
          kitchen = Room("Kitchen", 3, 4)
          hall = Room("Hall", 2, 5)
          print(kitchen > hall)
          print(kitchen < hall)
          print(hall < kitchen)
          print(max([hall, kitchen]).name)
          ```

          should print:

          ```
          True
          False
          True
          Kitchen
          ```
        seed: |
          class Room:
              def __init__(self, name, width, length):
                  self.name = name
                  self.width = width
                  self.length = length

              def area(self):
                  return self.width * self.length


          if __name__ == "__main__":
              kitchen = Room("Kitchen", 3, 4)
              hall = Room("Hall", 2, 5)
              print(kitchen > hall)
        solution: |
          class Room:
              def __init__(self, name, width, length):
                  self.name = name
                  self.width = width
                  self.length = length

              def area(self):
                  return self.width * self.length

              def __lt__(self, other):
                  return self.area() < other.area()

              def __gt__(self, other):
                  return self.area() > other.area()


          if __name__ == "__main__":
              kitchen = Room("Kitchen", 3, 4)
              hall = Room("Hall", 2, 5)
              print(kitchen > hall)
        hints:
          - "Both methods take `self` and `other`, another room, and return `True` or `False`."
          - "Compare the areas: `return self.area() < other.area()` in `__lt__`, and the same with `>` in `__gt__`."
        require:
          - pattern: def\s+__lt__\s*\(
            message: "Write the method `__lt__(self, other)` for `<`."
          - pattern: def\s+__gt__\s*\(
            message: "Write the method `__gt__(self, other)` for `>`."
        tests:
          - call: |
              kitchen = Room("Kitchen", 3, 4)
              hall = Room("Hall", 2, 5)
              print(kitchen > hall)
              print(kitchen < hall)
              print(hall < kitchen)
              print(max([hall, kitchen]).name)
          - call: |
              attic = Room("Attic", 6, 2)
              studio = Room("Studio", 3, 5)
              closet = Room("Closet", 1, 2)
              print(attic > studio)
              print(attic < studio)
              print(closet < attic)
              rooms = [attic, studio, closet]
              print(max(rooms).name)
              print(min(rooms).name)
              for room in sorted(rooms):
                  print(room.name)
            hidden: true
      - task: |
          A color on a screen is made of red, green and blue light, each a whole number from 0 to 255. Add two methods to the class `Color`. Both return a **new** color and leave the original as it is:

          - `mix(other)` returns a color whose red is the average of the two colors' reds, rounded down, and the same for green and blue.
          - `brighter()` returns a color with 50 more of each, but never more than 255. (`min` works with two numbers too: `min(a, b)` is the smaller of them.)

          For example,

          ```python fragment
          red = Color(255, 0, 0)
          blue = Color(0, 0, 255)
          print(red.mix(blue))
          print(red.brighter())
          print(red)
          ```

          should print:

          ```
          rgb(127, 0, 127)
          rgb(255, 50, 50)
          rgb(255, 0, 0)
          ```
        seed: |
          class Color:
              def __init__(self, red, green, blue):
                  self.red = red
                  self.green = green
                  self.blue = blue

              def __str__(self):
                  return f"rgb({self.red}, {self.green}, {self.blue})"


          if __name__ == "__main__":
              red = Color(255, 0, 0)
              blue = Color(0, 0, 255)
              print(red.mix(blue))
              print(red.brighter())
        solution: |
          class Color:
              def __init__(self, red, green, blue):
                  self.red = red
                  self.green = green
                  self.blue = blue

              def __str__(self):
                  return f"rgb({self.red}, {self.green}, {self.blue})"

              def mix(self, other):
                  red = (self.red + other.red) // 2
                  green = (self.green + other.green) // 2
                  blue = (self.blue + other.blue) // 2
                  return Color(red, green, blue)

              def brighter(self):
                  return Color(min(self.red + 50, 255), min(self.green + 50, 255), min(self.blue + 50, 255))


          if __name__ == "__main__":
              red = Color(255, 0, 0)
              blue = Color(0, 0, 255)
              print(red.mix(blue))
              print(red.brighter())
        hints:
          - "A method can create an object of its own class: `return Color(...)`, with the new red, green and blue in the parentheses."
          - "The average rounded down is `(self.red + other.red) // 2`. Don't change `self.red`: a new color gets the new values."
          - "In `brighter`, `min(self.red + 50, 255)` is the smaller of the two, so it's never more than 255."
        require:
          - pattern: return\s+Color\s*\(
            min: 2
            message: "Both methods should return a new color: `return Color(...)`."
        tests:
          - call: |
              red = Color(255, 0, 0)
              blue = Color(0, 0, 255)
              print(red.mix(blue))
              print(red.brighter())
              print(red)
          - call: |
              sky = Color(100, 180, 240)
              grass = Color(41, 120, 9)
              print(sky.mix(grass))
              print(grass.mix(sky))
              print(sky.brighter())
              print(sky.brighter().brighter())
              print(sky)
              print(grass)
            hidden: true

  - id: oop-techniques-equality
    slug: equality
    title: Equality with __eq__
    text: |
      For `==`, Python has an answer even when your class has no method for it. But it's probably not the answer you want:

      ```python run
      class Point:
          def __init__(self, x, y):
              self.x = x
              self.y = y


      a = Point(1, 2)
      b = Point(1, 2)
      c = a
      print(a == b)
      print(a == c)
      ```

      ```output
      False
      True
      ```

      Without a method of its own, `==` asks whether the two are the very **same object**, as `is` does. `a` and `c` refer to the same point, but `b` is a different object, even though it has the same coordinates. To compare the contents, write the method **`__eq__`**:

      ```python run
      class Point:
          def __init__(self, x, y):
              self.x = x
              self.y = y

          def __eq__(self, other):
              return self.x == other.x and self.y == other.y


      a = Point(1, 2)
      b = Point(1, 2)
      print(a == b)
      print(a != b)
      print(Point(3, 4) in [a, b, Point(3, 4)])
      ```

      ```output
      True
      False
      True
      ```

      Two things come for free. When a class has `__eq__` but no `__ne__`, Python works out `!=` as the opposite of `==`. And everything that compares items with `==` now works with points: `in` for lists, and the list methods `count`, `index` and `remove`.

      ### Comparing with something else

      `__eq__` above expects `other` to be a point. Compared with anything else, say the string `"1, 2"`, it would stop with an `AttributeError`, since a string has no `x`. A careful `__eq__` first checks the type with `isinstance`, and returns `False` for anything that isn't a point:

      ```python fragment
      def __eq__(self, other):
          if not isinstance(other, Point):
              return False
          return self.x == other.x and self.y == other.y
      ```

      ### A full set of comparisons

      `<=` and `>=` don't come from `<` and `==` automatically: each needs a method of its own. They can be written with the ones you have. Software versions such as 3.12 and 3.14 are a good example. The major version, the first number, matters most, and the minor version only decides when the major versions are equal:

      ```python run
      class Version:
          def __init__(self, major, minor):
              self.major = major
              self.minor = minor

          def __eq__(self, other):
              return self.major == other.major and self.minor == other.minor

          def __lt__(self, other):
              if self.major != other.major:
                  return self.major < other.major
              return self.minor < other.minor

          def __le__(self, other):
              return self < other or self == other


      old = Version(3, 12)
      new = Version(3, 14)
      print(old < new)
      print(new <= Version(3, 14))
      print(Version(2, 99) < old)
      ```

      ```output
      True
      True
      True
      ```

      Note how `__le__` uses `self < other` and `self == other`: inside the class, the operators call the class's own methods too.

      **Your turn:** what does this program print? Type each line it prints.
    predict: |
      class Coin:
          def __init__(self, value):
              self.value = value


      class Bill:
          def __init__(self, value):
              self.value = value

          def __eq__(self, other):
              return self.value == other.value


      print(Coin(5) == Coin(5))
      print(Bill(5) == Bill(5))
      print(Bill(5) != Bill(10))
      a = Coin(1)
      b = a
      print(a == b)
    hints:
      - "`Coin` has no `__eq__`, so `==` asks whether the two are the very same object. `Bill` compares the values."
      - "Two separate `Coin(5)` objects are not the same object. But `b = a` doesn't make a new coin: `a` and `b` refer to the same one."
      - "With `__eq__` and no `__ne__`, `!=` is the opposite of `==`."
    more:
      - task: |
          Add comparisons to the class `Time`, a time of day in hours and minutes. Write the methods for `==`, `<`, `<=`, `>` and `>=`. The protected helper `_minutes()` is already there: it gives the time as minutes after midnight, which makes every comparison easy. For example,

          ```python fragment
          lunch = Time(12, 30)
          meeting = Time(9, 45)
          also_lunch = Time(12, 30)
          print(lunch == also_lunch)
          print(lunch != meeting)
          print(meeting < lunch)
          print(lunch <= also_lunch)
          print(meeting >= lunch)
          print(lunch > meeting)
          ```

          should print:

          ```
          True
          True
          True
          True
          False
          True
          ```
        seed: |
          class Time:
              def __init__(self, hours, minutes):
                  self.hours = hours
                  self.minutes = minutes

              def _minutes(self):
                  return self.hours * 60 + self.minutes


          if __name__ == "__main__":
              lunch = Time(12, 30)
              meeting = Time(9, 45)
              print(meeting < lunch)
        solution: |
          class Time:
              def __init__(self, hours, minutes):
                  self.hours = hours
                  self.minutes = minutes

              def _minutes(self):
                  return self.hours * 60 + self.minutes

              def __eq__(self, other):
                  return self._minutes() == other._minutes()

              def __lt__(self, other):
                  return self._minutes() < other._minutes()

              def __le__(self, other):
                  return self._minutes() <= other._minutes()

              def __gt__(self, other):
                  return self._minutes() > other._minutes()

              def __ge__(self, other):
                  return self._minutes() >= other._minutes()


          if __name__ == "__main__":
              lunch = Time(12, 30)
              meeting = Time(9, 45)
              print(meeting < lunch)
        hints:
          - "The methods are `__eq__`, `__lt__`, `__le__`, `__gt__` and `__ge__`, each with the parameters `self` and `other`. `!=` comes for free from `__eq__`."
          - "Each one compares the two times in minutes: `return self._minutes() < other._minutes()` for `__lt__`, and the other operators the same way."
          - "`other` is a `Time` too, so it has `_minutes()` as well. Using a protected method of another object of the same class is fine."
        require:
