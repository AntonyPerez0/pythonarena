              print(lunch == also_lunch)
              print(lunch != meeting)
              print(meeting < lunch)
              print(lunch <= also_lunch)
              print(meeting >= lunch)
              print(lunch > meeting)
          - call: |
              early = Time(6, 59)
              late = Time(7, 0)
              print(early == late)
              print(early < late)
              print(early > late)
              print(late >= early)
              print(late <= early)
              print(early >= Time(6, 59))
              print(sorted([late, early])[0].hours)
