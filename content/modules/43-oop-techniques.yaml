      - task: |
          The class `Clock` is a time of day. Add two operators to it:

          - `clock + minutes` returns a new clock that many minutes later. After 23:59 comes 0:00 again.
          - `clock - other` returns a whole number: how many minutes it takes to get from the time `other` to this clock's time, going forward, past midnight if needed.

          For example,

          ```python fragment
          start = Clock(22, 30)
          end = start + 150
          print(end)
          print(start)
          print(end - start)
          print(Clock(8, 15) - Clock(7, 50))
          ```

          should print:

          ```
          1:00
          22:30
          150
          25
          ```
        seed: |
          class Clock:
              def __init__(self, hours, minutes):
                  self.hours = hours
                  self.minutes = minutes

              def __str__(self):
                  minutes = str(self.minutes)
                  if self.minutes < 10:
                      minutes = "0" + minutes
                  return f"{self.hours}:{minutes}"


          if __name__ == "__main__":
              start = Clock(22, 30)
              end = start + 150
              print(end)
              print(end - start)
        solution: |
          class Clock:
              def __init__(self, hours, minutes):
                  self.hours = hours
                  self.minutes = minutes

              def __str__(self):
                  minutes = str(self.minutes)
                  if self.minutes < 10:
                      minutes = "0" + minutes
                  return f"{self.hours}:{minutes}"

              def _total(self):
                  return self.hours * 60 + self.minutes

              def __add__(self, minutes):
                  total = (self._total() + minutes) % (24 * 60)
                  return Clock(total // 60, total % 60)

              def __sub__(self, other):
                  return (self._total() - other._total()) % (24 * 60)


          if __name__ == "__main__":
              start = Clock(22, 30)
              end = start + 150
              print(end)
              print(end - start)
        hints:
          - "Work in minutes after midnight: a helper method that returns `self.hours * 60 + self.minutes` makes both operators easier."
          - "A day has `24 * 60` minutes. In `__add__`, `% (24 * 60)` takes the total back to the start of the day after midnight; then `total // 60` is the hours and `total % 60` the minutes."
          - "`__sub__` returns a number, not a clock. The difference of the two times in minutes can be negative when midnight is in between, and `% (24 * 60)` turns it into the right number of minutes forward, since `%` in Python never gives a negative result for a positive divisor."
