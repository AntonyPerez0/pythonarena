  - id: larger-application-interface
    slug: user-interface
    title: A text user interface
    text: |
      With the logic tried out, the reading log needs a user interface. A text interface is a loop: read a command, carry it out, and do it again until the user is done. The interface gets a class of its own, `ReadingApp`, and its commands are words: `add`, `read`, `left` and `quit`. The app creates a `ReadingLog` and keeps it in a private attribute. Everything about books goes through it.

      ```python run
      class ReadingLog:
          def __init__(self):
              self.__lengths = {}
              self.__pages_read = {}

          def add_book(self, title, length):
              self.__lengths[title] = length
              self.__pages_read[title] = 0

          def has_book(self, title):
              return title in self.__lengths

          def read(self, title, pages):
              self.__pages_read[title] += pages

          def pages_left(self, title):
              return self.__lengths[title] - self.__pages_read[title]


      class ReadingApp:
          def __init__(self):
              self.__log = ReadingLog()

          def show_commands(self):
              print("commands: add, read, left, quit")

          def add_book(self):
              title = input("title: ")
              length = int(input("pages in the book: "))
              self.__log.add_book(title, length)

          def read(self):
              title = input("title: ")
              if not self.__log.has_book(title):
                  print(f"{title} is not in the log")
                  return
              pages = int(input("pages read: "))
              self.__log.read(title, pages)

          def left(self):
              title = input("title: ")
              if not self.__log.has_book(title):
                  print(f"{title} is not in the log")
                  return
              print(f"{self.__log.pages_left(title)} pages left")

          def run(self):
              self.show_commands()
              while True:
                  command = input("> ")
                  if command == "quit":
                      break
                  elif command == "add":
                      self.add_book()
                  elif command == "read":
                      self.read()
                  elif command == "left":
                      self.left()
                  else:
                      print(f"unknown command: {command}")
                      self.show_commands()


      if __name__ == "__main__":
          app = ReadingApp()
          app.run()
      ```

      ```input
      add
      Dune
      412
      read
      Dune
      50
      read
      Emma
      left
      Dune
      help
      quit
      ```

      ```output
      commands: add, read, left, quit
      > add
      title: Dune
      pages in the book: 412
      > read
      title: Dune
      pages read: 50
      > read
      title: Emma
      Emma is not in the log
      > left
      title: Dune
      362 pages left
      > help
      unknown command: help
      commands: add, read, left, quit
      > quit
      ```

      Here is who does what:

      - `run` is the main loop. It reads a command and passes the work on to the method for that command. Handing work over like this is called **delegating**.
      - `add_book`, `read` and `left` each handle one command. They ask the user for what they need, call the logic, and show what it returns.
      - The interface never touches the dictionaries. When it needs to know something about the books, it asks `ReadingLog`.
      - Checking what the user typed is the interface's job. Before it asks for pages, `read` checks with `has_book` that the book exists, and tells the user if it doesn't.

      Why not write everything inside the loop? Read `run` again: it works like a table of contents. It lists every command the app knows, and the details of each one are a method away. A new command is a new method and one more `elif`, and the commands that already work stay as they are.

      `ReadingLog` and `ReadingApp` both have methods called `add_book` and `read`, and that's fine. The app's versions talk to the user, while the log's versions store the data. They never get mixed up, since each one is called on an object of its own class.

      **Your turn:** the pantry app works, but its `execute` does everything itself. Move the code of each command into a method of its own: `add_item()` for command 1 and `check()` for command 2. Then `execute` only reads the command and calls the right method. The app should work exactly as before, for example:

      ```
      command (1 add, 2 check, 0 quit): 1
      item: rice
      amount: 2
      command (1 add, 2 check, 0 quit): 1
      item: rice
      amount: 3
      command (1 add, 2 check, 0 quit): 2
      item: rice
      rice: 5
      command (1 add, 2 check, 0 quit): 2
      item: salt
      salt: 0
      command (1 add, 2 check, 0 quit): 0
      ```
    seed: |
      class Pantry:
          def __init__(self):
              self.__items = {}

          def add(self, item, amount):
              if item not in self.__items:
                  self.__items[item] = 0
              self.__items[item] += amount

          def amount(self, item):
              if item not in self.__items:
                  return 0
              return self.__items[item]


      class PantryApp:
          def __init__(self):
              self.__pantry = Pantry()

          def execute(self):
              while True:
                  command = input("command (1 add, 2 check, 0 quit): ")
                  if command == "0":
                      break
                  elif command == "1":
                      item = input("item: ")
                      amount = int(input("amount: "))
                      self.__pantry.add(item, amount)
                  elif command == "2":
                      item = input("item: ")
                      print(f"{item}: {self.__pantry.amount(item)}")


      if __name__ == "__main__":
          app = PantryApp()
          app.execute()
    solution: |
      class Pantry:
          def __init__(self):
              self.__items = {}

          def add(self, item, amount):
              if item not in self.__items:
                  self.__items[item] = 0
              self.__items[item] += amount

          def amount(self, item):
              if item not in self.__items:
                  return 0
              return self.__items[item]


      class PantryApp:
          def __init__(self):
              self.__pantry = Pantry()

          def add_item(self):
              item = input("item: ")
              amount = int(input("amount: "))
              self.__pantry.add(item, amount)

          def check(self):
              item = input("item: ")
              print(f"{item}: {self.__pantry.amount(item)}")

          def execute(self):
              while True:
                  command = input("command (1 add, 2 check, 0 quit): ")
                  if command == "0":
                      break
                  elif command == "1":
                      self.add_item()
                  elif command == "2":
                      self.check()


      if __name__ == "__main__":
          app = PantryApp()
          app.execute()
    hints:
