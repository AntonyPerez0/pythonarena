        solution: |
          class GiftList:
              def __init__(self):
                  self.__ideas = {}

              def add_idea(self, name, idea):
                  if name not in self.__ideas:
                      self.__ideas[name] = []
                  self.__ideas[name].append(idea)

              def ideas(self, name):
                  if name not in self.__ideas:
                      return None
                  return self.__ideas[name]

              def all_data(self):
                  return self.__ideas


          class GiftFile:
              def __init__(self, filename):
                  self.__filename = filename

              def load(self):
                  gifts = {}
                  try:
                      with open(self.__filename) as file:
                          for line in file:
                              name, *ideas = line.strip().split(";")
                              gifts[name] = ideas
                  except FileNotFoundError:
                      pass
                  return gifts

              def save(self, gifts):
                  with open(self.__filename, "w") as file:
                      for name, ideas in gifts.items():
                          file.write(";".join([name] + ideas) + "\n")


          class GiftApp:
              def __init__(self, storage):
                  self.__gifts = GiftList()
                  self.__storage = storage
                  for name, ideas in self.__storage.load().items():
                      for idea in ideas:
                          self.__gifts.add_idea(name, idea)

              def help(self):
                  print("commands: 1 add an idea, 2 show ideas, 0 quit")

              def add_idea(self):
                  name = input("name: ")
                  idea = input("idea: ")
                  self.__gifts.add_idea(name, idea)

              def show(self):
                  name = input("name: ")
                  ideas = self.__gifts.ideas(name)
                  if ideas is None:
                      print("no ideas yet")
                      return
                  for idea in ideas:
                      print(idea)

              def quit(self):
                  self.__storage.save(self.__gifts.all_data())

              def execute(self):
                  self.help()
                  while True:
                      command = input("command: ")
                      if command == "0":
                          self.quit()
                          break
                      elif command == "1":
                          self.add_idea()
                      elif command == "2":
                          self.show()
                      else:
                          self.help()


          if __name__ == "__main__":
              app = GiftApp(GiftFile("gifts.txt"))
              app.execute()
