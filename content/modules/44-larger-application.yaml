      - task: |
          The quiz night's `Scoreboard` from the previous step is ready. Write its text user interface, the class `ScoreboardApp`. Its method `execute` first prints the commands, `commands: 1 add points, 2 show a team, 3 leader, 0 quit`, and then reads commands until the user types 0:

          - `1` asks for a team and points, and adds them. If the points aren't a whole number, it prints `points must be a whole number` and adds nothing.
          - `2` asks for a team and prints its points, as `Owls: 5 points`.
          - `3` prints `leader: ` and the leading team, or `no teams yet`.
          - Any other command prints the commands again.

          Give each command a method of its own. For example:

          ```
          commands: 1 add points, 2 show a team, 3 leader, 0 quit
          command: 3
          no teams yet
          command: 1
          team: Owls
          points: 5
          command: 1
          team: Foxes
          points: ten
