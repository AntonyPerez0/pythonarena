          class Scoreboard:
              def __init__(self):
                  self.__points = {}

              def add_points(self, team, points):
                  if team not in self.__points:
                      self.__points[team] = 0
                  self.__points[team] += points

              def points(self, team):
                  if team not in self.__points:
                      return 0
                  return self.__points[team]

              def leader(self):
