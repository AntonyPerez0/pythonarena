      - task: |
          In this trip expenses app, the user interface does work that belongs to the logic: `report` adds up the amounts and finds the largest one itself. Move that work into `Expenses`, where it can be used and tested without the user interface:

          - `total()` returns the sum of the amounts, and 0 when there are none.
          - `largest()` returns the largest amount, and 0 when there are none.

          Then change `report` so that it only asks `Expenses` for these two numbers and prints them. The app should work exactly as before, for example:

          ```
          > add
          amount: 25
          > add
          amount: 40
          > report
          total 65, largest 40
          > add
          amount: 12
          > report
          total 77, largest 40
          > quit
          ```
        seed: |
          class Expenses:
              def __init__(self):
                  self.__amounts = []

              def add(self, amount):
                  self.__amounts.append(amount)

              def amounts(self):
                  return self.__amounts


          class ExpensesApp:
              def __init__(self):
                  self.__expenses = Expenses()

              def add(self):
                  amount = int(input("amount: "))
                  self.__expenses.add(amount)

              def report(self):
                  total = 0
                  largest = 0
                  for amount in self.__expenses.amounts():
                      total += amount
                      if amount > largest:
                          largest = amount
                  print(f"total {total}, largest {largest}")

              def run(self):
                  while True:
                      command = input("> ")
                      if command == "quit":
                          break
                      elif command == "add":
                          self.add()
                      elif command == "report":
                          self.report()


          if __name__ == "__main__":
              app = ExpensesApp()
              app.run()
        solution: |
          class Expenses:
              def __init__(self):
                  self.__amounts = []

              def add(self, amount):
                  self.__amounts.append(amount)

              def amounts(self):
                  return self.__amounts

              def total(self):
                  return sum(self.__amounts)

              def largest(self):
                  if len(self.__amounts) == 0:
                      return 0
                  return max(self.__amounts)


          class ExpensesApp:
              def __init__(self):
                  self.__expenses = Expenses()

              def add(self):
                  amount = int(input("amount: "))
                  self.__expenses.add(amount)

              def report(self):
                  total = self.__expenses.total()
                  largest = self.__expenses.largest()
                  print(f"total {total}, largest {largest}")

              def run(self):
                  while True:
                      command = input("> ")
                      if command == "quit":
                          break
                      elif command == "add":
                          self.add()
                      elif command == "report":
                          self.report()


          if __name__ == "__main__":
              app = ExpensesApp()
              app.run()
        hints:
          - "Write `def total(self):` and `def largest(self):` in `Expenses`. Inside the class, the amounts are in `self.__amounts`."
          - "`sum` adds up a list. `max` finds the largest item, but it stops with an error on an empty list, so check `len(self.__amounts) == 0` first and return 0."
          - "In `report`, the loop goes away: get the two numbers with `self.__expenses.total()` and `self.__expenses.largest()`, and print them as before."
        require:
