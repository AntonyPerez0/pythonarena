      class Pantry:
          def __init__(self):
              self.__items = {}

          def add(self, item, amount):
              if item not in self.__items:
                  self.__items[item] = 0
              self.__items[item] += amount

          def amount(self, item):
              if item not in self.__items:
                  return 0
              return self.__items[item]


      class PantryApp:
          def __init__(self):
              self.__pantry = Pantry()

          def add_item(self):
              item = input("item: ")
              amount = int(input("amount: "))
              self.__pantry.add(item, amount)

          def check(self):
              item = input("item: ")
              print(f"{item}: {self.__pantry.amount(item)}")

          def execute(self):
              while True:
                  command = input("command (1 add, 2 check, 0 quit): ")
                  if command == "0":
                      break
                  elif command == "1":
                      self.add_item()
                  elif command == "2":
                      self.check()


      if __name__ == "__main__":
          app = PantryApp()
          app.execute()
    hints:
      - "Write `def add_item(self):` in `PantryApp`, and move the three lines of command 1 into it. Do the same for command 2 with `def check(self):`."
      - "In `execute`, the branches become one line each: `self.add_item()` and `self.check()`."
      - "The methods use the pantry through `self.__pantry`, just as the loop did."
    require:
      - pattern: def\s+add_item\s*\(\s*self\s*\)
        message: "Write the method `add_item(self)` for command 1."
