      - task: |
          Write the logic class of a scoreboard for a quiz night. A `Scoreboard` keeps each team's total points, and has these methods:

          - `add_points(team, points)` adds points to the team's total. A team that isn't on the board yet starts from 0.
          - `points(team)` returns the team's total, and 0 for a team that isn't on the board.
          - `leader()` returns the name of the team with the most points. If two teams have the most, it's the one that came on the board first. When the board is empty, it returns `None`.

          For example,

          ```python fragment
          board = Scoreboard()
          print(board.leader())
          board.add_points("Owls", 5)
          board.add_points("Foxes", 7)
          board.add_points("Owls", 4)
          print(board.points("Owls"))
          print(board.points("Bears"))
          print(board.leader())
          ```

          should print:

          ```
          None
          9
          0
          Owls
          ```
        seed: |
          # Write the class Scoreboard here.


          if __name__ == "__main__":
              board = Scoreboard()
              board.add_points("Owls", 5)
              print(board.points("Owls"))
              print(board.leader())
        solution: |
          class Scoreboard:
              def __init__(self):
                  self.__points = {}

              def add_points(self, team, points):
                  if team not in self.__points:
                      self.__points[team] = 0
                  self.__points[team] += points

              def points(self, team):
                  if team not in self.__points:
                      return 0
                  return self.__points[team]

              def leader(self):
                  best = None
                  for team in self.__points:
                      if best is None or self.__points[team] > self.__points[best]:
                          best = team
                  return best


          if __name__ == "__main__":
              board = Scoreboard()
              board.add_points("Owls", 5)
              print(board.points("Owls"))
              print(board.leader())
        hints:
          - "Keep the points in a dictionary in a private attribute: the team is the key, and its total the value."
          - "`add_points` works like `add_sighting`: create the key with 0 if it's missing, then add with `+=`."
          - "In `leader`, keep the best team so far in a variable that starts as `None`. Go through the teams, and replace the best one when it's still `None` or the team has more points. With `>` (not `>=`), a tie keeps the team that came first."
