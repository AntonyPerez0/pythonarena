  - id: larger-application-objects
    slug: objects-in-dictionary
    title: Objects in a dictionary
    text: |
      The values of a dictionary can be any values, objects of your own classes too. Here each species in the log is a `Species` object, which keeps a list of the places where it was seen:

      ```python run
      class Species:
          def __init__(self, name):
              self.name = name
              self.places = []

          def add_place(self, place):
              self.places.append(place)

          def __str__(self):
              return f"{self.name}: {', '.join(self.places)}"


      sightings = [("robin", "park"), ("heron", "lake"), ("robin", "garden")]
      log = {}
      for name, place in sightings:
          if name not in log:
              log[name] = Species(name)
          log[name].add_place(place)

      for name in log:
          print(log[name])
      ```

      ```output
      robin: park, garden
      heron: lake
      ```

      The loop first makes sure the species has an object: if the name isn't a key yet, it creates a new `Species` and puts it in the dictionary. After that `if`, the object is surely there, either just created or made on an earlier round. `log[name].add_place(place)` does two things in one line: `log[name]` gets the object from the dictionary, and `.add_place(place)` calls its method. It could be written in two lines too:

      ```python fragment
      species = log[name]
      species.add_place(place)
      ```

      The variable `species` doesn't hold a copy. It refers to the very object that's in the dictionary, so the place is added to that object.

      ### A class for the data of one entry

      In the earlier steps, each species was just a list of places. Now the bird watcher wants to write a note about a species too. A list of places and a note are the data of one entry in the log, so they get a class of their own, and `BirdLog` keeps `Species` objects in its dictionary:

      ```python run
      class Species:
          def __init__(self, name):
              self.__name = name
              self.__places = []
              self.__note = None

          def places(self):
              return self.__places

          def note(self):
              return self.__note

          def add_place(self, place):
              self.__places.append(place)

          def set_note(self, note):
              self.__note = note


      class BirdLog:
          def __init__(self):
              self.__species = {}

          def __get_species(self, name):
              if name not in self.__species:
                  self.__species[name] = Species(name)
              return self.__species[name]

          def add_sighting(self, name, place):
              self.__get_species(name).add_place(place)

          def add_note(self, name, note):
              self.__get_species(name).set_note(note)

          def get(self, name):
              if name not in self.__species:
                  return None
              return self.__species[name]


      log = BirdLog()
      log.add_sighting("robin", "park")
      log.add_sighting("robin", "garden")
      log.add_note("robin", "red breast, sings at dawn")
      log.add_note("owl", "heard, not seen")
      robin = log.get("robin")
      print(robin.places())
      print(robin.note())
      print(log.get("owl").places())
      print(log.get("eagle"))
      ```

      ```output
      ['park', 'garden']
      red breast, sings at dawn
      []
      None
      ```

      The private helper `__get_species` finds the object for a name, and creates it first if needed, so `add_sighting` and `add_note` don't both repeat that `if`. `get` returns the whole `Species` object, or `None` for a name that isn't in the log.

      Change one part at a time, and test it before you go on. Here the logic changed, so its test lines came first. The user interface changes only a little: `search` now gets a `Species` object and asks it for the places and the note, and a new command asks for a note and calls `add_note`.

      ```python fragment
      def search(self):
          name = input("species: ")
          species = self.__log.get(name)
          if species is None:
              print("not seen yet")
              return
          for place in species.places():
              print(place)
          if species.note() is not None:
              print("note:", species.note())
      ```

      **Your turn:** what does this program print? Type each line it prints.
