          class Scoreboard:
              def __init__(self):
                  self.__points = {}

              def add_points(self, team, points):
                  if team not in self.__points:
                      self.__points[team] = 0
                  self.__points[team] += points

              def points(self, team):
                  if team not in self.__points:
                      return 0
                  return self.__points[team]

              def leader(self):
                  best = None
                  for team in self.__points:
                      if best is None or self.__points[team] > self.__points[best]:
                          best = team
                  return best


          class ScoreboardApp:
              def __init__(self):
                  self.__board = Scoreboard()

              def help(self):
                  print("commands: 1 add points, 2 show a team, 3 leader, 0 quit")

              def add_points(self):
                  team = input("team: ")
                  try:
                      points = int(input("points: "))
                  except ValueError:
                      print("points must be a whole number")
                      return
                  self.__board.add_points(team, points)

              def show(self):
                  team = input("team: ")
                  print(f"{team}: {self.__board.points(team)} points")

              def leader(self):
                  leader = self.__board.leader()
                  if leader is None:
                      print("no teams yet")
                  else:
                      print("leader:", leader)

              def execute(self):
                  self.help()
                  while True:
                      command = input("command: ")
                      if command == "0":
