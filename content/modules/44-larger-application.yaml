      class ReadingLog:
          def __init__(self):
              self.__lengths = {}
              self.__pages_read = {}

          def add_book(self, title, length):
              self.__lengths[title] = length
              self.__pages_read[title] = 0

          def has_book(self, title):
              return title in self.__lengths

          def read(self, title, pages):
              self.__pages_read[title] += pages

          def pages_left(self, title):
              return self.__lengths[title] - self.__pages_read[title]

          def percent(self, title):
              return self.__pages_read[title] * 100 // self.__lengths[title]


      if __name__ == "__main__":
          log = ReadingLog()
          log.add_book("Dune", 412)
          log.read("Dune", 103)
          print(log.percent("Dune"))
    hints:
      - "The pages read are in `self.__pages_read[title]` and the book's length in `self.__lengths[title]`."
      - "Multiply the pages read by 100 first, and then divide by the length with `//`, which rounds down. Dividing first would round down to 0 too early."
