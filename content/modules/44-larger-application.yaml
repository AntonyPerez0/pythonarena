          class Club:
              def __init__(self, name, leader, members):
                  self.name = name
                  self.leader = leader
                  self.members = members


          class ClubFile:
              def __init__(self, filename):
                  self.__filename = filename

              def load(self):
                  clubs = []
                  try:
                      with open(self.__filename) as file:
                          for line in file:
                              name, leader, *members = line.strip().split(",")
                              clubs.append(Club(name, leader, members))
                  except FileNotFoundError:
                      pass
                  return clubs

              def save(self, clubs):
                  with open(self.__filename, "w") as file:
                      for club in clubs:
                          parts = [club.name, club.leader] + club.members
                          file.write(",".join(parts) + "\n")


          class Clubs:
              def __init__(self):
                  self.__clubs = {}

              def add(self, club):
                  self.__clubs[club.name] = club

              def has_club(self, name):
                  return name in self.__clubs

              def join(self, name, member):
                  self.__clubs[name].members.append(member)

              def members(self, name):
                  return self.__clubs[name].members

              def all_clubs(self):
                  return list(self.__clubs.values())


          class ClubApp:
              def __init__(self, storage):
                  self.__clubs = Clubs()
                  self.__storage = storage
                  for club in self.__storage.load():
                      self.__clubs.add(club)

              def show_commands(self):
                  print("commands: join, show, quit")

              def join(self):
                  name = input("club: ")
                  if not self.__clubs.has_club(name):
                      print("no such club")
                      return
                  member = input("name: ")
                  self.__clubs.join(name, member)

              def show(self):
                  name = input("club: ")
                  if not self.__clubs.has_club(name):
                      print("no such club")
                      return
                  members = self.__clubs.members(name)
                  if len(members) == 0:
                      print("no members yet")
                  for member in members:
                      print(member)

              def save(self):
                  self.__storage.save(self.__clubs.all_clubs())

              def run(self):
                  self.show_commands()
                  while True:
                      command = input("> ")
                      if command == "quit":
                          self.save()
                          break
                      elif command == "join":
                          self.join()
                      elif command == "show":
                          self.show()
                      else:
                          self.show_commands()


          if __name__ == "__main__":
              app = ClubApp(ClubFile("clubs.txt"))
              app.run()
