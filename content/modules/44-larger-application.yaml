    solution: |
      class BirdLog:
          def __init__(self):
              self.__sightings = {}

          def add_sighting(self, species, place):
              if species not in self.__sightings:
                  self.__sightings[species] = []
              self.__sightings[species].append(place)

          def places(self, species):
              if species not in self.__sightings:
                  return None
              return self.__sightings[species]

          def species_at(self, place):
              found = []
              for species in self.__sightings:
                  if place in self.__sightings[species]:
                      found.append(species)
              return found


      if __name__ == "__main__":
          log = BirdLog()
          log.add_sighting("robin", "park")
          log.add_sighting("heron", "lake")
          print(log.species_at("park"))
    hints:
      - "Go through the species in the dictionary with a `for` loop, and collect the right ones into a new list."
      - "A species belongs in the list if `place in self.__sightings[species]`: its list of places has the place in it."
      - Each species is a key only once, so a loop over the keys adds it only once, however many times it was seen there.
