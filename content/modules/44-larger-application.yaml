  - id: larger-application-files
    slug: files
    title: Reading and saving the data
    text: |
      A bird log that forgets everything when the program ends isn't much use. The data should be saved in a file, and read back the next time the program starts. Handling the file is a responsibility of its own, so it gets a class of its own too.

      The file has one line for each species: the species first, then the places, separated by semicolons:

      ```text
      robin;park;garden
      magpie;park
      ```

      ### Taking the rest of a list

      When a line is split at the semicolons, the first part is the species and all the other parts are places, however many there are. Python can take a list apart this way, with a **starred assignment**: a `*` in front of the last variable gives it a list of all the items that are left over.

      ```python repl
      >>> species, *places = "robin;park;garden".split(";")
      >>> species
      'robin'
      >>> places
      ['park', 'garden']
      >>> first, second, *rest = [1, 2, 3, 4, 5]
      >>> rest
      [3, 4, 5]
      >>> species, *places = ["heron"]
      >>> places
      []
      ```

      ### A class for the file

      `FileHandler` gets the file's name in its constructor. `load` reads the file into a dictionary of the same shape that `BirdLog` uses, and `save` writes such a dictionary back. The first time the program runs there's no file yet, so `load` catches the `FileNotFoundError` and returns an empty dictionary: an empty log is the right start. Before the class goes into the application, it's tested on its own:

      ```file birds.txt
      robin;park;garden
      magpie;park
      ```

      ```python run
      class FileHandler:
          def __init__(self, filename):
              self.__filename = filename

          def load(self):
              data = {}
              try:
                  with open(self.__filename) as file:
                      for line in file:
                          species, *places = line.strip().split(";")
                          data[species] = places
              except FileNotFoundError:
                  pass
              return data

          def save(self, data):
              with open(self.__filename, "w") as file:
                  for species, places in data.items():
                      file.write(";".join([species] + places) + "\n")


      handler = FileHandler("birds.txt")
      data = handler.load()
      print(data)
      data["robin"].append("forest")
      data["heron"] = ["lake"]
      handler.save(data)

      with open("birds.txt") as file:
          for line in file:
              print(line.strip())
      ```

      ```output
      {'robin': ['park', 'garden'], 'magpie': ['park']}
      robin;park;garden;forest
      magpie;park
      heron;lake
      ```

      `[species] + places` makes one list of the species and its places, and `";".join(...)` puts semicolons between them.

      ### Into the application

      The application reads the file once, when it starts, and keeps the data in its objects while it runs. When the user quits, it writes all of the data back, replacing what was in the file. This is usually the simplest way to work with a file: changing a file line by line in place is much harder. `BirdLog` gets one more method, `all_data()`, which returns its dictionary of sightings, and the user interface gets a `quit` method that saves:

      ```python fragment
      class BirdLogApp:
          def __init__(self, storage):
              self.__log = BirdLog()
              self.__storage = storage
              for species, places in self.__storage.load().items():
                  for place in places:
                      self.__log.add_sighting(species, place)

          def quit(self):
              self.__storage.save(self.__log.all_data())

          # help, add_sighting and search as before. In execute,
          # command 0 calls self.quit() before the break.


      if __name__ == "__main__":
          app = BirdLogApp(FileHandler("birds.txt"))
          app.execute()
      ```

      Notice that the app doesn't create its `FileHandler` itself: it gets one as a parameter. The name of the file is no concern of the user interface, so it's decided outside it. To keep the log in another file, or to test the app with a test file, you pass it another handler and don't change a line of `BirdLogApp`. This is called **dependency injection**: an object gets the things it depends on from outside.

