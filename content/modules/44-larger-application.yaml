          class Recipe:
              def __init__(self, name):
                  self.__name = name
                  self.__ingredients = []
                  self.__minutes = None

              def ingredients(self):
                  return self.__ingredients

              def minutes(self):
                  return self.__minutes

              def add_ingredient(self, ingredient):
                  self.__ingredients.append(ingredient)

              def set_minutes(self, minutes):
                  self.__minutes = minutes

              def __str__(self):
                  if self.__minutes is None:
                      time = "unknown"
                  else:
                      time = f"{self.__minutes} min"
                  return f"{self.__name} (ingredients: {len(self.__ingredients)}, time: {time})"


          class RecipeBox:
              def __init__(self):
                  self.__recipes = {}

              def __recipe(self, name):
                  if name not in self.__recipes:
                      self.__recipes[name] = Recipe(name)
                  return self.__recipes[name]

              def add_ingredient(self, name, ingredient):
                  self.__recipe(name).add_ingredient(ingredient)

              def set_minutes(self, name, minutes):
                  self.__recipe(name).set_minutes(minutes)

              def get(self, name):
                  if name not in self.__recipes:
                      return None
                  return self.__recipes[name]

              def quick(self, limit):
                  names = []
                  for name in self.__recipes:
                      minutes = self.__recipes[name].minutes()
                      if minutes is not None and minutes <= limit:
                          names.append(name)
                  return names


