id: larger-application
summary: Building a bigger program out of classes that each have one job. Application logic first, then a text user interface that delegates to it, objects as the values of a dictionary, a class for the data of one entry, and a class that reads the data from a file and saves it back.
steps:
  - id: larger-application-logic
    slug: logic
    title: Start with the application logic
    text: |
      Your programs are getting bigger. A program of a few hundred lines has more details than anyone can keep in mind at once, unless it's organized into parts.

      One of the oldest ideas in programming helps here: **separation of concerns**. Divide the program into parts so that each part takes care of one concern, one area of the work. Functions are one way to do this, and classes are another. With classes, the idea is often put as the **single responsibility principle**: each class, and the objects made from it, should have one job in the program.

      Most applications have at least three different jobs:

      - the **application logic**: the data the program is about, and the rules for handling it
      - the **user interface**: everything the user sees and types
      - **storage**: saving the data, for example in a file, so that it's still there the next time the program runs

      Each of these is a responsibility of its own, so each gets a class of its own. This module builds one application this way, step by step: a log for a bird watcher, which records where each species of bird has been seen.

      ### Start with the logic

      Where to start is up to you, but the logic is often a good place. It's the heart of the program, and it can be tested without any user interface. The log needs to record a sighting, a species seen at a place, and to tell where a species has been seen. A dictionary fits well: the species is the key, and its value is a list of places.

      ```python run
      class BirdLog:
          def __init__(self):
              self.__sightings = {}

          def add_sighting(self, species, place):
              if species not in self.__sightings:
                  self.__sightings[species] = []
              self.__sightings[species].append(place)

          def places(self, species):
              if species not in self.__sightings:
                  return None
              return self.__sightings[species]


      log = BirdLog()
      log.add_sighting("robin", "park")
      log.add_sighting("heron", "lake")
      log.add_sighting("robin", "garden")
      print(log.places("robin"))
      print(log.places("heron"))
      print(log.places("eagle"))
      ```

      ```output
      ['park', 'garden']
      ['lake']
      None
      ```

      `places` returns `None` for a species that isn't in the log. The lines at the end are only there to test the class.

      ### Test as you go

      Try out every new method as soon as you have written it, with a few lines like the ones above. If something's wrong, you know where to look: in the code you just wrote. If you write fifty lines before you test anything, the bug could be anywhere in them. Once the class works, delete the test lines, or move them under `if __name__ == "__main__":`.

      ### Logic returns, it doesn't print

      `BirdLog` never prints anything and never asks for input. It returns its answers, and leaves it to the user interface to decide how to show them. That's not a detail. The same logic class can then serve a text interface, a web page or a program that tests it, without a single change.

      **Your turn:** add the method `species_at(place)` to `BirdLog`. It returns a list of the species that have been seen at the given place, in the order they were added to the log, each species only once. For a place where no birds have been seen, it returns an empty list. For example,

      ```python fragment
      log = BirdLog()
      log.add_sighting("robin", "park")
      log.add_sighting("heron", "lake")
      log.add_sighting("magpie", "park")
      log.add_sighting("robin", "park")
      print(log.species_at("park"))
      print(log.species_at("lake"))
      print(log.species_at("forest"))
      ```

      should print:

      ```
      ['robin', 'magpie']
      ['heron']
      []
      ```
