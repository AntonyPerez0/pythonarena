      - task: |
          The method `undone` of `TodoList` prints the tasks that aren't done yet. But showing things to the user is the user interface's job, and a logic class that prints can't be used anywhere else. Change `undone` so that it **returns** the tasks that aren't done, as a list in the order they were added, and prints nothing. For example,

          ```python fragment
          todo = TodoList()
          todo.add("wash the car")
          todo.add("call grandma")
          todo.add("water the plants")
          todo.mark_done("call grandma")
          print(todo.undone())
          ```

          should print:

          ```
          ['wash the car', 'water the plants']
          ```
        seed: |
          class TodoList:
              def __init__(self):
                  self.__tasks = {}

              def add(self, task):
                  self.__tasks[task] = False

              def mark_done(self, task):
                  if task in self.__tasks:
                      self.__tasks[task] = True

              def undone(self):
                  for task in self.__tasks:
                      if not self.__tasks[task]:
                          print(task)


          if __name__ == "__main__":
              todo = TodoList()
              todo.add("wash the car")
              todo.add("call grandma")
              todo.mark_done("call grandma")
              print(todo.undone())
        solution: |
          class TodoList:
              def __init__(self):
                  self.__tasks = {}

              def add(self, task):
                  self.__tasks[task] = False

              def mark_done(self, task):
                  if task in self.__tasks:
                      self.__tasks[task] = True

              def undone(self):
                  tasks = []
                  for task in self.__tasks:
                      if not self.__tasks[task]:
                          tasks.append(task)
                  return tasks


          if __name__ == "__main__":
              todo = TodoList()
              todo.add("wash the car")
              todo.add("call grandma")
              todo.mark_done("call grandma")
              print(todo.undone())
        hints:
          - "Instead of printing each task, collect the tasks into a new list."
          - "Start with an empty list, `append` each task that isn't done, and `return` the list after the loop."
