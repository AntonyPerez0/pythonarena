  - id: larger-application-interface
    slug: user-interface
    title: A text user interface
    text: |
      With the logic working, the application needs a user interface. A simple one is text: the program asks for a command, carries it out, and asks for the next one, until the user wants to quit. The user interface gets a class of its own, `BirdLogApp`. It creates a `BirdLog` and keeps it in a private attribute.

      ```python run
      class BirdLog:
          def __init__(self):
              self.__sightings = {}

          def add_sighting(self, species, place):
              if species not in self.__sightings:
                  self.__sightings[species] = []
              self.__sightings[species].append(place)

          def places(self, species):
              if species not in self.__sightings:
                  return None
              return self.__sightings[species]


      class BirdLogApp:
          def __init__(self):
              self.__log = BirdLog()

          def help(self):
              print("commands:")
              print("1 add a sighting")
              print("2 search")
              print("0 quit")

          def add_sighting(self):
              species = input("species: ")
              place = input("place: ")
              self.__log.add_sighting(species, place)

          def search(self):
              species = input("species: ")
              places = self.__log.places(species)
              if places is None:
                  print("not seen yet")
                  return
              for place in places:
                  print(place)

          def execute(self):
              self.help()
              while True:
                  print()
                  command = input("command: ")
                  if command == "0":
                      break
                  elif command == "1":
                      self.add_sighting()
                  elif command == "2":
                      self.search()
                  else:
                      self.help()


      if __name__ == "__main__":
          app = BirdLogApp()
          app.execute()
      ```

      ```input
      1
      robin
      park
      1
      robin
      garden
      2
      robin
      2
      eagle
      0
      ```

      ```output
      commands:
      1 add a sighting
      2 search
      0 quit

      command: 1
      species: robin
      place: park

      command: 1
      species: robin
      place: garden

      command: 2
      species: robin
      park
      garden

      command: 2
      species: eagle
      not seen yet

      command: 0
      ```

      Look at how the work is shared:

      - `execute` is the main loop. It reads a command and **delegates**: it calls the method that handles that command, and does nothing else.
      - `add_sighting` and `search` each handle one command. They ask the user for what they need, call `BirdLog`'s methods, and print the results.
      - `help` prints the list of commands, at the start and whenever the user types something the app doesn't know.
      - The user interface never touches the dictionary of sightings. Storing a sighting is `BirdLog`'s job.

      Everything could have been written into one long `while` loop, and the program would even be a bit shorter. But each new command would make that loop longer and harder to follow. With a method for each command, you know where to look: to change how searching works, you go to `search`, and nothing else is affected. Adding a command takes three small changes: a line in `help`, a new method, and an `elif` in `execute`.

      Both classes have a method called `add_sighting`, and that's fine. `BirdLogApp`'s asks the user, while `BirdLog`'s stores the data. They never get mixed up, since each one is called on an object of its own class.

      **Your turn:** the pantry app works, but its `execute` does everything itself. Move the code of each command into a method of its own: `add_item()` for command 1 and `check()` for command 2. Then `execute` only reads the command and calls the right method. The app should work exactly as before, for example:

      ```
      command (1 add, 2 check, 0 quit): 1
      item: rice
      amount: 2
      command (1 add, 2 check, 0 quit): 1
      item: rice
      amount: 3
      command (1 add, 2 check, 0 quit): 2
      item: rice
      rice: 5
      command (1 add, 2 check, 0 quit): 2
      item: salt
      salt: 0
      command (1 add, 2 check, 0 quit): 0
      ```
