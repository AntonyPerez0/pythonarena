          class Club:
              def __init__(self, name, leader, members):
                  self.name = name
                  self.leader = leader
                  self.members = members

              def __str__(self):
                  return f"{self.name} ({self.leader}), members: {len(self.members)}"


          class ClubFile:
              def __init__(self, filename):
                  self.__filename = filename

              def load(self):
                  clubs = []
                  try:
                      with open(self.__filename) as file:
                          for line in file:
                              name, leader, *members = line.strip().split(",")
                              clubs.append(Club(name, leader, members))
                  except FileNotFoundError:
                      pass
                  return clubs

              def save(self, clubs):
                  with open(self.__filename, "w") as file:
                      for club in clubs:
                          parts = [club.name, club.leader] + club.members
                          file.write(",".join(parts) + "\n")


