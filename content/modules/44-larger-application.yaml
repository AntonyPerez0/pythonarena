          The quiz night's `Scoreboard` from the previous step is ready. Write its text user interface, the class `ScoreboardApp`. Its method `execute` first prints the commands, `commands: 1 add points, 2 show a team, 3 leader, 0 quit`, and then reads commands until the user types 0:

