        solution: |
          class OpenSet:
              def __init__(self):
                  self.slots = [None] * 4
                  self.count = 0

              def _find(self, key):
                  i = hash(key) % len(self.slots)
                  while self.slots[i] is not None and self.slots[i] != key:
                      i = (i + 1) % len(self.slots)
                  return i

              def add(self, key):
                  i = self._find(key)
                  if self.slots[i] == key:
                      return False
                  self.slots[i] = key
                  self.count += 1
                  if self.count * 3 > len(self.slots) * 2:
                      old = self.slots
                      self.slots = [None] * (len(old) * 2)
                      for k in old:
                          if k is not None:
                              self.slots[self._find(k)] = k
                  return True

              def contains(self, key):
                  return self.slots[self._find(key)] == key


          if __name__ == "__main__":
              s = OpenSet()
              print(s.add(7), s.add(15), s.add(7))
              print(s.slots)
              print(s.contains(15), s.contains(23))
