      - task: |
          Write a class `OpenSet`: a set that keeps its keys with open addressing and linear probing, as the last example of the lesson does. The keys sit in one list, `self.slots`, where `None` marks an empty slot (a key is never `None`), and `self.count` is the number of keys. The seed starts with 4 slots and a count of 0.

          - The search for a key starts at slot `hash(key) % len(self.slots)` and moves one slot to the right at a time, back to slot 0 after the last one, until it reaches the key or an empty slot.
          - `add(key)` returns `False` when the search reaches the key. Otherwise it stores the key in the empty slot the search reached, adds one to `self.count`, and returns `True`.
          - `contains(key)` returns whether the key is in the set.
          - Like Python's dict, the table grows when more than two-thirds of its slots are taken. After `add` stores a new key, if `self.count * 3 > len(self.slots) * 2`, the table makes twice as many empty slots and stores every key again: a key's first slot depends on the number of slots.

          The hidden test adds 100,000 keys and looks up 100,000: `key in self.slots` would search the whole list every time.

          For example, this program:

          ```python fragment
          s = OpenSet()
          print(s.add(7), s.add(15), s.add(7))
          print(s.slots)
          print(s.contains(15), s.contains(23))
          ```

          prints (7 and 15 both start at slot 3, the last one, so 15 goes around to slot 0; a search for 23 starts at slot 3, goes on to slot 0 and stops at the empty slot 1):

          ```
          True True False
          [15, None, None, 7]
          True False
          ```
