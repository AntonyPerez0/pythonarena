      class HashMap:
          def __init__(self):
              self.buckets = [[] for i in range(8)]
              self.count = 0

          def _index(self, key):
              return hash(key) % len(self.buckets)

          def put(self, key, value):
              bucket = self.buckets[self._index(key)]
              for pair in bucket:
                  if pair[0] == key:
                      pair[1] = value
                      return
              bucket.append([key, value])
              self.count += 1
              if self.count / len(self.buckets) > 0.75:
                  self._grow()

          def get(self, key):
              for pair in self.buckets[self._index(key)]:
                  if pair[0] == key:
                      return pair[1]
              return None

          def _grow(self):
              old = self.buckets
              self.buckets = [[] for i in range(len(old) * 2)]
              for bucket in old:
                  for pair in bucket:
                      self.buckets[self._index(pair[0])].append(pair)


      if __name__ == "__main__":
          table = HashMap()
          for key in range(6):
              table.put(key, key * 10)
          print(len(table.buckets))
          table.put(6, 60)
          print(len(table.buckets), table.get(3), table.get(6))
