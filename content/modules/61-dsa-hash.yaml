      - task: |
          A computer's memory holds `capacity` pages, and a program asks for pages one after another. When the page it asks for is in memory, that's a hit, and the page becomes the most recently used. When it isn't, that's a **miss**: the page is loaded, and if the memory is already full, the least recently used page is dropped to make room.

          Write `count_misses(requests, capacity)` that returns the number of misses, for a memory that starts empty. The hidden test has 300,000 requests and a capacity of 40,000.

          For example, `count_misses([1, 2, 1, 3, 2, 4, 1, 2], 3)` returns (1, 2 and 3 load, 4 pushes out 1, and the next 1 pushes out 3):

          ```
          5
          ```
        seed: |
          from collections import OrderedDict


