        solution: |
          class HashSet:
              def __init__(self, bucket_count):
                  self.buckets = [[] for i in range(bucket_count)]
                  self.count = 0

              def add(self, key):
                  bucket = self.buckets[hash(key) % len(self.buckets)]
                  if key in bucket:
                      return False
                  bucket.append(key)
                  self.count += 1
                  return True

              def contains(self, key):
                  return key in self.buckets[hash(key) % len(self.buckets)]

              def size(self):
                  return self.count


          if __name__ == "__main__":
              s = HashSet(8)
              print(s.add(3), s.add(11), s.add(3))
              print(s.contains(11), s.contains(19), s.size())
