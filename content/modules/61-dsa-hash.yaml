              pass


          if __name__ == "__main__":
              print(count_misses([1, 2, 1, 3, 2, 4, 1, 2], 3))
        solution: |
          from collections import OrderedDict


          def count_misses(requests, capacity):
              memory = OrderedDict()
              misses = 0
              for page in requests:
                  if page in memory:
                      memory.move_to_end(page)
                  else:
                      misses += 1
                      memory[page] = True
                      if len(memory) > capacity:
                          memory.popitem(last=False)
              return misses


          if __name__ == "__main__":
              print(count_misses([1, 2, 1, 3, 2, 4, 1, 2], 3))
        slow: |
          from collections import OrderedDict


          def count_misses(requests, capacity):
              memory = []
              misses = 0
              for page in requests:
                  if page in memory:
                      memory.remove(page)
                  else:
                      misses += 1
                      if len(memory) == capacity:
                          memory.pop(0)
                  memory.append(page)
              return misses


          if __name__ == "__main__":
              print(count_misses([1, 2, 1, 3, 2, 4, 1, 2], 3))
