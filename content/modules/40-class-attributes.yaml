      ```

      Some things to notice:

      - **Each class looks after its own data.** The rider never touches the station's list; it asks the station with `station.release()` and `station.dock(...)`. So the station alone decides whether there's room, and its list can stay private.
      - **One object, many places.** Bike 1 is created once. It moves from the park's list to Ada, to the harbor's list, to Ben, but it's always the same object; only references to it move around.
      - **`None` means "nothing here".** `release` returns `None` from an empty station, and `rent_from` checks for it before printing. The third bike made, number 3, never found room, so it exists in no list at all.
