id: class-attributes
summary: Values and methods that belong to the class itself. Class variables shared by all objects, class methods and static methods, default values for parameters (and the trap of a list as a default), and a larger program where several classes work together.
steps:
  - id: class-attributes-variables
    slug: class-variables
    title: Class variables
    text: |
      So far every object has had its own values for its attributes: two products, two prices. Sometimes a value belongs to the class as a whole and is shared by all its objects, such as a tax rate that's the same for every product. That's a **class variable**. You write it inside the class but outside any method, without `self.`:

      ```python run
      class Product:
          tax_percent = 24

          def __init__(self, name, price):
              self.name = name
              self.price = price

          def total_price(self):
              return self.price + self.price * Product.tax_percent / 100


      print("Tax:", Product.tax_percent, "%")
      bread = Product("Bread", 4)
      lamp = Product("Lamp", 50)
      print(bread.total_price(), lamp.total_price())

      Product.tax_percent = 10
      print(bread.total_price(), lamp.total_price())
      ```

      ```output
      Tax: 24 %
      4.96 62.0
      4.4 55.0
      ```

      You reach a class variable through the class's name: `Product.tax_percent`. It exists as soon as the class does, before any object is created, which is why the first `print` works. There is only one `tax_percent`, so changing it once changes the total price of every product.

      Attributes that each object has for itself, like `self.price`, are called **instance variables** (an object is an *instance* of its class). Any value can be a class variable, a list or a dictionary too.

      ### Counting objects

      A class variable can count how many objects have been created, and give each new object the next number:

      ```python run
      class Ticket:
          sold = 0

          def __init__(self, show):
              Ticket.sold += 1
              self.number = Ticket.sold
              self.show = show

          def __str__(self):
              return f"Ticket {self.number}: {self.show}"


      a = Ticket("Hamlet")
      b = Ticket("Hamlet")
      c = Ticket("Cats")
      print(a)
      print(c)
      print("Tickets sold:", Ticket.sold)
      ```

      ```output
      Ticket 1: Hamlet
      Ticket 3: Cats
      Tickets sold: 3
      ```

      `Ticket.sold` is shared, and `self.number` is each ticket's own copy of what it was at that moment.

      ### Change it through the class

      Inside a method, `self.sold` can *read* the class variable: when an object has no attribute of that name, Python looks in its class. But *assigning* to `self.sold` creates a new attribute in that one object, and the class variable doesn't change:

      ```python run
      class Ticket:
          sold = 0

          def __init__(self):
              self.sold += 1


      a = Ticket()
      b = Ticket()
      print(Ticket.sold, a.sold, b.sold)
      ```

      ```output
      0 1 1
      ```

      Each ticket now has its own `sold`, and the shared count is still 0. To change a class variable, always go through the class's name: `Ticket.sold += 1`.

      **Your turn:** every new club member should get the next member number. Fill in the blanks so the program prints:

      ```
      1 Ada
      2 Linus
      3 Grace
      Members: 3
      ```
    fill: |
      class Member:
          count = 0

          def __init__(self, name):
              Member.[[count]] += 1
              self.number = [[Member.count]]
              self.name = name


      members = [Member("Ada"), Member("Linus"), Member("Grace")]
      for member in members:
          print(member.number, member.name)
      print("Members:", Member.count)
    hints:
      - "The shared counter is the class variable `count`, and you change it through the class's name."
      - "First `Member.count += 1`, then give the new member the current count: `self.number = Member.count`."
    tests:
      - expect: |
          1 Ada
          2 Linus
          3 Grace
          Members: 3
    more:
      - task: |
          What does this program print? Type each line it prints.
        predict: |
          class Lamp:
              watts = 40

              def __init__(self, room):
                  self.room = room

              def describe(self):
                  return f"{self.room}: {Lamp.watts} W"


          desk = Lamp("study")
          hall = Lamp("hall")
          print(desk.describe())
          Lamp.watts = 60
          print(desk.describe())
          print(hall.describe())
        hints:
          - "`watts` is a class variable: there is only one, shared by both lamps."
          - "After `Lamp.watts = 60`, every lamp's `describe` uses 60."
      - task: |
          Write the class `Coin`. It has two class variables:

          - `values`, a dictionary of the value in cents of each kind of coin: `"penny"` is 1, `"nickel"` is 5, `"dime"` is 10 and `"quarter"` is 25;
          - `minted`, the number of coins created so far, at first 0.

          The constructor takes the kind of coin (one of the keys of `values`), stores it in the attribute `kind`, and adds one to `minted`. The method `cents(self)` returns the coin's value from the dictionary.

          For example, this code:

          ```python fragment
          print(Coin.values["dime"])
          purse = [Coin("quarter"), Coin("penny"), Coin("dime")]
          total = 0
          for coin in purse:
              total += coin.cents()
          print(total)
          print(Coin.minted)
          ```

          prints:

          ```
          10
          36
          3
          ```
        seed: |
          class Coin:
              pass


          if __name__ == "__main__":
              print(Coin.values["dime"])
              purse = [Coin("quarter"), Coin("penny"), Coin("dime")]
              total = 0
              for coin in purse:
                  total += coin.cents()
              print(total)
              print(Coin.minted)
        solution: |
          class Coin:
              values = {"penny": 1, "nickel": 5, "dime": 10, "quarter": 25}
              minted = 0

              def __init__(self, kind):
                  self.kind = kind
                  Coin.minted += 1

              def cents(self):
                  return Coin.values[self.kind]


          if __name__ == "__main__":
              print(Coin.values["dime"])
              purse = [Coin("quarter"), Coin("penny"), Coin("dime")]
              total = 0
              for coin in purse:
                  total += coin.cents()
              print(total)
              print(Coin.minted)
        hints:
          - "Both class variables go at the top of the class, outside any method: `values = {...}` and `minted = 0`."
          - "In `__init__`, add one with the class's name: `Coin.minted += 1`."
          - "`cents` looks up the coin's kind in the shared dictionary: `Coin.values[self.kind]`."
        tests:
          - call: |
              print(Coin.values["dime"])
              purse = [Coin("quarter"), Coin("penny"), Coin("dime")]
              total = 0
              for coin in purse:
                  total += coin.cents()
              print(total)
              print(Coin.minted)
          - call: |
              print(Coin.minted)
              print(Coin("nickel").cents())
              print(Coin("quarter").cents() + Coin("quarter").cents())
              print(Coin.minted)
              print(Coin.values["penny"], Coin("penny").kind)
            hidden: true

  - id: class-attributes-methods
    slug: class-methods
    title: Class methods and static methods
    text: |
      Methods can belong to the class too. You call such a method through the class's name, without creating an object first.

      A **class method** has the decorator `@classmethod` above it, and its first parameter is **`cls`** instead of `self`. Where `self` is the object, `cls` is the class itself, and Python fills it in for you just as it fills in `self`. A **static method** has the decorator `@staticmethod` and no such parameter at all: it's an ordinary function that lives in the class because it belongs with it.

      ```python run
      class Time:
          def __init__(self, hours, minutes):
              if not Time.valid(hours, minutes):
                  raise ValueError(f"Not a valid time: {hours}:{minutes}")
              self.hours = hours
              self.minutes = minutes

          @staticmethod
          def valid(hours, minutes):
              return 0 <= hours < 24 and 0 <= minutes < 60

          @classmethod
          def from_text(cls, text):
              parts = text.split(":")
              return cls(int(parts[0]), int(parts[1]))

          @classmethod
          def midnight(cls):
              return cls(0, 0)

          def __str__(self):
              return f"{self.hours:02}:{self.minutes:02}"


      print(Time.valid(25, 0))
      lunch = Time.from_text("12:30")
      print(lunch)
      print(Time.midnight())
      ```

      ```output
      False
      12:30
      00:00
      ```

      (In the f-string, `:02` writes a number with at least two digits, padding it with a zero.)

      - `Time.valid(25, 0)` checks a time without creating any object. A program reading times from the user could check each one before creating a `Time`, and the constructor uses the same check, also through the class's name.
      - `from_text` and `midnight` create new objects: `cls(...)` calls the class, exactly as `Time(...)` would. Class methods like these are a handy way to offer more than one way to create an object.

      ### Which one to choose

      Both kinds are called the same way, `Time.valid(...)` or `Time.from_text(...)`. The difference is what they get:

      - an ordinary method gets the object (`self`), and is called on an object;
      - a class method gets the class (`cls`), so it can create objects with `cls(...)` and use class variables as `cls.name`;
      - a static method gets neither, so it can only use its own parameters.

      A class method that works with a class variable:

      ```python run
      class Ticket:
          sold = 0

          def __init__(self):
              Ticket.sold += 1

          @classmethod
          def sales_report(cls):
              return f"{cls.sold} tickets sold"


      Ticket()
      Ticket()
      print(Ticket.sales_report())
      ```

      ```output
      2 tickets sold
      ```

      Calling an ordinary method through the class doesn't work, because there is no object to be its `self`. `Time.__str__()` would stop with `TypeError: Time.__str__() missing 1 required positional argument: 'self'`.

      **Your turn:** fill in the blanks so that `Rectangle.square(side)` is a class method that creates a square, and the program prints:

      ```
      3 x 3
      9
      ```
    fill: |
      class Rectangle:
          def __init__(self, width, height):
              self.width = width
              self.height = height

          @[[classmethod]]
          def square(cls, side):
              return [[cls]](side, side)

          def area(self):
              return self.width * self.height

          def __str__(self):
              return f"{self.width} x {self.height}"


      tile = Rectangle.square(3)
      print(tile)
      print(tile.area())
    hints:
      - "The method is called through the class, `Rectangle.square(3)`, and its first parameter is `cls`. Which decorator does it need?"
      - "The decorator is `@classmethod`, and `cls(side, side)` creates the new object, just like `Rectangle(side, side)`."
    tests:
      - expect: |
          3 x 3
          9
    more:
      - task: |
          A product code looks like `ABC-1234`: three capital letters, a dash and four digits. Write the class `Product`:

          - a static method `valid_code(code)` that returns `True` if the code has exactly that shape, and `False` otherwise;
          - a constructor that takes a code and a name, and raises `ValueError("Invalid code")` if the code isn't valid (use the static method). It stores them in the attributes `code` and `name`.

          For example, this code:

          ```python fragment
          print(Product.valid_code("ABC-1234"))
          print(Product.valid_code("AB-12345"))
          lamp = Product("LMP-0042", "Desk lamp")
          print(lamp.name)
          ```

          prints:

          ```
          True
          False
          Desk lamp
          ```
        seed: |
          class Product:
              pass


          if __name__ == "__main__":
              print(Product.valid_code("ABC-1234"))
              print(Product.valid_code("AB-12345"))
              lamp = Product("LMP-0042", "Desk lamp")
              print(lamp.name)
        solution: |
          class Product:
              def __init__(self, code, name):
                  if not Product.valid_code(code):
                      raise ValueError("Invalid code")
                  self.code = code
                  self.name = name

              @staticmethod
              def valid_code(code):
                  if len(code) != 8 or code[3] != "-":
                      return False
                  for char in code[:3]:
                      if char not in "ABCDEFGHIJKLMNOPQRSTUVWXYZ":
                          return False
                  for char in code[4:]:
                      if char not in "0123456789":
                          return False
                  return True


          if __name__ == "__main__":
              print(Product.valid_code("ABC-1234"))
              print(Product.valid_code("AB-12345"))
              lamp = Product("LMP-0042", "Desk lamp")
              print(lamp.name)
        hints:
          - "A valid code is 8 characters long and has a dash at index 3. Check that first and return `False` if not."
          - "Then check the first three characters (`code[:3]`) one by one: each must be in `\"ABCDEFGHIJKLMNOPQRSTUVWXYZ\"`. Do the same for the last four (`code[4:]`) with the digits."
          - "The constructor calls the check through the class, `Product.valid_code(code)`, and raises the error when it gives `False`."
        require:
          - pattern: '@staticmethod'
            raw: true
            message: Make `valid_code` a static method, with `@staticmethod` above it.
        tests:
          - call: |
              print(Product.valid_code("ABC-1234"))
              print(Product.valid_code("AB-12345"))
              lamp = Product("LMP-0042", "Desk lamp")
              print(lamp.name)
          - call: |
              for code in ["XYZ-0000", "xyz-0000", "XYZ-00a0", "XYZ_0000", "XYZ-00000", "XY1-0000", ""]:
                  print(code, Product.valid_code(code))
            hidden: true
          - call: |
              try:
                  Product("toy-1", "Yo-yo")
                  print("created")
              except ValueError as error:
                  print(error)
              item = Product("TOY-0001", "Yo-yo")
              print(item.code, item.name)
            hidden: true
      - task: |
          Write the class `Order`. Each new order gets the next number from the class variable `next_number`, which starts at 1: the first order is number 1, the next number 2, and so on. The class has:

          - a constructor that takes the customer's name, stores it in `customer`, and gives the order its `number`;
          - a class method `start_numbering(cls, number)` that sets the number the next order will get;
          - `__str__`, which returns a string such as `Order 1 for Ada`.

          For example, this code:

          ```python fragment
          print(Order("Ada"))
          print(Order("Ben"))
          Order.start_numbering(100)
          print(Order("Cy"))
          print(Order.next_number)
          ```

          prints:

          ```
          Order 1 for Ada
          Order 2 for Ben
          Order 100 for Cy
          101
          ```
        seed: |
          class Order:
              next_number = 1


          if __name__ == "__main__":
              print(Order("Ada"))
              print(Order("Ben"))
              Order.start_numbering(100)
              print(Order("Cy"))
              print(Order.next_number)
        solution: |
          class Order:
              next_number = 1

              def __init__(self, customer):
                  self.customer = customer
                  self.number = Order.next_number
                  Order.next_number += 1

              @classmethod
              def start_numbering(cls, number):
                  cls.next_number = number

              def __str__(self):
                  return f"Order {self.number} for {self.customer}"


          if __name__ == "__main__":
              print(Order("Ada"))
              print(Order("Ben"))
              Order.start_numbering(100)
              print(Order("Cy"))
              print(Order.next_number)
        hints:
          - "In `__init__`, first give the order the current `Order.next_number`, then add one to the class variable."
          - "The class method changes the class variable through `cls`: `cls.next_number = number`."
          - "Don't write `self.next_number += 1`: that would give the order an attribute of its own and leave the shared counter as it was."
        require:
          - pattern: '@classmethod'
            raw: true
            message: Make `start_numbering` a class method, with `@classmethod` above it.
        tests:
          - call: |
              print(Order("Ada"))
              print(Order("Ben"))
              Order.start_numbering(100)
              print(Order("Cy"))
              print(Order.next_number)
          - call: |
              Order.start_numbering(7)
              first = Order("Kim")
              second = Order("Lou")
              print(first.number, second.number)
              print(first)
              Order.start_numbering(1)
              print(Order("Max"))
              print(second)
            hidden: true

  - id: class-attributes-defaults
    slug: default-values
    title: Default values for parameters
    text: |
      In part 7 you gave a function's parameters **default values**, used whenever the caller leaves the argument out. Methods and constructors can have them too. They're handy when most objects start the same way:

      ```python run
      class Character:
          def __init__(self, name, health=100, level=1):
              self.name = name
              self.health = health
              self.level = level

          def heal(self, amount=10):
              self.health += amount

          def __str__(self):
              return f"{self.name}: health {self.health}, level {self.level}"


      ana = Character("Ana")
      bo = Character("Bo", 80)
      cy = Character("Cy", level=5)
      bo.heal()
      bo.heal(5)
      print(ana)
      print(bo)
      print(cy)
      ```

      ```output
      Ana: health 100, level 1
      Bo: health 95, level 1
      Cy: health 100, level 5
      ```

      Arguments fill the parameters in order, so `Character("Bo", 80)` sets the health. To give a later parameter and skip an earlier one, name it: `Character("Cy", level=5)` is a **keyword argument**. Writing `Character("Cy", 5)` would set the health to 5, not the level.

      Parameters with default values come after the ones without. `def __init__(self, health=100, name):` is a syntax error: `parameter without a default follows parameter with a default`.

      ### The trap: a list as a default value

      A default value is created only once, when Python reads the `def` line, not on every call. For a number or a string that never matters. For a list it does, because a list can change. Every object that gets the default ends up with *the same list*:

      ```python run
      class Backpack:
          def __init__(self, owner, items=[]):
              self.owner = owner
              self.items = items

          def pack(self, item):
              self.items.append(item)


      ana = Backpack("Ana")
      bo = Backpack("Bo")
      ana.pack("map")
      print(bo.items)
      print(ana.items is bo.items)
      ```

      ```output
      ['map']
      True
      ```

      Ana packed a map, and it turned up in Bo's backpack, because both backpacks refer to the one list that was made for the default.

      The fix is to use `None` as the default, and create a new list inside the method when the caller didn't give one:

      ```python run
      class Backpack:
          def __init__(self, owner, items=None):
              self.owner = owner
              if items is None:
                  self.items = []
              else:
                  self.items = items

          def pack(self, item):
              self.items.append(item)


      ana = Backpack("Ana")
      bo = Backpack("Bo")
      ana.pack("map")
      print(bo.items)
      print(Backpack("Cy", ["tent"]).items)
      ```

      ```output
      []
      ['tent']
      ```

      Now `self.items = []` runs on every call, so every backpack gets a list of its own. Never use a list (or a dictionary) as a default value; use `None` and create it in the method.

      **Your turn:** a meeting lasts 60 minutes unless told otherwise. Fill in the blank so that `minutes` has the default value 60, and the program prints:

      ```
      Standup: 15 min
      Planning: 60 min
      ```
    fill: |
      class Meeting:
          def __init__(self, title, [[minutes=60‖minutes = 60]]):
              self.title = title
              self.minutes = minutes

          def __str__(self):
              return f"{self.title}: {self.minutes} min"


      print(Meeting("Standup", 15))
      print(Meeting("Planning"))
    hints:
      - The blank is the second parameter, `minutes`, written together with its default value.
      - "A default value is written with `=` after the parameter's name: `minutes=60`."
    tests:
      - expect: |
          Standup: 15 min
          Planning: 60 min
    more:
      - task: |
          Two teams are created without any players, and then a player joins one of them, but she shows up in both teams. Fix the class so that every team gets a list of its own, while `Team("Blues", ["Kim"])` still starts with the players given. The program should print:

          ```
          Reds: Ada
          Blues:
          Greens: Kim, Lou
          ```
        seed: |
          class Team:
              def __init__(self, name, players=[]):
                  self.name = name
                  self.players = players

              def join(self, player):
                  self.players.append(player)

              def __str__(self):
                  return f"{self.name}: {', '.join(self.players)}"


          reds = Team("Reds")
          blues = Team("Blues")
          greens = Team("Greens", ["Kim"])
          reds.join("Ada")
          greens.join("Lou")
          print(reds)
          print(blues)
          print(greens)
        solution: |
          class Team:
              def __init__(self, name, players=None):
                  self.name = name
                  if players is None:
                      self.players = []
                  else:
                      self.players = players

              def join(self, player):
                  self.players.append(player)

              def __str__(self):
                  return f"{self.name}: {', '.join(self.players)}"


          reds = Team("Reds")
          blues = Team("Blues")
          greens = Team("Greens", ["Kim"])
          reds.join("Ada")
          greens.join("Lou")
          print(reds)
          print(blues)
          print(greens)
        hints:
          - "The default list `[]` is created only once, so every team without players of its own shares it."
          - "Make the default `None` instead: `players=None`."
          - "In `__init__`, if `players is None`, set `self.players = []`; otherwise use the list that was given."
        forbid:
          - pattern: =\s*\[\s*\]\s*[,)]
            message: "Don't use a list as a default value: use `None` and create the list inside `__init__`."
        tests:
          - expect: |
              Reds: Ada
              Blues:
              Greens: Kim, Lou
      - task: |
          Write the class `Alarm`. Its constructor takes the hour, the minute (by default 0) and a label (by default `"Alarm"`), and keeps them in the attributes `hour`, `minute` and `label`. The method `snooze(self, minutes=5)` moves the alarm later by the given number of minutes; when the minutes reach 60, the hour goes up by one (and after hour 23 comes hour 0). `__str__` returns a string such as `Wake up at 7:05`, with the minutes always written with two digits.

          For example, this code:

          ```python fragment
          early = Alarm(7, label="Wake up")
          print(early)
          early.snooze()
          print(early)
          late = Alarm(23, 50)
          late.snooze(15)
          print(late)
          ```

          prints:

          ```
          Wake up at 7:00
          Wake up at 7:05
          Alarm at 0:05
          ```
        seed: |
          class Alarm:
              pass


          if __name__ == "__main__":
              early = Alarm(7, label="Wake up")
              print(early)
              early.snooze()
              print(early)
              late = Alarm(23, 50)
              late.snooze(15)
              print(late)
        solution: |
          class Alarm:
              def __init__(self, hour, minute=0, label="Alarm"):
                  self.hour = hour
                  self.minute = minute
                  self.label = label

              def snooze(self, minutes=5):
                  total = self.hour * 60 + self.minute + minutes
                  self.hour = total // 60 % 24
                  self.minute = total % 60

              def __str__(self):
                  return f"{self.label} at {self.hour}:{self.minute:02}"


          if __name__ == "__main__":
              early = Alarm(7, label="Wake up")
              print(early)
              early.snooze()
              print(early)
              late = Alarm(23, 50)
              late.snooze(15)
              print(late)
        hints:
          - "Give the defaults in the parameter list: `def __init__(self, hour, minute=0, label=\"Alarm\"):` and `def snooze(self, minutes=5):`."
          - "In `snooze`, turn the time into minutes since midnight, add the snooze, then split it again: the hour is `total // 60 % 24` and the minute `total % 60`."
          - "In `__str__`, `{self.minute:02}` writes the minutes with two digits."
        tests:
          - call: |
              early = Alarm(7, label="Wake up")
              print(early)
              early.snooze()
              print(early)
              late = Alarm(23, 50)
              late.snooze(15)
              print(late)
          - call: |
              nap = Alarm(14, 30)
              print(nap)
              nap.snooze(30)
              print(nap)
              nap.snooze()
              print(nap.hour, nap.minute)
              gym = Alarm(6, 45, "Gym")
              gym.snooze(75)
              print(gym)
            hidden: true

  - id: class-attributes-example
    slug: classes-together
    title: Classes working together
    text: |
      To finish this part, here is a larger program where several classes work together: a small city bike system. Read it slowly, class by class. Everything in it is something you've already learned; the point is how the pieces fit.

      - A `Bike` has a number. A class variable hands out the numbers, and the model has a default value.
      - A `Station` has a fixed number of slots and a private list of the `Bike` objects docked there. `release` returns a bike, or `None` when the station is empty.
      - A `Rider` has at most one bike at a time: the attribute `bike` is `None` while they walk.

      ```python run
      class Bike:
          next_number = 1

          def __init__(self, model="city"):
