        solution: |
          class Bike:
              next_number = 1

              def __init__(self, model="city"):
                  self.number = Bike.next_number
                  Bike.next_number += 1
                  self.model = model

              @classmethod
              def batch(cls, count, model="city"):
                  bikes = []
                  for i in range(count):
                      bikes.append(cls(model))
                  return bikes

              def __str__(self):
                  return f"bike {self.number} ({self.model})"


          if __name__ == "__main__":
              first = Bike.batch(2)
              more = Bike.batch(3, "cargo")
              print(len(first), len(more))
              for bike in more:
                  print(bike)
