          class Network:
              def __init__(self):
                  self.__stations = []

              def add(self, station):
                  self.__stations.append(station)

              def total_bikes(self):
                  total = 0
                  for station in self.__stations:
                      total += station.bike_count()
                  return total

              def busiest(self):
                  best = None
                  for station in self.__stations:
                      if best is None or station.bike_count() > best.bike_count():
                          best = station
                  return best


