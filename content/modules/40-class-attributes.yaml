      class Station:
          def __init__(self, name, slots):
              self.__name = name
              self.__slots = slots
              self.__bikes = []

          @property
          def name(self):
              return self.__name

          def free_slots(self):
              return self.__slots - len(self.__bikes)

          def dock(self, bike):
              if self.free_slots() == 0:
                  return False
              self.__bikes.append(bike)
              return True

          def release(self):
              if len(self.__bikes) == 0:
                  return None
              return self.__bikes.pop(0)

          def move_to(self, other, count):
              moved = 0
              while moved < count and len(self.__bikes) > 0 and other.free_slots() > 0:
                  other.dock(self.release())
                  moved += 1
              return moved

          def __str__(self):
              return f"{self.__name}: bikes {len(self.__bikes)}, free {self.free_slots()}"


