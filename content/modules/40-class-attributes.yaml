      class Station:
          def __init__(self, name, slots):
              self.__name = name
              self.__slots = slots
              self.__bikes = []

          @property
          def name(self):
              return self.__name

          def free_slots(self):
              return self.__slots - len(self.__bikes)

          def dock(self, bike):
              if self.free_slots() == 0:
                  return False
              self.__bikes.append(bike)
              return True

          def release(self):
              if len(self.__bikes) == 0:
                  return None
              return self.__bikes.pop(0)

          def __str__(self):
              return f"{self.__name}: bikes {len(self.__bikes)}, free {self.free_slots()}"


      class Rider:
          def __init__(self, name):
              self.name = name
              self.bike = None

          def rent_from(self, station):
              if self.bike is not None:
                  return
              self.bike = station.release()
              if self.bike is None:
                  print(f"{self.name}: no bikes at {station.name}")
              else:
                  print(f"{self.name} took {self.bike} at {station.name}")

          def return_to(self, station):
              if self.bike is not None and station.dock(self.bike):
                  print(f"{self.name} left {self.bike} at {station.name}")
                  self.bike = None


      park = Station("Park", 2)
      harbor = Station("Harbor", 1)
      park.dock(Bike())
      park.dock(Bike("cargo"))
      print(park.dock(Bike()))

      ada = Rider("Ada")
      ben = Rider("Ben")
      ada.rent_from(park)
      ada.return_to(harbor)
      ben.rent_from(harbor)
      ada.rent_from(harbor)
      print(park)
      print(harbor)
