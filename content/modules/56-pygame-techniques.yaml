  - id: pygame-techniques-game
    slug: small-game
    title: A small game
    text: |
      Games ask one question all the time: do these two things touch? Does the robot touch the coin, does the monster touch the robot? pygame has a type for the question: **`pygame.Rect`**, a rectangle with a position and a size.

      ```python run
      import pygame

      robot = pygame.Rect(100, 150, 40, 40)
      print(robot)
      print(robot.x, robot.y, robot.width, robot.height)
      print(robot.right, robot.bottom)
      print(robot.center)
      robot.x += 10
      print(robot.topleft, robot.right)
      ```

      ```output
      Rect(100, 150, 40, 40)
      100 150 40 40
      140 190
      (120, 170)
      (110, 150) 150
      ```

      `right` is `x + width`, the first x past the rectangle (it covers x from 100 to 139), and `bottom` the same for y. `center` is its middle point. Change `x` or `y` and the rectangle moves: `right`, `center` and the rest follow. You can also set them: `robot.center = (160, 120)` moves the rectangle so that its center is there.

      An image gives a rectangle of its own size with `get_rect`: `robot_image.get_rect(topleft=(100, 150))` is the same as `pygame.Rect(100, 150, 40, 40)` for the 40 x 40 robot. And `blit` takes a rectangle as the position, using its top-left corner: `window.blit(robot_image, robot)`.

      ### Touching

      `a.colliderect(b)` tells whether the rectangles `a` and `b` overlap, and `a.collidepoint(point)` whether the point is inside `a`. That's the click test of the previous module, ready-made.

      ```python run
      import pygame

      robot = pygame.Rect(100, 150, 40, 40)
      coin = pygame.Rect(130, 130, 24, 24)
      wall = pygame.Rect(140, 150, 40, 40)
      print(robot.colliderect(coin))
      print(robot.colliderect(wall))
      print(robot.collidepoint((120, 160)))
      print(robot.collidepoint((140, 160)))
      ```

      ```output
      True
      False
      True
      False
      ```

      The coin's corner overlaps the robot's top-right corner. The wall starts at x = 140, right where the robot ends, so they're side by side but don't overlap.

      ### Putting it together

      Here is a whole game. Coins fall, one at a time, and the player moves the robot with the arrow keys to catch them. Each catch is a point, and the next coin starts falling from the top. When a coin falls to the bottom without being caught, the game is over: nothing moves any more, and the window says so until it's closed. A real game would choose each coin's place with `random`; this one takes them in turn from a list.

      ```asset robot.png
      ```

      ```asset coin.png
      ```

      ```python window
      import pygame

      pygame.init()
      window = pygame.display.set_mode((320, 240))
      pygame.display.set_caption("Coin Rain")
      robot_image = pygame.image.load("robot.png")
      coin_image = pygame.image.load("coin.png")
      font = pygame.font.SysFont("Arial", 24)

      robot = robot_image.get_rect(topleft=(140, 200))
      coin_xs = [60, 220, 150, 30, 260]
      next_x = 0
      coin = coin_image.get_rect(topleft=(coin_xs[0], 0))
      score = 0
      game_over = False
      going_left = False
      going_right = False
      clock = pygame.time.Clock()

      while True:
          for event in pygame.event.get():
              if event.type == pygame.KEYDOWN:
                  if event.key == pygame.K_LEFT:
                      going_left = True
                  if event.key == pygame.K_RIGHT:
                      going_right = True
              if event.type == pygame.KEYUP:
                  if event.key == pygame.K_LEFT:
                      going_left = False
                  if event.key == pygame.K_RIGHT:
                      going_right = False
              if event.type == pygame.QUIT:
                  exit()

          if not game_over:
              if going_left and robot.x > 0:
                  robot.x -= 4
              if going_right and robot.right < 320:
                  robot.x += 4
              coin.y += 3
              if robot.colliderect(coin):
                  score += 1
                  next_x = (next_x + 1) % len(coin_xs)
                  coin.topleft = (coin_xs[next_x], 0)
              elif coin.top >= 240:
                  game_over = True

          window.fill((0, 0, 0))
          window.blit(robot_image, robot)
          window.blit(coin_image, coin)
          score_text = font.render(f"Score: {score}", True, (255, 255, 255))
          window.blit(score_text, (10, 10))
          if game_over:
              text = font.render("Game over", True, (255, 80, 80))
              window.blit(text, ((320 - text.get_width()) // 2, 100))
          pygame.display.flip()
          clock.tick(60)
      ```

      ```window
      {frames: 220, events: [{at: 5, type: keydown, key: K_LEFT}, {at: 25, type: keyup, key: K_LEFT}, {at: 70, type: keydown, key: K_RIGHT}, {at: 105, type: keyup, key: K_RIGHT}]}
      ```

      The game is the same main loop as before, with its three parts:

      1. **Events** only change variables: the arrow keys set `going_left` and `going_right`.
      2. **Updating** applies the game's rules to its **state**, the variables that describe the game: the robot moves (but not out of the window), the coin falls, a catch adds a point and starts the next coin, and a missed coin sets `game_over`. When `game_over` is `True`, this part does nothing, so everything stays where it was.
      3. **Drawing** shows the state as it is now, including the score and, at the end, the words "Game over".

      Keeping the parts apart makes a game much easier to change. A new rule goes in the updating part, and the drawing part draws whatever the state is.

      **Your turn:** what does this program print? Type each line it prints.
