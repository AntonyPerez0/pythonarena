      - "After moving 20 to the left, the player covers x from 80 to 119, which doesn't reach the wall's 130."
    more:
      - task: |
          Collect the coins with clicks. Each coin is a `pygame.Rect`, and a click on a coin removes it from the list. The text at the bottom tells how many coins are left. Fill in the blanks: the rectangle method that tells whether a point is inside, and the function that gives the length of the list.
        assets: [coin.png]
        fill: |
          import pygame

          pygame.init()
          window = pygame.display.set_mode((320, 240))
          coin = pygame.image.load("coin.png")
          font = pygame.font.SysFont("Arial", 24)

          coins = [pygame.Rect(40, 40, 24, 24), pygame.Rect(150, 100, 24, 24), pygame.Rect(260, 60, 24, 24)]

          while True:
              for event in pygame.event.get():
                  if event.type == pygame.MOUSEBUTTONDOWN:
                      for coin_rect in coins:
                          if coin_rect.[[collidepoint]](event.pos):
                              coins.remove(coin_rect)
                              break
                  if event.type == pygame.QUIT:
                      exit()

              window.fill((0, 0, 0))
              for coin_rect in coins:
                  window.blit(coin, coin_rect)
              text = font.render(f"Coins left: {[[len]](coins)}", True, (255, 255, 255))
              window.blit(text, (10, 200))
              pygame.display.flip()
        hints:
          - One method of a rectangle checks a point, the other checks another rectangle. Which one is for a point?
          - "`coin_rect.collidepoint(event.pos)`, and the length of a list is `len(coins)`."
        tests:
          - name: Two coins collected
            window: {frames: 20, events: [{at: 3, type: mousedown, pos: [50, 50], button: 1}, {at: 4, type: mouseup, pos: [50, 50], button: 1}, {at: 8, type: mousedown, pos: [10, 150], button: 1}, {at: 9, type: mouseup, pos: [10, 150], button: 1}, {at: 12, type: mousedown, pos: [270, 80], button: 1}, {at: 13, type: mouseup, pos: [270, 80], button: 1}]}
          - window: {frames: 20, events: [{at: 2, type: mousedown, pos: [160, 110], button: 1}, {at: 3, type: mouseup, pos: [160, 110], button: 1}, {at: 6, type: mousedown, pos: [64, 64], button: 1}, {at: 7, type: mouseup, pos: [64, 64], button: 1}]}
            hidden: true
      - task: |
          Write a dodging game. The robot stands at the bottom of the window, at (140, 200), and a monster falls toward it. The player moves the robot with the arrow keys, 4 pixels per frame while the key is held, and the robot's x stays between 0 and 280.

          The monster starts at the top (y = 0) and falls 5 pixels per frame. Its x comes from the list `[40, 200, 120, 260, 0]`: the first monster falls at x = 40, the next one at 200, and so on, back to the start of the list after the last one. When a monster's y reaches 240 or more, it has been dodged: the count of dodged monsters grows by one, and the next monster starts at the top.

          When the robot and the monster touch (their rectangles overlap), the game is over: from then on nothing moves, and the window shows `Game over` too, until it's closed.

          In each frame: handle the events, then (unless the game is over) move the robot, move the monster, check for a dodged monster and check for touching. Then draw: fill the window black, draw the robot, the monster, the text `Dodged: 2` (with the real count) at (10, 10), and, when the game is over, the text `Game over` centered across the window with its top at y = 100. Use the starter code's font for both texts.
        assets: [robot.png, monster.png]
        seed: |
          import pygame

          pygame.init()
          window = pygame.display.set_mode((320, 240))
          pygame.display.set_caption("Dodge")
          robot_image = pygame.image.load("robot.png")
          monster_image = pygame.image.load("monster.png")
          font = pygame.font.SysFont("Arial", 24)

          robot = robot_image.get_rect(topleft=(140, 200))
          monster_xs = [40, 200, 120, 260, 0]
          clock = pygame.time.Clock()

          while True:
              for event in pygame.event.get():
                  if event.type == pygame.QUIT:
                      exit()

              window.fill((0, 0, 0))
              window.blit(robot_image, robot)
              pygame.display.flip()
              clock.tick(60)
        solution: |
          import pygame

          pygame.init()
          window = pygame.display.set_mode((320, 240))
          pygame.display.set_caption("Dodge")
          robot_image = pygame.image.load("robot.png")
          monster_image = pygame.image.load("monster.png")
          font = pygame.font.SysFont("Arial", 24)

          robot = robot_image.get_rect(topleft=(140, 200))
          monster_xs = [40, 200, 120, 260, 0]
          next_x = 0
          monster = monster_image.get_rect(topleft=(monster_xs[0], 0))
          dodged = 0
          game_over = False
          going_left = False
          going_right = False
          clock = pygame.time.Clock()

          while True:
              for event in pygame.event.get():
                  if event.type == pygame.KEYDOWN:
                      if event.key == pygame.K_LEFT:
                          going_left = True
                      if event.key == pygame.K_RIGHT:
                          going_right = True
                  if event.type == pygame.KEYUP:
                      if event.key == pygame.K_LEFT:
                          going_left = False
                      if event.key == pygame.K_RIGHT:
                          going_right = False
                  if event.type == pygame.QUIT:
                      exit()

              if not game_over:
                  if going_left:
                      robot.x -= 4
                  if going_right:
                      robot.x += 4
                  if robot.x < 0:
                      robot.x = 0
                  if robot.x > 280:
                      robot.x = 280
                  monster.y += 5
                  if monster.y >= 240:
                      dodged += 1
                      next_x = (next_x + 1) % len(monster_xs)
                      monster.topleft = (monster_xs[next_x], 0)
                  if robot.colliderect(monster):
                      game_over = True

              window.fill((0, 0, 0))
              window.blit(robot_image, robot)
              window.blit(monster_image, monster)
              text = font.render(f"Dodged: {dodged}", True, (255, 255, 255))
              window.blit(text, (10, 10))
              if game_over:
                  over = font.render("Game over", True, (255, 80, 80))
                  window.blit(over, ((320 - over.get_width()) // 2, 100))
              pygame.display.flip()
              clock.tick(60)
        hints:
          - "Start from the lesson's game: the same arrow-key variables, a `pygame.Rect` for the monster made with `monster_image.get_rect(topleft=(monster_xs[0], 0))`, a count and `game_over = False`."
          - "In the updating part, under `if not game_over:`, move and clamp the robot, then `monster.y += 5`. When `monster.y >= 240`, count it and set `monster.topleft` to the next x of the list and y 0."
          - "Then `if robot.colliderect(monster):` ends the game. Draw the `Game over` text only when `game_over` is `True`, centered with its own `get_width()`."
        require:
          - pattern: \.colliderect\s*\(
            message: "Check for touching with `colliderect`."
        tests:
          - name: Standing still
            window: {frames: 150}
          - name: Dodging to the right
            window: {frames: 240, events: [{at: 100, type: keydown, key: K_RIGHT}, {at: 130, type: keyup, key: K_RIGHT}]}
            hidden: true
          - name: A long game
            window: {frames: 300, events: [{at: 100, type: keydown, key: K_LEFT}, {at: 120, type: keyup, key: K_LEFT}, {at: 250, type: keydown, key: K_RIGHT}, {at: 262, type: keyup, key: K_RIGHT}]}
            hidden: true
          - name: In the middle of the game
            window: {frames: 70, events: [{at: 10, type: keydown, key: K_RIGHT}, {at: 30, type: keyup, key: K_RIGHT}]}
            hidden: true
          - name: Into the wall
            window: {frames: 60, events: [{at: 3, type: keydown, key: K_RIGHT}, {at: 55, type: keyup, key: K_RIGHT}]}
            hidden: true
