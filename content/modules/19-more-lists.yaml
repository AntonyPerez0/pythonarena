    solution: |
      def column_winner(board: list, column_index: int) -> str:
          first = board[0][column_index]
          if first == ".":
              return ""
          for row in board:
              if row[column_index] != first:
                  return ""
          return first


      if __name__ == "__main__":
          board = [["X", "O", "."], ["X", "O", "X"], ["X", ".", "O"]]
          print(column_winner(board, 0))
          print(column_winner(board, 1) == "")
