      ### Strings on the board

      For some games, strings say more than numbers. This tic-tac-toe board holds `"X"`, `"O"` and `"."` for an empty square. A row is a win when its three squares hold the same piece, and that piece isn't the empty `"."`:

      ```python run
      def row_winner(board: list, row_index: int) -> str:
          row = board[row_index]
          if row[0] != "." and row[0] == row[1] and row[1] == row[2]:
              return row[0]
          return ""


      board = [
          ["O", "X", "."],
          ["X", "X", "X"],
          ["O", ".", "O"],
      ]
      print(row_winner(board, 1))
      print(row_winner(board, 2) == "")
      ```

      ```output
      X
      True
      ```

      The function returns the winning piece, or an empty string when the row isn't a win. Printing an empty string prints an empty line, so the example compares it with `""` instead.

