          def diagonal_winner(board: list) -> str:
              middle = board[1][1]
              if middle == ".":
                  return ""
              if board[0][0] == middle and board[2][2] == middle:
                  return middle
              if board[0][2] == middle and board[2][0] == middle:
                  return middle
              return ""


