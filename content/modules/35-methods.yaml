      - task: |
          Write a class `Expenses` that keeps track of money spent. Give it these methods:

          - `add(amount)` records one expense.
          - `count()` returns how many expenses have been recorded.
          - `total()` returns their sum.
          - `largest()` returns the largest expense, or 0 when there are none.

          Decide yourself which attributes the class needs, but don't give an attribute the same name as a method: `self.count = 0` would hide the method `count`. This code:

          ```python fragment
          trip = Expenses()
          trip.add(12.5)
          trip.add(40)
          trip.add(7.5)
          print(trip.count(), trip.total(), trip.largest())
          ```

          prints

          ```
          3 60.0 40
          ```
        seed: |
          class Expenses:
              pass


          if __name__ == "__main__":
              trip = Expenses()
              trip.add(12.5)
              trip.add(40)
              print(trip.count(), trip.total(), trip.largest())
        solution: |
          class Expenses:
              def __init__(self):
                  self.number = 0
                  self.sum = 0
                  self.biggest = 0

              def add(self, amount):
                  self.number += 1
                  self.sum += amount
                  if amount > self.biggest:
                      self.biggest = amount

              def count(self):
                  return self.number

              def total(self):
                  return self.sum

              def largest(self):
                  return self.biggest


          if __name__ == "__main__":
              trip = Expenses()
              trip.add(12.5)
              trip.add(40)
              print(trip.count(), trip.total(), trip.largest())
        hints:
          - "The constructor sets up what the object must remember: how many expenses, their sum and the largest so far, all 0 at the start."
          - "`add` updates all three. The largest changes only when the new amount is bigger than the largest so far."
          - "An attribute can't have the same name as a method of the class: `self.count = 0` would hide the method `count`. Name the attributes something else, such as `self.number`."
        tests:
          - call: |
              trip = Expenses()
              trip.add(12.5)
              trip.add(40)
              trip.add(7.5)
              print(trip.count(), trip.total(), trip.largest())
          - call: |
              empty = Expenses()
              print(empty.count(), empty.total(), empty.largest())
              week = Expenses()
              for amount in [3, 18, 2, 18, 9]:
                  week.add(amount)
              print(week.count(), week.total(), week.largest())
              print(empty.count())
            hidden: true
      - task: |
          Write a class `Elevator` for a building with the floors 0 to 10. An elevator remembers just two numbers: the floor it is on, in the attribute `floor`, and how many floors it has traveled in all, in the attribute `traveled`. A new elevator is on floor 0 and has traveled 0 floors. Give the class two methods:

          - `exists(floor)`, a helper method, returns `True` when the building has that floor.
          - `go_to(floor)` moves the elevator to the floor, adds the number of floors it passes to `traveled` and returns `True`. From floor 2 up to 7 is 5 floors, and from 7 down to 3 is 4. For a floor that doesn't exist, it changes nothing and returns `False`: use `exists` to find out.

          Then write the main program. It asks for floors until the user types an empty line, prints `No such floor` when the elevator can't go to the floor, and at the end tells where the elevator is and how far it went, as in this example:

          ```
          Floor: 4
          Floor: 12
          No such floor
          Floor: 1
          Floor:
          Now on floor 1, traveled 7 floors
          ```
        seed: |
          class Elevator:
              def __init__(self):
                  self.floor = 0
                  self.traveled = 0

              # Write the methods here.


          # Write the main program here.
        solution: |
          class Elevator:
              def __init__(self):
                  self.floor = 0
                  self.traveled = 0

              def exists(self, floor):
                  return 0 <= floor <= 10

              def go_to(self, floor):
                  if not self.exists(floor):
                      return False
                  self.traveled += abs(floor - self.floor)
                  self.floor = floor
                  return True


          lift = Elevator()
          while True:
              line = input("Floor: ")
              if line == "":
                  break
              if not lift.go_to(int(line)):
                  print("No such floor")

          print(f"Now on floor {lift.floor}, traveled {lift.traveled} floors")
        hints:
          - "`exists` can return a comparison: `0 <= floor <= 10`. In `go_to`, check `if not self.exists(floor):` first, and return `False` before anything changes."
          - "The floors passed are the difference between the new floor and the old one, without its minus sign: `abs(floor - self.floor)`. Add it to `self.traveled` before `self.floor` changes."
          - "In the main program, make one `Elevator()` before the loop. `go_to` tells you whether the move worked, so print the message when it returns `False`: `if not lift.go_to(int(line)):`."
        require:
          - pattern: self\.exists\(
            message: "Use the helper method in `go_to`: call it with `self.exists(floor)`."
          - pattern: Elevator\(\)
            message: Make an `Elevator` object in the main program with `Elevator()`.
        tests:
