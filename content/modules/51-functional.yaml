id: functional
summary: Functional programming builds a program from functions that return new values instead of changing variables. The map and filter functions and the iterators they return, and reduce from the functools module, with numbers and with your own objects.
steps:
  - id: functional-map
    slug: map
    title: Transforming with map
    text: |
      Most of your programs so far have worked by changing things, one step at a time: a loop adds to a total, `append` makes a list longer, a method changes an attribute of an object. **Functional programming** is a way of writing programs that works the other way round. It computes new values from old ones with functions, and it leaves the old values as they are. A way of writing programs like this is called a **programming paradigm**. Here's one small job done both ways:

      ```python run
      numbers = [3, 8, 5]

      doubled = []
      for number in numbers:
          doubled.append(number * 2)
      print(doubled)

      print([number * 2 for number in numbers])
      ```

      ```output
      [6, 16, 10]
      [6, 16, 10]
      ```

      The loop changes the list `doubled` in every round, so to know what it holds at some point, you follow the rounds. The comprehension is one expression that says what the new list is, and nothing changes on the way. That's the functional way of thinking, and you've used it since comprehensions. This step and the next two show three classic functional tools: `map`, `filter` and `reduce`. Each of them takes a function as an argument, just as `sorted` takes a key.

      ### map

      The function **`map`** calls a function on every item of a series and gives the results. You write it as `map(function, series)`:

      ```python run
      texts = ["12", "-4", "30"]
      numbers = map(int, texts)
      for number in numbers:
          print(number * 2)
      ```

      ```output
      24
      -8
      60
      ```

      The function can be any function that takes one argument: one of Python's own, one you wrote, or a lambda:

      ```python run
      def initial(name):
          return name[0] + "."


      names = ["Ada", "Linus", "Grace"]
      print(list(map(initial, names)))
      print(list(map(lambda name: name.upper(), names)))
      ```

      ```output
      ['A.', 'L.', 'G.']
      ['ADA', 'LINUS', 'GRACE']
      ```

      A list comprehension does the same: `[initial(name) for name in names]`. Neither is more correct than the other, so choose whichever reads better to you.

      ### map gives an iterator

      `map` doesn't return a list. It returns a `map` object, an **iterator**: like a generator, it computes each value only when it's asked for, and it's used up after one pass. Printing it shows only `<map object at 0x7f3a2c>`, which is why the example above wraps it in `list()`. Going through the same map twice gives nothing the second time:

      ```python run
      prices = [2.0, 3.5, 10.0]
      with_tax = map(lambda price: price * 1.25, prices)

      for price in with_tax:
          print(price)
      print("Once more:")
      for price in with_tax:
          print(price)
      ```

      ```output
      2.5
      4.375
      12.5
      Once more:
      ```

      When you need the values more than once, store a list instead: `with_tax = list(map(...))`.

      ### map and your own objects

      `map` works with any items, objects of your own classes too. The function gets one object and can compute anything from it, such as a number or a line of text made from its attributes:

      ```python run
      class Room:
          def __init__(self, name, width, length):
              self.name = name
              self.width = width
              self.length = length


      rooms = [Room("kitchen", 3, 4), Room("hall", 1.5, 6), Room("bedroom", 4, 3.5)]
      print(list(map(lambda room: room.width * room.length, rooms)))
      print(list(map(lambda room: f"{room.name}: {room.width} x {room.length} m", rooms)))
      ```

      ```output
      [12, 9.0, 14.0]
      ['kitchen: 3 x 4 m', 'hall: 1.5 x 6 m', 'bedroom: 4 x 3.5 m']
      ```

      **Your turn:** fill in the blanks so that the program converts the temperatures to Fahrenheit with `map` and prints them as a list:

      ```
      [32.0, 77.0, 212.0]
      ```
    fill: |
      def to_fahrenheit(celsius):
          return celsius * 9 / 5 + 32


      temperatures = [0, 25, 100]
      print([[list]]([[map]](to_fahrenheit, temperatures)))
    hints:
      - The inner function calls `to_fahrenheit` on every temperature. The outer one turns the result into a list.
      - "`map(to_fahrenheit, temperatures)` gives an iterator, and `list(...)` around it gives the list to print."
    tests:
      - expect: "[32.0, 77.0, 212.0]"
    more:
      - task: |
          What does this program print? Type each line it prints.
        predict: |
          words = ["one", "two", "three"]
          lengths = map(len, words)
          print(list(lengths))
          print(list(lengths))
          print(list(map(lambda word: word[::-1], words)))
        hints:
          - "`map(len, words)` gives the length of each word."
          - The first `list` uses up the iterator `lengths`, so the second one gets nothing.
          - "`word[::-1]` is the word backwards."
      - task: |
          The class `Product` holds a product's name and price. Write a function `price_tags(products)` that uses `map` to return a list of price tags, one string for each product: the name, a colon and a space, and the price with two decimals. For example,

          ```python fragment
          products = [Product("tea", 3.5), Product("honey", 7), Product("lemon", 0.45)]
          print(price_tags(products))
          ```

          should print:

          ```
          ['tea: 3.50', 'honey: 7.00', 'lemon: 0.45']
          ```
        seed: |
          class Product:
              def __init__(self, name, price):
                  self.name = name
                  self.price = price


          def price_tags(products):
              pass


          if __name__ == "__main__":
              products = [Product("tea", 3.5), Product("honey", 7), Product("lemon", 0.45)]
              print(price_tags(products))
        solution: |
          class Product:
              def __init__(self, name, price):
                  self.name = name
                  self.price = price


          def price_tags(products):
              return list(map(lambda product: f"{product.name}: {product.price:.2f}", products))


          if __name__ == "__main__":
              products = [Product("tea", 3.5), Product("honey", 7), Product("lemon", 0.45)]
              print(price_tags(products))
        hints:
          - "The function given to `map` gets one `Product` and returns its tag. An f-string makes the tag: `f\"{product.name}: {product.price:.2f}\"`."
          - "`map` gives an iterator, but the function should return a list: wrap it in `list(...)`."
        require:
          - pattern: \bmap\s*\(
            message: Make the tags with `map`.
        tests:
          - call: |
              products = [Product("tea", 3.5), Product("honey", 7), Product("lemon", 0.45)]
              print(price_tags(products))
          - call: price_tags([Product("bread", 2.199), Product("jam", 12)])
            hidden: true
          - call: price_tags([])
            hidden: true

  - id: functional-filter
    slug: filter
    title: Selecting with filter
    text: |
      `map` changes every item. **`filter`** keeps some of the items as they are and drops the rest. You write it as `filter(function, series)`: it calls the function on each item and keeps the items for which the function returns `True`:

      ```python run
      numbers = [8, 3, 15, 4, 23, 42]
      for number in filter(lambda n: n > 10, numbers):
          print(number)
      ```

      ```output
      15
      23
      42
      ```

      A named function works just as well, and a longer condition often reads better with a name:

      ```python run
      def is_palindrome(word):
          return word == word[::-1]


      words = ["level", "python", "radar", "map", "noon"]
      print(list(filter(is_palindrome, words)))
      ```

      ```output
      ['level', 'radar', 'noon']
      ```

      That's the same as the comprehension `[word for word in words if is_palindrome(word)]`.

      ### filter gives an iterator too

      Like `map`, `filter` returns an iterator, which is used up after one pass. That can bite when you use the result twice, for example to count the items and then to print them:

      ```python run
      class Task:
          def __init__(self, name, done):
              self.name = name
              self.done = done


      tasks = [Task("shop", True), Task("cook", False), Task("call Grandma", False)]
      open_tasks = filter(lambda task: not task.done, tasks)
      print("Tasks left:", len(list(open_tasks)))
      for task in open_tasks:
          print(task.name)
      ```

      ```output
      Tasks left: 2
      ```

      The loop printed nothing: `list(open_tasks)` already took every item, so nothing was left for the loop. Store the list once and use it as often as you like:

      ```python run
      class Task:
          def __init__(self, name, done):
              self.name = name
              self.done = done


      tasks = [Task("shop", True), Task("cook", False), Task("call Grandma", False)]
      open_tasks = list(filter(lambda task: not task.done, tasks))
      print("Tasks left:", len(open_tasks))
      for name in map(lambda task: task.name.upper(), open_tasks):
          print(name)
      ```

      ```output
      Tasks left: 2
      COOK
      CALL GRANDMA
      ```

      ### filter and map together

      The second program also used `map` on what `filter` kept. Both take a series and give a series, so one's result can go straight into the other. Such a chain is read from the inside out:

      ```python fragment
      names = list(map(lambda task: task.name, filter(lambda task: not task.done, tasks)))
      ```

      First `filter` keeps the open tasks, then `map` takes their names. The comprehension `[task.name for task in tasks if not task.done]` does the same in one go.

      **Your turn:** fill in the blank with the condition, so that `filter` keeps only the numbers that are divisible by 3. The program should print:

      ```
      [9, 21, 3, 30]
      ```
    fill: |
      numbers = [9, 14, 21, 3, 8, 30]
      print(list(filter(lambda n: [[n % 3 == 0]], numbers)))
    hints:
      - The lambda gets one number and must return `True` for the numbers to keep.
      - "A number is divisible by 3 when the remainder is zero: `n % 3 == 0`."
    tests:
      - expect: "[9, 21, 3, 30]"
    more:
      - task: |
          What does this program print? Type each line it prints.
        predict: |
          numbers = [5, 12, 7, 20, 3]
          big = filter(lambda n: n > 6, numbers)
          print(next(big))
          print(list(big))
          print(list(map(lambda n: n * 2, filter(lambda n: n < 6, numbers))))
        hints:
          - "`filter` gives an iterator, so `next` works on it, just as on a generator. The first number over 6 is 12."
          - "`list(big)` takes the numbers over 6 that are left after that."
          - On the last line, read from the inside out. `filter` keeps 5 and 3, then `map` doubles them.
      - task: |
          The class `Book` holds a book's title and whether it's on loan. Write a function `available_titles(books)` that returns a list of the titles of the books that are **not** on loan, in alphabetical order. Use `filter` and `map`. For example,

          ```python fragment
          books = [Book("Matilda", False), Book("Dracula", True), Book("Beloved", False)]
          print(available_titles(books))
          ```

          should print:

          ```
          ['Beloved', 'Matilda']
          ```
        seed: |
          class Book:
              def __init__(self, title, on_loan):
                  self.title = title
                  self.on_loan = on_loan


          def available_titles(books):
              pass


          if __name__ == "__main__":
              books = [Book("Matilda", False), Book("Dracula", True), Book("Beloved", False)]
              print(available_titles(books))
        solution: |
          class Book:
              def __init__(self, title, on_loan):
                  self.title = title
                  self.on_loan = on_loan


          def available_titles(books):
              available = filter(lambda book: not book.on_loan, books)
              titles = map(lambda book: book.title, available)
              return sorted(titles)


          if __name__ == "__main__":
              books = [Book("Matilda", False), Book("Dracula", True), Book("Beloved", False)]
              print(available_titles(books))
        hints:
          - "First `filter` the books whose `on_loan` is `False`: the lambda can return `not book.on_loan`."
          - Then `map` each of those books to its title.
          - "`sorted` accepts an iterator and returns a sorted list, which is just what the function should return."
        require:
          - pattern: \bfilter\s*\(
            message: Pick the books with `filter`.
          - pattern: \bmap\s*\(
            message: Take the titles with `map`.
        tests:
          - call: |
              books = [Book("Matilda", False), Book("Dracula", True), Book("Beloved", False)]
              print(available_titles(books))
          - call: available_titles([Book("Ulysses", True), Book("Emma", False), Book("Carrie", False), Book("Anna", False)])
            hidden: true
          - call: available_titles([Book("Ulysses", True)])
            hidden: true

  - id: functional-reduce
    slug: reduce
    title: Combining with reduce
    text: |
      `map` and `filter` turn a series into another series. **`reduce`** turns a whole series into a single value, such as a total. It isn't a built-in function: it lives in the module **`functools`**, so you import it first.

      `reduce(function, series, start)` works like a loop with a running result. The result begins as `start`. For each item, `reduce` calls the function with two arguments, the result so far and the item, and what the function returns becomes the new result. After the last item, `reduce` returns that result. Here the result is a string that collects the first letter of each color:

      ```python run
      from functools import reduce

      colors = ["red", "green", "blue"]
      code = reduce(lambda letters, color: letters + color[0], colors, "")
      print(code)
      ```

      ```output
      rgb
      ```

      Round by round, the lambda gets the result so far and the next color, and what it returns is the result for the next round:

      | Round | `letters` | `color` | The lambda returns |
      |:-:|---|---|---|
      | 1 | `""` (the start) | `"red"` | `"r"` |
      | 2 | `"r"` | `"green"` | `"rg"` |
      | 3 | `"rg"` | `"blue"` | `"rgb"` |

      There are no more colors after round 3, so `reduce` returns `"rgb"`.

      The function can combine the result and the item in any way you write, and the result doesn't have to be the same kind of value as the items. Both of these go through a list of words. The first keeps the longest word, and the second counts the letters of all the words:

      ```python run
      from functools import reduce

      words = ["map", "filter", "reduce", "lambda"]
      print(reduce(lambda longest, word: word if len(word) > len(longest) else longest, words, ""))
      print(reduce(lambda total, word: total + len(word), words, 0))
      ```

      ```output
      filter
      21
      ```

      The start value is where the result begins, so choose one that fits the job. The longest word starts from the empty string, which any word is longer than, and a count of letters starts from 0. The start value is also what `reduce` returns for an empty list.

      ### Without a start value

      You can leave the start value out. Then `reduce` takes the first item as the starting result and goes on from the second one, so `reduce(lambda a, b: a + b, [4, 8, 3])` starts from 4 and gives 15. But with an empty list there's nothing to start from, and `reduce` stops with `TypeError: reduce() of empty iterable with no initial value`.

      ### reduce and your own objects

      With objects, give the start value. The function adds something taken from each object to the result:

      ```python run
      from functools import reduce


      class Parcel:
          def __init__(self, label, weight):
              self.label = label
              self.weight = weight


      parcels = [Parcel("books", 4.5), Parcel("lamp", 2.0), Parcel("plates", 6.5)]
      total = reduce(lambda result, parcel: result + parcel.weight, parcels, 0)
      print("Total weight:", total)
      ```

      ```output
      Total weight: 13.0
      ```

      Without the 0, `reduce` would take the first parcel itself as the starting result, and the first round would try to add a weight to a `Parcel` object:

      ```python run crash
      from functools import reduce


      class Parcel:
          def __init__(self, label, weight):
              self.label = label
              self.weight = weight


      parcels = [Parcel("books", 4.5), Parcel("lamp", 2.0), Parcel("plates", 6.5)]
      total = reduce(lambda result, parcel: result + parcel.weight, parcels)
      print("Total weight:", total)
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 11, in <module>
          total = reduce(lambda result, parcel: result + parcel.weight, parcels)
        File "main.py", line 11, in <lambda>
          total = reduce(lambda result, parcel: result + parcel.weight, parcels)
                                                ~~~~~~~^~~~~~~~~~~~~~~
      TypeError: unsupported operand type(s) for +: 'Parcel' and 'float'
      ```

      So when the items are objects and the result is a number, always give a start value of the right type.

      **Your turn:** the program should add up the playing times of the songs with `reduce`, but it stops with an error. Fix it, so that it prints:

      ```
      Total: 11 min
      ```
    seed: |
      from functools import reduce


      class Song:
          def __init__(self, title, minutes):
              self.title = title
              self.minutes = minutes


      songs = [Song("Intro", 2), Song("Theme", 5), Song("Outro", 4)]
      total = reduce(lambda result, song: result + song.minutes, songs)
      print("Total:", total, "min")
    solution: |
      from functools import reduce


      class Song:
          def __init__(self, title, minutes):
              self.title = title
              self.minutes = minutes


      songs = [Song("Intro", 2), Song("Theme", 5), Song("Outro", 4)]
      total = reduce(lambda result, song: result + song.minutes, songs, 0)
      print("Total:", total, "min")
    hints:
      - Read the error message. What is `reduce` trying to add a number to in the first round?
      - "Without a start value, the first `Song` object is the starting result. Give `reduce` a third argument, the start value `0`."
    require:
      - pattern: \breduce\s*\(
        message: Keep adding up the minutes with `reduce`.
    forbid:
      - pattern: \b11\b
        message: Let `reduce` calculate the total instead of typing 11.
    tests:
      - expect: "Total: 11 min"
    more:
      - task: |
          What does this program print? Type each line it prints.
        predict: |
          from functools import reduce

          numbers = [3, 9, 2]
          print(reduce(lambda a, b: a * 10 + b, numbers, 0))
          print(reduce(lambda a, b: a if a > b else b, numbers))
          print(reduce(lambda text, n: text + str(n) + "-", numbers, ">"))
        hints:
          - "Go round by round. On the first line the result is 0, then 0 * 10 + 3, then 3 * 10 + 9, and so on."
          - The second line has no start value, so it starts from 3 and keeps the larger of the result and the next number.
          - "The last line starts from the string `\">\"` and adds each number and a dash."
      - task: |
          The class `CartItem` holds the name, the unit price and the quantity of an item in a shopping cart. Write a function `cart_total(items)` that uses `reduce` to return the total price of the cart: the sum of price times quantity of every item. An empty cart costs 0. For example,

          ```python fragment
          cart = [CartItem("pen", 1.5, 4), CartItem("notebook", 3.25, 2), CartItem("eraser", 0.75, 1)]
          print(cart_total(cart))
          ```

          should print:

          ```
          13.25
          ```
        seed: |
          class CartItem:
              def __init__(self, name, price, quantity):
                  self.name = name
                  self.price = price
                  self.quantity = quantity


          def cart_total(items):
              pass


          if __name__ == "__main__":
              cart = [CartItem("pen", 1.5, 4), CartItem("notebook", 3.25, 2), CartItem("eraser", 0.75, 1)]
              print(cart_total(cart))
        solution: |
          from functools import reduce


          class CartItem:
              def __init__(self, name, price, quantity):
                  self.name = name
                  self.price = price
                  self.quantity = quantity


          def cart_total(items):
              return reduce(lambda total, item: total + item.price * item.quantity, items, 0)


          if __name__ == "__main__":
              cart = [CartItem("pen", 1.5, 4), CartItem("notebook", 3.25, 2), CartItem("eraser", 0.75, 1)]
              print(cart_total(cart))
        hints:
          - "Import it first: `from functools import reduce`."
          - "The function given to `reduce` gets the total so far and one item, and returns the total plus that item's price times its quantity."
          - "Give `0` as the start value. Without it, the first round would add to a `CartItem` object, and an empty cart would be an error."
        require:
          - pattern: \breduce\s*\(
            message: Calculate the total with `reduce`.
        tests:
          - call: |
              cart = [CartItem("pen", 1.5, 4), CartItem("notebook", 3.25, 2), CartItem("eraser", 0.75, 1)]
              print(cart_total(cart))
          - call: cart_total([CartItem("melon", 2.5, 2)])
            hidden: true
          - call: print(cart_total([]) == 0)
            hidden: true
          - call: print(cart_total([CartItem("cup", 4, 3), CartItem("plate", 6, 2), CartItem("fork", 1, 10)]) == 34)
            hidden: true
