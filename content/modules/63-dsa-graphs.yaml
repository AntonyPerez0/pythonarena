                      [[seen.add(w)]]
                      stack.append(w)
          return len(seen)


      chain = {v: [v + 1] for v in range(9999)}
      chain[9999] = []
      print(reachable(chain, 0), reachable(chain, 9990))
      loops = {1: [2], 2: [3, 1], 3: [1], 4: [1]}
      print(reachable(loops, 1), reachable(loops, 4))
    hints:
