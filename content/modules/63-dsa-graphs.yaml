      dist = {1: 0}
      queue = deque([1])
      while queue:
          v = queue.popleft()
          print(v, dist[v])
          for w in graph[v]:
              if w not in dist:
                  dist[w] = dist[v] + 1
                  queue.append(w)
    hints:
      - "The queue starts with 1. When 1 leaves, its neighbors 2 and 5 join, in that order, both at distance 1."
