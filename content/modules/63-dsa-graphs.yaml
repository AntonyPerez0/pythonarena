        solution: |
          class UnionFind:
              def __init__(self, n):
                  self.parent = list(range(n))
                  self.size = [1] * n
                  self.groups = n

              def find(self, x):
                  root = x
                  while self.parent[root] != root:
                      root = self.parent[root]
                  while self.parent[x] != root:
                      next_x = self.parent[x]
                      self.parent[x] = root
                      x = next_x
                  return root

              def union(self, a, b):
                  root_a, root_b = self.find(a), self.find(b)
                  if root_a == root_b:
                      return False
                  if self.size[root_a] < self.size[root_b]:
                      root_a, root_b = root_b, root_a
                  self.parent[root_b] = root_a
                  self.size[root_a] += self.size[root_b]
                  self.groups -= 1
                  return True

              def size_of(self, x):
                  return self.size[self.find(x)]


          if __name__ == "__main__":
              sets = UnionFind(8)
              print(sets.union(1, 5), sets.union(7, 5), sets.union(5, 1), sets.union(3, 0))
              print(sets.groups, sets.size_of(7), sets.find(1) == sets.find(7), sets.find(0) == sets.find(5))
