      - task: |
          On a social network, `follows` lists pairs `(a, b)`: person a follows person b. Write `mutual_pairs(follows)` that returns how many pairs of people follow each other. Each such pair counts once. The people are numbers, no pair appears twice in the list, and nobody follows themselves.

          `(b, a) in follows` would answer "does b follow a back?", but on a list it's a scan, O(E) for each of the E follows: the hidden test has 80,000 follows. Put each person's follows in a set first, so the check is O(1) on average.

          For example, here 1 and 2 follow each other, and so do 3 and 4. So this call:

          ```python fragment
          print(mutual_pairs([(1, 2), (2, 1), (1, 3), (3, 4), (4, 3), (2, 3)]))
          ```

          prints:

          ```
          2
          ```
        seed: |
          def mutual_pairs(follows):
              pass


          if __name__ == "__main__":
              print(mutual_pairs([(1, 2), (2, 1), (1, 3), (3, 4), (4, 3), (2, 3)]))
        solution: |
          def mutual_pairs(follows):
              following = {}
              for a, b in follows:
                  if a not in following:
                      following[a] = set()
                  following[a].add(b)
              count = 0
              for a, b in follows:
                  if b in following and a in following[b]:
                      count += 1
              return count // 2


          if __name__ == "__main__":
              print(mutual_pairs([(1, 2), (2, 1), (1, 3), (3, 4), (4, 3), (2, 3)]))
        slow: |
          def mutual_pairs(follows):
              count = 0
              for a, b in follows:
                  if (b, a) in follows:
                      count += 1
              return count // 2


          if __name__ == "__main__":
              print(mutual_pairs([(1, 2), (2, 1), (1, 3), (3, 4), (4, 3), (2, 3)]))
        hints:
          - "Build an adjacency list first: a dict that maps each person to the set of people they follow."
          - "Then, for each follow `(a, b)`, check whether b follows a: `a in following[b]`, O(1) on average. Mind people who follow nobody: they aren't keys of the dict."
          - "Every mutual pair is found twice, once from each side, so halve the count at the end. (Or count only the follows with `a < b`.)"
