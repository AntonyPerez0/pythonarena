        seed: |
          from collections import deque


          def shortest_path(grid):
              pass


          if __name__ == "__main__":
              maze = [
                  "S..#....",
                  ".#.#.##.",
                  ".#...#E.",
                  ".####.#.",
                  "......#.",
              ]
              print(shortest_path(maze))
        solution: |
          from collections import deque


          def shortest_path(grid):
              rows, cols = len(grid), len(grid[0])
              for r in range(rows):
                  for c in range(cols):
                      if grid[r][c] == "S":
                          start = (r, c)
              dist = {start: 0}
              queue = deque([start])
              while queue:
                  r, c = queue.popleft()
                  if grid[r][c] == "E":
                      return dist[(r, c)]
                  for nr, nc in [(r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)]:
                      if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] != "#" and (nr, nc) not in dist:
                          dist[(nr, nc)] = dist[(r, c)] + 1
                          queue.append((nr, nc))
              return -1


          if __name__ == "__main__":
              maze = [
                  "S..#....",
                  ".#.#.##.",
                  ".#...#E.",
                  ".####.#.",
                  "......#.",
              ]
              print(shortest_path(maze))
        slow: |
          from collections import deque


          def shortest_path(grid):
              rows, cols = len(grid), len(grid[0])
              for r in range(rows):
                  for c in range(cols):
                      if grid[r][c] == "S":
                          start = (r, c)
              visited = [start]
              queue = deque([(start, 0)])
              while queue:
                  (r, c), moves = queue.popleft()
                  if grid[r][c] == "E":
                      return moves
                  for nr, nc in [(r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)]:
                      if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] != "#" and (nr, nc) not in visited:
                          visited.append((nr, nc))
                          queue.append(((nr, nc), moves + 1))
              return -1


          if __name__ == "__main__":
              maze = [
                  "S..#....",
                  ".#.#.##.",
                  ".#...#E.",
                  ".####.#.",
                  "......#.",
              ]
              print(shortest_path(maze))
        hints:
          - "First find S: loop over the rows and columns until `grid[r][c] == \"S\"`."
          - "Then run the lesson's grid BFS from S, with a dict `dist` of the cells found so far. Return `dist[(r, c)]` when the cell that leaves the queue is E."
          - "A neighbor joins the queue when it's inside the grid, isn't a wall and isn't in `dist` yet. If the queue runs empty, E can't be reached: return -1."
