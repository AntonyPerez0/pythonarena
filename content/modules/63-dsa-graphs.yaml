                  [1, 1, 2, 8, 2],
                  [1, 7, 9, 9, 1],
                  [2, 1, 1, 1, 3],
              ]
              print(cheapest_grid(costs))
        solution: |
          import heapq


          def cheapest_grid(costs):
              rows, cols = len(costs), len(costs[0])
              best = {(0, 0): costs[0][0]}
              heap = [(costs[0][0], 0, 0)]
              while heap:
                  total, r, c = heapq.heappop(heap)
                  if (r, c) == (rows - 1, cols - 1):
                      return total
                  if total > best[(r, c)]:
                      continue
                  for nr, nc in [(r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)]:
                      if 0 <= nr < rows and 0 <= nc < cols:
                          new_total = total + costs[nr][nc]
                          if (nr, nc) not in best or new_total < best[(nr, nc)]:
                              best[(nr, nc)] = new_total
                              heapq.heappush(heap, (new_total, nr, nc))


          if __name__ == "__main__":
              costs = [
                  [2, 1, 1, 6, 3],
                  [8, 9, 1, 7, 4],
                  [1, 1, 2, 8, 2],
                  [1, 7, 9, 9, 1],
                  [2, 1, 1, 1, 3],
              ]
              print(cheapest_grid(costs))
