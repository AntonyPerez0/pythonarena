          def fewest_terms(n, prereqs):
              needs = [0] * n
              unlocks = [[] for _ in range(n)]
              for a, b in prereqs:
                  unlocks[a].append(b)
                  needs[b] += 1
              term = [c for c in range(n) if needs[c] == 0]
              terms = 0
              passed = 0
              while term:
                  terms += 1
                  passed += len(term)
                  next_term = []
                  for course in term:
                      for later in unlocks[course]:
                          needs[later] -= 1
                          if needs[later] == 0:
                              next_term.append(later)
                  term = next_term
              if passed < n:
                  return -1
              return terms


