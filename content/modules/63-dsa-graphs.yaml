          from collections import deque


          def route(graph, start, goal):
              came_from = {start: None}
              queue = deque([start])
              while queue:
                  station = queue.popleft()
                  if station == goal:
                      path = []
                      while station is not None:
                          path.append(station)
                          station = came_from[station]
                      path.reverse()
                      return path
                  for nxt in graph[station]:
                      if nxt not in came_from:
                          came_from[nxt] = station
                          queue.append(nxt)
              return None


