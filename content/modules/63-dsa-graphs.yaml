          def walk(costs, r, c, total, on_path):
              rows, cols = len(costs), len(costs[0])
              if (r, c) == (rows - 1, cols - 1):
                  return total
              best = None
              for nr, nc in [(r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)]:
                  if 0 <= nr < rows and 0 <= nc < cols and (nr, nc) not in on_path:
                      on_path.add((nr, nc))
                      found = walk(costs, nr, nc, total + costs[nr][nc], on_path)
                      on_path.remove((nr, nc))
                      if found is not None and (best is None or found < best):
                          best = found
              return best


          def cheapest_grid(costs):
              return walk(costs, 0, 0, costs[0][0], {(0, 0)})


          if __name__ == "__main__":
              costs = [
                  [2, 1, 1, 6, 3],
                  [8, 9, 1, 7, 4],
                  [1, 1, 2, 8, 2],
                  [1, 7, 9, 9, 1],
                  [2, 1, 1, 1, 3],
              ]
              print(cheapest_grid(costs))
