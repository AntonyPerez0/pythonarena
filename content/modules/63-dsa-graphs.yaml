          A maze is a list of strings: `.` is open, `#` is a wall, `S` is the start and `E` the exit. Write `shortest_path(grid)` that returns the fewest moves from S to E, moving up, down, left or right, or -1 when E can't be reached. Keep the cells you've found in a set or a dict: the hidden tests have mazes of 240 by 280 and 301 by 301 cells, with tens of thousands of open cells, where a list of visited cells takes billions of comparisons.

          For example, this program:

          ```python fragment
