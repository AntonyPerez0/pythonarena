          A climbing gym keeps its members in one file (`number;name`) and every visit in another (`number;date`, one line per visit). Write a program that asks for the names of the two files and prints each member's name and number of visits, in the order of the members file. Members who haven't visited get 0.

          With these files, `members.csv` and `visits.csv`

          ```text
          1;Ana
          2;Bo
          3;Cy
          ```

          ```text
          3;2026-03-02
          1;2026-03-02
          1;2026-03-05
          1;2026-03-09
          ```

          a run looks like this:

          ```
          Members: members.csv
          Visits: visits.csv
          Ana 3
          Bo 0
          Cy 1
          ```
        seed: |
