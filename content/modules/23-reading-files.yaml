          def read_ratings(filename):
              ratings = {}
              with open(filename) as file:
                  for line in file:
                      parts = line.strip().split(";")
                      ratings[parts[0]] = []
                      for rating in parts[1:]:
                          ratings[parts[0]].append(int(rating))
              return ratings


          def best_rated(filename):
              ratings = read_ratings(filename)
              best_title = ""
              best_average = 0
              for title, scores in ratings.items():
                  average = sum(scores) / len(scores)
                  if average > best_average:
                      best_title = title
                      best_average = average
              return best_title


          if __name__ == "__main__":
              print(best_rated("ratings.csv"))
