      - task: |
          A football league has two files, each with a header line. `players.csv` tells which team each player is in (`player;team`), and `goals.csv` has a line for each match in which a player scored (`player;goals`). Write a function `team_goals(players_file, goals_file)` that returns a dictionary from each team to its total goals. Every team of the players file is in it, in the order the teams first appear there, also a team whose players scored nothing.

          With these files

          ```text
          player;team
          Ana;Owls
          Bo;Foxes
          Cy;Owls
          Dee;Bears
          ```

          ```text
          player;goals
          Ana;2
          Cy;1
          Ana;1
          Bo;3
          ```

          `print(team_goals("players.csv", "goals.csv"))` prints:

          ```
          {'Owls': 4, 'Foxes': 3, 'Bears': 0}
          ```
        seed: |
          def team_goals(players_file, goals_file):
              pass


          if __name__ == "__main__":
              print(team_goals("players.csv", "goals.csv"))
        solution: |
          def team_goals(players_file, goals_file):
              teams = {}
              goals = {}
              with open(players_file) as file:
                  for line in file:
                      parts = line.strip().split(";")
                      if parts[0] == "player":
                          continue
                      teams[parts[0]] = parts[1]
                      goals[parts[1]] = 0

              with open(goals_file) as file:
                  for line in file:
                      parts = line.strip().split(";")
                      if parts[0] == "player":
                          continue
                      team = teams[parts[0]]
                      goals[team] += int(parts[1])
              return goals


          if __name__ == "__main__":
              print(team_goals("players.csv", "goals.csv"))
        hints:
          - "You need two dictionaries: one from player to team (to find a scorer's team), and the result, from team to goals."
          - While reading the players file, store each player's team and give the team 0 goals. Skip the header lines in both files.
          - "For each line of the goals file, find the player's team with the first dictionary and add the goals to that team: `goals[team] += int(parts[1])`."
