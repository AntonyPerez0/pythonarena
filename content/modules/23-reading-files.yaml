          visits_file = input("Visits: ")
        solution: |
          members_file = input("Members: ")
          visits_file = input("Visits: ")

          names = {}
          visits = {}
          with open(members_file) as file:
              for line in file:
                  parts = line.strip().split(";")
                  names[parts[0]] = parts[1]
                  visits[parts[0]] = 0

          with open(visits_file) as file:
