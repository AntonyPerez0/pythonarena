id: more-comprehensions
summary: Comprehensions over strings and over objects of your own classes, joining the results back into a string, and comprehensions that make dictionaries and sets instead of lists.
steps:
  - id: more-comprehensions-strings-objects
    slug: strings-and-objects
    title: Strings and your own objects
    text: |
      A comprehension goes through anything a `for` loop can, and a string is a series of characters. So a comprehension over a string gets one character at a time. Here it picks the digits out of a code:

      ```python repl
      >>> code = "a1b2c3"
      >>> [c for c in code if c in "0123456789"]
      ['1', '2', '3']
      >>> [int(c) for c in code if c in "0123456789"]
      [1, 2, 3]
      >>> sum([int(c) for c in code if c in "0123456789"])
      6
      ```

      Whatever it goes through, a comprehension in square brackets makes a list. When you want a string instead, hand the list of strings to the string method `join` from part 4. It makes one string of the pieces, with the string you call it on between each two of them:

      ```python repl
      >>> digits = [c for c in "a1b2c3" if c in "0123456789"]
      >>> "".join(digits)
      '123'
      >>> "+".join(digits)
      '1+2+3'
      ```

      The pieces must be strings, though. The digits as numbers stop `join`:

      ```python run crash
      numbers = [int(c) for c in "a1b2c3" if c in "0123456789"]
      print("+".join(numbers))
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 2, in <module>
          print("+".join(numbers))
                ~~~~~~~~^^^^^^^^^
      TypeError: sequence item 0: expected str instance, int found
      ```

      Item 0, the first one, is an `int`, not a `str`. Keep the pieces as strings for `join`, or turn each number back into a string with a comprehension: `"+".join([str(n) for n in numbers])` gives `1+2+3`.

      ### Word by word

      To work on whole words instead of characters, `split` the string first. `split()` gives a list of the words, a comprehension changes each of them, and `join` puts them back together with a space between each two. The string method `capitalize` gives a word with its first letter in capitals and the rest in small letters, so it also fixes the all-capitals `LORD`:

      ```python run
      title = "the LORD of the rings"
      print(" ".join([word.capitalize() for word in title.split()]))
      ```

      ```output
      The Lord Of The Rings
      ```

      Back at the level of characters, an `if` and `else` in front of the `for`, as in the previous module, changes some characters and keeps the rest. This makes a file name out of a title:

      ```python run
      title = "My Summer Photos"
      file_name = "".join(["_" if c == " " else c.lower() for c in title])
      print(file_name + ".zip")
      ```

      ```output
      my_summer_photos.zip
      ```

      ### Objects of your own classes

      A list of objects works like any other list. The expression and the condition can use the objects' attributes and methods. The expression decides what goes into the new list: below, the first comprehension collects names, and the second one, with just `recipe` in front of the `for`, keeps the `Recipe` objects themselves:

      ```python run
      class Recipe:
          def __init__(self, name, minutes):
              self.name = name
              self.minutes = minutes


      recipes = [Recipe("Pancakes", 20), Recipe("Toast", 5), Recipe("Lasagna", 90), Recipe("Salad", 10)]
      print([recipe.name for recipe in recipes if recipe.minutes <= 15])

      quick = [recipe for recipe in recipes if recipe.minutes <= 15]
      for recipe in quick:
          recipe.name += " (quick)"
      print([recipe.name for recipe in recipes])
      ```

      ```output
      ['Toast', 'Salad']
      ['Pancakes', 'Toast (quick)', 'Lasagna', 'Salad (quick)']
      ```

      `quick` is a new list, but its items aren't new objects. As in part 9, a list holds references, so `quick` and `recipes` refer to the same two objects, `Toast` and `Salad`. The loop changes them through `quick`, and the change shows when the last line goes through `recipes`.

      ### Your own iterable classes

      The `for` inside a comprehension is the same `for` as in a loop, so it accepts the same things. That includes objects of a class with the methods `__iter__` and `__next__`, the iterable classes of part 10. A `Countdown` hands out the numbers from its start down to 1, and the comprehension gets them one by one, just like items of a list:

      ```python run
      class Countdown:
          def __init__(self, start):
              self.start = start

          def __iter__(self):
              self.current = self.start
              return self

          def __next__(self):
              if self.current == 0:
                  raise StopIteration
              self.current -= 1
              return self.current + 1


      print([n * 10 for n in Countdown(4)])
      ```

      ```output
      [40, 30, 20, 10]
      ```

      **Your turn:** an acronym is made of the first letters of the words, in capitals. Fill in the blank so the program prints:

      ```
      PNG
      ```
    fill: |
      name = "portable network graphics"
      acronym = "".join([[[word[0]]].upper() for word in name.split()])
      print(acronym)
    hints:
      - "`name.split()` gives the list of words, and the comprehension goes through them one `word` at a time."
      - "The first letter of a word is at index 0: the blank is `word[0]`."
    tests:
      - expect: PNG
    more:
      - task: |
          Write a function `double_letters(word)` that returns a new string in which every character of `word` is doubled. Use a list comprehension and `join`.

          For example, `double_letters("hello")` returns `"hheelllloo"`, so this call:

          ```python fragment
          print(double_letters("hello"))
          ```

          prints:

          ```
          hheelllloo
          ```
        seed: |
          def double_letters(word):
              pass


          if __name__ == "__main__":
              print(double_letters("hello"))
        solution: |
          def double_letters(word):
              return "".join([c * 2 for c in word])


          if __name__ == "__main__":
              print(double_letters("hello"))
        hints:
          - "A comprehension over `word` goes through its characters. A character times 2 is that character twice: `\"e\" * 2` is `\"ee\"`."
          - "`[c * 2 for c in word]` is a list of doubled characters. Join them with nothing between them: `\"\".join(...)`."
        require:
          - pattern: \[[^\n]*\bfor\b
            message: Make the doubled characters with a list comprehension.
          - pattern: \.join\s*\(
            message: Put the pieces together into one string with `join`.
        tests:
          - call: print(double_letters("hello"))
          - call: double_letters("ab c")
            hidden: true
          - call: double_letters("")
            hidden: true
      - task: |
          The program has a class `Song`, with a title and a length in seconds. Write a function `short_songs(songs, limit)` that returns a list of the titles of the songs that are shorter than `limit` seconds, in their original order. Use a list comprehension.

          For example, this program:

          ```python fragment
          songs = [Song("Intro", 95), Song("Epic", 610), Song("Hit", 200)]
          print(short_songs(songs, 300))
          ```

          prints:

          ```
          ['Intro', 'Hit']
          ```
        seed: |
          class Song:
              def __init__(self, title, seconds):
                  self.title = title
                  self.seconds = seconds


          def short_songs(songs, limit):
              pass


          if __name__ == "__main__":
              songs = [Song("Intro", 95), Song("Epic", 610), Song("Hit", 200)]
              print(short_songs(songs, 300))
        solution: |
          class Song:
              def __init__(self, title, seconds):
                  self.title = title
                  self.seconds = seconds


          def short_songs(songs, limit):
              return [song.title for song in songs if song.seconds < limit]


          if __name__ == "__main__":
              songs = [Song("Intro", 95), Song("Epic", 610), Song("Hit", 200)]
              print(short_songs(songs, 300))
        hints:
          - The new list should hold titles, so the expression is the song's `title` attribute.
          - "Filter with the `seconds` attribute: `if song.seconds < limit`."
          - "Put it together: `[song.title for song in songs if ...]`."
        require:
          - pattern: \[[^\n]*\bfor\b
            message: Build the list of titles with a list comprehension.
        tests:
          - call: |
              songs = [Song("Intro", 95), Song("Epic", 610), Song("Hit", 200)]
              print(short_songs(songs, 300))
          - call: short_songs([Song("A", 300), Song("B", 299), Song("C", 30)], 300)
            hidden: true
          - call: short_songs([Song("Long", 900)], 60)
            hidden: true

  - id: more-comprehensions-dictionaries
    slug: dictionaries
    title: Dictionary comprehensions
    text: |
      In part 5 you built dictionaries with a loop: start from an empty dictionary, and in each round store a value under a key. This one turns temperatures in Celsius into Fahrenheit:

      ```python run
      celsius = [0, 25, 100]
      fahrenheit = {}
      for c in celsius:
          fahrenheit[c] = c * 9 / 5 + 32
      print(fahrenheit)
      ```

      ```output
      {0: 32.0, 25: 77.0, 100: 212.0}
      ```

      A **dictionary comprehension** says the same in one line. It's written in curly brackets, like a dictionary, and in front of the `for` it has a key and a value with a colon between them, like a pair in a dictionary:

      ```python run
      celsius = [0, 25, 100]
      fahrenheit = {c: c * 9 / 5 + 32 for c in celsius}
      print(fahrenheit)
      ```

      ```output
      {0: 32.0, 25: 77.0, 100: 212.0}
      ```

      The shape is:

      ```text
      {key: value for item in series}
      ```

      Compare it with the loop: what comes before the colon, `c`, is what went between the square brackets in `fahrenheit[c]`, and what comes after it is the value that was stored there. A filter with `if` at the end works just as in a list comprehension.

      ### A key only once

      A dictionary has each key only once. When a comprehension makes the same key again, the new value replaces the old one, and the key keeps its place from the first time. Here every fruit goes under its first letter:

      ```python run
      fruits = ["apple", "avocado", "banana", "blueberry", "cherry"]
      by_letter = {fruit[0]: fruit for fruit in fruits}
      print(by_letter)
      ```

      ```output
      {'a': 'avocado', 'b': 'blueberry', 'c': 'cherry'}
      ```

      `"apple"` went in first, under `"a"`, and then `"avocado"` took its place. Five fruits went in, but the dictionary has only three keys, and for each letter the last fruit wins.

      ### From a dictionary to a dictionary

      To go through a dictionary's keys and values together, use its `items()` method, as in a `for` loop. Then the new dictionary can change the values, leave some pairs out, or even swap the keys and values:

      ```python repl
      >>> prices = {"tea": 3, "cake": 5, "soup": 8}
      >>> {name: price * 2 for name, price in prices.items()}
      {'tea': 6, 'cake': 10, 'soup': 16}
      >>> {name: price for name, price in prices.items() if price < 6}
      {'tea': 3, 'cake': 5}
      >>> {price: name for name, price in prices.items()}
      {3: 'tea', 5: 'cake', 8: 'soup'}
      ```

      Two lists of the same length can become one dictionary, with the indexes from `range(len(...))`:

      ```python run
      names = ["Ada", "Alan", "Grace"]
      born = [1815, 1912, 1906]
      years = {names[i]: born[i] for i in range(len(names))}
      print(years)
      ```

      ```output
      {'Ada': 1815, 'Alan': 1912, 'Grace': 1906}
      ```

      ### Curly brackets, not square ones

      A key and a value with a colon only work inside curly brackets. In square brackets, Python stops at the colon:

      ```python run crash
      celsius = [0, 25, 100]
      fahrenheit = [c: c * 9 / 5 + 32 for c in celsius]
      ```

      ```crash
        File "main.py", line 2
          fahrenheit = [c: c * 9 / 5 + 32 for c in celsius]
                         ^
      SyntaxError: invalid syntax
      ```

      **Your turn:** fill in the blank so that the dictionary has the numbers 1 to 5 as its keys and each number's square as its value. The program should print:

      ```
      {1: 1, 2: 4, 3: 9, 4: 16, 5: 25}
      ```
    fill: |
      squares = {n: [[n * n‖n ** 2]] for n in range(1, 6)}
      print(squares)
    hints:
      - The key comes before the colon and the value after it. The key is the number `n` itself.
      - "The value is the square of `n`: `n * n`."
    tests:
      - expect: "{1: 1, 2: 4, 3: 9, 4: 16, 5: 25}"
    more:
      - task: |
          What does this program print? Type each line it prints.
        predict: |
          words = ["sun", "moon", "star", "sky"]
          by_length = {len(w): w for w in words}
          print(by_length)
          print(len(by_length))
          print({w: n for n, w in by_length.items()})
        hints:
          - "The key is the length of each word. Two of the words have 3 letters, and two have 4."
          - When a key comes again, its new value replaces the old one, but the key stays where it was first put. `len` of a dictionary is the number of its keys.
          - "The last comprehension goes through the pairs that `items()` gives and swaps each key and value."
      - task: |
          Write a function `passed(scores, limit)` that gets a dictionary of names and scores, and returns a new dictionary with only the people whose score is at least `limit`. Use a dictionary comprehension.

          For example, this call:

          ```python fragment
          print(passed({"Ann": 72, "Bo": 45, "Cy": 90}, 50))
          ```

          prints:

          ```
          {'Ann': 72, 'Cy': 90}
          ```
        seed: |
          def passed(scores, limit):
              pass


          if __name__ == "__main__":
              print(passed({"Ann": 72, "Bo": 45, "Cy": 90}, 50))
        solution: |
          def passed(scores, limit):
              return {name: score for name, score in scores.items() if score >= limit}


          if __name__ == "__main__":
              print(passed({"Ann": 72, "Bo": 45, "Cy": 90}, 50))
        hints:
          - "Go through the names and scores together: `for name, score in scores.items()`."
          - "The pairs stay as they are, so the key and value are `name: score`. A filter at the end leaves out the rest."
          - "The filter is `if score >= limit`."
        require:
          - pattern: \{[^\n]*\bfor\b
            message: Build the new dictionary with a dictionary comprehension.
        tests:
          - call: 'print(passed({"Ann": 72, "Bo": 45, "Cy": 90}, 50))'
          - call: 'passed({"Dee": 10, "Eli": 20, "Fay": 30}, 20)'
            hidden: true
          - call: 'passed({"Gus": 1}, 5)'
            hidden: true

  - id: more-comprehensions-sets
    slug: sets
    title: Sets and set comprehensions
    text: |
      Sometimes you only care which values there are, not how many times each one comes up. A **set** is a collection for that. Each value is in a set only once, and a set keeps no order. You write one in curly brackets, or make one out of a list with `set`, which drops the repeats:

      ```python repl
      >>> colors = {"red", "blue", "red"}
      >>> len(colors)
      2
      >>> "blue" in colors
      True
      >>> colors.add("green")
      >>> colors.add("red")
      >>> len(colors)
      3
      >>> set([3, 1, 3, 2, 1])
      {1, 2, 3}
      ```

      The method `add` adds a value to a set, and adding a value that's already there changes nothing. An empty set is `set()`, because `{}` is an empty dictionary.

      ### Sort a set before you print it

      A set has no order of its own. Small whole numbers usually come out in increasing order, but strings come out in a different order from one run of the program to the next. So whenever you print a set of strings, or go through one, sort it first. `sorted` gives a sorted list:

      ```python repl
      >>> sorted({"pear", "apple", "fig"})
      ['apple', 'fig', 'pear']
      ```

      ### Set comprehensions

      Curly brackets without a key and a colon make a **set comprehension**. The repeats disappear on their own:

      ```python run
      words = ["tree", "car", "house", "dog", "bike", "sun"]
      lengths = {len(word) for word in words}
      print(lengths)
      print(len(lengths), "different lengths")
      ```

      ```output
      {3, 4, 5}
      3 different lengths
      ```

      Six words, but only three different lengths. Here the set holds strings, so it's sorted before it's printed:

      ```python run
      words = ["tree", "car", "house", "dog", "bike", "cat"]
      first_letters = sorted({word[0] for word in words})
      print(first_letters)
      ```

      ```output
      ['b', 'c', 'd', 'h', 't']
      ```

      So curly brackets make two kinds of comprehension: with `key: value` a dictionary, and with a single expression a set.

      ### A set has no indexes

      Since a set keeps no order, there's no first or second item, and indexing stops the program:

      ```python run crash
      lengths = {3, 4, 5}
      print(lengths[0])
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 2, in <module>
          print(lengths[0])
                ~~~~~~~^^^
      TypeError: 'set' object is not subscriptable
      ```

      "Subscriptable" means that something can be indexed with square brackets. To get the values in order, make a sorted list first: `sorted(lengths)[0]` is the smallest.

      **Your turn:** fill in the blank so that `lengths` is the set of the different word lengths. The program should print:

      ```
      {4, 5, 6}
      ```
    fill: |
      words = ["banana", "kiwi", "apple", "plum", "pear"]
      lengths = {[[len(word)]] for word in words}
      print(lengths)
    hints:
      - The expression of a set comprehension is the value that goes into the set for each word.
      - "The length of a word is `len(word)`."
    tests:
      - expect: "{4, 5, 6}"
    more:
      - task: |
          Write a function `used_letters(text)` that returns a sorted list of the different letters in `text`, all in lowercase, without spaces. Use a set comprehension, and sort the set into a list.

          For example, this call:

          ```python fragment
          print(used_letters("Hello World"))
          ```

          prints:

          ```
          ['d', 'e', 'h', 'l', 'o', 'r', 'w']
          ```
        seed: |
          def used_letters(text):
              pass


          if __name__ == "__main__":
              print(used_letters("Hello World"))
        solution: |
          def used_letters(text):
              return sorted({c for c in text.lower() if c != " "})


          if __name__ == "__main__":
              print(used_letters("Hello World"))
        hints:
          - "Go through the characters of `text.lower()`, so the capitals become small letters, and filter out the spaces with `if c != \" \"`."
          - "In curly brackets, the comprehension makes a set, so each letter is in it only once."
          - "`sorted(...)` around the set gives a sorted list."
        require:
          - pattern: \{[^\n]*\bfor\b
            message: Collect the letters with a set comprehension.
          - pattern: \bsorted\s*\(
            message: Sort the set into a list with `sorted`.
        tests:
          - call: print(used_letters("Hello World"))
          - call: used_letters("banana bread")
            hidden: true
          - call: used_letters("A a A")
            hidden: true
      - task: |
          Write a function `common(first, second)` that returns a sorted list of the different values that are in both lists. Use a set comprehension.

          For example, this call:

          ```python fragment
          print(common(["tea", "milk", "jam", "tea"], ["jam", "bread", "tea"]))
          ```

          prints:

          ```
          ['jam', 'tea']
          ```
        seed: |
          def common(first, second):
              pass


          if __name__ == "__main__":
              print(common(["tea", "milk", "jam", "tea"], ["jam", "bread", "tea"]))
        solution: |
          def common(first, second):
              return sorted({item for item in first if item in second})


          if __name__ == "__main__":
              print(common(["tea", "milk", "jam", "tea"], ["jam", "bread", "tea"]))
        hints:
          - "Go through the first list and keep only the items that are also in the second: `if item in second`."
          - "In curly brackets the comprehension makes a set, so `\"tea\"` is there only once even though the first list has it twice."
          - "Return `sorted(...)` of the set, a sorted list."
        require:
          - pattern: \{[^\n]*\bfor\b
            message: Collect the values with a set comprehension.
        tests:
          - call: print(common(["tea", "milk", "jam", "tea"], ["jam", "bread", "tea"]))
          - call: common([5, 3, 9, 3, 1], [1, 3, 7, 3])
            hidden: true
          - call: common(["a", "b"], ["c"])
            hidden: true
