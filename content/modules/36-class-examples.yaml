        solution: |
          class Album:
              def __init__(self, title, artist, year):
                  self.title = title
                  self.artist = artist
                  self.year = year

              def __str__(self):
                  return f"{self.title} by {self.artist} ({self.year})"


          class Collection:
              def __init__(self):
                  self.albums = []

              def add(self, title, artist, year):
                  self.albums.append(Album(title, artist, year))

              def by_artist(self, artist):
                  found = []
                  for album in self.albums:
                      if album.artist == artist:
                          found.append(album)
                  return found

              def from_years(self, first, last):
                  found = []
                  for album in self.albums:
                      if first <= album.year <= last:
                          found.append(album)
                  return found


          if __name__ == "__main__":
              shelf = Collection()
              shelf.add("Blue", "Joni Mitchell", 1971)
              shelf.add("Kind of Blue", "Miles Davis", 1959)
              for album in shelf.by_artist("Joni Mitchell"):
                  print(album)
