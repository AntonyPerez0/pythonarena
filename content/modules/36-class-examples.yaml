          Write a class `TodoList` that keeps tasks as strings. Give it these methods:

          - `add(task)` puts a task at the end of the list.
          - `done(task)` removes the task and returns `True`, or returns `False` when there is no such task.
          - `search(word)` returns a list of the tasks that have the word in them, whatever the capitals, in their order in the list.
          - `__str__` returns `no tasks` when the list is empty, and otherwise the word `Tasks`, the number of tasks in parentheses, a colon and the tasks separated by commas, as shown below.

          This code:

          ```python fragment
          todo = TodoList()
          todo.add("Buy milk")
          todo.add("Call grandma")
          todo.add("Buy stamps")
          print(todo)
          print(todo.search("buy"))
          print(todo.done("Buy milk"), todo.done("Swim"))
          print(todo)
          ```

          prints

          ```
          Tasks (3): Buy milk, Call grandma, Buy stamps
          ['Buy milk', 'Buy stamps']
          True False
          Tasks (2): Call grandma, Buy stamps
          ```
        seed: |
          class TodoList:
              pass


          if __name__ == "__main__":
              todo = TodoList()
              todo.add("Buy milk")
              todo.add("Call grandma")
              print(todo)
              print(todo.search("buy"))
        solution: |
          class TodoList:
              def __init__(self):
                  self.tasks = []

              def add(self, task):
                  self.tasks.append(task)

              def done(self, task):
                  if task in self.tasks:
                      self.tasks.remove(task)
                      return True
                  return False

              def search(self, word):
                  found = []
                  for task in self.tasks:
                      if word.lower() in task.lower():
                          found.append(task)
                  return found

              def __str__(self):
                  if len(self.tasks) == 0:
                      return "no tasks"
                  return f"Tasks ({len(self.tasks)}): " + ", ".join(self.tasks)


          if __name__ == "__main__":
              todo = TodoList()
              todo.add("Buy milk")
              todo.add("Call grandma")
              print(todo)
              print(todo.search("buy"))
        hints:
          - "The constructor makes an empty list. `done` checks `if task in self.tasks:` before it removes anything."
          - "In `search`, compare both in small letters: `word.lower() in task.lower()`, and collect the matches in a new list."
          - "`__str__` returns `f\"Tasks ({len(self.tasks)}): \" + \", \".join(self.tasks)`, or `\"no tasks\"` for an empty list."
