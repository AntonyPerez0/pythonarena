      - task: |
          Write a class `Cart` for a web shop's shopping cart. It keeps the products and their prices in a list. Give it these methods:

          - `add(product, price)` puts a product in the cart.
          - `remove(product)` takes the first product with that name out of the cart and returns `True`, or returns `False` when there is none.
          - `total()` returns the sum of the prices.
          - `__str__` returns the number of items and the total with two decimals, in the form shown below.

          This code:

          ```python fragment
          cart = Cart()
          cart.add("socks", 4.5)
          cart.add("hat", 12)
          cart.add("socks", 4.5)
          print(cart)
          print(cart.remove("hat"), cart.remove("scarf"))
          print(cart)
          ```

          prints

          ```
          items: 3, total 21.00
          True False
          items: 2, total 9.00
          ```
        seed: |
          class Cart:
              def __init__(self):
                  self.items = []


          if __name__ == "__main__":
              cart = Cart()
              cart.add("socks", 4.5)
              print(cart)
        solution: |
          class Cart:
              def __init__(self):
                  self.items = []

              def add(self, product, price):
                  self.items.append((product, price))

              def remove(self, product):
                  for item in self.items:
                      if item[0] == product:
                          self.items.remove(item)
                          return True
                  return False

              def total(self):
                  total = 0
                  for product, price in self.items:
                      total += price
                  return total

              def __str__(self):
                  return f"items: {len(self.items)}, total {self.total():.2f}"


          if __name__ == "__main__":
              cart = Cart()
              cart.add("socks", 4.5)
              print(cart)
        hints:
          - "Keep each product as a tuple: `self.items.append((product, price))`."
          - "In `remove`, loop through the tuples. When `item[0] == product`, take that tuple out with the list method `remove` and return `True` right away. After the loop, return `False`."
          - "`__str__` can use `len(self.items)` and `self.total()`; `:.2f` shows two decimals."
        tests:
          - call: |
              cart = Cart()
              cart.add("socks", 4.5)
              cart.add("hat", 12)
              cart.add("socks", 4.5)
              print(cart)
              print(cart.remove("hat"), cart.remove("scarf"))
              print(cart)
          - call: |
              cart = Cart()
              print(cart, cart.total())
              cart.add("mug", 8.25)
              cart.add("tea", 3.1)
              cart.add("mug", 7.0)
              print(cart.remove("mug"), cart.total())
              print(cart.remove("tea"), cart.remove("tea"))
              print(cart)
            hidden: true
      - task: |
          Write a class `TicketQueue` for the line at a ticket counter. Give it these methods:

          - `arrive(name)` puts the person at the end of the line.
          - `serve()` takes the first person out of the line and returns their name. When the line is empty, it returns the string `"nobody"`.
          - `position(name)` returns the person's place in the line, counting from 1, or 0 when they are not in it.
          - `__str__` returns the names in order with ` > ` between them, or `empty` when nobody is waiting.

          This code:

          ```python fragment
          line = TicketQueue()
          line.arrive("Ann")
          line.arrive("Bo")
          line.arrive("Cy")
          print(line)
          print(line.position("Cy"), line.position("Dee"))
          print(line.serve())
          print(line)
          ```

          prints

          ```
          Ann > Bo > Cy
          3 0
          Ann
          Bo > Cy
          ```
        seed: |
          class TicketQueue:
              pass


          if __name__ == "__main__":
              line = TicketQueue()
              line.arrive("Ann")
              line.arrive("Bo")
              print(line)
        solution: |
          class TicketQueue:
              def __init__(self):
                  self.names = []

              def arrive(self, name):
                  self.names.append(name)

              def serve(self):
                  if len(self.names) == 0:
                      return "nobody"
                  return self.names.pop(0)

              def position(self, name):
                  for i in range(len(self.names)):
                      if self.names[i] == name:
                          return i + 1
                  return 0

              def __str__(self):
                  if len(self.names) == 0:
                      return "empty"
                  return " > ".join(self.names)


          if __name__ == "__main__":
              line = TicketQueue()
              line.arrive("Ann")
              line.arrive("Bo")
              print(line)
        hints:
          - "Keep the names in a list attribute that the constructor makes. `pop(0)` takes out the first one."
          - "For `position`, go through the indexes with `for i in range(len(self.names)):`. When `self.names[i] == name`, return `i + 1`, since the places count from 1. After the loop, return 0."
          - "`__str__` returns `\" > \".join(self.names)`, or `\"empty\"` when the list is empty."
        tests:
          - call: |
              line = TicketQueue()
              line.arrive("Ann")
              line.arrive("Bo")
              line.arrive("Cy")
              print(line)
              print(line.position("Cy"), line.position("Dee"))
              print(line.serve())
              print(line)
          - call: |
              q = TicketQueue()
              print(q)
              print(q.serve(), q.position("Ann"))
              q.arrive("Zoe")
              q.arrive("Yan")
              print(q.position("Yan"), q.serve(), q.position("Yan"))
              print(q.serve(), q.serve())
              print(q)
            hidden: true

  - id: class-examples-search
    slug: searching
    title: A collection you can search
    text: |
      A larger program often has two kinds of classes: one for a single thing, and one for a collection of those things. Here a `Hike` knows its own data and how to show itself, and a `Logbook` keeps the hikes someone plans to walk and answers questions about them:

      ```python run
      class Hike:
          def __init__(self, name, km):
              self.name = name
              self.km = km
              self.walked = False

          def __str__(self):
              status = "walked" if self.walked else "not yet"
              return f"{self.name} ({self.km} km, {status})"


      class Logbook:
          def __init__(self):
              self.hikes = []

          def add(self, name, km):
              self.hikes.append(Hike(name, km))

          def mark_walked(self, name):
              for hike in self.hikes:
                  if hike.name == name:
                      hike.walked = True

          def find(self, word):
              found = []
              for hike in self.hikes:
                  if word.lower() in hike.name.lower():
                      found.append(hike)
              return found

          def km_left(self):
              total = 0
              for hike in self.hikes:
                  if not hike.walked:
                      total += hike.km
              return total


      summer = Logbook()
      summer.add("Lake Path", 5)
      summer.add("Ridge Loop", 12)
      summer.add("Old lake trail", 9)
      summer.mark_walked("Lake Path")

      for hike in summer.find("lake"):
          print(hike)
      print("Km left:", summer.km_left())
      ```

      ```output
      Lake Path (5 km, walked)
      Old lake trail (9 km, not yet)
      Km left: 21
      ```

      A few things to notice:

      - The client only calls `add` with a name and a length. `Logbook` makes the `Hike` objects itself and keeps them in its list.
      - `find` is a search: it goes through the list and collects the hikes that match into a new list. It compares in small letters, so `lake` also finds `Lake`.
      - `find` returns the `Hike` objects themselves, so the client can print them (with their `__str__`) or use their attributes.
      - `mark_walked` changes the attribute of a hike that is in the list. The list holds references to the hikes, so the change stays.

      ### Searching for the best match

      Another common search finds the one item that is best by some measure. Such a method goes through the list once and remembers the best item so far. If the list can be empty, it needs an answer for that too:

      ```python fragment
      def longest(self):
          if len(self.hikes) == 0:
              return None
          best = self.hikes[0]
          for hike in self.hikes:
              if hike.km > best.km:
                  best = hike
          return best
      ```

