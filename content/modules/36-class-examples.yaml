      - task: |
          Write a class `Parcel` whose constructor takes the receiver's name and the weight in kilograms, and stores them in the attributes `receiver` and `kg`. Every new parcel also has the attribute `delivered`, set to `False`. Give it a method `deliver()`, which marks the parcel delivered, and a `__str__` method that returns the text shown below: when the parcel has been delivered, it ends with ` (delivered)`.

          This code:

          ```python fragment
          box = Parcel("Ada", 2.5)
          print(box)
          box.deliver()
          print(box)
          ```

          prints

          ```
          Parcel for Ada, 2.5 kg
          Parcel for Ada, 2.5 kg (delivered)
          ```
        seed: |
          # Write the class Parcel here.


          if __name__ == "__main__":
              box = Parcel("Ada", 2.5)
              print(box)
        solution: |
          class Parcel:
              def __init__(self, receiver, kg):
                  self.receiver = receiver
                  self.kg = kg
                  self.delivered = False

              def deliver(self):
                  self.delivered = True

              def __str__(self):
                  text = f"Parcel for {self.receiver}, {self.kg} kg"
                  if self.delivered:
                      text += " (delivered)"
                  return text


          if __name__ == "__main__":
              box = Parcel("Ada", 2.5)
              print(box)
        hints:
          - "`deliver` only sets `self.delivered = True`."
          - "In `__str__`, build the text with an f-string, and add `\" (delivered)\"` to it when `self.delivered` is `True`."
          - Return the finished string at the end of `__str__`.
        tests:
          - call: |
              box = Parcel("Ada", 2.5)
              print(box)
              box.deliver()
              print(box)
          - call: |
              big = Parcel("Grace Hopper", 14)
              small = Parcel("Linus", 0.3)
              small.deliver()
              print(big)
              print(small)
              print(str(big).upper())
            hidden: true

  - id: class-examples-derived
    slug: derived-values
    title: Values worked out from others
    text: |
      Often some of an object's values follow from others. A length of time in seconds also tells you how many hours and minutes it is. A good rule is to store the basic data in attributes and to work out the rest in methods, so that it is always up to date:

      ```python run
      class Duration:
          def __init__(self, seconds):
              self.seconds = seconds

          def hours(self):
              return self.seconds // 3600

          def minutes(self):
              return self.seconds % 3600 // 60

          def add(self, seconds):
              self.seconds += seconds

          def __str__(self):
              return f"{self.hours()}:{self.minutes():02}:{self.seconds % 60:02}"


      film = Duration(5409)
      print(film)
      film.add(600)
      print(film)
      print(film.hours(), film.minutes())
      ```

      ```output
      1:30:09
      1:40:09
      1 40
      ```

      The object stores only the total number of seconds. `add` changes that one attribute, and the hours and minutes are right after it, because they are worked out each time they are asked for.

      In an f-string, `:02` after a whole number shows it with at least two digits, filling with zeros in front: `{9:02}` is `09`. Clock times need that.

      If a class does store a value worked out from others, say to save working it out again and again, then every method that changes the data must update that value too. Forget one, and the object contradicts itself. That is why the rule above is a good one.

      ### Values that wrap around

      Some values go around in a circle. An odometer with four digits goes from 9999 back to 0000, as a clock goes from 23:59 to 00:00. The remainder operator `%` keeps such a value in range:

      ```python run
      class Odometer:
          def __init__(self):
              self.km = 0

          def drive(self, km):
              self.km = (self.km + km) % 10000

          def __str__(self):
              return f"{self.km:04}"


      old_van = Odometer()
      old_van.drive(9950)
      print(old_van)
      old_van.drive(75)
      print(old_van)
      ```

      ```output
      9950
      0025
      ```

      9950 + 75 is 10025, and the remainder when that is divided by 10000 is 25. With `%`, the method can never leave the odometer out of range, whatever the client drives.

      **Your turn:** what does this program print? Type each line it prints.
    predict: |
      class Dial:
          def __init__(self):
              self.position = 0

          def turn(self, steps):
              self.position = (self.position + steps) % 12

          def __str__(self):
              return f"position {self.position:02}"


      d = Dial()
      d.turn(5)
      print(d)
      d.turn(10)
      print(d)
      d.turn(20)
      print(d)
    hints:
      - "`print(d)` uses `__str__`, which shows the position with at least two digits."
      - "After turning 5, the dial is at 5. Turning 10 more gives 15, and 15 % 12 is 3."
      - "3 + 20 is 23, and 23 % 12 is 11."
    more:
      - task: |
          Write a class `Record` that keeps a team's wins and losses. Its constructor takes the starting numbers of wins and losses, both 0 when not given, and stores them in the attributes `wins` and `losses`. Give it these methods:

          - `win()` and `lose()` add one to the wins or the losses.
          - `games()` returns the number of games played.
          - `win_percent()` returns the share of games won as a whole number of percent (use `round`), or 0 when no games have been played.
          - `__str__` returns the wins, a hyphen, the losses and the percent, as shown below.

          This code:

          ```python fragment
          team = Record(6, 3)
          print(team, team.games())
          team.win()
          print(team)
          rookies = Record()
          print(rookies)
          ```

          prints

          ```
          6-3 (67%) 9
          7-3 (70%)
          0-0 (0%)
          ```
        seed: |
          class Record:
              pass


          if __name__ == "__main__":
              team = Record(6, 3)
              print(team, team.games())
        solution: |
          class Record:
              def __init__(self, wins=0, losses=0):
                  self.wins = wins
                  self.losses = losses

              def win(self):
                  self.wins += 1

              def lose(self):
                  self.losses += 1

              def games(self):
                  return self.wins + self.losses

              def win_percent(self):
                  if self.games() == 0:
                      return 0
                  return round(self.wins / self.games() * 100)

              def __str__(self):
                  return f"{self.wins}-{self.losses} ({self.win_percent()}%)"


          if __name__ == "__main__":
              team = Record(6, 3)
              print(team, team.games())
        hints:
          - "Store only the wins and the losses. `games` and `win_percent` work them out each time: `self.wins + self.losses`."
          - "In `win_percent`, return 0 first when `self.games() == 0`, so that you never divide by zero."
          - "`__str__` can call the other methods: `f\"{self.wins}-{self.losses} ({self.win_percent()}%)\"`."
        tests:
          - call: |
              team = Record(6, 3)
              print(team, team.games())
              team.win()
              print(team)
              rookies = Record()
              print(rookies)
          - call: |
              r = Record()
              r.lose()
              r.lose()
              r.win()
              print(r, r.games(), r.win_percent())
              print(Record(1, 0), Record(0, 4), Record(2, 1))
            hidden: true
      - task: |
          Write a class `Countdown` for a kitchen timer. Its constructor takes the minutes and the seconds to start from. Give it these methods:

          - `tick()` takes one second off the time. When the time is already 00:00, it stays there.
          - `__str__` returns the time left as minutes and seconds, both with two digits: `02:05`.

          This code:

          ```python fragment
          timer = Countdown(1, 1)
          print(timer)
          timer.tick()
          print(timer)
          timer.tick()
          print(timer)
          ```

          prints

          ```
          01:01
          01:00
          00:59
          ```
        seed: |
          class Countdown:
              def __init__(self, minutes, seconds):
                  pass


          if __name__ == "__main__":
              timer = Countdown(1, 1)
              print(timer)
              timer.tick()
              print(timer)
        solution: |
          class Countdown:
              def __init__(self, minutes, seconds):
                  self.left = minutes * 60 + seconds

              def tick(self):
                  if self.left > 0:
                      self.left -= 1

              def __str__(self):
                  return f"{self.left // 60:02}:{self.left % 60:02}"


          if __name__ == "__main__":
              timer = Countdown(1, 1)
              print(timer)
              timer.tick()
              print(timer)
        hints:
          - "It's easiest to store just one number: the seconds left, `minutes * 60 + seconds`."
          - "`tick` takes one off only `if` there is time left."
          - "In `__str__`, the minutes are the seconds left `// 60` and the seconds are `% 60`. Show both with `:02`."
        tests:
          - call: |
              timer = Countdown(1, 1)
              print(timer)
              timer.tick()
              print(timer)
              timer.tick()
              print(timer)
          - call: |
              egg = Countdown(0, 2)
              for i in range(4):
                  print(egg)
                  egg.tick()
              print(egg)
              print(Countdown(12, 0), Countdown(0, 59), Countdown(5, 30))
            hidden: true
          - call: |
              long = Countdown(10, 0)
              for i in range(61):
                  long.tick()
              print(long)
            hidden: true

  - id: class-examples-list
    slug: keeping-a-list
    title: A class that keeps a list
    text: |
      Many classes keep a collection of things in a list attribute and offer methods to add to it, take from it and ask about it. The client doesn't touch the list itself; it uses the methods.

      The string method `join` from part 4 comes in handy for showing such a list. As a reminder, it puts the strings of a list together into one string, with the string it is called on between them:

      ```python repl
      >>> names = ["Ann", "Bo", "Cy"]
      >>> ", ".join(names)
      'Ann, Bo, Cy'
      >>> " / ".join(names)
      'Ann / Bo / Cy'
      ```

      Read `", ".join(names)` as "join the names with a comma and a space". All the items have to be strings.

      Here is a waiting list for a busy restaurant. The first to arrive is the first to get a table:

      ```python run
      class WaitingList:
          def __init__(self):
              self.names = []

          def add(self, name):
              self.names.append(name)

          def next_up(self):
              return self.names.pop(0)

          def size(self):
              return len(self.names)

          def __str__(self):
              if len(self.names) == 0:
                  return "nobody waiting"
              return ", ".join(self.names)


      tables = WaitingList()
      tables.add("Ann")
      tables.add("Bo")
      tables.add("Cy")
      print(tables)
      print("Table for", tables.next_up())
      print(tables, "/", tables.size(), "waiting")
      ```

      ```output
      Ann, Bo, Cy
      Table for Ann
      Bo, Cy / 2 waiting
      ```

      `next_up` both changes the list and returns the name it took out, thanks to `pop(0)`. The constructor makes a new empty list for every waiting list, so two restaurants never share one.

      ### A list of tuples

      When each thing in the collection has several pieces of data, the list can hold tuples. This playlist keeps each song as a pair of its title and its length in seconds:

      ```python run
      class Playlist:
          def __init__(self, name):
              self.name = name
              self.songs = []

          def add(self, title, seconds):
              self.songs.append((title, seconds))

          def total_seconds(self):
              total = 0
              for title, seconds in self.songs:
                  total += seconds
              return total

          def longest(self):
              best = self.songs[0]
              for song in self.songs:
                  if song[1] > best[1]:
                      best = song
              return best[0]

          def __str__(self):
              titles = []
              for title, seconds in self.songs:
                  titles.append(title)
              return f"{self.name}: " + ", ".join(titles)


      road_trip = Playlist("Road trip")
      road_trip.add("Highway Song", 215)
      road_trip.add("Desert Wind", 342)
      road_trip.add("Gas Station Blues", 187)
      print(road_trip)
      print(road_trip.total_seconds(), "seconds")
      print("Longest:", road_trip.longest())
      ```

      ```output
      Road trip: Highway Song, Desert Wind, Gas Station Blues
      744 seconds
      Longest: Desert Wind
      ```

      `for title, seconds in self.songs:` takes each tuple apart into two variables, as you did with a dictionary's `items()`. In `longest`, `song[1]` is a song's length and `best[0]` the title of the longest one.

      **Your turn:** fill in the blanks, so that the bag keeps its items in a list and the program prints:

      ```
      keys, phone, apple
      ```
