          - "The base case: when `len(text) == len(pattern)`, append `text` to `found` if `node.is_word`, and return."
          - "Otherwise, look at `letter = pattern[len(text)]`. For a dot, call the helper for every child in `sorted(node.children)`, with that child's letter added to `text`. For any other letter, call it only for that letter's child, if there is one."
