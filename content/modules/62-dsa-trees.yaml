        solution: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def has_path_sum(node, target):
              if node is None:
                  return False
              rest = target - node.value
              if node.left is None and node.right is None:
                  return rest == 0
              return has_path_sum(node.left, rest) or has_path_sum(node.right, rest)


          if __name__ == "__main__":
              root = Node(6, Node(3, Node(1), Node(4)), Node(9, None, Node(2)))
              print(has_path_sum(root, 13))
              print(has_path_sum(root, 9), has_path_sum(root, 15))
