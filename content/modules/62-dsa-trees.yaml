              return Node(value)
          if value < node.value:
              node.left = insert(node.left, value)
          elif value > node.value:
              node.right = insert(node.right, value)
          return node


      def search(node, value):
          while node is not None:
              print("visit", node.value)
              if value == node.value:
                  return True
              if value < node.value:
                  node = node.left
              else:
                  node = node.right
          return False


      root = None
      for value in [50, 30, 70, 20, 40, 60, 35]:
          root = insert(root, value)
      print(search(root, 38))
    hints:
