        seed: |
          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def has_path_sum(node, target):
              pass


          if __name__ == "__main__":
              root = Node(6, Node(3, Node(1), Node(4)), Node(9, None, Node(2)))
