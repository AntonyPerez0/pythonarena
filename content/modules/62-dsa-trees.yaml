id: dsa-trees
summary: Trees and the recursion that walks them. Binary trees and linked lists, binary search trees, the three traversals, stacks and level order with a deque, with what each costs and where a deep tree breaks recursion. Then binary heaps, by hand and with heapq, and tries for prefix search. Big tests show where a heap, a balanced tree or a trie is the fast way.
steps:
  - id: dsa-trees-binary-trees
    slug: binary-trees
    title: Binary trees and recursion
    text: |
      You built binary trees in the recursion module: a `Node` class with a `value` and two children, `left` and `right`, where `None` means "no child here", and recursive functions that counted the nodes, added up the values and measured the depth of a tree. This module takes trees on to what interviews ask about them. This step asks what those functions cost and where they break, and it ends with the linked list, a chain of nodes with one link each. The next ones add the order of a search tree, other ways to walk a tree, heaps and tries.

      Here are the three functions again, with the names interview questions usually give them: `size` is the recursion module's `count_nodes`, and `height` is its `depth`.

      ```python run
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def size(node):
          if node is None:
              return 0
          return 1 + size(node.left) + size(node.right)


      def tree_sum(node):
          if node is None:
              return 0
          return node.value + tree_sum(node.left) + tree_sum(node.right)


      def height(node):
          if node is None:
              return 0
          return 1 + max(height(node.left), height(node.right))


      #        4
      #       / \
      #      9   2
      #         / \
      #        7   5
      root = Node(4, Node(9), Node(2, Node(7), Node(5)))
      print(size(root), tree_sum(root), height(root))
      ```

      ```output
      5 27 3
      ```

      Read `None` as the **empty tree**. Then a tree is either empty or a node with two smaller trees, its subtrees, and that hands you the shape of almost every tree function:

      1. **The base case:** the empty tree, `None`. Its answer is usually 0, `True` or an empty list.
      2. Ask the same question of the left subtree and of the right subtree.
      3. Combine the two answers with the node itself.

      Trust the recursion. You don't need to follow every call to know that `size` is right: if it gives the right answers for the two subtrees, then 1 plus those answers is right for the whole tree. And the calls do end, because each one goes a level down, and the levels run out at `None`.

      Here the **height** is the number of nodes on the longest path from the root down to a leaf: 3, for the path 4, 2, 7. (Some books count the links between the nodes instead, which gives one less. Interview questions often call this height the "maximum depth".)

      ### A leaf is not enough of a base case

      The recursion stops at the leaves, so it's tempting to make the leaf the base case:

      ```python run crash
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def height(node):
          if node.left is None and node.right is None:
              return 1
          return 1 + max(height(node.left), height(node.right))


      print(height(Node(4, Node(9), Node(2, Node(7), Node(5)))))
      print(height(Node(4, Node(9, Node(1)))))
      ```

      ```output
      3
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 15, in <module>
          print(height(Node(4, Node(9, Node(1)))))
                ~~~~~~^^^^^^^^^^^^^^^^^^^^^^^^^^^
        File "main.py", line 11, in height
          return 1 + max(height(node.left), height(node.right))
                         ~~~~~~^^^^^^^^^^^
        File "main.py", line 11, in height
          return 1 + max(height(node.left), height(node.right))
                                            ~~~~~~^^^^^^^^^^^^
        File "main.py", line 9, in height
          if node.left is None and node.right is None:
             ^^^^^^^^^
      AttributeError: 'NoneType' object has no attribute 'left'
      ```

      The first tree works, because every node in it has two children or none. In the second, 4 and 9 each have a left child only. Neither is a leaf, so `height` calls itself for both children of each, and the call for the missing right child of 9 gets `None`, which has no `left`. Interview tests like a node with one child for exactly this reason. Checking each child before its call (`if node.left is not None:`) works, but it needs a check in front of every call and still fails on an empty tree. Handle `None` once, at the top, and the function works for leaves, for nodes with one child and for the empty tree alike.

      ### What it costs

      Each function makes one call for every node and one for every `None` below a node, and does O(1) work in each: O(n) time for n nodes. The memory goes to the calls that are waiting for an answer, which are the nodes on the path from the root to the current node: O(h) extra memory, where h is the height. A **balanced** tree, in which the two subtrees of every node have about the same height, has a height of about log₂ n: 20 levels hold a million nodes. A tree in which every node has one child is a **chain** with h = n, and there the waiting calls run into a limit:

      ```python run crash
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def height(node):
          if node is None:
              return 0
          return 1 + max(height(node.left), height(node.right))


      chain = None
      for value in range(2000):
          chain = Node(value, chain)
      print(height(chain))
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 17, in <module>
          print(height(chain))
                ~~~~~~^^^^^^^
        File "main.py", line 11, in height
          return 1 + max(height(node.left), height(node.right))
                         ~~~~~~^^^^^^^^^^^
        File "main.py", line 11, in height
          return 1 + max(height(node.left), height(node.right))
                         ~~~~~~^^^^^^^^^^^
        File "main.py", line 11, in height
          return 1 + max(height(node.left), height(node.right))
                         ~~~~~~^^^^^^^^^^^
        [Previous line repeated 996 more times]
      RecursionError: maximum recursion depth exceeded
      ```

      The loop builds the chain from the bottom up, each new node taking the chain so far as its left child: 2,000 levels, and no recursion. But `height` keeps a call waiting for every level, and Python stops at about 1000 waiting calls with a `RecursionError`. So recursion is safe on balanced trees, which are never deep, and on small trees. Interviewers like to ask about this, and the next steps show how to walk a deep tree with a loop and a stack or a queue of your own.

      ### Linked lists

      A chain is a list in disguise. Give each node a single link, `next`, and you have a **linked list**, an interview favorite. The list is known by its first node, the **head**, and the last node's `next` is `None`. Walking it is a `while` loop that follows the links. Reversing it takes three variables: `prev`, the part already reversed, `node`, the node to turn around, and `nxt`, which saves the rest of the list before `node.next` changes:

      ```python run
      class ListNode:
          def __init__(self, value, next_node=None):
              self.value = value
              self.next = next_node


      def to_list(head):
          values = []
          node = head
          while node is not None:
              values.append(node.value)
              node = node.next
          return values


      def reverse(head):
          prev = None
          node = head
          while node is not None:
              nxt = node.next
              node.next = prev
              prev = node
              node = nxt
          return prev


      head = None
      for value in [5, 4, 3, 2, 1]:
          head = ListNode(value, head)
      print(to_list(head))
      head = reverse(head)
      print(to_list(head))
      ```

      ```output
      [1, 2, 3, 4, 5]
      [5, 4, 3, 2, 1]
      ```

      Each new node goes in front of the old head, so the values go in from 5 down to 1. `reverse` turns each link around once: O(n) time and O(1) memory. A linked list adds a node at its front in O(1), where a list's `insert(0, x)` is O(n), but reaching the k-th node takes k steps along the links: there's no `head[k]`.

      Many linked list questions use **slow and fast pointers**, two pointers that walk at different speeds: `slow` moves one node at a time and `fast` moves two. When `fast` reaches the end, `slow` is at the middle. And if the list loops back on itself, `fast` never reaches an end. It goes round the loop and catches up with `slow` from behind, one node closer each round:

      ```python run
      class ListNode:
          def __init__(self, value, next_node=None):
              self.value = value
              self.next = next_node


      def middle(head):
          slow = head
          fast = head
          while fast is not None and fast.next is not None:
              slow = slow.next
              fast = fast.next.next
          return slow.value


      def has_cycle(head):
          slow = head
          fast = head
          while fast is not None and fast.next is not None:
              slow = slow.next
              fast = fast.next.next
              if slow is fast:
                  return True
          return False


      head = None
      for value in [6, 5, 4, 3, 2, 1]:
          head = ListNode(value, head)
      print(middle(head), middle(head.next))
      print(has_cycle(head))
      last = head
      while last.next is not None:
          last = last.next
      last.next = head.next.next
      print(has_cycle(head))
      ```

      ```output
      4 4
      False
      True
      ```

      For 1 to 6, the two middle values are 3 and 4, and `middle` stops at the second one. For 2 to 6, 4 is the exact middle. The last lines link the 6 back to the 3, so the list goes 1, 2, 3, 4, 5, 6, 3, 4, 5, 6 and so on forever: a walk to the end would never stop. `slow is fast` asks whether both point to the same node, not to equal values. Both functions are O(n) time and O(1) memory. A set of the nodes seen so far would find the loop too, but in O(n) memory.

      **Your turn:** a tree is **height-balanced** when, at every node, the heights of the two subtrees differ by at most 1. Calling `height` for the two subtrees of every node works, but it walks the nodes below each node again for every node above them: O(n log n) on a balanced tree. `checked_height` does it all in one walk, O(n). It returns the height of the tree, or -1 when some node in it isn't balanced, and a -1 from either subtree passes straight up. Fill in the blanks: when a node isn't balanced, and the height of a node that is. The program should print:

      ```
      True 3
      False False
      False False
      True 3
      ```
    fill: |
      class Node:
          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right


      def checked_height(node):
          if node is None:
              return 0
          left = checked_height(node.left)
          right = checked_height(node.right)
          if left == -1 or right == -1 or [[abs(left - right) > 1‖abs(right - left) > 1‖abs(left - right) >= 2]]:
              return -1
          return 1 + [[max(left, right)‖max(right, left)]]


      def is_balanced(root):
          return checked_height(root) != -1


      root = Node(4, Node(9), Node(2, Node(7), Node(5)))
      print(is_balanced(root), checked_height(root))
      print(is_balanced(Node(4, Node(9, Node(1)))), is_balanced(Node(4, None, Node(2, None, Node(5)))))
      deep_inside = Node(1, Node(2, Node(3), Node(4)), Node(5, None, Node(6, Node(7))))
      left_heavy = Node(1, Node(2, Node(3, Node(4)), Node(5)))
      print(is_balanced(deep_inside), is_balanced(left_heavy))
      print(is_balanced(None), checked_height(Node(1, Node(2, Node(3)), Node(4))))
    hints:
      - "A node is unbalanced when its two heights are more than 1 apart, whichever side is taller. `abs` gives the difference without its sign."
      - "The first blank is `abs(left - right) > 1`. A balanced node is one level above the taller of its two subtrees: `max(left, right)`."
    tests:
      - expect: |
          True 3
          False False
          False False
          True 3
