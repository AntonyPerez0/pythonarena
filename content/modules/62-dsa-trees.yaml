        solution: |
          class TrieNode:
              def __init__(self):
                  self.children = {}
                  self.count = 0


          def count_with_prefix(words, prefixes):
              root = TrieNode()
              for word in words:
                  node = root
                  node.count += 1
                  for letter in word:
                      if letter not in node.children:
                          node.children[letter] = TrieNode()
                      node = node.children[letter]
                      node.count += 1
              result = []
              for prefix in prefixes:
                  node = root
                  for letter in prefix:
                      if letter not in node.children:
                          node = None
                          break
                      node = node.children[letter]
                  if node is None:
                      result.append(0)
                  else:
                      result.append(node.count)
              return result


          if __name__ == "__main__":
              words = ["car", "card", "care", "cat", "dog", "car"]
              print(count_with_prefix(words, ["car", "ca", "d", "cart", "x"]))
