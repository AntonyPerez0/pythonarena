          class Node:
              def __init__(self, value, left=None, right=None):
                  self.value = value
                  self.left = left
                  self.right = right


          def same_tree(a, b):
              if a is None and b is None:
                  return True
              if a is None or b is None:
                  return False
              return a.value == b.value and same_tree(a.left, b.left) and same_tree(a.right, b.right)


