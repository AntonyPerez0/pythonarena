          For example, in this tree the root-to-leaf paths add up to 6 + 3 + 1 = 10, 6 + 3 + 4 = 13 and 6 + 9 + 2 = 17. 6 + 3 = 9 doesn't count, since the path stops at 3, which isn't a leaf. So this program:

          ```python fragment
          #        6
          #       / \
          #      3   9
          #     / \   \
          #    1   4   2
          root = Node(6, Node(3, Node(1), Node(4)), Node(9, None, Node(2)))
