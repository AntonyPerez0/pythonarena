        solution: |
          class TrieNode:
              def __init__(self):
                  self.children = {}
                  self.is_word = False


          class Trie:
              def __init__(self):
                  self.root = TrieNode()

              def insert(self, word):
                  node = self.root
                  for letter in word:
                      if letter not in node.children:
                          node.children[letter] = TrieNode()
                      node = node.children[letter]
                  node.is_word = True

              def matches(self, pattern):
                  found = []
                  self.match(self.root, pattern, "", found)
                  return found

              def match(self, node, pattern, text, found):
                  if len(text) == len(pattern):
                      if node.is_word:
                          found.append(text)
                      return
                  letter = pattern[len(text)]
                  if letter == ".":
                      for child in sorted(node.children):
                          self.match(node.children[child], pattern, text + child, found)
                  elif letter in node.children:
                      self.match(node.children[letter], pattern, text + letter, found)


          if __name__ == "__main__":
              trie = Trie()
              for word in ["cat", "cot", "cut", "cart", "dog", "dot", "cab"]:
                  trie.insert(word)
              print(trie.matches("c.t"))
              print(trie.matches("do."), trie.matches("x.."))
