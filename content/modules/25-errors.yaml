          def read_numbers(filename):
              numbers = []
              with open(filename) as file:
                  for line in file:
                      numbers.append(int(line))
              return numbers


          def total_of_files(filenames):
              total = 0
              for filename in filenames:
                  try:
                      total += sum(read_numbers(filename))
                  except FileNotFoundError:
                      pass
              return total


