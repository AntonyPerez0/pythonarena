  - id: errors-raise
    slug: raise
    title: Raising errors yourself
    text: |
      Your own code can raise an exception too, with the **`raise`** statement. Causing errors on purpose may sound odd, but it's the clearest way for a function to say "I can't do this with these arguments". A function that only prints an error message is easy to miss, especially when its result goes on to other code, and one that returns a special value, such as -1, risks having that value used as if it were a real result. An exception can't be missed: it stops the program unless the caller handles it.

      ```python run crash
      def hours_to_minutes(hours):
          if hours < 0:
              raise ValueError(f"hours can't be negative: {hours}")
          return hours * 60


      print(hours_to_minutes(2))
      print(hours_to_minutes(-3))
      ```

      ```output
      120
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 8, in <module>
          print(hours_to_minutes(-3))
                ~~~~~~~~~~~~~~~~^^^^
        File "main.py", line 3, in hours_to_minutes
          raise ValueError(f"hours can't be negative: {hours}")
      ValueError: hours can't be negative: -3
      ```

      After `raise` comes the exception: its kind, with a message in parentheses. `ValueError` is the usual choice for a value that isn't acceptable, and `TypeError` for a value of the wrong type. The message is shown in the traceback, so make it say what was wrong.

      ### Catching your own exceptions

      The caller handles a raised exception like any other. With `as`, the `except` line also gives the exception a name, and printing it prints its message:

      ```python run
      def booking(guests, nights):
          if guests < 1 or guests > 6:
              raise ValueError(f"a room takes 1 to 6 guests, not {guests}")
          if nights < 1:
              raise ValueError(f"a stay is at least one night, not {nights}")
          return (guests, nights)


      try:
          print("Booked:", booking(2, 3))
          print("Booked:", booking(9, 1))
      except ValueError as error:
          print("Can't book:", error)
      ```

      ```output
      Booked: (2, 3)
      Can't book: a room takes 1 to 6 guests, not 9
      ```

      This is a good division of work. The function checks its arguments and raises an exception when they're wrong; it doesn't need to know who called it or how to talk to the user. The code that talks to the user catches the exception and decides what to say.

      **Your turn:** fill in the blanks so that `set_volume(level)` raises a `ValueError` with the message `volume must be 0 to 10` when the level is outside 0 to 10, and otherwise returns the level. This code

      ```python fragment
      print(set_volume(7))
      try:
          set_volume(11)
      except ValueError as error:
          print("Error:", error)
      ```

      prints:

      ```
      7
      Error: volume must be 0 to 10
      ```
    fill: |
      def set_volume(level):
          if level < 0 or level > 10:
              [[raise]] [[ValueError]]("volume must be 0 to 10")
          return level


      if __name__ == "__main__":
          print(set_volume(7))
    hints:
      - The keyword that causes an exception comes first, then the kind of exception, with the message in parentheses.
      - "The line is `raise ValueError(\"volume must be 0 to 10\")`."
    tests:
      - call: |
          print(set_volume(7))
          try:
              set_volume(11)
          except ValueError as error:
              print("Error:", error)
      - call: set_volume(0)
        hidden: true
      - call: |
          try:
              set_volume(-1)
          except ValueError as error:
              print("Error:", error)
        hidden: true
    more:
      - task: |
          Write a function `withdraw(balance, amount)` that returns the balance left after taking `amount` out of an account. It raises a `ValueError`:

          - with the message `amount must be positive` if the amount is 0 or less;
          - with the message `not enough money` if the amount is more than the balance.

          For example, `withdraw(100, 30)` returns `70`, and `withdraw(100, 130)` raises a `ValueError` whose message is `not enough money`.
        seed: |
          def withdraw(balance, amount):
              pass


          if __name__ == "__main__":
              print(withdraw(100, 30))
        solution: |
          def withdraw(balance, amount):
              if amount <= 0:
                  raise ValueError("amount must be positive")
              if amount > balance:
                  raise ValueError("not enough money")
              return balance - amount


          if __name__ == "__main__":
              print(withdraw(100, 30))
