      - task: |
          The starter code has a function `parse_size(text)` that turns a size like `3x4` into a tuple `(3, 4)`, and raises a `ValueError` when the text isn't a valid size. Write the main program: it goes through the lines of the file `sizes.txt` and prints the area of each valid size, or `Skipped: ` and the exception's message for an invalid one.

          With this `sizes.txt`

          ```text
          3x4
          10x2
          5x
          0x8
          2x3x4
          ```

          the program prints:

          ```
          3x4: area 12
          10x2: area 20
          Skipped: invalid literal for int() with base 10: ''
          Skipped: 0x8 has a side of zero or less
          Skipped: 2x3x4 needs exactly one x
          ```
        seed: |
          def parse_size(text):
              parts = text.split("x")
              if len(parts) != 2:
                  raise ValueError(f"{text} needs exactly one x")
              width = int(parts[0])
              height = int(parts[1])
              if width <= 0 or height <= 0:
                  raise ValueError(f"{text} has a side of zero or less")
              return (width, height)


          # Write the main program below.
        solution: |
          def parse_size(text):
              parts = text.split("x")
              if len(parts) != 2:
                  raise ValueError(f"{text} needs exactly one x")
              width = int(parts[0])
              height = int(parts[1])
              if width <= 0 or height <= 0:
                  raise ValueError(f"{text} has a side of zero or less")
              return (width, height)


          # Write the main program below.
          with open("sizes.txt") as file:
              for line in file:
                  text = line.strip()
                  try:
                      size = parse_size(text)
                      print(f"{text}: area {size[0] * size[1]}")
                  except ValueError as error:
                      print("Skipped:", error)
        hints:
          - Go through the file line by line and strip each line before you give it to `parse_size`.
          - The `try` goes inside the loop, so one bad line doesn't stop the others.
          - "`except ValueError as error:` names the exception, and `print(\"Skipped:\", error)` prints its message. A `ValueError` from `int` inside `parse_size` is caught there too."
