id: encapsulation
summary: Keeping objects in a sensible state. Private attributes with two underscores, getters and setters with `@property`, checking new values in a setter, and private helper methods.
steps:
  - id: encapsulation-private
    slug: private-attributes
    title: Private attributes
    text: |
      The code that creates objects of a class and uses them is called the class's **client**. A well-made class keeps its objects in a sensible state whatever the client does: a thermostat should never be set to 45 degrees, and a bank balance shouldn't change except by deposits and withdrawals. Keeping the attributes of an object acceptable at all times is called keeping its **integrity**.

      A method can check a value before storing it. But as long as the attribute itself is in reach, the client can skip the method and change the attribute directly:

      ```python run
      class Thermostat:
          def __init__(self):
              self.target = 20

          def set_target(self, degrees):
              if 5 <= degrees <= 30:
                  self.target = degrees


      heater = Thermostat()
      heater.set_target(45)
      print(heater.target)
      heater.target = 45
      print(heater.target)
      ```

      ```output
      20
      45
      ```

      The method refused 45, and then the client set it anyway.

      ### Two underscores make it private

      An attribute whose name starts with two underscores, such as `__target`, is **private**: only the class's own methods can use it by that name. Code outside the class that tries to read it gets an error. To let the client see the value, the class offers a method that returns it:

      ```python run crash
      class Thermostat:
          def __init__(self):
              self.__target = 20

          def set_target(self, degrees):
              if 5 <= degrees <= 30:
                  self.__target = degrees

          def get_target(self):
              return self.__target


      heater = Thermostat()
      heater.set_target(22)
      print(heater.get_target())
      print(heater.__target)
      ```

      ```output
      22
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 16, in <module>
          print(heater.__target)
                ^^^^^^^^^^^^^^^
      AttributeError: 'Thermostat' object has no attribute '__target'. Did you mean: 'get_target'?
      ```

      Inside the class, `self.__target` works as usual. Outside it, the attribute can't be reached by that name (Python even suggests the public method to use instead), so the only way to change the target is `set_target`, which checks the value.

      Hiding an object's attributes and offering methods to use them is called **encapsulation**. The client tells the object what to do, and the object's own methods decide how. That also leaves the class free to change: if `Thermostat` later kept its target in tenths of a degree, only its methods would need rewriting, and every program that calls `set_target` and `get_target` would go on working.

      ### Private, not secret

      One thing outside code can do without an error is assign to the private name. But that doesn't reach the private attribute:

      ```python run
      class Thermostat:
          def __init__(self):
              self.__target = 20

          def get_target(self):
              return self.__target


      heater = Thermostat()
      heater.__target = 45
      print(heater.__target)
      print(heater.get_target())
      print(heater._Thermostat__target)
      ```

      ```output
      45
      20
      20
      ```

      `heater.__target = 45` gave the object a new, unrelated attribute that happens to be called `__target`, and the thermostat's real setting stayed at 20. The last line shows why: inside a class, Python quietly renames every private name, putting an underscore and the class's name in front. So the real attribute is `_Thermostat__target`, and only code inside the class uses it by its short name.

      That renaming is all "private" means in Python. Anyone who writes out the long name can still reach the attribute, so the two underscores aren't a lock but a label: this belongs to the class, use its methods. Treat it that way, and never write a name like `_Thermostat__target` in your own programs.

      The two underscores go only at the start of the name. A name with two underscores at both ends, like `__init__` or `__str__`, is one of Python's special methods, and it isn't private.

      **Your turn:** make the counter's attribute private. Fill in the blanks so that the attribute is called `__count`, and the program prints:

      ```
      3
      ```
    fill: |
      class Counter:
          def __init__(self):
              self.[[__count]] = 0

          def add(self):
              self.__count += 1

          def value(self):
              return self.[[__count]]


      clicks = Counter()
      clicks.add()
      clicks.add()
      clicks.add()
      print(clicks.value())
    hints:
      - The attribute is used in all three methods, and its name must be the same in each of them.
      - "A private attribute's name starts with two underscores: `self.__count`."
    tests:
      - expect: "3"
    more:
      - task: |
          A travel card holds money for bus trips. Write the class `TravelCard` with two private attributes, `__balance` and `__trips`, both 0 when a card is created, and these methods:

          - `load(self, amount)` adds the amount to the balance, but only if it's more than 0.
          - `travel(self, price)` pays for a trip: if the balance is at least the price, it takes the price off the balance, adds one to the trips and returns `True`. Otherwise nothing changes and it returns `False`.
          - `__str__(self)` returns a string such as `balance 7.5, trips 1`.

          For example, this code:

          ```python fragment
          card = TravelCard()
          card.load(10)
          card.load(-50)
          print(card.travel(2.5))
          print(card.travel(9))
          print(card)
          ```

          prints:

          ```
          True
          False
          balance 7.5, trips 1
          ```
        seed: |
          class TravelCard:
              pass


          if __name__ == "__main__":
              card = TravelCard()
              card.load(10)
              card.load(-50)
              print(card.travel(2.5))
              print(card.travel(9))
              print(card)
        solution: |
          class TravelCard:
              def __init__(self):
                  self.__balance = 0
                  self.__trips = 0

              def load(self, amount):
                  if amount > 0:
                      self.__balance += amount

              def travel(self, price):
                  if self.__balance < price:
                      return False
                  self.__balance -= price
                  self.__trips += 1
                  return True

              def __str__(self):
                  return f"balance {self.__balance}, trips {self.__trips}"


          if __name__ == "__main__":
              card = TravelCard()
              card.load(10)
              card.load(-50)
              print(card.travel(2.5))
              print(card.travel(9))
              print(card)
        hints:
          - "Create both attributes in `__init__` with two underscores at the start of their names: `self.__balance = 0`."
          - "`load` only changes the balance when `amount > 0`."
          - "In `travel`, return `False` first if `self.__balance < price`; otherwise change both attributes and return `True`."
        require:
          - pattern: self\.__balance\b
            message: Keep the balance in a private attribute, `self.__balance`.
          - pattern: self\.__trips\b
            message: Keep the number of trips in a private attribute, `self.__trips`.
        tests:
          - call: |
              card = TravelCard()
              card.load(10)
              card.load(-50)
              print(card.travel(2.5))
              print(card.travel(9))
              print(card)
          - call: |
              card = TravelCard()
              print(card.travel(1))
              card.load(6)
              card.load(0)
              print(card.travel(3))
              print(card.travel(3))
              print(card.travel(3))
              print(card)
            hidden: true
      - task: |
          A shop serves customers in the order they arrive. Write the class `Queue`, which keeps the names of the waiting customers in a private list `__names`:

          - `join(self, name)` adds a name to the end of the queue.
          - `serve(self)` removes the first name from the queue and returns it. If the queue is empty, it returns `None`.
          - `length(self)` returns the number of people waiting.

          For example, this code:

          ```python fragment
          queue = Queue()
          queue.join("Ada")
          queue.join("Ben")
          print(queue.serve())
          print(queue.length())
          print(queue.serve())
          print(queue.serve())
          ```

          prints:

          ```
          Ada
          1
          Ben
          None
          ```
        seed: |
          class Queue:
              pass


          if __name__ == "__main__":
              queue = Queue()
              queue.join("Ada")
              queue.join("Ben")
              print(queue.serve())
              print(queue.length())
              print(queue.serve())
              print(queue.serve())
        solution: |
          class Queue:
              def __init__(self):
                  self.__names = []

              def join(self, name):
                  self.__names.append(name)

              def serve(self):
                  if len(self.__names) == 0:
                      return None
                  return self.__names.pop(0)

              def length(self):
                  return len(self.__names)


          if __name__ == "__main__":
              queue = Queue()
              queue.join("Ada")
              queue.join("Ben")
              print(queue.serve())
              print(queue.length())
              print(queue.serve())
              print(queue.serve())
        hints:
          - "Create the private list in `__init__`: `self.__names = []`."
          - "`pop(0)` removes the first item of a list and returns it."
          - "Check for an empty list first in `serve`, and return `None` in that case."
        require:
          - pattern: self\.__names\b
            message: Keep the names in a private list, `self.__names`.
        tests:
          - call: |
              queue = Queue()
              queue.join("Ada")
              queue.join("Ben")
              print(queue.serve())
              print(queue.length())
              print(queue.serve())
              print(queue.serve())
          - call: |
              queue = Queue()
              print(queue.length())
              print(queue.serve())
              for name in ["Kim", "Lou", "Max"]:
                  queue.join(name)
              print(queue.length())
              print(queue.serve())
              queue.join("Noa")
              print(queue.serve(), queue.serve(), queue.serve())
              print(queue.length())
            hidden: true

  - id: encapsulation-getters
    slug: getters
    title: Getters with @property
    text: |
      A method that gives the value of a private attribute is called a **getter**, and a method that changes it a **setter**. With ordinary methods, the client has to write `heater.get_target()`, with parentheses. Python has a neater way: a **property**.

      ### The @property decorator

      A line that starts with `@`, just above a `def`, is a **decorator**. It changes how the method is used. With the decorator `@property`, the method is used like an attribute, without parentheses:

      ```python run
      class Thermostat:
          def __init__(self):
              self.__target = 20

          @property
          def target(self):
              return self.__target


      heater = Thermostat()
      print(heater.target)
      ```

      ```output
      20
      ```

      The getter is named after the attribute, without the underscores. The client writes `heater.target` as if it were an attribute, but what runs is the method, which returns the private `__target`.

      A property with only a getter is **read-only**. Trying to assign to it is an error:

      ```python run crash
      class Thermostat:
          def __init__(self):
              self.__target = 20

          @property
          def target(self):
              return self.__target


      heater = Thermostat()
      heater.target = 45
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 11, in <module>
          heater.target = 45
          ^^^^^^^^^^^^^
      AttributeError: property 'target' of 'Thermostat' object has no setter
      ```

      The next step adds a setter, so the client can change the target too.

      ### Properties that are calculated

      A getter doesn't need an attribute of its own. It can work out its value every time it's asked:

      ```python run
      class Temperature:
          def __init__(self, celsius):
              self.__celsius = celsius

          @property
          def celsius(self):
              return self.__celsius

          @property
          def fahrenheit(self):
              return self.__celsius * 9 / 5 + 32


      today = Temperature(25)
      print(today.celsius)
      print(today.fahrenheit)
      ```

      ```output
      25
      77.0
      ```

      The object stores only degrees Celsius, but the client can't tell `celsius` from `fahrenheit`: both look like attributes. That's encapsulation at work. The class decides what it stores, and could change that later without the client noticing.

      ### No parentheses

      A property is used without parentheses. With them, Python first gets the value (here the number 20) and then tries to call that number like a function:

      ```python run crash
      class Thermostat:
          def __init__(self):
              self.__target = 20

          @property
          def target(self):
              return self.__target


      heater = Thermostat()
      print(heater.target())
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 11, in <module>
          print(heater.target())
                ~~~~~~~~~~~~~^^
      TypeError: 'int' object is not callable
      ```

      **Your turn:** fill in the blank so that `name` is a property, and the program prints:

      ```
      Grace
      ```
    fill: |
      class Student:
          def __init__(self, name):
              self.__name = name

          @[[property]]
          def name(self):
              return self.__name


      student = Student("Grace")
      print(student.name)
    hints:
      - The line above the method is a decorator. Which one makes a method usable like an attribute?
      - "The decorator is `@property`; the `@` is already there."
    tests:
      - expect: Grace
    more:
      - task: |
          What does this program print? Type each line it prints.
        predict: |
          class Box:
              def __init__(self, width, height):
                  self.__width = width
                  self.__height = height

              @property
              def width(self):
                  return self.__width

              @property
              def area(self):
                  return self.__width * self.__height


          box = Box(3, 5)
          print(box.width)
          print(box.area)
          print(box.area + box.width)
        hints:
          - "`box.width` runs the getter `width`, which returns the private width."
          - "`box.area` has no attribute of its own: the getter calculates 3 * 5 every time."
      - task: |
          Write the class `Duration`, which stores a length of time as a whole number of seconds in a private attribute. Its constructor takes the total number of seconds. It has these read-only properties:

          - `total_seconds`: the total number of seconds
          - `hours`: the full hours in it
          - `minutes`: the full minutes left over after the hours
          - `seconds`: the seconds left over after the minutes

          It also has `__str__`, which returns a string such as `1 h 2 min 5 s`. For example, this code:

          ```python fragment
          film = Duration(3725)
          print(film.total_seconds)
          print(film.hours, film.minutes, film.seconds)
          print(film)
          ```

          prints:

          ```
          3725
          1 2 5
          1 h 2 min 5 s
          ```
        seed: |
          class Duration:
              def __init__(self, total_seconds):
                  self.__total = total_seconds


          if __name__ == "__main__":
              film = Duration(3725)
              print(film.total_seconds)
              print(film.hours, film.minutes, film.seconds)
              print(film)
        solution: |
          class Duration:
              def __init__(self, total_seconds):
                  self.__total = total_seconds

              @property
              def total_seconds(self):
                  return self.__total

              @property
              def hours(self):
                  return self.__total // 3600

              @property
              def minutes(self):
                  return self.__total % 3600 // 60

              @property
              def seconds(self):
                  return self.__total % 60

              def __str__(self):
                  return f"{self.hours} h {self.minutes} min {self.seconds} s"


          if __name__ == "__main__":
              film = Duration(3725)
              print(film.total_seconds)
              print(film.hours, film.minutes, film.seconds)
              print(film)
        hints:
          - "Each property is a method with `@property` above it, which returns a number calculated from `self.__total`."
          - "An hour is 3600 seconds, so the hours are `self.__total // 3600`. The seconds left over are `self.__total % 60`."
          - "For the minutes, first take what's left after the full hours (`self.__total % 3600`), then divide that by 60 with `//`."
        require:
          - pattern: '@property'
            min: 4
            raw: true
            message: Write the four values as properties, each with `@property` above it.
        tests:
          - call: |
              film = Duration(3725)
              print(film.total_seconds)
              print(film.hours, film.minutes, film.seconds)
              print(film)
          - call: |
              short = Duration(59)
              print(short)
              print(Duration(7200))
              print(Duration(86399))
              print(Duration(600).minutes)
            hidden: true

  - id: encapsulation-setters
    slug: setters
    title: Setters that check the value
    text: |
      To let the client change a property with an ordinary assignment, add a **setter**: a second method with the same name, with the decorator `@name.setter` above it. The setter gets the new value as a parameter, so it can check the value before storing it:

      ```python run
      class Thermostat:
          def __init__(self):
              self.__target = 20

          @property
          def target(self):
              return self.__target

          @target.setter
          def target(self, degrees):
              if 5 <= degrees <= 30:
                  self.__target = degrees


      heater = Thermostat()
      heater.target = 23
      print(heater.target)
      heater.target = 45
      print(heater.target)
      ```

      ```output
      23
      23
      ```

      For the client, `heater.target = 23` looks just like assigning to an attribute. Behind the scenes the setter runs, and it quietly ignores 45.

      The getter has to come first. `@property` creates the property called `target`, and `@target.setter` then adds a setter to it. With the setter first, Python stops at the decorator with `NameError: name 'target' is not defined`, because no `target` exists yet.

      ### Saying no out loud

      Ignoring a bad value hides the mistake: the client thinks the heater is set to 45. It's usually better to **raise** an exception, as you did in part 6. A `ValueError` is the usual one for a value that isn't acceptable:

      ```python run crash
      class Thermostat:
          def __init__(self):
              self.__target = 20

          @property
          def target(self):
              return self.__target

          @target.setter
          def target(self, degrees):
              if degrees < 5 or degrees > 30:
                  raise ValueError("The target must be from 5 to 30 degrees")
              self.__target = degrees


      heater = Thermostat()
      heater.target = 23
      print(heater.target)
      heater.target = 45
      ```

      ```output
      23
      ```

      ```crash
      Traceback (most recent call last):
        File "main.py", line 19, in <module>
          heater.target = 45
          ^^^^^^^^^^^^^
        File "main.py", line 12, in target
          raise ValueError("The target must be from 5 to 30 degrees")
      ValueError: The target must be from 5 to 30 degrees
      ```

      The client can catch the error with `try` and `except ValueError` and decide what to do, for example ask the user again.

      ### The setter in `__init__`

      The value given to the constructor needs the same check. Instead of writing the check twice, let `__init__` use the setter: `self.target = degrees`, without the underscores, assigns through the property and so runs the setter.

      ```python fragment
      class Thermostat:
          def __init__(self, degrees):
              self.target = degrees  # runs the setter, which checks the value
      ```

      Now `Thermostat(45)` raises the same `ValueError`, and no thermostat can ever start with a bad target.

      One trap: inside the setter, store the value in the private attribute, `self.__target = degrees`. Writing `self.target = degrees` there would call the setter again, which would call itself again, and so on, until Python stops with a `RecursionError`.

      **Your turn:** a product's price must never be negative. Fill in the blanks so that `price` has a setter that raises a `ValueError`, and the program prints:

      ```
      35
      Error: The price can't be negative
      35
      ```
    fill: |
      class Product:
          def __init__(self, name, price):
              self.name = name
              self.__price = price

          @property
          def price(self):
              return self.__price

          @[[price]].setter
          def price(self, price):
              if price < 0:
                  raise [[ValueError]]("The price can't be negative")
              self.__price = price


      lamp = Product("Lamp", 40)
      lamp.price = 35
      print(lamp.price)
      try:
          lamp.price = -5
      except ValueError as error:
          print("Error:", error)
      print(lamp.price)
    hints:
      - "A setter's decorator is the property's name, a dot and `setter`."
      - "The decorator is `@price.setter`, and the error to raise is a `ValueError`, which the `except` below catches."
    tests:
      - expect: |
          35
          Error: The price can't be negative
          35
    more:
      - task: |
          Write the class `Book`. Its constructor takes a title and a rating:

          - The title is read-only: a property `title` with a getter only.
          - The rating is a property `rating` with a getter and a setter. A rating must be a number from 1 to 5; for any other value the setter raises `ValueError("The rating must be from 1 to 5")`.
          - The constructor must check the rating too, so it should use the setter.

          For example, this code:

          ```python fragment
          book = Book("Small Gods", 4)
          book.rating = 5
          print(book.title, book.rating)
          try:
              book.rating = 9
          except ValueError as error:
              print(error)
          print(book.rating)
          ```

          prints:

          ```
          Small Gods 5
          The rating must be from 1 to 5
          5
          ```
        seed: |
          class Book:
              def __init__(self, title, rating):
                  self.__title = title
                  self.__rating = rating


          if __name__ == "__main__":
              book = Book("Small Gods", 4)
              book.rating = 5
              print(book.title, book.rating)
              try:
                  book.rating = 9
              except ValueError as error:
                  print(error)
              print(book.rating)
        solution: |
          class Book:
              def __init__(self, title, rating):
                  self.__title = title
                  self.rating = rating

              @property
              def title(self):
                  return self.__title

              @property
              def rating(self):
                  return self.__rating

              @rating.setter
              def rating(self, rating):
                  if rating < 1 or rating > 5:
                      raise ValueError("The rating must be from 1 to 5")
                  self.__rating = rating


          if __name__ == "__main__":
              book = Book("Small Gods", 4)
              book.rating = 5
              print(book.title, book.rating)
              try:
                  book.rating = 9
              except ValueError as error:
                  print(error)
              print(book.rating)
        hints:
          - "Write a getter for each attribute (`@property`), and a setter for the rating only (`@rating.setter`, after its getter)."
          - "In the setter, raise the error when `rating < 1 or rating > 5`; otherwise store the value in `self.__rating`."
          - "In `__init__`, write `self.rating = rating` without underscores, so the setter checks the starting rating too."
