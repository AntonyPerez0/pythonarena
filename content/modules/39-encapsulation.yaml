      - task: |
          Write the class `Temperature`. It stores degrees Celsius in a private attribute, and its constructor takes degrees Celsius. It has two properties, each with a getter and a setter:

          - `celsius`: nothing can be colder than -273.15 degrees, so for a lower value the setter raises `ValueError("Below absolute zero")`. The constructor uses this setter too.
          - `fahrenheit`: the getter returns `celsius * 9 / 5 + 32`. The setter turns the Fahrenheit value it gets into Celsius, `(fahrenheit - 32) * 5 / 9`, and stores it through the `celsius` setter, so the same check applies.

          For example, this code:

          ```python fragment
          water = Temperature(25)
          print(water.fahrenheit)
          water.fahrenheit = 212
          print(water.celsius)
          try:
              water.celsius = -300
          except ValueError as error:
              print(error)
          ```

          prints:

          ```
          77.0
          100.0
          Below absolute zero
          ```
        seed: |
          class Temperature:
              def __init__(self, celsius):
                  pass


          if __name__ == "__main__":
              water = Temperature(25)
              print(water.fahrenheit)
              water.fahrenheit = 212
              print(water.celsius)
              try:
                  water.celsius = -300
              except ValueError as error:
                  print(error)
        solution: |
          class Temperature:
              def __init__(self, celsius):
                  self.celsius = celsius

              @property
              def celsius(self):
                  return self.__celsius

              @celsius.setter
              def celsius(self, degrees):
                  if degrees < -273.15:
                      raise ValueError("Below absolute zero")
                  self.__celsius = degrees

              @property
              def fahrenheit(self):
                  return self.celsius * 9 / 5 + 32

              @fahrenheit.setter
              def fahrenheit(self, degrees):
                  self.celsius = (degrees - 32) * 5 / 9


          if __name__ == "__main__":
              water = Temperature(25)
              print(water.fahrenheit)
              water.fahrenheit = 212
              print(water.celsius)
              try:
                  water.celsius = -300
              except ValueError as error:
                  print(error)
        hints:
          - "Start with the `celsius` property: a getter that returns `self.__celsius`, and a setter that checks the value before storing it in `self.__celsius`."
