      - task: |
          A robot moves on a board of 10 by 10 squares, where both `x` and `y` go from 0 to 9. It starts at (0, 0). Write the class `Robot` with:

          - a private method `__move(self, dx, dy)`, which moves the robot by `dx` steps along x and `dy` steps along y, but only if it stays on the board. Otherwise the robot stays where it is.
          - four public methods that use `__move`: `north` (y goes up by one), `south` (y goes down by one), `east` (x goes up by one) and `west` (x goes down by one).
          - `__str__`, which returns the position, such as `(2, 1)`.

          For example, this code:

          ```python fragment
          robot = Robot()
          robot.west()
          robot.east()
          robot.east()
          robot.north()
          print(robot)
          ```

          prints:

          ```
          (2, 1)
          ```
        seed: |
          class Robot:
              def __init__(self):
                  self.__x = 0
                  self.__y = 0

              def __str__(self):
                  return f"({self.__x}, {self.__y})"


          if __name__ == "__main__":
              robot = Robot()
              robot.west()
              robot.east()
              robot.east()
              robot.north()
              print(robot)
        solution: |
          class Robot:
              def __init__(self):
                  self.__x = 0
                  self.__y = 0

              def __move(self, dx, dy):
                  new_x = self.__x + dx
                  new_y = self.__y + dy
                  if 0 <= new_x <= 9 and 0 <= new_y <= 9:
                      self.__x = new_x
                      self.__y = new_y

              def north(self):
                  self.__move(0, 1)

              def south(self):
                  self.__move(0, -1)

              def east(self):
                  self.__move(1, 0)

              def west(self):
                  self.__move(-1, 0)

              def __str__(self):
                  return f"({self.__x}, {self.__y})"


          if __name__ == "__main__":
              robot = Robot()
              robot.west()
              robot.east()
              robot.east()
              robot.north()
              print(robot)
        hints:
          - "In `__move`, work out the new position in two local variables first, and only store it if both coordinates are from 0 to 9."
          - "Each public method is one line that calls the helper, for example `self.__move(0, 1)` for north."
          - "West from (0, 0) would be x = -1, which is off the board, so the robot stays put."
        require:
          - pattern: def\s+__move\s*\(
            message: Write the private helper method `__move`.
          - pattern: self\.__move\s*\(
            min: 4
            message: Let all four directions use `self.__move(...)`.
        tests:
          - call: |
              robot = Robot()
              robot.west()
              robot.east()
              robot.east()
              robot.north()
              print(robot)
          - call: |
