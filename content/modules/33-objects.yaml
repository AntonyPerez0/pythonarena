        solution: |
          from datetime import date


          def weekend_count(days):
              count = 0
              for day in days:
                  if day.weekday() >= 5:
                      count += 1
              return count


          if __name__ == "__main__":
              days = [date(2026, 10, 17), date(2026, 10, 18), date(2026, 10, 19)]
              print(weekend_count(days))
