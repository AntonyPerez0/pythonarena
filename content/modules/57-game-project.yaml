        solution: |
          import pygame

          SIZE = 40
          LEVEL = [
              "#########",
              "#...#...#",
              "#.....X.#",
              "#...#...#",
              "#..X#...#",
              "#.......#",
              "#########",
          ]


          class BoxGame:
              def __init__(self):
                  pygame.init()
                  self.load_pictures()
                  self.map = LEVEL
                  self.height = len(self.map)
                  self.width = len(self.map[0])
                  self.window = pygame.display.set_mode((self.width * SIZE, self.height * SIZE + SIZE))
                  pygame.display.set_caption("Box Robot")
                  self.font = pygame.font.SysFont("Arial", 24)
                  self.clock = pygame.time.Clock()
                  self.reset()

              def load_pictures(self):
                  self.tiles = {
                      "#": pygame.image.load("wall.png"),
                      ".": pygame.image.load("floor.png"),
                      "X": pygame.image.load("target.png"),
                  }
                  self.robot_picture = pygame.image.load("robot.png")
                  self.box_picture = pygame.image.load("box.png")
                  self.done_picture = pygame.image.load("box-done.png")

              def reset(self):
                  self.robot = (2, 3)
                  self.boxes = [(2, 2), (6, 4)]
                  self.moves = 0

              def run(self):
                  while True:
                      self.handle_events()
                      self.draw()
                      self.clock.tick(60)

              def handle_events(self):
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          exit()
                      if event.type == pygame.KEYDOWN:
                          if event.key == pygame.K_LEFT:
                              self.try_move(-1, 0)
                          if event.key == pygame.K_RIGHT:
                              self.try_move(1, 0)
                          if event.key == pygame.K_UP:
                              self.try_move(0, -1)
                          if event.key == pygame.K_DOWN:
                              self.try_move(0, 1)
                          if event.key == pygame.K_r:
                              self.reset()
                          if event.key == pygame.K_ESCAPE:
                              exit()

              def is_free(self, x, y):
                  return self.map[y][x] != "#" and (x, y) not in self.boxes

              def try_move(self, dx, dy):
                  if self.solved():
                      return
                  x, y = self.robot
                  new_x = x + dx
                  new_y = y + dy
                  if self.map[new_y][new_x] == "#":
                      return
                  if (new_x, new_y) in self.boxes:
                      box_x = new_x + dx
                      box_y = new_y + dy
                      if not self.is_free(box_x, box_y):
                          return
                      self.boxes.remove((new_x, new_y))
                      self.boxes.append((box_x, box_y))
                  self.robot = (new_x, new_y)
                  self.moves += 1

              def solved(self):
                  for x, y in self.boxes:
                      if self.map[y][x] != "X":
                          return False
                  return True

              def draw(self):
                  self.window.fill((0, 0, 0))
                  for y in range(self.height):
                      for x in range(self.width):
                          square = self.map[y][x]
                          self.window.blit(self.tiles[square], (x * SIZE, y * SIZE))
                          if (x, y) in self.boxes:
                              if square == "X":
                                  self.window.blit(self.done_picture, (x * SIZE, y * SIZE))
                              else:
                                  self.window.blit(self.box_picture, (x * SIZE, y * SIZE))
                  robot_x, robot_y = self.robot
                  self.window.blit(self.robot_picture, (robot_x * SIZE, robot_y * SIZE))
                  self.draw_bar()
                  pygame.display.flip()

              def draw_bar(self):
                  top = self.height * SIZE + 12
                  if self.solved():
                      text = self.font.render(f"Solved in {self.moves} moves!", True, (120, 230, 120))
                  else:
                      text = self.font.render(f"Moves: {self.moves}", True, (255, 255, 255))
                  self.window.blit(text, (10, top))
                  keys = self.font.render("R: restart  Esc: quit", True, (160, 160, 160))
                  self.window.blit(keys, (196, top))


          if __name__ == "__main__":
              game = BoxGame()
              game.run()
