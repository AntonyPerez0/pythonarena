  - id: game-project-finishing
    slug: finishing
    title: Finishing the game
    text: |
      The puzzle can be played now, but it isn't a finished game yet. This step adds the finishing touches: a counter of moves, keys for starting over and quitting, and a message when the puzzle is solved.

      ### A bar for text

      The text goes in a bar under the map, so the window gets one row of tiles taller, and `__init__` makes a font for the text:

      ```python fragment
      self.window = pygame.display.set_mode((self.width * SIZE, self.height * SIZE + SIZE))
      self.font = pygame.font.SysFont("Arial", 24)
      ```

      Make the font once, in `__init__`, and not in `draw`: making a font takes time, and `draw` runs on every frame.

      ### Counting moves

      `reset` sets `self.moves = 0`, and `try_move` adds one at its very end, after all the checks. A bump into a wall returns before it gets there, so it isn't counted. A new method, `draw_bar`, writes the count and the keys in the bar:

      ```python fragment
      def draw_bar(self):
          top = self.height * SIZE + 12
          text = self.font.render(f"Moves: {self.moves}", True, (255, 255, 255))
          self.window.blit(text, (10, top))
      ```

      A puzzle player wants to know the count: the same puzzle can be solved in many ways, and the fewer moves, the better.

      ### Starting over and quitting

      Pushing a box into a corner ruins the game, so the player needs a way to start over. The R key calls `reset`, which puts the robot, the boxes and the counter back as they were at the start. The Esc key quits, just like closing the window:

      ```python fragment
      if event.key == pygame.K_r:
          self.reset()
      if event.key == pygame.K_ESCAPE:
          exit()
      ```

      This works because `reset` makes a brand new list of boxes every time. If the starting places were in one list kept somewhere else, and `reset` said `self.boxes = START_BOXES`, both names would refer to the same list. Every push would change the starting places too, and R would bring back the boxes where they were last, not where they started. `list(START_BOXES)` would make a copy.

      ### Solved!

      The puzzle is solved when every box is on a target. A method answers the question by going through the boxes. The first box that isn't on a target settles it, so the method can return `False` right there. The answer is `True` only when the loop has checked them all:

      ```python fragment
      def solved(self):
          for x, y in self.boxes:
              if self.map[y][x] != "X":
                  return False
          return True
      ```

      When the puzzle is solved, `draw_bar` shows a message instead of the count, and `try_move` starts with `if self.solved(): return`, so the robot stays still. The player can still look at the finished puzzle, and press R to play again.

      ### Testing the ending

      To test the ending, you'd have to solve the whole puzzle every time you change something. While you work on the ending, make it easy: a test level where one push solves it, or, for a moment, a `solved` that just says `return True`. Remember to put things back when the ending works.

      Here's the finished game, with all six of its pictures:

      ```asset floor.png
      ```

      ```asset wall.png
      ```

      ```asset target.png
      ```

      ```asset robot.png
      ```

      ```asset box.png
      ```

      ```asset box-done.png
      ```

      The window below shows the puzzle solved in 16 moves. That's the fewest possible. Can you find another way to do it in 16?

