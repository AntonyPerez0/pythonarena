      grid = [[int(ch) for ch in line] for line in puzzle.split()]
      print(solve(grid))
      for line in grid:
          print("".join(str(d) for d in line))
      ```

      prints:

      ```
      True
      987654321
      123987456
      654123789
      236871945
      549236178
      871549632
      365712894
      712498563
      498365217
      ```
