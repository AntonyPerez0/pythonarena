              pass


          if __name__ == "__main__":
              print(count_with_sum([7, 2, 5, 4, 9], 11))
        solution: |
          def count_from(numbers, i, remaining):
              if i == len(numbers):
                  return 1 if remaining == 0 else 0
              take = count_from(numbers, i + 1, remaining - numbers[i])
              leave = count_from(numbers, i + 1, remaining)
              return take + leave


          def count_with_sum(numbers, target):
              return count_from(numbers, 0, target)


          if __name__ == "__main__":
              print(count_with_sum([7, 2, 5, 4, 9], 11))
