        solution: |
          def build(counts, length, path, result):
              if len(path) == length:
                  result.append("".join(path))
                  return
              for letter in counts:
                  if counts[letter] > 0:
                      counts[letter] -= 1           # choose one of this letter
                      path.append(letter)
                      build(counts, length, path, result)
                      path.pop()                    # un-choose: give it back
                      counts[letter] += 1


          def unique_permutations(word):
              counts = {}
              for letter in sorted(word):
                  counts[letter] = counts.get(letter, 0) + 1
              result = []
              build(counts, len(word), [], result)
              return result


          if __name__ == "__main__":
