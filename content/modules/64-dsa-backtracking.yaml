      - task: |
          Write `unique_permutations(word)`, which returns a list of every different ordering of the letters of `word`, each exactly once, in alphabetical order. It must be fast for 14 letters that have only 3,432 different orderings, so don't make all n! orderings and remove the repeats: choose among the different letters, with a count for each.

          For example, `unique_permutations("pop")` returns:

