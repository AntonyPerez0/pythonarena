      - task: |
          Write `count_with_sum(numbers, target)`, which returns how many subsets of `numbers` add up to exactly `target`. The numbers can be negative or zero, and the empty subset adds up to 0. You don't need the subsets themselves: pass down how much of the target is still missing, and add up the counts of the two branches.

          For example, `count_with_sum([7, 2, 5, 4, 9], 11)` returns 3, for 7 + 4, 2 + 9 and 2 + 5 + 4:

          ```
          3
          ```
        seed: |
