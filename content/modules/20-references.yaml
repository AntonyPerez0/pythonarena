id: references
summary: What a variable really holds. Two names for one list, copying a list, lists given to functions and changed by them, and side effects that change a list by accident.
steps:
  - id: references-same-list
    slug: same-list
    title: Two names for one list
    text: |
      So far you could think of a variable as a box that holds a value. For lists, that picture leads you astray. A variable doesn't hold the list itself: it holds a **reference** to it, which tells Python where the list is in the computer's memory. Think of the list as a house, and of the reference as the house's address written on a note.

      Most of the time the difference doesn't matter. It matters as soon as two variables refer to the same list:

      ```python repl
      >>> a = [1, 2, 3]
      >>> b = a
      >>> b.append(4)
      >>> b[0] = 10
      >>> a
      [10, 2, 3, 4]
      ```

      `b = a` doesn't copy the list. It copies the reference, the address, so `a` and `b` are now two names for one and the same list. A change made through either name changes that one list, and both names see it. In a program this can be a surprise:

      ```python run
      weekday_songs = ["Intro", "Rain", "Comets"]
      weekend_songs = weekday_songs
      weekend_songs.append("Party Time")

      print("Weekdays:", weekday_songs)
      print("Weekend:", weekend_songs)
      ```

      ```output
      Weekdays: ['Intro', 'Rain', 'Comets', 'Party Time']
      Weekend: ['Intro', 'Rain', 'Comets', 'Party Time']
      ```

      ### Numbers and strings can't change

      Why doesn't the same happen with numbers?

      ```python repl
      >>> x = 5
      >>> y = x
      >>> y += 1
      >>> x
      5
      >>> y
      6
      ```

      Numbers, strings and Booleans are **immutable**: nothing can change them. `y += 1` doesn't change the number 5. It makes a new number, 6, and points `y` at it, while `x` still refers to 5. String methods work the same way: `upper` gives a new string and leaves the old one as it was. Lists are **mutable**: `append`, `sort`, `remove`, `pop` and assigning to an index all change the list itself, and every name that refers to it sees the change.

      Giving a variable a new value is different from changing the list it refers to:

      ```python repl
      >>> a = [1, 2, 3]
      >>> b = a
      >>> b = [7, 8]
      >>> a
      [1, 2, 3]
      ```

      `b = [7, 8]` points `b` at a new list. The old list doesn't change, and `a` still refers to it.

      ### References inside lists

      A matrix is a list that holds references to its rows. Taking a row out of a matrix gives you another name for that row, not a copy of it:

      ```python run
      seats = [["free", "free"], ["free", "taken"]]
      first_row = seats[0]
      first_row[1] = "taken"
      print(seats)
      ```

      ```output
      [['free', 'taken'], ['free', 'taken']]
      ```

      That's why `row[j] = ...` inside a loop over a matrix changes the matrix: `row` refers to one of its rows. But `number *= 10` on a number taken from a row only points the variable `number` at a new number.

      **Your turn:** what does this program print? Type each line it prints.
    predict: |
      team = ["Ana", "Ben"]
      players = team
      players.append("Cleo")
      print(team)
      players = ["Dev"]
      print(team)
      print(players)
    hints:
      - "`players = team` doesn't copy the list: both names refer to the same list."
      - "So `players.append(\"Cleo\")` changes the list that `team` refers to, too."
      - "`players = [\"Dev\"]` points `players` at a new list, and `team` keeps the old one."
    more:
