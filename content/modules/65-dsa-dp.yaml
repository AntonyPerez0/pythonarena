          left = lcs_of(a, b, i, j - 1)
          if len(up) >= len(left):
              return up
          return left


      def lcs(a, b):
          return lcs_of(a, b, len(a), len(b))


      if __name__ == "__main__":
          print(repr(lcs("DYNAMIC", "PROGRAMMING")))
