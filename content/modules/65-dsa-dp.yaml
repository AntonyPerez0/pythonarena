      Row 1 is about `"c"`, but it compares `a[1]`, the `"a"`, and at `j = 3` it asks for `b[3]`, one past the end of `"act"`.

      ### Getting the string back

      The table holds lengths, but it also remembers which choice made each entry, so you can walk back from the bottom-right corner, `i = len(a)` and `j = len(b)`, until `i` or `j` is 0:

      - When `a[i - 1]` and `b[j - 1]` are the same character, it's part of the answer. Save it in a list, then step back in both strings: `i - 1` and `j - 1`.
      - Otherwise go to the neighbor the entry came from: up (`i - 1`) when `length[i - 1][j] >= length[i][j - 1]`, else left (`j - 1`).

      The walk finds the characters from the end backward, so `found[::-1]` turns the list around. In the PYTHON table it starts at N, where the letters match, and finds `"PHON"`. Two strings often have several longest common subsequences (`"THON"` and `"YHON"` are just as long), and a different rule for ties finds a different one.

      ### Edit distance

      The **edit distance** (or Levenshtein distance) between two words is the fewest one-character changes that turn one into the other, where a change **inserts**, **deletes** or **replaces** a character. `"brain"` becomes `"bread"` in 3, for example by inserting e after the r, deleting the i and replacing the n with a d. A spell checker offers the words at the smallest distance from your typo.

      `dist[i][j]` holds the edit distance from `a[:i]` to `b[:j]`:

      - The edges come first. Emptying `i` characters takes `i` deletes, so `dist[i][0] = i`, and building `j` characters from nothing takes `j` inserts, so `dist[0][j] = j`. Leaving these edges at 0 is the common mistake: the distance from `"abc"` to `""` then comes out 0.
      - When `a[i - 1]` and `b[j - 1]` are the same, the ends need no change, and what's left costs `dist[i - 1][j - 1]`.
      - When they're different, one change fixes the end, on top of what came before: a replace of `a[i - 1]` by `b[j - 1]` (`dist[i - 1][j - 1] + 1`), a delete of `a[i - 1]` (`dist[i - 1][j] + 1`) or an insert of `b[j - 1]` (`dist[i][j - 1] + 1`). `dist[i][j]` is the smallest of the three.

      Here is the table from `"cat"` (down) to `"act"` (across):

      | | `""` | a | c | t |
      | --- | --- | --- | --- | --- |
      | `""` | 0 | 1 | 2 | 3 |
      | c | 1 | 1 | 1 | 2 |
      | a | 2 | 1 | 2 | 2 |
      | t | 3 | 2 | 2 | **2** |

      Swapping two neighbors costs 2 edits. Like the LCS, the table costs O(n × m) time and memory, while the plain recursion tries up to three edits at every step: exponential.

      **Your turn:** write `lcs(a, b)`, which returns one longest common subsequence of the strings `a` and `b`, built with the table and the walk back above, going up on a tie. The tests have strings of 600 and 450 characters, so fill the table without recursion.

      For example, `lcs("DYNAMIC", "PROGRAMMING")` returns:

      ```
      'AMI'
      ```
    seed: |
