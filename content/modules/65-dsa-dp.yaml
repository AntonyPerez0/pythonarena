  - id: dsa-dp-lcs
    slug: lcs
    title: Longest common subsequence and edit distance
    text: |
      Cross out some characters of a string, and what's left is a **subsequence** of it: the characters that stay keep their order, with gaps where others were. `"ace"` is a subsequence of `"abcde"`. Take two strings, and the longest string you can get from **both** by crossing out characters is their **longest common subsequence** (LCS). That's how `diff` and Git compare two versions of a file, line by line: the lines in the LCS are the ones nobody touched. Trying every subsequence is hopeless, since a string of n characters has 2ⁿ of them. DP works on **prefixes** instead, the first few characters of each string.

      ### The table

      `length[i][j]` holds the length of the LCS of `a[:i]` and `b[:j]`, the first `i` characters of `a` and the first `j` of `b`. Each entry depends on the last characters of those prefixes, `a[i - 1]` and `b[j - 1]`:

      - When they **match**, the LCS of the two prefixes may as well finish with that character, after the LCS of the shorter prefixes: `length[i][j] = length[i - 1][j - 1] + 1`.
      - When they don't, a common subsequence can't finish with both, so one of the two can go. Try leaving out each and keep the longer result: `length[i][j] = max(length[i - 1][j], length[i][j - 1])`.

      An empty prefix has nothing in common with anything, so row 0 and column 0 are all 0. That's why the table has `len(a) + 1` rows and `len(b) + 1` columns, and why the characters are `a[i - 1]` and `b[j - 1]`: entry `i` is about the first `i` characters, and the last of them is at index `i - 1`.

      ```python run
      a, b = "PYTHON", "TYPHOON"
      length = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
      for i in range(1, len(a) + 1):
          for j in range(1, len(b) + 1):
              if a[i - 1] == b[j - 1]:
                  length[i][j] = length[i - 1][j - 1] + 1
              else:
                  length[i][j] = max(length[i - 1][j], length[i][j - 1])

      print("   " + "  ".join(b))
      for i in range(1, len(a) + 1):
          print(a[i - 1], length[i][1:])
      ```

      ```output
         T  Y  P  H  O  O  N
      P [0, 0, 1, 1, 1, 1, 1]
      Y [0, 1, 1, 1, 1, 1, 1]
      T [1, 1, 1, 1, 1, 1, 1]
      H [1, 1, 1, 2, 2, 2, 2]
      O [1, 1, 1, 2, 3, 3, 3]
      N [1, 1, 1, 2, 3, 3, 4]
      ```

      The bottom-right entry is the answer: the LCS is 4 characters long. The table has (n + 1) × (m + 1) entries for strings of n and m characters, each O(1): O(n × m) time and memory. For two strings of 1,000 characters, that's a million entries instead of 2¹⁰⁰⁰ subsequences.

      The classic slip is to compare `a[i]` and `b[j]`, out of habit:

      ```python run crash
      a, b = "cat", "act"
      length = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
      for i in range(1, len(a) + 1):
          for j in range(1, len(b) + 1):
              if a[i] == b[j]:              # should be a[i - 1] and b[j - 1]
                  length[i][j] = length[i - 1][j - 1] + 1
              else:
                  length[i][j] = max(length[i - 1][j], length[i][j - 1])
