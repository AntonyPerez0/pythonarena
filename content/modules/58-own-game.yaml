id: own-game
summary: Planning and writing a game of your own. What a small game needs, turning an idea into a plan, a main loop that updates the game on every frame, collisions with pygame.Rect, and a complete coin chase with a monster, a time limit and an end.
steps:
  - id: own-game-plan
    slug: plan
    title: Planning your own game
    text: |
      You've built a whole game. The last project of the course is a game of your own: your idea, written with what you've learned. This module helps you plan it, and builds a small game that you can use as a starting point.

      ### What makes a game

      A small game needs only a few things, and you've written each of them already:

      - something the player controls, such as a robot that moves with the arrow keys
      - things to collect, or enemies to avoid, or both
      - a clear goal, so that the player knows what to do and when the game is won or lost
      - a counter that tells the player how they're doing: points, moves, time or lives
      - code split into methods of a class, each with one job, like the box game

      ### Ideas

      Choose something small enough to finish. You can always add to a game that works. A few ideas:

      - **Coin chase**: collect coins that appear in random places, while a monster follows you.
      - **Dodge**: monsters bounce around the window, and the robot has to keep away from them. The score is how long it survives.
      - **Maze run**: build a maze from the tiles of the box game, and find the way out in as few moves as possible, or before the time runs out.
      - **Keep it up**: bounce a ball off a paddle at the bottom of the window, and count the bounces.

      Besides the robot and the tiles of the box game, the site has these pictures for your games:

      ```asset coin.png
      ```

      ```asset ball.png
      ```

      ```asset monster.png
      ```

      ### From an idea to a plan

      Before writing any code, write down four things in plain words. For the coin chase:

      1. **What's in the game**: the robot, a coin, a monster, and the number of coins collected so far.
      2. **What the player does**: the arrow keys move the robot.
      3. **What happens by itself**: the monster moves toward the robot, and a collected coin jumps to a new place.
      4. **How it ends**: the monster catches the robot.

      The plan turns into code almost by itself. The first list is the game's state, the attributes that `reset` sets up. The second goes in `handle_events`, the third in a method of its own, `update`, and `draw` shows the state in the window.

      ### A game that moves by itself

      The box game waited for the player: between two key presses, nothing changed. In the coin chase, things move on every frame, so the main loop calls `update` between handling the events and drawing:

      ```python fragment
      def run(self):
          while True:
              self.handle_events()
              self.update()
              self.draw()
              self.clock.tick(60)
      ```

      Now the clock matters: at 60 frames a second, a robot that moves 3 pixels a frame goes 180 pixels a second. To move smoothly, the robot moves on every frame while an arrow key is held down, and as in part 13, `pygame.key.get_pressed()` tells which keys are down right now:

      ```python fragment
      keys = pygame.key.get_pressed()
      if keys[pygame.K_LEFT]:
          self.robot_x -= 3
      ```

      ### Did they touch?

      Most games ask on every frame whether two things touch: the robot and a coin, the robot and a monster. This is called **collision detection**, and you met pygame's tool for it in part 13: `pygame.Rect` and its method `colliderect`. The game keeps its positions as plain numbers in attributes, and makes the rectangles from them whenever it checks, so they always match the latest positions:

      ```python run
      import pygame

      robot_x, robot_y = 100, 50
      coin_x, coin_y = 130, 80
      robot = pygame.Rect(robot_x, robot_y, 40, 40)
      coin = pygame.Rect(coin_x, coin_y, 24, 24)
      print(robot.colliderect(coin))

      coin_x = 140
      coin = pygame.Rect(coin_x, coin_y, 24, 24)
      print(robot.colliderect(coin))
      ```

      ```output
      True
      False
      ```

      The robot covers x from 100 to 139. The coin at x = 130 overlaps it, but once the coin has moved to x = 140, their edges only touch, and that isn't an overlap.

      ### The first version

      Get a small version working first, then add one thing at a time and try the game after each one, the way the box game was built. Here's the start of the coin chase, without the monster: the robot collects coins, and each collected coin jumps to a random place. On this site, `random` gives the same numbers every time a window runs, so the coins go to the same places every time you play here.

      ```asset robot.png
      ```

      ```python window
      import random

      import pygame

      WIDTH = 480
      HEIGHT = 360


      class CoinChase:
          def __init__(self):
              pygame.init()
              self.window = pygame.display.set_mode((WIDTH, HEIGHT))
              pygame.display.set_caption("Coin Chase")
              self.robot_picture = pygame.image.load("robot.png")
              self.coin_picture = pygame.image.load("coin.png")
              self.font = pygame.font.SysFont("Arial", 24)
              self.clock = pygame.time.Clock()
              self.reset()

          def reset(self):
              self.robot_x = 40
              self.robot_y = 160
              self.coins = 0
              self.place_coin()

          def place_coin(self):
              self.coin_x = random.randint(0, WIDTH - 24)
              self.coin_y = random.randint(40, HEIGHT - 24)

          def run(self):
              while True:
                  self.handle_events()
                  self.update()
                  self.draw()
                  self.clock.tick(60)

          def handle_events(self):
              for event in pygame.event.get():
                  if event.type == pygame.QUIT:
                      exit()

          def update(self):
              keys = pygame.key.get_pressed()
              if keys[pygame.K_LEFT]:
                  self.robot_x -= 3
              if keys[pygame.K_RIGHT]:
                  self.robot_x += 3
              if keys[pygame.K_UP]:
                  self.robot_y -= 3
              if keys[pygame.K_DOWN]:
                  self.robot_y += 3
              robot = pygame.Rect(self.robot_x, self.robot_y, 40, 40)
              coin = pygame.Rect(self.coin_x, self.coin_y, 24, 24)
              if robot.colliderect(coin):
                  self.coins += 1
                  self.place_coin()

          def draw(self):
              self.window.fill((30, 90, 60))
              self.window.blit(self.coin_picture, (self.coin_x, self.coin_y))
              self.window.blit(self.robot_picture, (self.robot_x, self.robot_y))
              text = self.font.render(f"Coins: {self.coins}", True, (255, 255, 255))
              self.window.blit(text, (10, 10))
              pygame.display.flip()


      if __name__ == "__main__":
          game = CoinChase()
          game.run()
      ```

      ```window
      {frames: 70, events: [{at: 5, type: keydown, key: K_DOWN}, {at: 55, type: keyup, key: K_DOWN}]}
      ```

      **Your turn:** what does this program print? Type each line it prints.
