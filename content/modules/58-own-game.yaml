        solution: |
          import random

          import pygame

          WIDTH = 480
          HEIGHT = 360
          GAME_TIME = 15
          MONSTER_SPEED = 2
          SECONDS_PER_COIN = 2


          class CoinChase:
              def __init__(self):
                  pygame.init()
                  self.window = pygame.display.set_mode((WIDTH, HEIGHT))
                  pygame.display.set_caption("Coin Chase")
                  self.robot_picture = pygame.image.load("robot.png")
                  self.coin_picture = pygame.image.load("coin.png")
                  self.monster_picture = pygame.image.load("monster.png")
                  self.font = pygame.font.SysFont("Arial", 24)
                  self.clock = pygame.time.Clock()
                  self.reset()

              def reset(self):
                  self.robot_x = 40
                  self.robot_y = 160
                  self.monster_x = 420
                  self.monster_y = 40
                  self.coins = 0
                  self.lives = 3
                  self.frames = 0
                  self.over = False
                  self.place_coin()

              def place_coin(self):
                  self.coin_x = random.randint(0, WIDTH - 24)
                  self.coin_y = random.randint(40, HEIGHT - 24)

              def seconds_left(self):
                  return GAME_TIME + SECONDS_PER_COIN * self.coins - self.frames // 60

              def run(self):
                  while True:
                      self.handle_events()
                      if not self.over:
                          self.update()
                      self.draw()
                      self.clock.tick(60)

              def handle_events(self):
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          exit()
                      if event.type == pygame.KEYDOWN and event.key == pygame.K_r:
                          self.reset()

              def update(self):
                  self.move_robot()
                  self.move_monster()
                  robot = pygame.Rect(self.robot_x, self.robot_y, 40, 40)
                  coin = pygame.Rect(self.coin_x, self.coin_y, 24, 24)
                  monster = pygame.Rect(self.monster_x, self.monster_y, 40, 40)
                  if robot.colliderect(coin):
                      self.coins += 1
                      self.place_coin()
                  if robot.colliderect(monster):
                      self.lives -= 1
                      self.monster_x = 420
                      self.monster_y = 40
                      if self.lives == 0:
                          self.over = True
                  self.frames += 1
                  if self.seconds_left() == 0:
                      self.over = True

              def move_robot(self):
                  keys = pygame.key.get_pressed()
                  if keys[pygame.K_LEFT]:
                      self.robot_x -= 3
                  if keys[pygame.K_RIGHT]:
                      self.robot_x += 3
                  if keys[pygame.K_UP]:
                      self.robot_y -= 3
                  if keys[pygame.K_DOWN]:
                      self.robot_y += 3
                  self.robot_x = max(0, min(self.robot_x, WIDTH - 40))
                  self.robot_y = max(0, min(self.robot_y, HEIGHT - 40))

              def move_monster(self):
                  if self.monster_x < self.robot_x:
                      self.monster_x = min(self.monster_x + MONSTER_SPEED, self.robot_x)
                  if self.monster_x > self.robot_x:
                      self.monster_x = max(self.monster_x - MONSTER_SPEED, self.robot_x)
                  if self.monster_y < self.robot_y:
                      self.monster_y = min(self.monster_y + MONSTER_SPEED, self.robot_y)
                  if self.monster_y > self.robot_y:
                      self.monster_y = max(self.monster_y - MONSTER_SPEED, self.robot_y)

              def draw(self):
                  self.window.fill((30, 90, 60))
                  self.window.blit(self.coin_picture, (self.coin_x, self.coin_y))
                  self.window.blit(self.robot_picture, (self.robot_x, self.robot_y))
                  self.window.blit(self.monster_picture, (self.monster_x, self.monster_y))
                  coins_text = self.font.render(f"Coins: {self.coins}", True, (255, 255, 255))
                  self.window.blit(coins_text, (10, 10))
                  lives_text = self.font.render(f"Lives: {self.lives}", True, (255, 255, 255))
                  self.window.blit(lives_text, (200, 10))
                  time_text = self.font.render(f"Time: {self.seconds_left()}", True, (255, 255, 255))
                  self.window.blit(time_text, (390, 10))
                  if self.over:
                      message = self.font.render("Game over! Press R to play again.", True, (255, 230, 120))
                      self.window.blit(message, (106, 172))
                  pygame.display.flip()


          if __name__ == "__main__":
              game = CoinChase()
              game.run()
        hints:
          - "`update` already makes the rectangle `monster`. Check it like the coin: `if robot.colliderect(monster):`."
          - "Inside that `if`, take one from `self.lives`, and set `self.monster_x` and `self.monster_y` back to 420 and 40. Otherwise the monster would still be on the robot in the next frame, and take another life."
          - "Then, still inside it, check whether `self.lives` is 0, and if it is, set `self.over` to `True`. Don't set `self.over` to `False` anywhere in `update`: the time limit may have just ended the game."
