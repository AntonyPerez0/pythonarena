      ```

      ### The monster

      `move_monster` moves the monster one pixel closer to the robot on each axis, on every frame:

      ```python fragment
      def move_monster(self):
          if self.monster_x < self.robot_x:
              self.monster_x += 1
          if self.monster_x > self.robot_x:
              self.monster_x -= 1
          if self.monster_y < self.robot_y:
              self.monster_y += 1
          if self.monster_y > self.robot_y:
              self.monster_y -= 1
      ```

      The robot moves 3 pixels a frame and the monster only 1, so a player who keeps moving can stay out of its reach. A game like this is all about such numbers. Try other speeds and see how the game changes.

      ### Time

      `self.frames` counts the frames that the game has run. At 60 frames a second, `self.frames // 60` is the number of whole seconds played, and `seconds_left` subtracts it from the game's length, `GAME_TIME`. A constant at the top of the program makes it easy to try a shorter or a longer game.

      ### When the game is over

      The attribute `self.over` tells whether the game has ended. `update` sets it to `True` when the monster catches the robot or the time runs out. From then on the main loop skips `update`, so nothing moves, but `draw` keeps showing the last picture with a message on top. R calls `reset`, which sets everything back, `self.over` included.

      An attribute that tells which **phase** a game is in, playing or over, is common in games. A bigger game could have more phases: a title screen, a pause, the next level.

      ### Make it yours

      A game grows one small change at a time. The challenges of this step make three changes to the coin chase: a faster monster, coins that give more time, and lives, so that being caught once doesn't end the game. Some more ideas, for this game or your own:

      - more monsters, kept in a list, each moved by the same code
      - a monster that gets faster with every five coins
      - a best score that stays while the program runs, in an attribute that `reset` doesn't touch

      ### Testing your game

      Test the part you're working on without playing the whole game: start the monster right next to the robot to see the ending, or set `GAME_TIME` to 3. Print values while you look for a bug. Then put the real values back.

      Then hand the game to someone else, and watch them play without helping. Did they know what to do without being told? Where did they get stuck, or bored? Did they want another round when it ended? That shows you what to work on next. Someone who can read code can also tell you which part of yours was hard to follow.

      You can write and play a game of your own in the Playground of this site, where all its pictures are available.

      **Your turn:** in the challenges of this step the monster is faster. It moves `MONSTER_SPEED` pixels a frame, 2 to begin with. That needs care: a monster 1 pixel to the left of the robot would jump 1 pixel past it, then back again on the next frame, and so on. It would shake.

      Write the method `move_monster`. On every frame, the monster's x moves `MONSTER_SPEED` pixels toward the robot's x, but never past it: if the robot's x is closer than that, the monster's x becomes the robot's x. If the two are already the same, the monster's x stays as it is. The monster's y moves toward the robot's y in the same way.
