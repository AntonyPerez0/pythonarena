                  if keys[pygame.K_LEFT]:
                      self.robot_x -= 3
                  if keys[pygame.K_RIGHT]:
                      self.robot_x += 3
                  if keys[pygame.K_UP]:
                      self.robot_y -= 3
                  if keys[pygame.K_DOWN]:
                      self.robot_y += 3
                  self.robot_x = max(0, min(self.robot_x, WIDTH - 40))
                  self.robot_y = max(0, min(self.robot_y, HEIGHT - 40))

              def move_monster(self):
                  if self.monster_x < self.robot_x:
                      self.monster_x += 1
                  if self.monster_x > self.robot_x:
                      self.monster_x -= 1
                  if self.monster_y < self.robot_y:
                      self.monster_y += 1
                  if self.monster_y > self.robot_y:
                      self.monster_y -= 1

              def draw(self):
                  self.window.fill((30, 90, 60))
                  self.window.blit(self.coin_picture, (self.coin_x, self.coin_y))
                  self.window.blit(self.robot_picture, (self.robot_x, self.robot_y))
                  self.window.blit(self.monster_picture, (self.monster_x, self.monster_y))
                  coins_text = self.font.render(f"Coins: {self.coins}", True, (255, 255, 255))
                  self.window.blit(coins_text, (10, 10))
                  time_text = self.font.render(f"Time: {self.seconds_left()}", True, (255, 255, 255))
                  self.window.blit(time_text, (390, 10))
                  if self.over:
                      message = self.font.render("Game over! Press R to play again.", True, (255, 230, 120))
                      self.window.blit(message, (106, 172))
                  pygame.display.flip()


          if __name__ == "__main__":
              game = CoinChase()
              game.run()
