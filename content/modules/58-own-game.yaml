  - id: own-game-complete
    slug: complete
    title: A complete small game
    text: |
      Here's the coin chase finished: a monster, a time limit and an end. Read it through first. The sections after it explain what's new.

      ```asset robot.png
      ```

      ```asset coin.png
      ```

      ```asset monster.png
      ```

      ```python window
      import random

      import pygame

      WIDTH = 480
      HEIGHT = 360
      GAME_TIME = 15


      class CoinChase:
          def __init__(self):
              pygame.init()
              self.window = pygame.display.set_mode((WIDTH, HEIGHT))
              pygame.display.set_caption("Coin Chase")
              self.robot_picture = pygame.image.load("robot.png")
              self.coin_picture = pygame.image.load("coin.png")
              self.monster_picture = pygame.image.load("monster.png")
              self.font = pygame.font.SysFont("Arial", 24)
              self.clock = pygame.time.Clock()
              self.reset()

          def reset(self):
              self.robot_x = 40
              self.robot_y = 160
              self.monster_x = 420
              self.monster_y = 40
              self.coins = 0
              self.frames = 0
              self.over = False
              self.place_coin()

          def place_coin(self):
              self.coin_x = random.randint(0, WIDTH - 24)
              self.coin_y = random.randint(40, HEIGHT - 24)

          def seconds_left(self):
              return GAME_TIME - self.frames // 60

          def run(self):
              while True:
                  self.handle_events()
                  if not self.over:
                      self.update()
                  self.draw()
                  self.clock.tick(60)

          def handle_events(self):
              for event in pygame.event.get():
                  if event.type == pygame.QUIT:
                      exit()
                  if event.type == pygame.KEYDOWN and event.key == pygame.K_r:
                      self.reset()

          def update(self):
              self.move_robot()
              self.move_monster()
              robot = pygame.Rect(self.robot_x, self.robot_y, 40, 40)
              coin = pygame.Rect(self.coin_x, self.coin_y, 24, 24)
              monster = pygame.Rect(self.monster_x, self.monster_y, 40, 40)
              if robot.colliderect(coin):
                  self.coins += 1
                  self.place_coin()
              if robot.colliderect(monster):
                  self.over = True
              self.frames += 1
              if self.seconds_left() == 0:
                  self.over = True

          def move_robot(self):
              keys = pygame.key.get_pressed()
              if keys[pygame.K_LEFT]:
                  self.robot_x -= 3
              if keys[pygame.K_RIGHT]:
                  self.robot_x += 3
              if keys[pygame.K_UP]:
                  self.robot_y -= 3
              if keys[pygame.K_DOWN]:
                  self.robot_y += 3
              self.robot_x = max(0, min(self.robot_x, WIDTH - 40))
              self.robot_y = max(0, min(self.robot_y, HEIGHT - 40))

          def move_monster(self):
              if self.monster_x < self.robot_x:
                  self.monster_x += 1
              if self.monster_x > self.robot_x:
                  self.monster_x -= 1
              if self.monster_y < self.robot_y:
                  self.monster_y += 1
              if self.monster_y > self.robot_y:
                  self.monster_y -= 1

          def draw(self):
              self.window.fill((30, 90, 60))
              self.window.blit(self.coin_picture, (self.coin_x, self.coin_y))
              self.window.blit(self.robot_picture, (self.robot_x, self.robot_y))
              self.window.blit(self.monster_picture, (self.monster_x, self.monster_y))
              coins_text = self.font.render(f"Coins: {self.coins}", True, (255, 255, 255))
              self.window.blit(coins_text, (10, 10))
              time_text = self.font.render(f"Time: {self.seconds_left()}", True, (255, 255, 255))
              self.window.blit(time_text, (390, 10))
              if self.over:
                  message = self.font.render("Game over! Press R to play again.", True, (255, 230, 120))
                  self.window.blit(message, (106, 172))
              pygame.display.flip()


      if __name__ == "__main__":
          game = CoinChase()
          game.run()
      ```

      ```window
      {frames: 640, events: [{at: 5, type: keydown, key: K_DOWN}, {at: 55, type: keyup, key: K_DOWN}, {at: 55, type: keydown, key: K_RIGHT}, {at: 190, type: keyup, key: K_RIGHT}, {at: 190, type: keydown, key: K_UP}, {at: 265, type: keyup, key: K_UP}, {at: 265, type: keydown, key: K_LEFT}, {at: 400, type: keyup, key: K_LEFT}]}
      ```

      ### The monster

      `move_monster` moves the monster one pixel closer to the robot on each axis, on every frame:

      ```python fragment
      def move_monster(self):
          if self.monster_x < self.robot_x:
              self.monster_x += 1
          if self.monster_x > self.robot_x:
              self.monster_x -= 1
          if self.monster_y < self.robot_y:
              self.monster_y += 1
          if self.monster_y > self.robot_y:
              self.monster_y -= 1
      ```

      The robot moves 3 pixels a frame and the monster only 1, so a player who keeps moving can stay out of its reach. A game like this is all about such numbers. Try other speeds and see how the game changes.

      ### Time

      `self.frames` counts the frames that the game has run. At 60 frames a second, `self.frames // 60` is the number of whole seconds played, and `seconds_left` subtracts it from the game's length, `GAME_TIME`. A constant at the top of the program makes it easy to try a shorter or a longer game.

      ### When the game is over

      The attribute `self.over` tells whether the game has ended. `update` sets it to `True` when the monster catches the robot or the time runs out. From then on the main loop skips `update`, so nothing moves, but `draw` keeps showing the last picture with a message on top. R calls `reset`, which sets everything back, `self.over` included.

      An attribute that tells which **phase** a game is in, playing or over, is common in games. A bigger game could have more phases: a title screen, a pause, the next level.

      ### Make it yours

      Here are some ways to grow the coin chase, or your own game:

      - more monsters, kept in a list, each moved by the same code
      - a monster that gets faster with every five coins
      - lives: being caught costs one, and the game ends when they're gone
      - a best score that stays while the program runs, in an attribute that `reset` doesn't touch

