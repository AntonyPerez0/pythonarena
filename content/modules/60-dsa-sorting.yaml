        solution: |
          def partition3(values, low, high, pivot):
              lt = low
              i = low
              gt = high
              while i <= gt:
                  if values[i] < pivot:
                      values[lt], values[i] = values[i], values[lt]
                      lt += 1
                      i += 1
                  elif values[i] > pivot:
                      values[i], values[gt] = values[gt], values[i]
                      gt -= 1
                  else:
                      i += 1
              return lt, gt


          def kth_smallest(values, k):
              values = values[:]
              low = 0
              high = len(values) - 1
