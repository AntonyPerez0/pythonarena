          Write `median(values)` with quickselect, without sorting: for an odd number of values, the one in the middle of the sorted order; for an even number, the average of the two in the middle. `values` is never empty, and the function must leave it as it is. It must be fast for 100,000 values, also when many of them are equal. Don't use `sorted`, `sort`, `heapq` or `statistics`.

          For example, this program:

