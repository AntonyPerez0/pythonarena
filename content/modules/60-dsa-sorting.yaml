          def insertion_sort(values):
              moves = 0
              for i in range(1, len(values)):
                  item = values[i]
                  j = i
                  while j > 0 and values[j - 1] > item:
                      values[j] = values[j - 1]
                      j -= 1
                      moves += 1
                  values[j] = item
              return moves


          if __name__ == "__main__":
              values = [19, 25, 22, 30, 28, 27, 40]
              print(insertion_sort(values))
              print(values)
        slow: |
          def insertion_sort(values):
              moves = 0
              for i in range(1, len(values)):
                  for j in range(i, 0, -1):
                      if values[j - 1] > values[j]:
                          values[j - 1], values[j] = values[j], values[j - 1]
                          moves += 1
              return moves


          if __name__ == "__main__":
              values = [19, 25, 22, 30, 28, 27, 40]
              print(insertion_sort(values))
              print(values)
