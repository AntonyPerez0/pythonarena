      - task: |
          An **inversion** is a pair of items in the wrong order: a bigger item before a smaller one. `[4, 6, 2, 5]` has 3 of them: 4 and 2, 6 and 2, 6 and 5. It's the number of moves insertion sort makes, a measure of how far a list is from sorted. Write `count_inversions(values)`, which returns the number of inversions of a list. It must be fast for 60,000 values, so count them while you merge sort, in O(n log n).

          The trick is in the merge. When the front item of the right half is smaller than the front item of the left half, it's smaller than every item still waiting in the left half (that half is sorted), and all of those came before it in the list. So taking it counts `len(left) - i` inversions at once. The inversions inside each half are counted by the calls that sort the halves.

          For example, `count_inversions([4, 6, 2, 5])` returns:

          ```
          3
          ```
        seed: |
          def count_inversions(values):
              pass


          if __name__ == "__main__":
              print(count_inversions([4, 6, 2, 5]))
        solution: |
          def sort_and_count(values):
              if len(values) <= 1:
                  return values, 0
              middle = len(values) // 2
              left, count_left = sort_and_count(values[:middle])
              right, count_right = sort_and_count(values[middle:])
              merged = []
              count = count_left + count_right
              i = 0
              j = 0
              n_left = len(left)
              n_right = len(right)
              while i < n_left and j < n_right:
                  if left[i] <= right[j]:
                      merged.append(left[i])
                      i += 1
                  else:
                      merged.append(right[j])
                      j += 1
                      count += n_left - i
              merged += left[i:]
              merged += right[j:]
              return merged, count


          def count_inversions(values):
              return sort_and_count(values)[1]


          if __name__ == "__main__":
              print(count_inversions([4, 6, 2, 5]))
        slow: |
          def count_inversions(values):
              count = 0
              for i in range(len(values)):
                  for j in range(i + 1, len(values)):
                      if values[i] > values[j]:
                          count += 1
              return count


          if __name__ == "__main__":
              print(count_inversions([4, 6, 2, 5]))
        hints:
          - "Write a helper, `sort_and_count(values)`, that returns two things as a tuple: the sorted list and its number of inversions. A list of 0 or 1 items gives `(values, 0)`."
          - "In the helper, split in the middle and call it on each half: `left, count_left = sort_and_count(values[:middle])`. Start the count at `count_left + count_right`, then merge as in the lesson."
          - "In the merge, when `right[j]` is taken because it's smaller than `left[i]`, add `len(left) - i` to the count. On a tie take from the left, as the lesson's merge does: equal items aren't an inversion. `count_inversions` returns the count from the tuple."
          - "A loop inside a loop over all the pairs gives the right answer too, but for 60,000 values that's about 1.8 billion pairs: far too slow."
        tests:
