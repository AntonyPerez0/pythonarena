                  pivot = values[(low + high) // 2]
                  lt, gt = partition3(values, low, high, pivot)
                  if k < lt:
                      high = lt - 1
                  elif k > gt:
                      low = gt + 1
                  else:
                      return pivot


          def median(values):
              n = len(values)
              if n % 2 == 1:
                  return kth_smallest(values, n // 2)
              return (kth_smallest(values, n // 2 - 1) + kth_smallest(values, n // 2)) / 2


          if __name__ == "__main__":
