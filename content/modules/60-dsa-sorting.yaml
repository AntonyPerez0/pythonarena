                      elif y == x:
                          equal += 1
                  if smaller <= k < smaller + equal:
                      return x


          def median(values):
              n = len(values)
              if n % 2 == 1:
                  return kth_smallest(values, n // 2)
              return (kth_smallest(values, n // 2 - 1) + kth_smallest(values, n // 2)) / 2


