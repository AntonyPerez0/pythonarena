          - call: count_inversions([10, 20, 30, 40])
            hidden: true
          - call: count_inversions([8, 6, 4, 2, 0])
            hidden: true
          - call: count_inversions([7, 7, 7, 7])
            hidden: true
          - call: count_inversions([5, 1, 4, 1])
            hidden: true
          - call: count_inversions([])
            hidden: true
          - call: count_inversions([(60_000 - i) * 2 + i * i % 5 for i in range(60_000)])
            hidden: true
            big: true
          - call: count_inversions([i * i % 100_003 for i in range(40_000)])
            hidden: true
