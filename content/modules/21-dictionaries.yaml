          Each book is a dictionary with the keys `"title"`, `"author"` and `"year"`. Write a function `oldest_title(books)` that returns the title of the oldest book in the list. There is always at least one book, and no two books have the same year.

          For example, for the books `[{"title": "Night Trains", "author": "Leo Grant", "year": 1998}, {"title": "Paper Moons", "author": "Mia Stone", "year": 1987}]`, it returns `"Paper Moons"`.
