          ```
        seed: |
          def count_by_author(books: list) -> dict:
              pass


          if __name__ == "__main__":
              books = [
                  {"title": "The Glass Garden", "author": "Mia Stone", "year": 2011},
                  {"title": "Night Trains", "author": "Leo Grant", "year": 1998},
                  {"title": "Paper Moons", "author": "Mia Stone", "year": 1987},
              ]
              print(count_by_author(books))
        solution: |
          def count_by_author(books: list) -> dict:
              counts = {}
              for book in books:
                  author = book["author"]
                  if author not in counts:
                      counts[author] = 0
                  counts[author] += 1
              return counts


          if __name__ == "__main__":
              books = [
                  {"title": "The Glass Garden", "author": "Mia Stone", "year": 2011},
                  {"title": "Night Trains", "author": "Leo Grant", "year": 1998},
                  {"title": "Paper Moons", "author": "Mia Stone", "year": 1987},
              ]
              print(count_by_author(books))
        hints:
