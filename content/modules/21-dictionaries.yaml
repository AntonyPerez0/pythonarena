    fill: |
      def make_book(title: str, author: str, year: int) -> dict:
          book = [[{}]]
          book["title"] = title
          book[[["author"‖'author']]] = author
          book["year"] = [[year]]
          return book


      if __name__ == "__main__":
          print(make_book("Night Trains", "Leo Grant", 1998))
    hints:
