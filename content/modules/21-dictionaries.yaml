          Each book is a dictionary with the keys `"title"`, `"author"` and `"year"`. Write a function `count_by_author(books)` that returns a dictionary in which each author is a key and the value is the number of their books in the list.

          ```python fragment
          books = [
              {"title": "The Glass Garden", "author": "Mia Stone", "year": 2011},
              {"title": "Night Trains", "author": "Leo Grant", "year": 1998},
              {"title": "Paper Moons", "author": "Mia Stone", "year": 1987},
          ]
          print(count_by_author(books))
          ```

