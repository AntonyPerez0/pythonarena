name: Build, verify and deploy to GitHub Pages

# The jobs (README.md, "Deploy", says the same):
#
#   build            npm ci, the unit tests (first: they need no build output), then npm run build:
#                    every lesson, drill and project program run on the reference CPython (the content
#                    build), tsc, the site build and the pre-rendered pages. Uploads what the checks
#                    need as the artifact site-build (dist, src/generated, public/lessons and
#                    fidelity/out with the content check list) and, on main, dist as the Pages
#                    artifact. Then the link check (scripts/check-links.mjs): every internal link in
#                    the built pages, sitemap, manifest and lesson files resolves, and every external
#                    link (there and in content/) goes to an allowed host.
#   content-pyodide  every lesson and project program replayed in Pyodide (the engine the browser
#                    uses, run in Node) and compared with CPython, in 2 shards side by side.
#   e2e              the browser tests (Python in the page, accessibility with axe, phone widths,
#                    offline, mobile data), with screenshots.
#   pro-track        the Pro Track's projects (pro-track/<id>/) with Python and pytest: each starter
#                    fails some tests, and with its model solution (pro-track-solutions/<id>/) every
#                    test passes (scripts/pro-track-check.mjs). Needs nothing from the build.
#   lighthouse       pull requests only: Lighthouse scores against lighthouserc.cjs.
#   deploy           main only, once build and every check above have passed: publishes the dist the
#                    build job made, unchanged.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The site's own domain, also set under Settings > Pages > Custom domain.
  # Empty: publish at https://<owner>.github.io/<repo>/
  CUSTOM_DOMAIN: ""
  # The reference CPython: exactly the version Pyodide runs (node_modules/pyodide/pyodide-lock.json);
  # the content build stops if they differ.
  REFERENCE_PYTHON: "3.14.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      base_path: ${{ steps.site.outputs.base_path }}
      site_url: ${{ steps.site.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: The reference CPython
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.REFERENCE_PYTHON }}

      - name: Install dependencies (also copies Pyodide into public/engine)
        run: npm ci

      - name: Unit tests
        run: npm run test:unit
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Work out the site address
        id: site
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            base="/"
            url="https://$CUSTOM_DOMAIN"
          else
            owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            base="/${{ github.event.repository.name }}/"
            url="https://$owner.github.io/${{ github.event.repository.name }}"
          fi
          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "base_path=$base" >> "$GITHUB_OUTPUT"
          echo "site_url=$url" >> "$GITHUB_OUTPUT"

      - name: Run every lesson program on the reference CPython, type-check and build the site
        run: npm run build
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Check every link (internal ones resolve in the built site; external ones go to allowed hosts)
        run: npm run check-links

      - name: Keep the build for the check jobs
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: |
            dist
            src/generated
            public/lessons
            fidelity/out
          if-no-files-found: error
          retention-days: 7

      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  content-pyodide:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every shard runs to its end, so one run lists every program that differs.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/check-job-setup

      - name: Run the lesson programs of shard ${{ matrix.shard }} of 2 in Pyodide and compare with CPython
        run: npm run content:pyodide
        env:
          CONTENT_SHARD: ${{ matrix.shard }}/2

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_PATH: ${{ needs.build.outputs.base_path }}
      SITE_URL: ${{ needs.build.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/check-job-setup
        with:
          chromium: "true"

      - name: Browser tests (Python in the page, accessibility with axe, phone widths, offline, mobile data)
        run: npm run test:e2e -- --shots screenshots

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

  pro-track:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The script uses only Node's own modules, so no npm ci.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python for the Pro Track (the version its workflows use)
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pro-track/*/requirements.txt

      - name: Each Pro Track starter fails some of its tests; with its model solution every test passes
        run: node scripts/pro-track-check.mjs
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

  # Scores key pages as a phone would, and fails the PR below the thresholds in lighthouserc.cjs.
  lighthouse:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_PATH: ${{ needs.build.outputs.base_path }}
      SITE_URL: ${{ needs.build.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/check-job-setup
        with:
          npm: "false"

      - name: Lighthouse (performance, accessibility, SEO, best practices)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs

      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lhci
          if-no-files-found: ignore

  # Lighthouse runs on pull requests only, so it isn't in needs (a skipped job there would skip this one).
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, content-pyodide, e2e, pro-track]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
